"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M3120,518 C3140,518 3140,544.32 3160,544.32\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/><path d=\"M4220,124 C4290,124 4290,206.32 4360,206.32\" fill=\"none\" stroke=\"#5fa877\" stroke-width=\"1.3\" stroke-dasharray=\"\" opacity=\"0.9\"/><path d=\"M4220,124 C4290,124 4290,124.32 4360,124.32\" fill=\"none\" stroke=\"#c05b4d\" stroke-width=\"1.3\" stroke-dasharray=\"\" opacity=\"0.9\"/><path d=\"M4560,206 C4580,206 4580,124.32 4600,124.32\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/><path d=\"M4800,155 C4820,155 4820,206.32 4840,206.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M4800,155 C4820,155 4820,288.32 4840,288.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M4800,155 C4820,155 4820,124.32 4840,124.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M4560,124 C4580,124 4580,294.32 4600,294.32\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/>","laneSvg":"<rect x=\"0\" y=\"70\" width=\"5330\" height=\"344\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"85\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">十面埋伏</text><rect x=\"0\" y=\"232\" width=\"5330\" height=\"508\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"247\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">视角 · 主公</text>","nodes":[{"id":"start","title":"第一幕 · 陉谷","type":"scene","lines":["「噗……噗……噗……」","声音很轻，却像三颗冷钉，楔入陉谷的晨寂——是沉重的玄铁甲片从肩头卸下、砸在青石板上的闷响。","我伏在西坡岩棱后，指节骤然收紧。谷底那名敌将抬手卸下最后一面护心镜，随手抛给驮马夫——数百名精锐骑士只着皮甲，战马解了面帘护胸，在溪边低头饮水，温顺得全然没了铁骑的锋芒。","斥候的情报在脑中推演过无数遍：敌锋连下三城，主将恃勇，令麾下卸甲疾驰，甲胄尽由驮马随行。","这是一支主动卸了壳的猛虎，正毫无防备地卧在我布下的陷阱之中。身后三千步骑，弩手满弦，长枪待发——本为袭扰而设，此刻只需稍作调整，便能化作收割的利刃。","我十六岁从军。二十年前，我在淮阴的街市上，从一个恶少的胯下爬过去——那天我学会了忍。今天我伏在这西坡上，弩手满弦，学会了等。","忍、等，然后一击。这一击等了二十年，不差这一盏茶的工夫。","谷底那头，敌将纵身下马，靴尖碾了碾溪边的碎石，忽然抬头，朝西坡望了一眼。","只是一眼。像猎人在进山之前，先看了一遍林子。","我按住弩手的手腕，极轻地摇了摇头。风从谷底灌上来，吹得岩棱上的草尖伏下去，又立起来。"],"desc":"","choices":[{"text":"「格杀勿论——全歼！」弩手标定驮马队与阵眼，绝其披甲之念。","hint":"天赐之机 · 谋子","next":"a1_intro","cond":"","effects":"旗标:plan_annihilate；junji+10,renji-10"},{"text":"依旧依原策袭扰：夺其甲、乱其阵，缓图而退。","hint":"谋势 · 见好就收","next":"a1_intro","cond":"","effects":"旗标:plan_harass；junji+5,renji+5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"a1_intro","title":"箭雨","type":"duel","lines":["「杀！」令旗劈下。坡顶强弩齐齐调整角度，箭簇在晨雾里闪着寒星。","「弩手标定驮马队——先断他们的甲。」我在心里默念部署。首波箭簇倾泄而下——可几乎是同时，一声暴喝滚过谷底：「结阵！」","没有想象中的溃乱。那些中箭倒地的士卒旁，幸存的骑士在同一时间弹起——无甲胄拖累，他们的动作竟比平日重甲在身时，还要快上三分。","左翼以尸体与倒马为墙结成防线，右翼槊手列成锋线，数十名亲兵冒着箭雨扑向散落的甲胄堆，身中数箭也要拖回一面护心镜。","「好一支悍军。」我轻声说。身后的偏将一愣：「将军？」","「夸他们。」我说，「困兽比虎难打。传令：轻骑先不冲，让弩手再咬三轮，咬碎他们的阵脚再说。」","偏将传令下去。我盯着谷底，指节叩着剑柄——忍了二十年的那口气，不能急在这一时。","第三轮箭雨落下时，敌阵里有人用槊杆挑着一面甲胄举过头顶，在箭雨里晃了晃——像一面以甲代旗的降表，又像一支挑衅的令旗。","我眯起眼。那一瞬间，我忽然想起二十年前淮阴街市上，那只从我胯下跨过去的靴子。","战机在瞬息之间。谷底厮杀，就此白热。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_xinggu","pick":"","minigame":""},{"id":"a1_win","title":"鸣金","type":"scene","lines":["防线开裂，又合拢；再裂，再合。我军借马速凿穿三阵，眼看胜利的天平肉眼可见地倾斜——","就在此时，一阵沉厚如雷的马蹄声从谷口方向传来。齐整，轰鸣，铺天盖地。","「敌军主力回援！约有两万，距谷口不足五里！先锋已至隘口！」斥候连滚带爬，战马口吐白沫轰然倒地。","两万，五里。两个数字，如冰水浇灭了即将到手的全歼之念。","「鸣金。」我收剑入鞘，扭身看向身后，无半分迟疑。轻骑闻声即返，长枪结阵掩护，弩手射出最后一波箭雨——为撤军筑起一道箭墙。","「将军，再咬一口！就差一口了！」偏将急红了眼。","「再咬一口，填进去的就是我们。」我翻身上马，「全歼是赚来的，命是借来的——借来的东西，见好就收。」","我立于坡顶，居高临下。那名敌将持血槊立于尸山之间，半身甲被血浸透，目光穿过弥漫的血腥味，直直望来。是恨意吗？还是庆幸？","都不重要了。","回营路上，偏将还在念叨那口\"没咬完的\"。我勒住马，看了他一眼：「你记住——会打仗的人，赢在算得清什么时候收手。算不清的，都死在贪上了。」","他张了张嘴，没再说话。马蹄声里，陉谷在身后一寸一寸地远了。"],"desc":"","choices":[],"next":"a1_arrow","next2":"","effects":"junji+5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"a1_lose","title":"苦战而退","type":"scene","lines":["这一口，咬崩了牙。无甲之兵辗转腾挪灵动至极，我军轻骑一刀劈空，便要直面刺来的短刃——不少人连人带马摔倒，瞬间被围杀。","而谷口方向，沉厚如雷的马蹄声，终于还是来了。「敌军主力回援！约两万，距谷口不足五里！」","只能，做到这里了吗。","「鸣金！」我勒住战马，声音里第一次带上了一丝不甘。凄厉金鸣响彻陉谷，残部交替掩护，向坡上且战且退。","退回坡顶，清点人马，折了六百。我盯着那个数字看了很久——忍了二十年的那口气，今天差点没忍住。","坡顶回望，谷底尸横相叠，血溪漫过石缝。那名敌将持槊立于阵中，满脸血污，直直望来。","我记住了这双眼睛。","夜里清点箭矢，弩手报数的时候顿了一下——射出去的三千支箭，有一半钉在驮马队的甲胄堆上，一支都没入肉。","「他们把甲堆成了墙。」偏将低声道。","「不。」我看着那堆箭冢，「他们是把命，堆成了墙。」"],"desc":"","choices":[],"next":"end_xinggu","next2":"","effects":"junji-5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_xinggu","title":"结局 · 差一口气","type":"ending","lines":["那一夜，我们在坡顶扎营。没有人说话。清点伤亡的竹简递上来，我数完，把它翻了过去——背面写着我战前估的数：三十。","我原以为，折三十人，就够换他们一身甲。","偏将进帐站了很久，终于问出口：「将军，若是主力晚半日……」","「没有若是。」我吹熄了灯，「设伏的人，算地、算时辰、算他们背上的甲——只有一样没算到。」","「什么？」","「他们比我们想的，更不要命。」","后来史官写这一战，只有一句：汉军伏敌先锋于陉谷，不克，引退。","忍了二十年，等了二十年，第一击，折在一支卸了甲的军队身上。我不怨天——怨天的人，活不到设伏的那一天。","撤军路上，我把那面记着敌将旗号的合旗收进怀里。下次再遇，我不会再给他结阵的时间。","灯灭了。帐外有风，吹着合旗的布角，发出细碎的响。我枕着剑，听了一夜。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"差一口气（败线结局 · 陉谷）","endingDesc":"你算到了一切，除了他们比你想的，更不要命。","shop":"","duel":"","pick":"","minigame":""},{"id":"a1_arrow","title":"一箭","type":"scene","lines":["撤退的号角已经吹响。残敌瘫坐谷底，那名敌将依旧挺立阵中，半身血甲，像一面不肯倒的旗。","他身边已经没有人了。弩手在撤，驮马在撤，连那面军旗，都被一个断臂的卒子裹在怀里，踉跄着往谷口退。","他一个人站在血地里，槊尖拄地，胸膛起伏。","我抬手，指尖轻抬——弩手们屏住呼吸，等我落下这一指。","二十年前，我从一个人的胯下爬过去，学会了忍；今天，我站在坡顶，学会了等。忍和等教我的最后一课，是这个谷底的人，正用一条命，教会我什么叫\"不肯退\"。","指节停在半空。风从指尖穿过。"],"desc":"","choices":[{"text":"「送他一箭。」——箭破空，擦着他的肩头钉入青石板，箭羽震颤。","hint":"原著之箭 · 不杀，亦不敬意缺席","next":"m_bridge","cond":"","effects":"旗标:arrow_spare；renji+5"},{"text":"「放他走。」——收旗，转身，不再看谷底一眼。","hint":"英雄相惜 · 需军纪≥60 · 乱世里少有的一念","next":"m_bridge","cond":"{\"statAtLeast\":{\"junji\":60}}","effects":"旗标:arrow_honor；renji+10"},{"text":"「补他一箭。」——斩将夺旗，绝此后患。","hint":"兵家常规 · 也许多年后会有人问起这一箭","next":"m_bridge","cond":"","effects":"旗标:arrow_kill；junji+5,renji-10"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"m_bridge","title":"第二年 · 城外","type":"scene","lines":["陉谷的事，只是开始。真正的棋，在另一处——那座孤城。","他亲自留在孤城，牵住敌军主力；我在外调兵，断其粮道、攻其必救。一内一外，这是定好的局。","有过孤城粮尽的日子，也有信使断绝的日子。偏将不止一次劝我：将军，回师救一救吧。","我没有回。我信他——守得住，他会守；守不住，回师也来不及。我能做的，只有把刀更快些地递向敌后。","直到那一夜，孤城方向的天烧红了。我站在高坡上看了很久，转身传令：轻骑三千，星夜接应。","后来史书写那一夜，只写了五个字——「夜遁出孤城」。史书没写的是：那一夜，我也没有睡。","我连夜拔营，在他身后追了一百里。沿途的追兵，一队一队，都被我拦下来，碾碎在夜色里。","天亮时，我在一道岔路口看见他的车辙——两行深深的车印，朝我的方向，越碾越急。","一年，又一年。敌军的粮耗尽了，气也耗尽了。现在，轮到垓下收网了。"],"desc":"","choices":[],"next":"hx_duanliang","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hx_duanliang","title":"断粮 · 釜底抽薪","type":"scene","lines":["第二年秋。孤城还困着，敌军的粮道却在大山里。","斥候来报：敌军粮队，每旬一运，走黑水峡。护粮三千，民夫一万——那一万民夫，多是本地抓来的。","我站在坡上，望着黑水峡的方向。断粮道，是攻必救的第一步——可我若烧了这十万石粮，峡里那三万石民粮，也跟着没了。","偏将说：将军，粮队十日后到。烧，还是等？","风从峡谷灌上来，吹得人衣角猎猎。我摸着剑柄，想起孤城城头那面王袍——它在风里立着，等我这边先落子。"],"desc":"","choices":[{"text":"烧——粮尽则敌退，孤城可解。民夫……打完仗，再补他们。","hint":"雷霆 · 军纪立，仁心蚀","next":"hx_fire","cond":"","effects":"junji+10,renji-8"},{"text":"夺——抢粮充军，也喂孤城。可那三万石民粮，一粒不动。","hint":"两全 · 险中求","next":"hx_fire","cond":"","effects":"junji+5,renji+5"},{"text":"只烧军粮，不碰民仓——难，但要试。","hint":"仁心 · 烧一半，留一半","next":"hx_fire","cond":"","effects":"junji-3,renji+8"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hx_fire","title":"烧粮之夜","type":"scene","lines":["黑水峡的火，烧了整整六个时辰。","烟柱冲天，十里外都能看见。天亮时，斥候带回敌营的消息：粮队没了，营里开始杀马。","孤城方向的灯火，隔着山，明明灭灭——像在等一个结果。","我站在坡上，望着那片焦土。焦土下面，是这一冬的粮。","偏将问：将军，值吗？","我没有回答。有些账，不是现在算的——先记着，仗打完，一并还。","风从峡谷灌上来，把灰烬吹了我一身。"],"desc":"","choices":[],"next":"hx_xinshi","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hx_xinshi","title":"信使 · 百日音断","type":"scene","lines":["入秋之后，孤城方向的信，断了。","先是三日，再是半月。斥候带回的消息越来越旧：城还守着，旗还在——只是送信的，折了三个。","偏将说：将军，再派斥候，就是拿命填。","我望着孤城的方向。那儿有个人，在替我守一座城。他信我——这份信，不能断在送信的路上。","夜里的风，把远处的灯火吹得明明灭灭。那灯火，也许是孤城，也许是敌营。我分不清，也不敢猜错。"],"desc":"","choices":[{"text":"多派斥候，三路齐发——总有一路到。","hint":"命换信 · 仁心蚀","next":"hx_beishui","cond":"","effects":"junji+5,renji-8"},{"text":"收拢信使，改约期——城若破，回师也无用。","hint":"止损 · 军纪蚀","next":"hx_beishui","cond":"","effects":"junji-5,renji+5"},{"text":"亲领百骑，沿敌后接应——把信，送到城下去。","hint":"以身破局 · 孤注","next":"hx_beishui","cond":"","effects":"junji+8,renji-5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hx_beishui","title":"背水 · 一役","type":"scene","lines":["断粮之后，敌军疯了一样扑过来，要打通粮道。","我退到河边。身后是大河，身前是三倍的兵。偏将的脸白了：将军，没路了。","我望着河面，忽然想起二十年前淮阴街市上那只靴子——退无可退的时候，人只剩下一个念头。","背水。列阵。告诉弟兄们：身后的河，就是你们的路——赢，踏过去；输，喂鱼。","河水的反光，映在每个人的脸上。没有一个人说话——可他们的手，都按在了刀柄上。"],"desc":"","choices":[{"text":"背水列阵，死战不退——置之死地而后生。","hint":"兵行险招 · 仁心蚀","next":"hx_river","cond":"","effects":"junji+10,renji-8"},{"text":"留半队伏于林后——赢了，是后手；输了，是退路。","hint":"留一手 · 稳中求","next":"hx_river","cond":"","effects":"junji+5,renji+5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hx_river","title":"河岸","type":"scene","lines":["那一仗打完了。河水染了一角红，又被冲淡。","我蹲在河边，掬起一捧水，洗了把脸。水很凉，像那一年淮阴街市的冬天。","弟兄们在水边洗刀，有人唱起了调子——不是军歌，是淮阴乡下的秧歌。","我听着，忽然想：这仗，打的是命，唱的是活。","天边的云，烧成了金色。我站起来，把刀别回腰间。","下一仗，在齐地。"],"desc":"","choices":[],"next":"hx_dianbing","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hx_dianbing","title":"点兵 · 多多益善","type":"scene","lines":["汉王的信到了：齐地未平，命我筹措兵马，择日南下。","可兵马不是天上掉下来的。淮阴的旧部、萧何的文书、各营的降卒——要人，只有三条路。","夜里点灯，我把各营的册子翻了一遍。册子很薄——能打的，就这么多。","偏将说：将军，人多不一定能打。我说：可这一仗，人少了，连阵都摆不开。","灯花爆了一下。我合上册子，心里有了计较。"],"desc":"","choices":[{"text":"多多益善——降卒流民皆收，人丁最旺，但良莠不齐，军纪难张。","hint":"韩信点兵 · 多多益善","next":"hx_roll","cond":"","effects":"junji-3,renji+3"},{"text":"精挑壮勇——只要打过仗的老兵，人少，但个个顶用。","hint":"宁缺毋滥 · 军纪立","next":"hx_roll","cond":"","effects":"junji+8,renji-5"},{"text":"上书汉王再调一部——稳，但误了时机。","hint":"求稳 · 兵贵神速","next":"hx_roll","cond":"","effects":"junji-5,renji+5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hx_roll","title":"帐前点将","type":"scene","lines":["点将那夜，帐前的火把，一直烧到五更。","新卒在火下报数，声音参差——有老兵的粗嗓，也有流民的哑腔。","我在火下走了一趟，拍拍这个的肩，扶正那个的盔。","他们不知道自己的名字会进哪份名册，只知道跟着我，往北。","天蒙蒙亮时，队伍开拔。马蹄踏碎霜花，像一页页翻过的军册。","齐地，就在前面。"],"desc":"","choices":[],"next":"hx_gongqi","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hx_gongqi","title":"攻齐 · 背信之师","type":"scene","lines":["兵马齐了。探马来报：汉王已遣郦食其入齐，说降齐王——齐王，正在犹豫。","军师蒯通说：将军受诏击齐，郦生一介书生，谈何说降？他劝我即刻发兵。","我望着齐地的方向。若郦生说成，齐地不战而下；若我先动了……郦生那颗脑袋，就悬了。","帐里的灯，把地图上「齐」字照得发亮。我伸手，摸了摸那两个字。","兵贵神速，还是信义为先——这一刀，割的是我自己的心。"],"desc":"","choices":[{"text":"即刻发兵——兵贵神速，齐王犹豫之时，正是战机。","hint":"背信攻齐 · 郦生或死","next":"hx_lishi_dead","cond":"","effects":"junji+10,renji-10；旗标:lishi_dead"},{"text":"停兵三日，等郦生的消息——信义为先。","hint":"守信 · 错失战机","next":"hx_lishi_alive","cond":"","effects":"junji-8,renji+8；旗标:lishi_alive"},{"text":"佯动——大张旗鼓作势攻齐，逼齐王早降，给郦生递刀。","hint":"两全 · 兵不厌诈","next":"hx_lishi_alive","cond":"","effects":"junji+3,renji+3；旗标:lishi_alive"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hx_lishi_dead","title":"郦生 · 鼎","type":"scene","lines":["大军压境那日，齐王本已动摇。","探马回报：齐宫的火，烧了半座城。郦生被烹于鼎中——齐王说：汉使不诚，既已发兵，留他何用。","帐中安静了很久。没有人说话，连风都停了。","军师蒯通说：将军受诏击齐，何错之有？","我握着那道诏书。诏书是真的。可郦生那颗人头，也是真的。","当年在汉营，他劝我归汉；后来他替我游说诸侯，唇舌比刀快。","他死在我递出去的刀上。"],"desc":"","choices":[{"text":"受诏击齐，问心无愧——兵贵神速，他该明白。","hint":"军纪立 · 心冷","next":"hx_qingwang","cond":"","effects":"junji+8,renji-5"},{"text":"上表请罪——人是我害的。陛下若要问罪，我认。","hint":"仁心 · 认这笔账","next":"hx_qingwang","cond":"","effects":"junji-5,renji+8"},{"text":"沉默。把诏书收进怀里，整军，点将。","hint":"吞下 · 记着","next":"hx_qingwang","cond":"","effects":"junji+5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hx_lishi_alive","title":"郦生 · 说成","type":"scene","lines":["停兵第三日，齐王的降书到了。","郦生回来了。那身使袍的袖口磨得发白，人瘦了一圈——眼睛，却亮。","他说：齐王信我，我也信他。七十城，一兵未动。","帐外，军士们正在欢呼。我望着他，忽然想：原来仗，也可以不打。","只是，若我一直打下去，他这颗脑袋，会不会也在某口鼎里？","他拍拍我的肩：将军，这天下，不是只有刀能平。"],"desc":"","choices":[{"text":"敬酒——郦公，这碗酒，敬你。","hint":"仁心 · 记一功","next":"hx_qingwang","cond":"","effects":"renji+8"},{"text":"整军——降书未必真。兵，不能散。","hint":"军纪 · 防一手","next":"hx_qingwang","cond":"","effects":"junji+8"},{"text":"不语。看着他走远。那身白袍，在风里越来越小。","hint":"记下 · 一诺","next":"hx_qingwang","cond":"","effects":"junji+3,renji+3"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hx_qingwang","title":"请封 · 假齐王","type":"scene","lines":["齐地平定，我遣使入关，向汉王请封——","使者回来，带回一道诏书：大丈夫定诸侯，即为真王耳，何以假为！","汉王封我为齐王。","可那道诏书，我读了三遍。每个字都认得，每个字都烫手。","萧何的私信随后就到，只有八个字：面君之日，交还兵符。","萧何说：将军，你手里那支兵，是天下最贵的东西——有人拿它换王，有人拿它换命。","灯下，我把兵符从怀里摸出来，看了很久。"],"desc":"","choices":[{"text":"自请封——这王位，我当得。","hint":"功高震主 · 不避","next":"hx_baiyu_intro","cond":"","effects":"junji+5；旗标:qing_wang"},{"text":"交兵符——兵是陛下的。我替他握了握。","hint":"自抑 · 良弓入匣","next":"hx_baiyu_intro","cond":"","effects":"junji-5,renji+8；旗标:jiao_bing"},{"text":"请封却辞——臣请为假王，已蒙恩准，不敢当真。","hint":"折中 · 半收半放","next":"hx_baiyu_intro","cond":"","effects":"junji+3"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hx_baiyu_intro","title":"彭城故道 · 遇霸王","type":"duel","lines":["齐地平了，我率军回师。行至彭城故道，斥候急报：项羽亲率精骑三千，截我归路。","项羽。这个名字，我听过太多回——彭城之战，三万精骑破汉军五十万；荥阳城外，一杆画戟挑落多少汉将。","我下令列阵。可马蹄声起的那一刻，我忽然明白——有些对手，不是阵能挡住的。","项字旗在风里展开。三千精骑，如一柄出鞘的黑刀。","这一战，正面打不赢。可这一战，我也不能不打。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_baiyu","pick":"","minigame":""},{"id":"hx_baiyu_lose","title":"败后 · 悟","type":"scene","lines":["那一战，我败了。三千精骑如刀切豆腐，我的阵，在他面前像纸糊的。","败退回营，我坐在灯下，把那一战的每一个回合，反反复复想了三遍。","我终于明白：项羽的勇，是正面打不败的。要赢他，得让他自己走进来——","围住他，困住他，用四面八方的声音，磨掉他那口气。","十面埋伏。这四个字，从那一夜起，长在了我心里。","灯下，我把那张地图又摊开。垓下，两个字，被我描了又描。"],"desc":"","choices":[],"next":"a3_intro","next2":"","effects":"junji-5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"vp_lord_start","title":"第二视角 · 主公","type":"scene","lines":["天没亮，我就登上了城头。露水很重，剑柄发凉。","城砖上散落着昨日没来得及收的箭镞。我弯腰拾起一支，在掌心搁了会儿。","城外黑旗还在。敌营的鼓敲了一夜，这会儿忽然停了——鼓停，比鼓响更叫人心里发毛。","身后，亲兵抬着王袍上城。我摆了摆手。今日，我自己站在这儿。","城下一骑快马入营，递上晨间的军报。只有两行：敌营正在打造云梯；另一路，他的大军已经动了。","我盯着后一行看了很久，把军报折好，收进怀里。","风起了。我按住怀里那纸军报，忽然想：二十年前，我在沛县街上欠人酒钱的时候，可从没想过，有一天会有人替我去守一座城。","城头的旗，在风里抖了一下。我伸手扶正。"],"desc":"","choices":[],"next":"a2_intro","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"a2_intro","title":"第二幕 · 孤城（主公视角）","type":"scene","lines":["风卷着城头的烟尘，漫过垛口。我扶着冰冷的石砖往下望——城外黑旗连营，鼓角沉沉，敲得人直发闷。","「主公，此城兵寡粮薄，本就难支，您何必亲留此地？退回后方，也好有个照应！」苦谏的幕僚被侍卫架着，声音还在城头飘，「偏信误国啊——」","我抬手，示意侍卫松开他。他喘着气看着我，我看着他，忽然笑了：「你说偏信误国——那你信不信，外头那位，会带着兵回来？」","他张了张嘴，没答上来。","攻城略地，各尽其职。他在外调度，我在内牵敌——这是定好的局。我不是披甲陷阵的人，当年在那场宴上能屈能伸，如今也一样。我坐镇此处，是为旗，不为刃。","我当年是沛县的亭长，管十里地的治安，收过小贩的份子钱，被乡里人叫了半辈子无赖。如今我坐在孤城的城头，等一支大军——二十年前，我做梦也想不到，有一天会有人愿意替我去死守一座城。","守城的日子慢得像熬油。白日登城巡防，王袍立在显眼处——箭雨擦着垛口飞过，侍卫伸手拦，我便侧身避开，不躲远，也不逞强。夜里回帐，箭矢、伤兵、西城缺口、粮草簿，一行行数字压在心头，比城外的鼓声更沉。","近侍催了三次，我扒了半碗饭，又硬咽了两口菜。烛火噼啪一跳，我盯着粮草簿上「所剩无几」四个字，忽然想：当年在沛县，我欠人酒钱的时候，也没这么愁过。","城外鼓声又响起来。我放下碗，重新系好王袍的带子。"],"desc":"","choices":[{"text":"照旧巡防，稳住军心——援军的事，提一次便够了。","hint":"信人 · 用人不疑","next":"hz_zhou","cond":"","effects":"旗标:trust_hold；diye+10"},{"text":"密遣第二拨信使催援——顺便，也催问他的行军路线。","hint":"疑种 · 一旦种下就会发芽","next":"hz_zhou","cond":"","effects":"旗标:trust_doubt；diye-5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hz_zhou","title":"孤城 · 半碗粥","type":"scene","lines":["围城第七个月，粮尽。","仓里还剩三百石。兵要吃饭，百姓也要吃饭——三百石，撑不过这个冬。","幕僚献了三策：开仓赈民，收民心；先兵后民，保战力；杀马——马肉喂兵，马骨熬汤，给百姓。","我站在城头，看着城下排队领水的百姓。他们的碗，比我的还干净。","王袍的带子，被风吹得贴在了城砖上。我低头看了它一眼——它立在这儿，不是给兵看的，是给城里每一个人看的。"],"desc":"","choices":[{"text":"开仓——城可以丢，人心不能丢。","hint":"收民心 · 兵挨饿","next":"hz_food","cond":"","effects":"diye-5,renji+10"},{"text":"先兵——兵都饿死了，城和人心一起完。","hint":"保战力 · 民心寒","next":"hz_food","cond":"","effects":"diye+8,renji-5"},{"text":"杀马——马是战马，也是这城里最后的口粮。","hint":"折中 · 马骨熬汤","next":"hz_food","cond":"","effects":"diye+5,renji+5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hz_food","title":"三百石","type":"scene","lines":["三百石粮，像三块石头，压在一个冬天的秤上。","城里的炊烟，比前几日密了些——可每一缕烟下面，都是一张要吃饭的嘴。","我站在粮仓前，看最后一斗粮被人领走。管仓的老吏把斗沿的米粒，一粒一粒捡进手心，吹了吹，倒进自己的嘴里。","我别过头去。有些东西，看一眼就够记一辈子。","夜里，城外的敌营点起了火。火光映在城墙上，像一条咬住不放的蛇。"],"desc":"","choices":[],"next":"hz_yijian","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hz_yijian","title":"城下 · 一箭之约","type":"scene","lines":["粮尽的那段日子，城外射来一封信。","箭杆上绑着布，布上写着：开城，封侯；不开，城破之日，鸡犬不留。","劝降书。守将们等着我发话——我攥着那封信，忽然想起外头那位将军说过的话：越是紧要关头，越要慢。","慢。我不撕，不烧，不答——我写。","回他一封：城在人在，城亡人亡。箭书出城的时候，我听见城头的兵，把这句话传了下去。"],"desc":"","choices":[{"text":"撕了——不答就是答案。","hint":"决绝 · 军纪立","next":"hz_arrow","cond":"","effects":"diye+8,renji-5"},{"text":"回一箭书——把「城在人在」四个字，射回他们营里去。","hint":"明志 · 双收","next":"hz_arrow","cond":"","effects":"diye+5,renji+5"},{"text":"留而不答——冷着他，比骂他狠。","hint":"冷对 · 军纪蚀","next":"hz_arrow","cond":"","effects":"diye-3,renji+3"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hz_arrow","title":"箭书出城","type":"scene","lines":["那封信，到底还是回出去了。","城头的兵，把「城在人在」四个字传了一遍——传到最后，声音哑了，眼睛却亮了。","夜里巡城，我在垛口站了一会儿。城外黑压压的营火，像一片会呼吸的坟。","我忽然想：城外的箭，射得再远，也射不进人心。可人心要是散了，连箭都不用射。","这一夜，我没有睡。"],"desc":"","choices":[],"next":"hz_cefan","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hz_cefan","title":"策反 · 说齐","type":"scene","lines":["孤城的信，一封比一封急。可我知道，光守住孤城没用——得让项羽的后院，先起火。","郦食其主动请缨：臣凭三寸舌，可下齐七十城。","我放他去了。临行前他回头笑：陛下，若郦生不成，还有韩信那把刀。","我站在城头，看着他翻身上马。齐地若能不战而下，韩信的大军，就能腾出手来——","可我也知道，郦生此去，是把命押在了韩信不攻上。"],"desc":"","choices":[{"text":"遣郦生说齐——兵不血刃，但郦生生死系于韩信之手。","hint":"外交 · 信人","next":"hz_lishi_news","cond":"","effects":"diye+10,renji+5"},{"text":"先写信给韩信，让他暂缓——稳妥，但误了战机。","hint":"稳妥 · 误时","next":"hz_lishi_news","cond":"","effects":"diye+5,renji+5"},{"text":"双管齐下——郦生说，韩信压阵，逼齐王早降。","hint":"威逼 · 齐王或惧而烹郦生","next":"hz_lishi_news","cond":"","effects":"diye+8,renji-3"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hz_lishi_news","title":"齐地 · 郦生","type":"scene","lines":["齐地的消息，一夜之间传遍全城。","郦食其入齐，说降初成——齐王，已答应献城。","可就在齐王答应的当夜，齐地探马带回另一条消息：韩信的大军，动了。","齐王大怒：汉使不诚——既已发兵，留你何用。","郦生被烹于鼎中。","消息到孤城那日，我站在城头，站了很久。","我派出去的是使节，他打过去的是兵。","这中间隔着一道诏书——那道诏书，是我写给韩信的。","他没有等。","城下，士兵们正传着齐地的事。我扶着城砖，指节发白。"],"desc":"","choices":[{"text":"震怒——韩信，他眼里还有朕这个汉王吗！","hint":"权威受胁 · 疑种深埋","next":"hz_tuoxiang_intro","cond":"","effects":"diye+8；旗标:lord_resent"},{"text":"隐忍——压下去。仗还要打，刀还要用。","hint":"以大局为重 · 冷","next":"hz_tuoxiang_intro","cond":"","effects":"diye+5,renji-3"},{"text":"自责——是我害了郦生。我不该让他去。","hint":"仁心 · 认账","next":"hz_tuoxiang_intro","cond":"","effects":"diye-5,renji+8"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hz_tuoxiang_intro","title":"荥阳城外 · 拖","type":"duel","lines":["项羽的大军，终于压到了荥阳。","我登城一看，心里凉了半截——项羽亲统的精骑，铺天盖地。汉军这几万残兵，正面迎上去，就是送死。","可韩信那边，信刚送出去。他需要时间——哪怕多一天，都是好的。","我下城，把守将们都叫来：这一仗，不打胜，打拖。","城头的旗，在风里抖。我听见有人低声说：项字旗……那是项字旗啊。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_tuoxiang","pick":"","minigame":""},{"id":"hz_tuoxiang_lose","title":"败后 · 拖","type":"scene","lines":["荥阳还是丢了。我带着残兵退过成皋，项羽的追兵，咬了一路。","可我要的，不是赢——是拖。","烧了粮道，断了浮桥，一路丢下辎重引他分兵；夜里点火，天亮灭烟，让他猜不准我往哪走。","项羽的刀，追了我三十里，终究没能把我一口吞下去。","韩信那边，时间，我给他拖出来了。"],"desc":"","choices":[{"text":"弃车保帅——分兵诱敌，主力东撤，与韩信会师。","hint":"壮士断腕 · 仁心蚀","next":"a2_doubt","cond":"","effects":"diye+10,renji-5"},{"text":"拼死断后——亲自殿后，把追兵引向自己。","hint":"以身诱敌 · 险中求","next":"a2_doubt","cond":"","effects":"diye+8,renji+3"},{"text":"坚壁清野——退入山城，闭门不出，耗项羽的锐气。","hint":"守势 · 稳中求","next":"a2_doubt","cond":"","effects":"diye+5,renji+5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"a2_doubt","title":"裂隙","type":"scene","lines":["连日守城，兵疲粮少，局势一日紧过一日。白日登城，望着漫山遍野的敌军，再想想远在天边的大军——","一个念头，不受控地冒了出来：会不会……他根本不打算回来？","心猛地一沉。我竟在怀疑他？！怀疑那个我亲手托以重兵、定下奇策的人！","我忽然想起那年春天，我在帐里请他同食，把自己面前的肉推给他；解下自己的外袍，披在他肩上。他那时看我的眼神，我记到今天。","用人不疑，疑人不用——这话是我自己说的。可坐在这城头，听着城外一夜一夜的鼓声，我开始怀疑：他还记不记得那件袍子？","我立刻甩头，想把这念头压下去。用人不疑，疑人不用。可越是压制，心底那点疑虑越是冒头：自古高位之下，哪有不生嫌隙的？","「主公？」近侍轻声唤了一句。我骤然回神，指节在案上轻轻一叩，把所有翻涌的心思一并压回深处。","「无事。」","声音平静，听不出半分波澜。只是心底那层毫无破绽的信任，已经悄悄裂了一丝微不可查的缝。","这夜我辗转难眠，心事太重，刚吹灭的烛灯又被我重新点燃。","帐外本该只有巡夜的轻响——可没过多久，远处传来一阵极短促、极整齐的闷响。不像寻常攻城，倒像是盾阵推进、墙垣崩裂。","下一刻，惨叫声像被捅破的水袋，骤然炸开。是营门口。兵刃相撞、甲叶摩擦、士兵中刀的短哼，一路朝着王帐碾过来。","他们的目标，从一开始就是我。","我的手按在剑上，指尖发凉——那一瞬，我心里闪过的第一个念头，不是城破了，而是：他来不了了。"],"desc":"","choices":[],"next":"a2_break","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"a2_break","title":"夜遁","type":"duel","lines":["「主公！敌军已经冲进内院了！」亲兵跌撞冲进来，脸色惨白，「城破了——主公，城破了！」","我掀帘冲出帐外的瞬间，浓烈的血腥味扑面而来。营门处守兵像被割草一样倒下，黑色甲胄的精锐如潮水撕开防线，火把连成一条火蛇，笔直朝我咬来。","恐惧像冰水从脚底冲上头顶，脑子一片空白，只剩一个念头——跑。","西侧巷口，那辆无旗无饰的普通马车早已备好。我几乎是被人半扶半撞地推进车厢，膝盖狠狠磕在木沿上，也浑然不觉。","「快！往西！快！」","车轮刚一转动，我瘫坐在车厢里，冷汗浸透了里衣。我闭上眼，眼前却全是那些替我挡刀的人的脸——城破了，我还活着。这个念头，比任何伤口都疼。","身后的火光与杀伐声，终被车轮碾成了远方的余响。","车厢里很暗。我摸到怀里那纸军报，边角已经被冷汗洇软了。上面那行字——\"他的大军已经动了\"——在黑暗里，忽然变得烫手。","我不知道他在哪儿。我只知道，今夜这条命，是从这座城里，借出来的。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_taopao","pick":"","minigame":""},{"id":"a2_escape","title":"余响","type":"scene","lines":["马车载着我，一头扎进沉沉夜色。我揉了揉膝盖的淤青，靠在板壁上闭上眼，唯有车轮声，在夜色里一路向前。","城是怎么破的，是谁引来了那支精锐——我不知道，也暂时不敢知道。","只是那条裂缝，在颠簸的车厢里，又深了一寸。","后来亲兵说，那一夜我梦见了军帐里的粮草簿。一行行数字，像城门一样，一扇一扇地关上了。","黎明时分，车帘外透进一线灰白。我听见亲兵压低声音说：「主公，前面……前面有马蹄声。」","我掀开帘子。晨雾里，一队轻骑正在山口列阵，玄甲上的霜，映着初升的日头。","为首那匹马上的人，没有穿披风。他看见马车，勒住了马，隔着雾，行了一个军礼。","「主公。」他说。","两个字。我坐在车里，握着车帘的手，半天没有放下。"],"desc":"","choices":[{"text":"（结局）不先回营——先去他的军帐。","hint":"信人不疑 · 疑人不用","next":"end_xinren","cond":"{\"flag\":\"trust_hold\"}","effects":""},{"text":"（结局）先回营。站在帐前，看那面没倒的旗。","hint":"为旗不为刃 · 旗在哪里，刀砍向哪里","next":"end_flag","cond":"","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_xinren","title":"结局 · 信人不疑","type":"ending","lines":["夜遁回营那日，我没有回自己的帐，先去了他的军帐。","他不在。军帐里只有那幅舆图——图上，从孤城到垓下的路，被他用笔重新描过，粗粗的一条。","亲兵说：将军亲自带兵去接应主公了，天亮前就出发的。","我站在舆图前看了很久。那一条粗线，从孤城的方向，一直画到我站的地方。","我忽然明白，孤城那夜我怀疑他的那一刻——他正在连夜往我的方向赶。","垓下大捷后，他入帐述职，主动交出了兵符。满帐将领都愣住了。","我接过兵符，又放回他手里：「疑人不用，用人不疑。这八个字，孤城那夜我失信了——今日，朕还给你。」","他抬起头，那双眼睛里，我第一次看见了松动。","后来史书写：韩信用兵如神，汉王始终不疑，君臣相得，传为美谈。","没有人知道，这八个字，是我用孤城一夜，换来的。","那夜我回到自己帐里，把那件旧袍子找出来，叠好，放回箱底。袍子旧了，边角磨白了——可它还在。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"信人不疑（主公结局 · 疑人不用）","endingDesc":"孤城那夜你失信了一刻——这一生，你把它还给了他。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_flag","title":"结局 · 旗","type":"ending","lines":["马车在黎明前停住。前面是黑压压的军营——他的大军，已经到了。","亲兵扶我下车时，我听见帐里有人喊：主公回来了！","我摆摆手，没有让更多人出来迎接。我走进中帐，案上摊着粮草簿、战报、舆图——和孤城那一夜，一模一样。","后来我才知道，我逃出孤城那夜，他连夜拔营，在我身后追了一百里，替我断了一路的追兵。","他没有说。军报上只写着：某日，破追兵三千。","垓下大捷那日，我站在山坡上，看着韩信指挥三军合围。他回头看见我，愣了一下，随即行了一个军礼。","「主公。」他说。","我点了点头，没有多余的话。","史官后来写：汉王坐镇后方，调度有方，垓下一战而定天下。","没有人写的是：我这一生，最好的仗，都是在帐中打的。我是旗，不是刃——可旗立在哪里，刀就砍向哪里。","夜里巡营，我路过他的军帐，听见他在灯下和部将说话，说的是垓下的布阵。","我站了一会儿，没有进去。帐门口的旗，被风吹得猎猎作响——我伸手，扶了扶旗杆。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"旗（主公结局 · 为旗不为刃）","endingDesc":"你这一生最好的仗都在帐中打——旗立在哪里，刀就砍向哪里。","shop":"","duel":"","pick":"","minigame":""},{"id":"a2_escape_bad","title":"夜遁 · 带伤","type":"scene","lines":["马车碾过碎石，猛地一颠——肩头的箭伤磕在板壁上，疼得我倒吸一口凉气。亲兵压低声音：「主公，伤口还在流血……」","我按住伤口，指缝间黏稠温热。城是怎么破的？是谁引来了那支精锐？夜太黑，什么都看不清。","唯有那条裂缝，在颠簸里，又深了一寸。","车帘一角被风掀起。我恍惚看见，雾里有个人影，骑在马上，远远地跟着这辆车。","「那是谁？」我问。","亲兵看了一眼：「……像是将军帐下的斥候。天亮前就缀上咱们了。」","我没有再说话。伤口一抽一抽地疼——疼得像那条裂缝，正一寸一寸，往骨头里长。"],"desc":"","choices":[],"next":"end_crack","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_crack","title":"结局 · 裂","type":"ending","lines":["回营那日，我没有先卸甲，而是直接去了他的大帐。帐里只有那幅舆图，和一支刚熄的烛。","「军师，孤城一夜，你可知我差点死在那里？」我听见自己的声音，比想象中平静。","他抬头，看了我很久。那目光里没有辩解，只有一种了然——像早已料到这一日。","「主公是问城破之因，还是问臣之心？」","我答不上来。从那一夜起，我给他的一切差遣，都配了一个副手。","后来史书说：韩信数问汉王军情，汉王疑之。再后来，他们又写：飞鸟尽，良弓藏。","只有我知道，那把弓不是藏起来的——是从孤城那夜起，我亲手，一点一点，抽掉了它的弦。","那支烛熄了。他没有再点。","我走出大帐时，风正冷。城头的旗换了新的——旧的那面，在孤城那一夜，被火燎去了一角。","我看了那面新旗很久，忽然想：旗还是那面旗，只是立在风里的时辰，不一样了。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"裂（败线结局 · 疑种）","endingDesc":"孤城一夜，你活着逃出来了。有些东西，却死在了那条裂缝里。","shop":"","duel":"","pick":"","minigame":""},{"id":"a3_intro","title":"第三幕 · 垓下（韩信视角）","type":"duel","lines":["暮色四合，残阳的最后一抹金红被西山吞尽。","我按剑立在北坡顶，玄铁甲胄凝着薄霜。三万步骑围成的铁桶阵在夜色里只剩黑影，谷底，是那支久战之师——西楚霸王的残部。","这是我第一次如此清晰地审视他们的「疲」：士卒瘦得只剩筋骨，冻得发紫，却无人挪动半步去寻避风处。饿了三日，渴了两日，依旧无人争抢仅剩的晨霜，换岗哨卒的步伐按着鼓点，交接口令短促清晰。","久战千里，锐气尽丧，此为一败；缺衣少食，腹背受敌，此为二败；身陷绝境，援军未至，此为三败。可军纪未散，阵脚未乱——这便是最大的隐患。","「围了一日，该收网了。」身侧人按捺不住。","我缓缓摇头，目光凝在谷底：「再等等。」","夜色渐浓。谷底忽然传来一阵整齐的甲叶摩擦声——瘫坐的士卒，在无声中缓缓站起。缺了护腕的手紧攥兵刃，干裂的嘴唇抿成一线，眼底翻着最后的红丝。","「你看。」我侧头，「他们还没垮。」","黑暗中，一道魁梧的身影从敌阵纵马而出。长槊高举，一声嘶吼如惊雷：「随我冲！」——数千人齐声呐喊，声浪压过谷风，硬生生将我军东侧阵脚撞得微晃。","身侧人猛地前倾，抬手到半空，似要即刻传令强攻。","合围前夜，军师蒯通过来看了我很久，说：将军可知，功高震主四个字怎么写？我说：知道。他说：知道，为何不避？我望着舆图，没有答他。他走时叹了口气，那句话我记到今天：鼎足三分，天下可安——可安了天下，未必安得了将军。","如今我围住霸王，忽然又想起这句话。原来那句话，早在我听他说的时候，就已经应验了——只是应验在哪一天，还看天意。","我抬手，轻轻按住他的手腕，唇角勾起一抹极淡的笑，藏在风里。","我在心底无声轻叹：可惜。早在你们冒进的那一刻，我便遣五千锐骑星夜赶往鹰嘴崖——栈道已断，烽烟不起，你们心心念念的援军，早已成了崖下的枯骨。","霸王的悍勇，终究抵不过绝境的磨耗。冲锋被打退了。","「这是第八次了。」身旁人念道，声音带着震惊。","我笑了笑。其实是第九次。不过这并不重要。","因为再等一会儿，一切就要结束了。","谷底升起一堆篝火。楚卒们围着火，用槊杆挑着最后的干粮，在火上烤。火光里，我听见有人哼了一声调子——很短，像被谁掐断了。","我记住了那个调子。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_chuge","pick":"","minigame":""},{"id":"a3_win","title":"四面楚歌","type":"scene","lines":["第二面令旗挥下——四面围阵里，忽然飘起了歌声。","不是金戈铁马的军歌，而是楚地的民谣。婉转凄切，裹着江淮水乡的温软乡音，从东、西、南、北四面飘出，缠缠绕绕，落在谷底每一个楚卒的耳畔。","那调子熟悉得刻进骨血——是他们儿时在村口听老妪哼过的，是出征前妻子倚门轻唱的，是故里田埂上孩童追闹时喊的。一字一句，都揪着心底最软的那处。","先是一声压抑的抽噎，从人群最深处传来，像一颗石子投进死水。紧接着，低低的啜泣一点点漫开，越来越密——那点支撑着他们熬过缺衣少食、扛过千里奔袭的军纪与执念，在熟悉的楚地民谣里，寸寸瓦解。","「军心散了。」身侧人的声音终于缓了下来。","我静静望着谷底。那支曾所向披靡的精锐，在四面楚歌里，卸了最后的铠甲。","是时候了。最后一面令旗挥下，鼓响震彻四野，三万步骑如黑色潮水，缓缓涌向谷底——没有惊天动地的呐喊，只有兵刃的寒芒，在火把映照下，亮得刺眼。","厮杀声再起，却不再是势均力较量，只是一边倒的收割。我立在坡顶，听着兵刃入肉的闷响、归降的哀求——心底无半分喜悦，只剩一片沉沉的悲壮。","这便是战争。最优解的背后，是满地枯骨，是久战之师的末路，是英雄末路的孤勇。","身侧人望着谷底，缓缓吐出三个字：「结束了。」","我没有应声。我忽然想起陉谷那个卸甲的敌将——他的军队，是被我用箭逼着卸的甲；霸王这支，是被我用一首歌，卸了最后的甲。","两种卸甲，都叫战争。"],"desc":"","choices":[],"next":"a3_after","next2":"","effects":"junji+10","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"a3_after","title":"庆功 · 萧何的脚步","type":"scene","lines":["垓下的烟，散了七天。","捷报入京那日，封赏的诏书到了——汉王封我为齐王，又徙为楚王。","萧何的私信，比诏书早到一夜。信上只有一行字：将军，长乐宫的门，认得你的靴子。","我坐在灯下，把那行字看了很久。","军师蒯通又来了，还是那句话：功高震主。","这一次，我没有答他。","窗外，有人唱起楚地的民谣——垓下那首歌，跟到了我的城下。","我摸了摸怀里那枚兵符。它烫手——像当年郦生的那句话，像齐王鼎下的火。"],"desc":"","choices":[{"text":"【入朝】萧何的信，我等了二十年。","hint":"钟室 · 灯已点亮","next":"end_jogou","cond":"{\"flag\":\"lishi_dead\"}","effects":""},{"text":"【入朝】兵符已经交出去了。这一趟，是回家。","hint":"良弓未藏 · 善终","next":"end_lianggong","cond":"{\"flag\":\"lishi_alive\",\"flag2\":\"jiao_bing\"}","effects":""},{"text":"【入朝】齐王——不，该称楚王了。","hint":"我的时代 · 史笔已蘸墨","next":"a3_final","cond":"{\"flag\":\"lishi_alive\",\"notFlag\":\"jiao_bing\"}","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"a3_lose","title":"强攻","type":"scene","lines":["歌声没能唱散他们。第八次冲锋被击退之后，身侧人终于按捺不住：「围久生变，强攻罢！」","我望着谷底那支打不散的军队，沉默良久，最终点了头。","强攻的代价是惨烈的。三万步骑填进去将近三成——谷底的楚卒战至最后一人，无一人跪降。霸王的长槊折断之后，他提着半截槊锋，独自站在尸山上，最后望了一眼故乡的方向。","「结束了。」身侧人喘着粗气。","我没有应声。胜利是真的，代价也是真的——本可以用一首歌拿下的军队，我们用三成的人命去填。","身侧人似乎明白了什么，低声问：「军师早料到了？」","「料到了。」我望着谷底的尸山，「只是唱不唱得出那首歌，得看天时，也得看——人心还记不记得回家的调子。」","谷底的火烧了半夜。我立在坡顶，没有下去。","有个部将来报：霸王自刎前，把战马推进了江里。马不肯走，他推了三次。","我听完，没有说话。风把灰烬吹上来，落在甲胄上，像一层薄薄的雪。"],"desc":"","choices":[],"next":"end_slaughter","next2":"","effects":"junji-10,renji-5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_slaughter","title":"结局 · 强攻之殇","type":"ending","lines":["后来史官写这场垓下之战，落笔极省：夜闻汉军四面皆楚歌，项王夜溃，自刎乌江。","没有人写那一夜之前的事：歌没有唱散他们，于是我们用了三成的人命，去填一道本可以用乡音打开的堤。","我站在尸山上数过——第九次冲锋之后，谷底安静了很久。霸王提着半截槊锋，站在最后一具尸体的旁边，没有回头。","他自刎那日，我远远看着。听说乌江亭长备好了船，他不上。我想起陉谷里那个卸甲敌将的眼睛——原来英雄末路，都是同一双。","回营路上，有部将问：军师可悔？","「悔的不是强攻。」我望着南方的炊烟，「悔的是——那首歌，我明明会唱。」","那晚我独坐帐中，把那面收了三年的合旗拿出来，在灯下看。旗角还留着陉谷的尘。","我把它摊开，又折好。折到第五折的时候，我听见自己的手指关节，响了一声。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"强攻之殇（败线结局 · 惨胜）","endingDesc":"歌没唱散的人，我们用人命填平了。胜利是真的，代价也是真的。","shop":"","duel":"","pick":"","minigame":""},{"id":"a3_final","title":"尾声 · 我的时代","type":"ending","lines":["风卷着歌声与硝烟，漫过北坡，呛得人喉间发紧。","我收剑入鞘，指节因用力而泛白，掌心还凝着剑柄的寒凉。从合围谷底的那一刻起，这场战争的胜负便早已注定。","但我知道——属于我的时代，来临了。","后来史官在这一页写：夜闻汉军四面皆楚歌，项王乃大惊曰：「汉皆已得楚乎？是何楚人之多也！」","再后来，他们又写：狡兔死，走狗烹；飞鸟尽，良弓藏。","史官的笔，从来比剑慢，但比剑狠。","我站在北坡上，看着谷底的烟缓缓散尽。风里还残留着那首歌的尾音——楚地的民谣，裹着江淮的水汽，散在夜色里。","我忽然想：那首歌，唱散了三万人的军心；可它会不会有一天，也唱到我的城下来？","不知道。我只知道，属于我的时代来了——史书的笔，已经蘸好了墨。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"属于我的时代（终章）","endingDesc":"十面埋伏，围的是霸王；最后的伏兵，埋在史书里等着设伏的人。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_jogou","title":"结局 · 狡兔死，走狗烹","type":"ending","lines":["长乐宫的钟室，四面是墙。","萧何的马车，停在中庭。他先进去，又出来，朝我点了点头——和二十年前月下追我时，同一个动作。","成也萧何，败也萧何。","我抬头，看见梁上悬着一盏灯。灯下，悬着一柄剑。","临刑前，我忽然想起郦生。那年齐宫的鼎，和我面前这盏灯——原来都是一样的火。","我替他死在鼎边，他替我死在刀下。这笔账，史书替我记着。","殿外，传来报时的钟声。一下，一下——像垓下那晚，四面楚歌的调子。","史官落笔：狡兔死，走狗烹；飞鸟尽，良弓藏。","他们只写了八个字。没有人写：那把弓，是我自己递出去的。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"狡兔死，走狗烹（韩信结局 · 因果）","endingDesc":"郦生之死是第一笔债，钟室之灯是最后一笔——递出去的刀，终究有人替你收鞘。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_lianggong","title":"结局 · 良弓未藏","type":"ending","lines":["交还兵符那日，我在长安住了下来。","陛下来看过我一次，带了酒。酒是沛县的老酒——他说，当年在县里当亭长，就好这一口。","我们喝了半宿，谁也没提打仗的事。他走时，在门口站了一会儿，说：韩信，你的靴子，还是当年那双。","后来淮阴有人问我：将军，你后悔吗？那么多功业，说放就放了。","我望着南边的水田：后悔什么？弓藏在匣里，才是好弓。","再后来，史书写：淮阴侯韩信，善终。","没有人写的是——我每年祭郦生，都在他坟前放一壶酒。齐王没来得及请他喝的那壶。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"良弓未藏（韩信结局 · 善终）","endingDesc":"你把弓藏进了匣子，也把郦生那壶没喝到的酒，年年递到了坟前。","shop":"","duel":"","pick":"","minigame":""}],"viewpoints":[{"id":"vp_hanxin","name":"韩信","desc":"忍、等，然后一击。这一击等了二十年。","start":"start"},{"id":"vp_lord","name":"主公" "6 4\" opacity=\"0.9\"/><path d=\"M1680,155 C1700,155 1700,268.32 1720,268.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M1680,155 C1700,155 1700,350.32 1720,350.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M1920,155 C1940,155 1940,124.32 1960,124.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M1920,155 C1940,155 1940,206.32 1960,206.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/>","laneSvg":"<rect x=\"0\" y=\"70\" width=\"2450\" height=\"394\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"85\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">不尽长江滚滚流</text><rect x=\"0\" y=\"232\" width=\"2450\" height=\"318\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"247\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">视角 · 柴将军</text>","nodes":[{"id":"start","title":"棋 · 金陵御花园","type":"scene","lines":["「殿下，该您了。」","「啊？噢，好。」","棋子落下，却又弹起，两个跳跃，便打乱了棋阵。他笑了笑，随着我一起把棋扶回。","忽然，一阵急促的脚步由远而近。「报！前方战线传来消息——」近卫趋步近前耳语，说出了那个足以令我放声高歌的消息。我攥紧掌心的玉佩，努力抑制住激动的情绪，用尽可能平静的语气说道：「知道了，你下去吧。」","我很激动。而对坐的那个人，却比我沉得住气——他只稳稳拈出一枚白子，开始劫材，才缓缓开口：","「殿下——小儿大破贼军。」","我握着玉佩，笑了。窗外梧桐正绿，御花园的风把棋枰上的尘吹起来，又落回原处。","「柴卿，」我忽然问，「你方才落那枚白子之前，看了我几眼？」","他拈子的手，顿了顿：「一眼。」","「一眼就够？」","「回殿下，」他说，「殿下握着玉佩的时候，棋子落得最快——臣那一眼，是等殿下把这枚子，落稳。」"],"desc":"","choices":[],"next":"q_intro","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"q_intro","title":"手谈","type":"duel","lines":["这一盘棋下到日头偏西。我赢了半子——是他让的。他当我不晓得，或者，我装作不晓得。","十年了。从孤行冠礼那年，他就陪孤下棋。我落子快，悔棋也快；他落子慢，从不悔棋。","我摩挲着腰间那枚玉佩——母妃留给我的，说每逢大事就握着它。如今我握着它，像握着一件没说出口的心事。","我知道他看得出我今日为何心神不宁。他不只是我的臣，还是我的棋友。棋友，看得见棋子背后的人。","棋盘之外，是另一盘棋：我是储君，他是握兵的臣。棋盘之内，我们尚可以只是两个下棋的人。","今日这盘棋终局时，我忽然问了他一句没头没尾的话：","「柴卿，你说——棋盘上的胜负，和棋盘外的胜负，是一回事吗？」","他拈着棋子，久久不语，不知如何作答。窗外的风把梧桐叶吹得沙沙作响。","日头斜过棋枰，把那枚悬在半空的白子，照出一线影子。","他还没落子。我忽然有些后悔问出口——棋盘内外的界线，原是我自己定的；如今，也是我自己要去踩的。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_qipan","pick":"","minigame":""},{"id":"q_win","title":"手谈 · 接住了","type":"scene","lines":["他落下手中白子，答道：「回殿下：棋盘上的胜负，是黑白多寡；棋盘外的胜负——」他顿了顿，「是这盘棋，还有没有人陪你下下去。」","我怔了很久。窗外的梧桐叶落在棋枰上，我拾起来，夹进书页里，忽然笑了，笑得像当年那个行冠礼的少年：「那柴卿可要长命百岁。这盘棋，寡人要下几十年。」","「臣，遵旨。」","彼时我并不知道，这盘棋，只剩三年了。","许多年后，我坐在御书房里，还会忽然想起那日他说「下几十年」时的笑——那日之后，我再没见过他笑得那样敞亮。","那枚梧桐叶，夹在哪一卷书里，我始终没有再去找。","风从御花园过。棋枰上，黑白参差——他那枚白子落定之后，这一局，我赢了半子。","我知道是让的。他也知道我知道。可那半子，我们都接住了。"],"desc":"","choices":[],"next":"q_bridge","next2":"","effects":"dixin+10；旗标:qipan_heart","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"q_lose","title":"手谈 · 说岔了","type":"ending","lines":["「棋盘外的事，臣不敢妄议。」他垂下头。","「……也是。」我收起笑意，摩挲着棋子。那枚棋子在我指间转了又转，良久，轻轻放回了棋盒，「是寡人问得唐突了。」","「殿下言重了。」他说。我没有再说话。那日的棋，到此为止。","那日之后，御花园的棋局，就再没约过第三个人。","有些话没接住，就永远接不住了。多年后我坐在御书房里，常常想：若是那日他接住了那句话，后来的棋，会不会是另一盘？可这世上没有如果。棋没有，君臣也没有。","梧桐叶又落了。这一回，没有人把它夹进书页里。"],"desc":"","choices":[],"next":"","next2":"","effects":"dixin-5","ending":"不答（败线结局 · 说岔）","endingDesc":"那一局没接住的话，这辈子，都没有再接住。","shop":"","duel":"","pick":"","minigame":""},{"id":"q_bridge","title":"三年","type":"scene","lines":["那盘棋下完了，仗没有打完。","此后数年，捷报一封接一封地从北疆入京。每一封，朕都亲手拆，亲手读，读完了亲手收进御案左手的匣子——那匣子，和御花园的棋枰，隔着一道屏风。","直到那一年，烽火烧到了金陵城下——八百里加急的诏书发出去那日，孤立在城头，望到天黑。","没有等到回音。等来的是城外漫山遍野的营火，像星河坠进了旷野。","城下的风很冷。我握着玉佩，忽然想起棋枰上他教我的那句话：越是紧要关头，越要慢。","可这一回，慢的那一头，不在我手里。"],"desc":"","choices":[],"next":"q_chengxia","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"q_chengxia","title":"城下","type":"scene","lines":["敌军围城的第三日，营火连十里。站在城楼上往下看，那一片火光安静得可怕——像棋盘对面那个人，落子前的沉默。","守将请我回宫：殿下千金之体，不可立于矢石之下。百官附议，理由说得一个比一个好听。","我知道他们在怕什么。怕的不是城破——是城破之前，储君先乱了。","我摩挲着腰间的玉佩。母妃说，每逢大事，就握着它。可这一回，它焐不热我的手。","城外的烟柱，又多了三处。","第三日夜里，我在城楼上值到四更。城砖上结着霜，我数着远处的营火——一千八百七十三处。","身后有脚步。守将捧着热汤跪着，汤碗里的热气，在夜风里一下子就散了。","「殿下，喝口热的罢。」","我接过汤碗，没有喝。我看着碗里的热气散尽，忽然问：「你说——北边那位，此刻在做什么？」","守将一愣：「末将不知。」","「他大概在看地图。」我说，「他在等一个时候。」"],"desc":"","choices":[{"text":"「天子守国门，君王死社稷。」——孤不走，就在这城楼上，与城墙共存亡。","hint":"登城 · 军心所系","next":"q_jiebao","cond":"","effects":"旗标:chengxia_shou；dixin+10"},{"text":"回宫，侍奉病中的父皇——东宫不能先乱。","hint":"固本 · 守的是人心","next":"q_jiebao","cond":"","effects":"dixin+5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"q_jiebao","title":"捷报入京","type":"scene","lines":["三日后，捷报到京。柴国公没有回援——他捣敌腹心、半路设伏，大破回援之敌，京师解围。","捷报入殿那一刻，满殿欢呼。我没有出声。我想起城下那三日的营火，想起棋枰上他教我的第一句话：越是紧要关头，越要慢。","原来他把这句话，用在了千里之外。","父皇撑到了那封捷报入京。六月初一，龙驭上宾。他走之前只交代了一件事：把御花园那副棋，收进库里。","朕即位，加封柴国公。诏书是朕亲笔写的，字字客气——写完了，朕自己看了很久：写的是客气，压的是不安。","如今，御案上的捷报越堆越高，朝堂上的议论，也越来越响了。","我把那副棋从库里取出来，摆回御花园。棋盘擦了三遍，棋盒摆正——可那盘棋，再没有人陪朕下了。"],"desc":"","choices":[],"next":"cheng_feng","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"vp_chai_start","title":"第二视角 · 柴将军","type":"scene","lines":["三更。我掀帘出帐，看了一眼天。月亮已经偏西。","斥候还没回。斥候队长蹲在辕门边，每听见一声马蹄，就站起来一次。","敌营方向有炊烟——三道，风向比前日偏了半步。","我回帐展开地图。指尖停住的地方，正是那三道炊烟的方向。","天蒙蒙亮时，队长快步进来：将军，斥候回来了。敌营在宰牛。","我收剑起身，只说了两个字：「备马。」","马牵来的时候，晨光正从东边的山脊线上漫过来。我摸了摸马颈，忽然想起很多年前，御花园那盘棋——先帝落子前，也是这样，先看天，再看棋盘。","「将军，今日宰牛——敌军怕是要动身了。」","「动身才好。」我翻身上马，「赶路的队伍，背脊是软的。」"],"desc":"","choices":[],"next":"zhuanzhe","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"zhuanzhe","title":"剑 · 战场（柴将军视角）","type":"scene","lines":["深夜，敌军军营。牛羊肉的焦香与马奶酒的酸腐气味弥漫，敌军头子戴上哈达，扭动着肥胖的肚腩，跳了一曲又一曲。","我知道，是时候了。翻身上马，放出信号弹——赤色焰矢裂空而起，顷刻间，喊杀声如排山倒海袭来。","半个时辰后，我坐在敌军主帅大营的案牍上批阅战报。后来史官在《武皇帝本纪》中如是记载：三月十三，柴家军日袭八百里。","翌日清晨，我骑着马在战场上穿行。亲兵们的目光里带着叹服，我面上不显，心里到底还是松快了几分。","「将军，」偏将策马过来，「缴获的甲胄辎重足有三大营，怎么处置？」","「封存造册，一件不动。」我说，「打了胜仗，更该小心——庆功的酒醉人，醉了的将军，容易掉脑袋。」","「柴将军！有诏书！」","亲兵呈上一封沾满尘土的蜡封诏书。我笑着接过，缓缓拆开封线——绢帛上朱笔急书三字，将笑意瞬间凝冻在我唇角。","「金陵危。」","我盯着那三个字，看了很久。诏书在风里轻轻响着，战场的烟尘还没散尽，前方的路却已经换了方向。","我抬头看了看天空。湛蓝的天空上，除了白云，只有鹰隼在盘旋——如悬于疆场之上的黑白棋子。","偏将还在等我的军令。我握着那封诏书，指节收紧，又松开。","「金陵危」三个字下，是先帝的印。印是热的——盖下去的时候，朱砂还没干透。"],"desc":"","choices":[{"text":"「传令：停止打扫战场，缴获全弃，俘虏全放，一刻钟拔营。」回师勤王。","hint":"急赴 · 恐已不及","next":"r_intro","cond":"","effects":"旗标:plan_huiyuan"},{"text":"盯着地图良久——回援已来不及。那就，围魏救赵。","hint":"谋势 · 反向行军","next":"r_intro","cond":"","effects":"旗标:plan_weiwei；junGong+10"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"r_intro","title":"围魏救赵","type":"duel","lines":["马蹄踏碎月光，军队如黑色铁流悄然转向。","深夜的行军队列里，曾传来这样一段对话：「将军到底怎么了？我们走的方向离营寨越来越远了。」「听说是京城出事了，让我们赶着回去呢。」「那我们走反了啊？」","马蹄声卷起尘土，悄然盖住了后续的对话。","若选了急援，此刻该是星夜兼程；而我望着南方，轻轻一笑——现在赶回去也来不及了。","我十六岁从军。打了三十年仗，只学会一件事——越是紧要关头，越要慢。所以当所有人都以为我要回京时，我调转了马头。","城下之敌顿兵坚城，最怕的，就是老巢起火。对面不敢赌自己的身家性命，必然紧急回援——","而接下来，便是半路设伏，大破援军。","夜风从队伍前方灌过来。我听见身后的士卒在低声议论，有人喊了一声「将军」——我回头，队伍在月光下停成一条黑色的线，等我一句话。","「不是回京。」我说，「是去砍他们的根。」","队伍重新开拔。马蹄声起，像一场落了满地的棋。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_junxi","pick":"","minigame":""},{"id":"r_win","title":"大破","type":"scene","lines":["敌军主力果然回援。疲惫之师，一头撞进我预设的伏击圈——兵刃的寒芒亮起时，胜负已定。","捷报入京那日，京城解围。殿下跌坐在龙椅上，手里攥着的玉佩浸透了冷汗——这是后来近侍告诉我的。","六月初一，帝崩。","丧报是六月初三到军中的。报丧的人说，陛下走得很急，临终前只交代了一件事：把御花园那副棋，收进库里。","我在军中接到丧报，朝着金陵方向，跪了很久。膝盖底下的土，被我跪得湿了一片。","新帝登基，加封我为国公。圣旨的措辞很客气，客气得像隔着一层琉璃。","跪完起身时，我摸了摸怀里那枚白子——它贴着我的胸膛，焐得发烫。","那枚白子，是先帝赐的。他赐我这枚子的时候说过：将帅用兵，如落子——落下去，就没有回头。","如今教我落子的人，走了。"],"desc":"","choices":[],"next":"r_yiqi","next2":"","effects":"junGong+10,dixin-5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"r_yiqi","title":"忆棋","type":"scene","lines":["丧报入军那夜，我没有睡。帐里只点了一支烛，我把行囊最底层的一个布包取出来，层层打开——里面是一枚白子。","许多年前我第一次奉诏出征，先帝在御花园的棋枰边送我。他没有赐金赐甲，只从棋盒里拈出一枚白子，放在我掌心：","「柴卿，朕观你十年看棋不语。今日赐你这一子——将帅用兵，如落子：落下去，就没有回头。」","那时我才明白，我在棋盘边站着看的那十年，他一直在看我看棋。","我陪他下过吗？没有。我身份是臣，执不得子。可这一枚，我贴身带了半生——打过多少仗，它就跟我走了多少路。","如今先帝龙驭上宾。这世上，再没有那个会在落子前替我想一步的人了。","我把白子收进怀里，望着金陵的方向。接下来的路怎么走，该我自己落子了。","烛火跳了一下。帐外的风，卷着北疆的沙，扑在帐布上，沙沙响——像有人在很远的地方，翻着一页纸。"],"desc":"","choices":[{"text":"叩谢皇恩，整军回京。","hint":"孤臣 · 朝堂是另一盘棋","next":"end_guchen","cond":"","effects":""},{"text":"先回京奔丧——陛下，等等臣。","hint":"君臣一场 · 那枚棋，带回去","next":"end_bensang","cond":"","effects":""},{"text":"留在军中。北疆还不太平。","hint":"永镇边关 · 鹰隼作伴","next":"end_yingxun","cond":"","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_bensang","title":"结局 · 奔丧","type":"ending","lines":["大破之后第三天，丧报送抵军中。六月初一，帝崩。","我放下军报，问了三件事：灵堂设在哪里，先帝可有遗诏，新帝何时即位。问完，安排了三日军务，交印，换素服，轻骑回京。","灵前，我三跪九叩，一样不缺。起身时，从怀里摸出一枚棋子——御花园那盘棋的最后一子。那盘棋他赢了半子，这枚子我一直收着。","我把棋子放在香炉旁，没有说一句话。","新帝登基后问起那盘棋，我说：陛下赢了。","「那枚棋子呢？」","「留在灵前了。」","此后多年，我照旧领兵。京中有人说我薄情——先帝崩了，竟连一滴泪都没有。","没有人看见，我每年六月初一，都要独坐一夜。面前摆一盘棋，只落一子。","那一子，落在我让了他半子的那个位置。","灵堂的香，烧了一夜。那枚白子搁在香炉边，被香灰蒙了一层——我没有擦，也没有取回。","有些子，落在棋盘上，就再也收不回来了。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"奔丧（剑线结局 · 君臣一场）","endingDesc":"棋子留在灵前。此后每年六月初一，你只落一子——落在让他的那一步。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_yingxun","title":"结局 · 鹰隼","type":"ending","lines":["丧报送抵军中那天，我跪了很久。起来的时候，帐外的鹰隼正从头顶掠过——湛蓝的天上，只有它和白云。","宫里的人来了一趟又一趟，催我回京。我总说：伤还没好，北疆还不太平。","后来连催三道的诏书都到了。我接了诏，没有起身。","「将军，圣意已决。」","「我知道。」我说，「但比起金陵，我更习惯这里的风土。」","我把诏书收进怀里，翻身上马，往北去了。身后是京城，身前是荒原。鹰隼在天上跟着我，如影随形。","那年夏天，军报上只有几行潦草的字：六月初一，伏兵待敌，杀敌万余，逐北三十里。走送之。","此后很多年，北疆的军报上都只写战绩，不写将军的名字。有人说柴将军是不肯回京；有人说他是怕回去了，就再也回不来。","只有天上的鹰隼知道——他回不回去，都不妨碍他把北疆，守成了自己的棋盘。","每年六月初一，我还是会独坐一夜，摆一盘棋，只落一子。","子落下去，风从北疆的荒原上吹过来。天上的鹰隼，盘旋一圈，又往更北的地方去了。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"鹰隼（剑线结局 · 永镇边关）","endingDesc":"你留在了北疆。宫里的人催了一辈子，你没有回头一次。","shop":"","duel":"","pick":"","minigame":""},{"id":"r_lose","title":"血战","type":"scene","lines":["敌军回援的兵锋比预想的更锐。伏击圈被撕开三道口子，血战一日一夜，我军伤亡惨重——但京城，终究是解了围。","六月初一，帝崩。","报丧的人说，陛下临终前，反复念着一句话：棋，还没下完。","我在军中接到丧报，朝着金陵方向，跪了很久。身上的伤还没好，跪下去的时候，旧伤裂了，血渗出甲胄。","新帝登基，加封我为国公。圣旨的措辞很客气，客气得像隔着一层琉璃。","跪着的时候，血顺着甲缝往下滴，在土里洇开一小片暗红。","我忽然想起那一夜，我率军转向时，士卒们喊的那声\"将军\"——他们跟着我，把命押在了一个\"慢\"字上。","这一回，慢字没有救回所有人的命。"],"desc":"","choices":[],"next":"end_suijia","next2":"","effects":"junGong+15,dixin+5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_suijia","title":"结局 · 碎甲","type":"ending","lines":["解围的捷报与先帝的丧报，一前一后到军中。我把两份文书并排摆在案上，看了很久——一份是胜，一份是殁。","那一夜我又取出了那枚白子。当年御花园里，先帝笑问：柴卿看棋十年，可学会了？我答：臣学的是陛下一句话——可取子，不可失势。","如今京师解了围，这是取子。可跟我南下的老兵，十个里没回来三个——这一局，我失了势。","我把白子压在那份阵亡名册上，守了一夜。名册很长，烛很短。","新帝即位，遣使问将军安好。我只回了四个字：甲碎，心未。","后来史官写这一战，只肯给一句：围解，碎甲而葬者三千。那枚白子，我始终没有落回棋盘——有些局，输了就是输了。","天亮时，烛尽了。名册上的名字，在晨光里一行一行地亮起来。","我把白子收进怀里。它还是那枚白子——只是这一回，它压过三千个名字。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"碎甲（败线结局 · 血战）","endingDesc":"围解了，这一子算落下了。可那盘棋失了三分势——再也收不回来。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_guchen","title":"结局 · 孤臣","type":"ending","lines":["丧报与诏书，同日抵军。","诏书写得客气：加封国公，召即刻入朝。客气得像隔着一层琉璃。","诸将都替我高兴。我捏着诏书看了一遍，放回案上，只说了一句：「知道了。」","入朝那日，我没有穿甲。城门口的官员愣了一愣：「将军，这身打扮……」","「入朝，不必带刀。」","宫门外，我候了一个上午。没有人传，也没有人拦。后来才知，新帝在偏殿见了几拨人，最后一拨，才轮到我。","新帝没有问功，也没有问罪。他只是看着我，忽然说了一句：「柴卿，朕的父皇，常与你说棋。」","「是。」","「他临终前，握着朕的手，说了一句话。」新帝停了停，「他说——那盘棋，柴卿让了他一辈子，让到头了。」","我低着头，很久没有说话。","「臣，」我说，「从今日起，不让了。」","新帝没有再问。他给了我一个闲职，把我养在京城——朝堂上人人都知道，先帝在时，我是先帝的人。先帝没了，我谁的人都不是。","我不怨，也不求。京城的日子，日以下棋度日。偶尔有人登门，多半是来探口气的。我让座，奉茶，送客，一句多余的话也不说。","后来史书写：柴国公晚年，日以棋酒自娱，郁郁而终。","史书没有写的是：孤臣二字，是他自己选的。","入朝那天穿的布衣，我留了一辈子。每年六月初一，换上新洗的那件，独坐一日。","棋盘摆着，白子在盒里。那一日，我一子不落。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"孤臣（剑线结局 · 布衣入朝）","endingDesc":"先帝一去，你谁的人都不是。孤臣二字，是你自己选的。","shop":"","duel":"","pick":"","minigame":""},{"id":"cheng_feng","title":"局 · 功高（帝王视角 · 新帝）","type":"scene","lines":["「报！柴国公又胜了。」","御案上的奏报堆得越来越高。每一份捷报，都像棋盘上落在你领域里的一枚黑子——好看，也扎眼。","近侍屏退左右，压低声音：「陛下，朝堂上有人议论：柴家军只知有主帅，不知有朝廷。还有人说，柴国公功勋卓著，正该入朝荣养——」他顿了顿，没敢说下去。","「说下去。」","「——怕的是，功高震主，尾大不掉。」","我挥了挥手，让他退下。御书房里只剩我一个人，和那堆捷报。","三封折子，朕看了三遍。每一遍都觉得它们有理，每一遍又都觉得它们没理。可朕是皇帝——皇帝，不能赌一个没理。","先帝教柴卿的，是怎么下棋；柴卿教朕的，也是怎么下棋。太傅教朕的，是怎么猜人。如今朕坐在先帝坐过的位子上，忽然分不清：朕学的，够不够防住一个善下棋的人。","我摩挲着一枚白子。三年前御花园里那盘棋，朕赢了半子——谁让的谁，彼此心知肚明。你那句话，朕也一直记着——「是这盘棋，还有没有人陪你下下去。」","可如今，这盘棋已经下到了你的领域里。黑子压城，白子四散——棋枰上没有第三个人，可以帮你复盘。","我拈着那枚白子，在指间转了又转。窗外，御花园的梧桐，又绿了一季。"],"desc":"","choices":[{"text":"召他回京，收其兵权，荣养终身——棋友，不该变成棋子。","hint":"全君臣之义 · 需帝心≥55","next":"end_qiyou","cond":"{\"flag\":\"qipan_heart\",\"statAtLeast\":{\"dixin\":55}}","effects":"旗标:end_retire；dixin+10"},{"text":"三道诏书催他入朝，暗夺其兵——朝堂制衡，从来不看旧情。","hint":"帝王常规 · 谗言已入","next":"end_beiju_gate","cond":"","effects":"旗标:end_duoquan"},{"text":"留他在外镇守，倚为长城——异族未灭，何以刀枪入库？","hint":"用人不疑 · 可谗言不会停","next":"end_changcheng","cond":"","effects":"旗标:end_changcheng"},{"text":"朕，亲往。——带三千禁卫出关，去他的营帐里下棋。","hint":"亲往 · 需帝心≥60 · 君王的棋，下到臣子的营帐里","next":"end_qinwang","cond":"{\"statAtLeast\":{\"dixin\":60}}","effects":"旗标:end_qinwang；dixin+5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_beiju_gate","title":"御书房外 · 夜","type":"scene","lines":["诏书是黄昏送出去的，折子是入夜才摊开的。三封谗言，措辞各异，指向同一个名字。","你提笔，在召他回京的诏书上落了印。笔锋落下的那一刻，你忽然想起十年前御花园那盘棋——","他落子慢，从不悔棋；你落子快，悔棋也快。","铜漏滴答。案头的灯，把诏书上那枚朱印照得发亮，像一枚刚落的子。","朱砂未干。夜风从窗缝里钻进来，吹得印泥边缘，起了一层细毛。"],"desc":"","choices":[{"text":"你还记得他那句话——「是这盘棋，还有没有人陪你下下去。」","hint":"一念之仁 · 血色棋子的开端","next":"end_beiju","cond":"{\"flag\":\"qipan_heart\"}","effects":""},{"text":"有些话，十年前没接住，十年后也不必再接了。","hint":"决裂 · 覆盘","next":"end_juelie","cond":"","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_juelie","title":"结局 · 覆盘","type":"ending","lines":["他回京那日，是六月廿八。我坐在御书房里，面前摆着三封折子，一封诏书。","「臣，叩见陛下。」他卸了甲，布衣入见，在殿外跪了很久。我数着铜漏，让他跪到日头偏西，才传他进来。","「柴卿，」我开口时，声音比想象中稳，「有人说你拥兵自重。朕不信。可朕需要你一句话，好堵住满朝的嘴。」","他抬起头，看着我。那目光我认得——十年前御花园里，他教我下棋时，就是这样看我的。","「陛下要的，是臣的一句话，还是臣的兵权？」","御书房里静了很久。我听见自己说：「朕要的，是这盘棋，还能下下去。」","他笑了笑，从怀里摸出一枚白子——当年御花园那盘棋，我赢了半子，他收起来的那一枚。「这盘棋，」他把白子轻轻放在御案上，「十年前就下完了。陛下如今才来问——迟了。」","「那就让它下完。」我捡起那枚白子，放进他手心里，「你回北疆去。朕的棋，从今往后，不劳柴卿了。」","他捏着那枚白子，站起来，一步一步走出殿门。走到门槛，他停了一下，没有回头：","「臣，遵旨。」","后来史官写：柴国公还镇北疆，越三年，薨。帝闻之，辍朝三日。","没人知道那天御书房里发生过什么。只有殿角的铜漏，滴滴答答——和十年前，一模一样。","那枚白子，他带走了。朕案上那副棋，从此缺了一枚。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"覆盘（决裂结局 · 覆盘）","endingDesc":"君臣之义，止于一枚白子。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_qiyou","title":"结局 · 终局之局","type":"ending","lines":["他交出兵权那日，只提了一个请求：再下一盘棋。","御花园的梧桐又绿了。他落子依旧慢，从不悔棋；你落子依旧快，悔棋也快。","这一盘你赢了半子——是他让的。他知道，你也知道。这一次，你们都笑了。","「柴卿，棋盘上的胜负，和棋盘外的胜负，到底是一回事吗？」","他拈着棋子想了很久：「回陛下——只要下棋的人还在，就是一回事。」","他后来寿终正寝，谥号「武襄」。史官在传末写：君臣相得，始终不疑，为一代佳话。","多年后你禅位于太子，移居御花园旁的别宫。每天傍晚，你还是会摆一副棋——","白子朝东，黑子朝西。","风过棋枰。有一年秋天，梧桐叶落进棋盘，恰好落在中腹——那枚叶子的位置，是十年前他让出那半子的地方。","你没有把叶子拂开。就让它落着。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"终局之局（隐藏结局 · 棋友）","endingDesc":"棋盘外的胜负，终究被棋盘内的那句话救了回来。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_beiju","title":"结局 · 血色棋子","type":"ending","lines":["后来的事，史书写得很省。","谗言一封接一封。终于有一日，诏书到了军中：召国公即刻入朝，另遣将领接掌柴字营。","他入朝那日，我远远看见他脱了甲，换了一身布衣——像个教书先生。他在宫门口跪了很久，没人敢去扶。","再后来的事，史书只有八个字：「终陷朝争，身死族灭。」","抄家那日，官吏在他府中搜出的最贵重之物，是一副围棋——白子温润，黑子沉沉，其中一枚白子上刻着极小的两个字，要凑到眼前才看得清：","「御园。」","《旧唐书 · 柴国公传》：「夫弈棋者，谋子亦谋势。柴善谋子，破军杀将，可谓良将；然不善谋势，功高震主，遂成困局。君臣二人，皆困于棋枰之内，岂独柴之罪耶？」","殿角铜漏滴答。棋盘上的那枚血色棋子，终究是落下了。","那枚刻着\"御园\"的白子，后来收进内库。朕没有看它，也没有让人熔了它。","它和那副御花园的棋，隔着两道宫墙，落着一样的灰。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"血色棋子（正史结局）","endingDesc":"谋子而不谋势——困局成矣，君臣皆在枰内。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_changcheng","title":"结局 · 长城","type":"ending","lines":["你没有召他。一年，两年，五年——捷报年年入京，谗言也年年入京。","异族终于被打回了漠北。那天起，朝堂上只剩一个声音：鸟尽弓藏，正当其时。","诏书到了军中。他没有抗命——他只是请了第三道诏书之后的第四道：「臣病。」","你批了「准养」。又三年，他病殁于边关，死那天，帐外下了场大雪，三军缟素，雪落在甲上，像满盘白子。","他终究没回金陵。灵柩依他遗言葬在山坡上，朝着当年设伏的那道谷——那晚他在那里等过一夜的月亮。","史官在传末写道：柴留镇北疆十一载，未尝一入京师；帝亦未尝一召。君臣相见于枰内，相忘于江湖——或曰：此非君臣之福，乃社稷之福。","你在那页传记的眉批里，只写了三个字：","「是朕欠。」","笔搁下时，窗外的雪正大。御花园那副棋，棋盘上积了一层薄雪——白子黑子，都看不见了。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"长城（镇边结局 · 相忘江湖）","endingDesc":"他没有回到棋盘上——你把整个北疆，留作了他的棋盘。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_qinwang","title":"结局 · 亲往","type":"ending","lines":["你没有发诏书。你带着三千禁卫出了关——旌旗减半，仪仗全免，像个赶路的行商。","到营帐那日，他迎出十里，脱了甲，只穿布衣。君臣对跪在草地上，谁也没先说话。","还是你先开的口：「柴卿，这盘棋，寡人下了五年，没人陪朕复盘。今日特来讨教。」","棋盘就摆在草坡上。风很大，棋子压了镇纸。这一局下了整整一下午——你没有赢，他也没有让。终局数子，和棋。","「柴卿，棋盘上的胜负，和棋盘外的胜负，到底是不是一回事？」这个问题，他等了你五年。","他望着远处的鹰隼，想了很久：「回陛下——是同一回事。因为下棋的人，和陪下棋的人，都是活的。」","三年后他病殁于北疆，谥「武襄」。你没能再去一趟，只在御花园的棋枰东角，长年摆着一杯没人动过的茶。","史官写：帝亲往北疆劳军，君臣对弈于野，和局而散。自是北疆二十五年无警。","那杯茶，每年换一盏。换茶的宫人不知道，御花园东角那盏茶的位置——正好是他当年让出半子的那个方向。","风过茶烟。北疆的雪，落了又化，化了又落。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"亲往（隐藏结局 · 御驾出关）","endingDesc":"君王的棋，下到了臣子的营帐里——那一局，和棋。","shop":"","duel":"","pick":"","minigame":""}],"viewpoints":[{"id":"vp_emperor","name":"帝王","desc":"一盘棋陪了他十年。棋友，看得见棋子背后的人。","start":"start"},{"id":"vp_chai","name":"柴将军","desc":"打了三十年仗，只学会一件事。谋子，也谋势。","start":"vp_chai_start"}]},{"id":"diaolan","title":"雕栏玉彻朱颜再","subtitle":"孤家寡人 · 其一 · 傀儡的政变","mode":"story","startScene":"start","W":4610,"H":434,"nodeSvg":"<g class=\"node\" data-id=\"start\" transform=\"translate(40,84)\" opacity=\"1\">\n      <rect width=\"200\" height=\"56\" rx=\"6\" fill=\"#1c1915\" fill-opacity=\"0.8\" stroke=\"#5b8fb8\" stroke-width=\"2.5\" stroke-dasharray=\"5 3\" class=\"node-rect\"/>\n      <text x=\"8\" y=\"18\" font-size=\"14\" fill=\"#5b8fb8\" font-weight=\"700\">□</text>\n      <text x=\"27\" y=\"17\" font-size=\"13.5\" fill=\"#e8d9b0\" style=\"paint-order:stroke;stroke:#0e0c0a;stroke-width:3.5px\">汉献帝</text>\n      \n      <text x=\"8\" y=\"44\" font-size=\"10\" fill=\"#9a8f7d\">场景</text>\n    </g><g class=\"node\" data-id=\"kingdom\" transform=\"translate(280,84)\" opacity=\"1\">\n      <rect width=\"200\" height=\"56\" rx=\"6\" fill=\"#1c1915\" fill-opacity=\"0.8\" stroke=\"#5b8fb8\" stroke-width=\"1.5\"  class=\"node-rect\"/>\n      <text x=\"8\" y=\"18\" font-size=\"14\" fill=\"#5b8fb8\" font-weight=\"700\">□</text>\n      <text x=\"27\" y=\"17\" font-size=\"13.5\" fill=\"#e8d9b0\" style=\"paint-order:stroke;stroke:#0e0c0a;stroke-width:3.5px\">凋零的国家</text>\n      \n      <text x=\"8\" y=\"44\" font-size=\"10\" fill=\"#9a8f7d\">场景</text>\n    </g><g class=\"node\" "none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M2880,206 C2900,206 2900,99.68 2920,99.68\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/><path d=\"M2880,124 C2900,124 2900,124.32 2920,124.32\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/><path d=\"M720,155 C740,155 740,124.32 760,124.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M1200,155 C1220,155 1220,124.32 1240,124.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M2160,155 C2180,155 2180,124.32 2200,124.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M2400,124 C2420,124 2420,124.32 2440,124.32\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/><path d=\"M3120,155 C3140,155 3140,124.32 3160,124.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M3360,155 C3380,155 3380,124.32 3400,124.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M3600,124 C3620,124 3620,124.32 3640,124.32\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/>","laneSvg":"<rect x=\"0\" y=\"70\" width=\"4610\" height=\"250\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"85\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">雕栏玉彻朱颜再</text>","nodes":[{"id":"start","title":"汉献帝","type":"scene","lines":["长安，晌午，宫殿。宽敞的宫殿内只有我一人，正躺在太师椅上捧着书，读三国的故事——不知不觉，已读到汉献帝诛杀曹操的那一章。\r","\r","「朱将军又派人来催了，殿下。」\r","\r","我扭头凝望着跪在地上的那人，眉头紧皱：「知道了，我这就动身。」\r","\r","殿门关闭，宫殿恢复寂静。我转头看了看挂在墙上的画像，不由得自言自语：\r","\r","「恩师，你说，我会是下一个汉献帝吗？」\r","\r","画像上的老人微微笑着，不说话。他总是不说话。\r","\r","思绪随着汉献帝的故事散开：从衣带诏，到秘旨，再到最后的禅位……\r","\r","猛然，我把书用力合上，一字一句地道：「绝不！」\r","\r","我绝不是汉献帝。这回，我要做我自己的君主。\r","\r","殿外的风，从门缝里灌进来。画像的边角，微微卷动。\r"],"desc":"","choices":[],"next":"kingdom","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"kingdom","title":"凋零的国家","type":"scene","lines":["我接手的，是一个凋零的国家。藩镇割据、各自为政，政令不通，税收难行。我空有名义之姿，却无实查之政——连登基仪式，也是由藩镇节度使操办的。\r","\r","我刚被匆匆忙忙推上皇位，又得匆匆忙忙下诏封赏这些「从龙之臣」。我看着眼前一人多高、少说几千人的封赏名单，着实震惊了一回。\r","\r","一人得道，鸡犬升天。他们怕不是连村里的野狗也算上了。——我心里这样想。\r","\r","但说出口的，却是另一番措辞：「朱将军果然是重情重义、赏罚分明之人。今后军中诸多事宜，还望朱将军鼎力相助啊。」\r","\r","记忆中，那个肥头大耳的将军笑得很是灿烂。\r","\r","哼。死到临头的蠢猪罢了。\r","\r","名单还在案上摊着。我提笔，又放下——这一笔落下去，是几万张嘴的饭碗，也是几百户人家的心。\r"],"desc":"","choices":[],"next":"dl_mingdan","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"chess","title":"养心殿 · 旧伤","type":"scene","lines":["大雨。「啪！」盒中棋子突然散落一地。\r","\r","「陛下，要叫太医吗？」对面的人明显慌了神。\r","\r","我摇了摇头，拉上袖子揉了揉发涨的手腕——眼神却不由自主地盯上了那道几乎贯穿了整个手臂的伤疤。\r","\r","「没事，老毛病了，缓缓就好。」\r","\r","疼痛一阵接着一阵。我终究还是熬不过，无奈地朝对方笑了笑：「让你见笑了，我可能……需要先躺一会儿。」\r","\r","疼痛久久不散，勾起诸多往事，又在某一刻悄然变成了愤怒。我几乎是咬着牙低吼：\r","\r","「为了除掉那个蠢货，这点代价还是值得的！」\r","\r","对面的臣子低着头，假装没听见。殿外的雨，下得更大了。\r"],"desc":"","choices":[],"next":"dl_jiushang","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"planning","title":"深夜 · 布防图","type":"scene","lines":["深夜，长安城。我举着煤油灯，端详着墙上的布防图，在心里又默念了一遍：\r","\r","旅贲军，是从我府里亲手带出来的，是自己人。京兆尹，昨日已经来信，愿意支持政变，可以算半个。关键在龙武军和右骁卫——只要他们保持中立，则大事可成。\r","\r","我只有一次机会。成败与否，就看今晚了。\r","\r","煤油灯的火苗，在风里晃了晃。墙上那幅布防图，是我用了一个月，一笔一笔描出来的。\r","\r","灯花爆了一下。我伸手，摸了摸怀里的东西。\r"],"desc":"","choices":[{"text":"摸了摸怀中毒药。冰凉的瓷瓶刺着掌心——若败，这便是归宿。绝不当汉献帝。","hint":"不留退路 · 死志即战意","next":"coup_intro","cond":"","effects":"旗标:poison_ready；quanli+5"},{"text":"把毒药扔进了炭盆——今夜之后，要么御极，要么赴死，不必自尽这么麻烦。","hint":"孤注一掷 · 反正失败也活不成","next":"coup_intro","cond":"","effects":"旗标:poison_burned；renmai+5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"coup_intro","title":"三短一长","type":"duel","lines":["煤油燃尽了一碗又一碗。我举着灯的手已经僵直，但仍握着它，安静地坐在一大片黑暗中，耐心等待。\r","\r","终于，一阵整齐划一的脚步声出现在房门外。\r","\r","我心里演练过诸多场景，但当事情真的发生时，仍旧激动不已。我扔掉怀中毒药，正要站起，却一个踉跄差点摔倒——身子早已大汗淋漓。\r","\r","房门被有节奏地敲了三下：两下短，一下长。\r","\r","「快，请进！」疲惫的声音，难掩我内心的兴奋。我知道——大事可为了！\r","\r","门开时，风灌进来，吹得桌上的布防图猎猎作响。\r","\r","我按住图角，走出去。长安的夜，黑得没有一颗星。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_piancoup","pick":"","minigame":""},{"id":"coup_win","title":"伤 · 右手","type":"scene","lines":["在我的右手被大刀意外划过的那一瞬间，人生过往像走马灯在脑海中放映。\r","\r","就那么一瞬间，我想到了汉献帝，想到了曹操，想到了作古的老师，想到了炎炎夏日的微风，还有微风下那张熟悉的脸庞。如果她没死，现在应该跟我差不多大了吧……\r","\r","但很快，我就被一股强大的力量硬生生从回忆里拉扯了出来——是疼痛。剧烈的疼痛。\r","\r","「快走！」不知是谁高呼了一声。我用另一只手捧着快要掉落的肌肉，双腿一夹马肚，向前狂奔。\r","\r","失去意识之前，天空好像下了一阵毛毛细雨。\r","\r","——但政变，成了。\r","\r","三日后，三镇节度使的头颅挂上了朱雀门。\r","\r","雨停的时候，长安的街上，有人开始挂灯。\r"],"desc":"","choices":[],"next":"dl_fengsui","next2":"","effects":"quanli+30","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"coup_lose","title":"败 · 毒药","type":"ending","lines":["九门失守。死士的火把逼近寝殿，喊杀声一浪盖过一浪。\r","\r","我退回内殿，反锁殿门，从怀里摸出那只冰凉的瓷瓶——还好，今夜出门前，我把它带上了。\r","\r","窗外火光冲天。我把汉献帝的故事想了一遍：衣带诏，秘旨，禅位……然后我笑了。\r","\r","汉献帝禅位之后，又活了十四年。十四年的「山阳公」，天天看着别人的脸色行医种菜。\r","\r","我拔开了瓶塞。\r","\r","「恩师，」我对着墙上画像的方向轻声说，「学生不孝——学生不做汉献帝。」\r","\r","殿门被撞开的时候，宫殿里已经恢复了往日的寂静。就像那个晌午一样——只是太师椅上，再没有人读书了。\r","\r","画像还挂在墙上。老人还是微微笑着。\r","\r","殿外的雨，落进了宫门。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"不做汉献帝（败死结局）","endingDesc":"他一生都在害怕成为汉献帝——最后，他确实没有成为。","shop":"","duel":"","pick":"","minigame":""},{"id":"boy","title":"与马赛跑的少年","type":"scene","lines":["军营中一阵接一阵高呼的浪潮。最外围的将士率先发现了我，我笑着摁住他们，摇头示意不要出声，随后随他们的模样，一屁股坐在草场上。\r","\r","「你说，这小子还能坚持多久？」「最多两刻钟。」「要我看，半刻钟就得累趴下。」\r","\r","我的目光定在一位与马驹赛跑的精干少年身上。那匹小马极善奔跑，早拉开了几十尺——但距离非但没有再拉开，反而愈发靠近。\r","\r","终于，他双手一伸摁住马匹，刚想翻身上马，却一个踉跄，重重摔下，趴在地上一动不动。\r","\r","一阵折腾后，我来到营帐中看望这个少年。他浑身青肿，正机械地被灌着草药汤。见我进来，刚挣扎着想起身，就被我摁住了。\r","\r","「哪有人能跑得过马的？」我笑出声——自手臂受伤后，我便舍弃了刀枪，一门心思研究骑术与奔袭。\r","\r","「陛下，那哪有君主要屈服于臣子的呢？」\r","\r","一句虚弱的言语从床上传出，却直击我的禁脔。\r","\r","我不由得一愣，随之收敛笑意，一板一眼道：「偶尔。」\r","\r","「但很快就不是了。」\r"],"desc":"","choices":[],"next":"boy_choice","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"boy_choice","title":"利剑","type":"scene","lines":["我知道，我那天的脆弱与慌乱，在这位少年面前一览无余。\r","\r","但我不知道的是——在不久的将来，这位威风凛凛的少年，会成为我横扫藩镇、廓清寰宇的利剑。且对此使命，乐此不疲。\r","\r","此刻，我看着榻上的少年，做出一个决定。\r","\r","他浑身还青肿着，眼睛却亮得像两粒火。\r","\r","这柄剑，是收进鞘里，带在身边；还是交给国库，由公家磨砺；或者，就让它留在军营，由土与铁养大——\r","\r","榻上的少年不知道我在想什么。他只是撑着身子，努力坐直了些。\r","\r","窗外，军营的灯火，一盏一盏地亮着。\r"],"desc":"","choices":[{"text":"收为亲卫，带在身边亲自调教——君臣之谊，从今日始。","hint":"真结局 · 需人心≥60 · 以心换心，他会成为最锋利的剑","next":"end_sword","cond":"{\"statAtLeast\":{\"renmai\":60}}","effects":"旗标:boy_heart；renmai+15"},{"text":"送入军校，以国士之礼培养——利剑当归国库，不入私门。","hint":"公心 · 需权柄≥40 · 剑更利，但不在你手里","next":"end_across","cond":"{\"statAtLeast\":{\"quanli\":40}}","effects":"旗标:boy_state；quanli+10"},{"text":"哪里也不去。把他留在营里，留在士卒中间——跑赢过马的人，该由军营自己养大。","hint":"需人心≥55 · 不收、不送、不忘","next":"end_far","cond":"{\"statAtLeast\":{\"renmai\":55}}","effects":"旗标:boy_far；renmai+10"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_sword","title":"结局 · 朱颜再","type":"ending","lines":["雕栏玉彻应犹在，只是朱颜改。\r","\r","后来的史书说，那场深夜政变之后，藩镇们才发现：那个他们亲手扶上皇位的傀儡，从来就不是汉献帝。\r","\r","旅贲军清君侧，龙武军易帜，右骁卫按兵不动到最后一刻——三镇节度使的头颅挂上朱雀门那日，长安下了很大的雨，像极了政变那晚。\r","\r","登基三年，我做的第一件事，是把那份一人多高的封赏名单锁进库房。第二件事，是颁布均田令，把藩镇攥在手里的田契，一亩一亩还给了百姓。\r","\r","朝堂上有人骂我是疯子。骂完的那几个，第二年的秋后，都悄悄把儿子送进了我的亲卫营。\r","\r","少年跟在我身边第七年，我让他独自领了一镇兵马。临行前夜他来辞行，跪在殿外，一句话也不说。\r","\r","「去吧。」我说，「跑赢过马的人，也跑得赢天下。」\r","\r","他抬起头，眼里还是当年那点没褪干净的倔：「陛下，臣若败了，怎么回来见您？」\r","\r","「败了就败了。」我放下朱笔，看着他，「回来便是。朕的殿，不差你一个位子。」\r","\r","后来他果然赢了。捷报雪片一样飞进长安，朝臣们跪了一地，山呼万岁。\r","\r","我站在朱雀门楼上，看着那支凯旋的队伍由远而近。少年在马上远远望见我，翻身下马，单膝跪地，动作还是那么利落。\r","\r","长安又下雨了。和政变那晚一样大的雨。\r","\r","雕栏玉彻应犹在，只是朱颜改。\r","\r","朱颜确实改了——改成了那个跑赢马的孩子，改成了满朝文武再不敢抬眼直视的、真正的天子。\r","\r","偶尔。但很快就不是了。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"朱颜再（正章结局 · 政变功成）","endingDesc":"傀儡的春天来得很晚，但终究来了。你与少年的故事，才刚刚开始。","shop":"","duel":"","pick":"","minigame":""},{"id":"rain_night","title":"朱雀门 · 雨","type":"scene","lines":["三镇节度使的头颅挂上朱雀门那天，长安下了很大的雨，像极了政变那晚。\r","\r","我站在门楼下，听着雨声里的人声——有欢呼的，有沉默的，也有压低了嗓子咒骂的。\r","\r","旧部来报：三镇余部尚有数万，或降或逃，人心未定。幕僚压低声音进言：\r","\r","「陛下，斩草除根，可保百年太平。或者……开恩招抚，收天下之心。两条路，都在今夜定。」\r","\r","我看着檐下雨帘，想起那份一人多高的封赏名单。想起那句：鸡犬升天的人，也记得是谁给的鸡犬。\r","\r","雨声里，我听见自己的心跳。\r","\r","这道旨意落下去，是血还是恩，天下人都会记住今夜。\r"],"desc":"","choices":[{"text":"传令：余党首恶，与三镇同罪——雨停之前，我要看到名单。","hint":"雷霆 · 杀一儆百，藩镇胆寒","next":"after_heads","cond":"","effects":"quanli+15,renmai-10"},{"text":"传令：罪止三镇，余者不问——降者复其职，逃者听其归。","hint":"施恩 · 人心可收，但藩镇会记得你心软","next":"after_grace","cond":"","effects":"renmai+15,quanli-5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"after_heads","title":"名单之夜","type":"scene","lines":["雨停之前，名单呈了上来。三镇余党首恶的名字，一页接着一页。\r","\r","我握着朱笔核完最后一遍，忽然想起那份一人多高的封赏名单——请功时，名字写得密密麻麻；如今赴死，也一样密密麻麻。\r","\r","「办。」我听见自己说，「自今日起，降者为编户，举兵者为鉴。」\r","\r","那一夜我梦见恩师。他站在朱雀门下，不夸也不责，只问了一句：「陛下，怕吗？」\r","\r","「怕。」我在梦里答得很诚实。「但汉献帝比我还怕。」\r","\r","三个月后，当我终于能下地行走时，第一件事，便是去军营巡视。\r","\r","出宫那天，宫门口的灯，换了新的。\r"],"desc":"","choices":[],"next":"dl_sanzhang","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"after_grace","title":"招抚之夜","type":"scene","lines":["招抚令当夜就发出去了。「罪止三镇，余者不问。」\r","\r","幕僚颇有微词：「陛下，斩草不除根，春风吹又生。」\r","\r","我指着那份一人多高的封赏名单：「记住——这几千人当初为什么能鸡犬升天？因为他们看见从龙有赏。」\r","\r","「今日若杀这数万人，明日举旗的人，就会多出一万个跟从的。让他们活，他们就会记得：这条命，是朝廷给的。」\r","\r","旬日之内，降书如雪片。我没有得意——只是又造了一份名单，照样一人多高。\r","\r","三个月后，当我终于能下地行走时，第一件事，便是去军营巡视。\r","\r","出宫那天，宫门口的灯，也换了新的。\r"],"desc":"","choices":[],"next":"dl_sanzhang","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_across","title":"结局 · 隔岸","type":"ending","lines":["军校三年，他毕业那天，我正隔着长街远远看着。\r","\r","他没有进宫谢恩。教习说，这孩子只问了一句：「陛下还练骑术吗？」\r","\r","后来他成了帝国最利的剑。横扫藩镇、廓清寰宇，战报一封接一封送进长安——落款永远是公事公办的四个字：「臣某谨奏」。\r","\r","我批阅他的战报，比批阅任何奏章都慢。\r","\r","再后来，有人说大将军在边关置了酒，只设两个座：一个对着长安的方向，一个空着。\r","\r","剑归了国库。可铸剑的那炉火，听说一直有人按时添柴。\r","\r","添柴的人是谁，没有人知道。\r","\r","只有宫门口的老灯匠说，每年他的生辰，都有人来买一盏灯，挂在朱雀门外，也不点，就那么挂着。\r","\r","灯是空的。灯下的人，也是空的。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"隔岸（公器结局 · 剑不在手）","endingDesc":"你把利剑还给了天下，天下替你养着它——你们隔着一整个江山，谁也没有先开口。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_far","title":"结局 · 远芳","type":"ending","lines":["我什么都没做。只是离营那天，回头望了一眼——少年还趴在草场上，已经被同伴们围着灌草药汤了。\r","\r","后来的事，都是别人讲给我听的。\r","\r","说营里出了个跑赢马的小子；说旅贲军的老兵抢着带他；说五年后他带八百骑夜渡弱水，十年后他的旗号，藩镇听了要绕道。\r","\r","十二年后，三镇连兵犯阙，京师震动。援兵比军报先到——为首的将军单骑至朱雀门下，卸甲，徒步，一路走到我面前。\r","\r","「陛下，臣来迟了。」\r","\r","他老了，我也老了。他跪下，我扶他起来，谁也没说话。\r","\r","长安的灯，一盏一盏地亮起来。\r","\r","那晚我在宫门上站了很久。风里传来军营的操练声——年轻的声音，整齐得像一个人。\r","\r","营里的草场，又有人在与马赛跑了。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"远芳（人心结局 · 不召而来）","endingDesc":"你没收那把剑，剑自己记着铸它的人。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_ninegates","title":"结局 · 九门","type":"ending","lines":["九门失守。死士的火把逼近寝殿，喊杀声一浪盖过一浪。\r","\r","我退回内殿，反锁殿门——伸手入怀，摸了个空。\r","\r","那只冰凉的瓷瓶，那夜被我扔进了炭盆。没有毒药了。\r","\r","窗外火光冲天。我把汉献帝的故事想了一遍：衣带诏，秘旨，禅位……\r","\r","然后我笑了。汉献帝禅位之后，又活了十四年。十四年的「山阳公」，天天看着别人的脸色行医种菜。\r","\r","我不要那十四年。\r","\r","我抽出墙上的剑——那把示剑大典上被我丢掉、又被我捡回来的剑。\r","\r","「恩师，」我对着墙上画像的方向轻声说，「学生不孝——学生不做汉献帝。」\r","\r","剑落下去的时候，我听见殿门被撞开的声音。\r","\r","那幅画像，在火光里，还是微笑着的。\r","\r","后来史书只记了七个字：帝崩于兵，年二十有一。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"九门（败死结局 · 焚毒力战）","endingDesc":"没有毒药的那一夜，他把「不做汉献帝」五个字，用刀写完了。","shop":"","duel":"","pick":"","minigame":""},{"id":"dl_mingdan","title":"名单","type":"scene","lines":["那份一人多高的封赏名单，摊了三天了。\r","\r","宦官站在旁边，捧着朱砂，等我落笔。他低声提醒：「殿下——陛下，藩镇们都在等着您的墨迹呢。」\r","\r","我看着他，又看着名单。上头最前排的名字，是朱将军，是那些把刀架在我脖子上、又把我扶上龙椅的人。\r","\r","满朝都在等。天下都在看。\r","\r","这一笔，是谢恩，是买账，还是把人情记在账上、日后一笔一笔地收——\r","\r","我握着笔，指尖发凉。\r"],"desc":"","choices":[{"text":"照签——全批，先稳住藩镇。","hint":"暂时低头 · 收人心","next":"chess","cond":"","effects":"quanli-5,renmai+5"},{"text":"扣压——压住几份要职。","hint":"示强 · 藩镇记恨","next":"chess","cond":"","effects":"quanli+8,renmai-5"},{"text":"留中——留中不发，日后作价。","hint":"两头都不落实","next":"chess","cond":"","effects":"quanli+3,renmai-2"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"dl_jiushang","title":"旧伤","type":"scene","lines":["那道贯穿手臂的伤疤，被臣下看见了。\r","\r","消息压不住——明日早朝，满殿都会传开：天子身上有旧伤，来历不明。\r","\r","太医院的人来了，候在廊下，等着给我验伤、上药、留档。\r","\r","验，伤疤的来历就入了档——政变之前，我受过的每一道伤，都是日后的把柄。\r","\r","不验，旧伤溃烂的疼，我自己受着。\r","\r","太医院的药香，从廊下飘进来。我按着伤处，指尖染了点血。\r","\r","这道伤，是让太医看看的好，还是让天下人猜猜的好？\r"],"desc":"","choices":[{"text":"叫太医——示弱，收宫人心。","hint":"示软 · 旧伤入档","next":"planning","cond":"","effects":"renmai+8,quanli-3"},{"text":"硬撑——不发一言，伤疤入夜自己结痂。","hint":"强撑 · 臣下不敢窥","next":"planning","cond":"","effects":"quanli+5,renmai-5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"dl_fengsui","title":"烽燧","type":"scene","lines":["政变第三日，边报入京。\r","\r","叛军趁朝局动荡，自南而下，连破三城——消息到长安时，前锋已过了淮水。\r","\r","朝堂上，两派人吵成一团：亲征，还是倚藩镇？\r","\r","将军们跪了一地：陛下御驾亲征，以正视听！\r","\r","宗室却另有一说：陛下初登大宝，宜遣强藩代征——朱将军的兵，不是现成的么？\r","\r","我站在舆图前，看着淮水以南那一片失色的土地。\r","\r","亲征，是把身家性命押上去，赌一场人心。倚藩镇，是把刀借出去，赌它不回头。\r","\r","舆图上的朱砂，红得像血。长安的灯，还亮着。\r"],"desc":"","choices":[{"text":"亲征——天子御驾，以正视听。","hint":"押上身家 · 人心或归","next":"dl_banshi","cond":"","effects":"quanli+8,renmai-3"},{"text":"倚藩镇——借强藩之力。","hint":"引虎驱狼 · 他日难制","next":"dl_banshi","cond":"","effects":"quanli-8,renmai+5"},{"text":"守内——闭九门固本。","hint":"稳内先 · 外敌得寸进尺","next":"dl_banshi","cond":"","effects":"quanli+5,renmai-5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"dl_banshi","title":"班师","type":"scene","lines":["南边的战报，一封一封地来。\r","\r","胜了。城夺回来了。叛军退了——不管这胜仗是谁打的，城，回到了朝廷手里。\r","\r","可班师那日，我看见那支凯旋的军队，在城外扎营，迟迟不散。\r","\r","营帐的灯火，连绵数里。那不是班师的阵仗——是候命的阵仗。\r","\r","谁在候命？候谁的命？\r","\r","我站在宫门上，看着那片灯火。风很大，吹得我睁不开眼。\r","\r","长安的灯，一夜之间，少了很多。\r"],"desc":"","choices":[],"next":"rain_night","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"dl_sanzhang","title":"三张面孔","type":"scene","lines":["政变初定，朝堂上忽然热闹起来。\r","\r","朝臣崔相的帖子，宦官刘公公的帖子，还有朱将军的帖子——三份帖子，并排摆在案上。\r","\r","崔相说：陛下以士大夫为股肱，则天下文心尽归。\r","\r","刘公公说：内廷为陛下耳目，陛下但坐，奴婢替陛下看着。\r","\r","朱将军的帖子最薄，只有一行字：陛下，臣的兵，在城外等着。\r","\r","三张面孔，三个价码。\r","\r","我一份一份地看，又一份一份地放下。窗外，宫灯次第亮起，像三双眼睛。\r","\r","今夜的选择，会决定往后十年，这宫里的灯，听谁的。\r"],"desc":"","choices":[{"text":"倚朝臣——以士大夫制衡。","hint":"文心归 · 文官势涨","next":"dl_huanbian","cond":"","effects":"renmai+8,quanli-3"},{"text":"靠宦官——内廷为耳目。","hint":"得权 · 遗臭之名","next":"dl_huanbian","cond":"","effects":"quanli+5,renmai-5"},{"text":"亲藩镇——以虎制狼。","hint":"最稳 · 后患最深","next":"dl_huanbian","cond":"","effects":"quanli+8,renmai-8"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"dl_huanbian","title":"换边","type":"scene","lines":["选了谁，谁就坐大。\r","\r","不出半年，那一边的人开始肆无忌惮——朝堂上，他们的声音越来越大；宫墙外，他们的宅邸越修越高。\r","\r","另外两边，暗中递来了消息：陛下，该换边了。再不换，这天下的主人，就要换人了。\r","\r","我坐在养心殿里，面前摊着三张面孔的帖子，和一张空白的任命状。\r","\r","制衡，是引第三边压住坐大者——可三边都会记得我首鼠两端。\r","\r","从一而终，是把注押到底——快意，可他日我只是换了个人来挟持。\r","\r","抽身，自掌禁军——最硬，也最孤。满朝都会站到对面去。\r","\r","窗外，宫灯在风里晃。我提笔，墨滴在纸上，洇开一团。\r"],"desc":"","choices":[{"text":"制衡——引第三方压住坐大者。","hint":"两头摇摆 · 皆不满","next":"dl_xishi","cond":"","effects":"quanli+3,renmai+3"},{"text":"从一而终——全押所选。","hint":"快意 · 他日成提线木偶","next":"dl_xishi","cond":"","effects":"quanli+8,renmai-6"},{"text":"抽身——自掌禁军，谁也不信。","hint":"最硬 · 最孤","next":"dl_xishi","cond":"","effects":"quanli+10,renmai-10"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"dl_xishi","title":"西市灯","type":"scene","lines":["夜里，我换了便服，去西市走了一趟。\r","\r","灯市正热闹。卖灯的、卖糖的、耍把式的，人流如织。百姓们脸上带着笑——他们不知道宫里的角力，也不关心谁坐大了。\r","\r","只有卖灯的老汉，见我的袍子角沾了宫里的泥，多看了我一眼，压低声音说了句：\r","\r","「贵人，灯市上的灯，一盏是一盏。哪盏亮得久，得看吹灯的人，手稳不稳。」\r","\r","他说完，转身招呼别的客人去了。\r","\r","我站在灯市中央，看着满街的灯。忽然明白了一件事——\r","\r","天下的灯，不在宫墙里，在这条街上。\r","\r","我往回走。宫门口的灯，一盏也没灭。\r"],"desc":"","choices":[],"next":"boy","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""}],"viewpoints":[]},{"id":"changhen","title":"人生长恨水长东","subtitle":"孤家寡人 · 其二 · 熬","mode":"story","startScene":"start","W":4610,"H":574,"nodeSvg":"<g class=\"node\" data-id=\"start\" transform=\"translate(40,84)\" opacity=\"1\">\n      <rect width=\"200\" height=\"56\" rx=\"6\" fill=\"#1c1915\" fill-opacity=\"0.8\" stroke=\"#5b8fb8\" stroke-width=\"2.5\" stroke-dasharray=\"5 3\" class=\"node-rect\"/>\n      <text x=\"8\" y=\"18\" font-size=\"14\" fill=\"#5b8fb8\" font-weight=\"700\">□</text>\n      <text x=\"27\" y=\"17\" font-size=\"13.5\" fill=\"#e8d9b0\" style=\"paint-order:stroke;stroke:#0e0c0a;stroke-width:3.5px\">咳</text>\n      \n      <text x=\"8\" y=\"44\" font-size=\"10\" fill=\"#9a8f7d\">场景</text>\n    </g><g class=\"node\" data-id=\"fever\" transform=\"translate(520,84)\" opacity=\"1\">\n      <rect width=\"200\" height=\"56\" rx=\"6\" fill=\"#1c1915\" fill-opacity=\"0.8\" stroke=\"#5b8fb8\" stroke-width=\"1.5\"  class=\"node-rect\"/>\n      <text x=\"8\" y=\"18\" font-size=\"14\" fill=\"#5b8fb8\" font-weight=\"700\">□</text>\n      <text x=\"27\" y=\"17\" font-size=\"13.5\" fill=\"#e8d9b0\" style=\"paint-order:stroke;stroke:#0e0c0a;stroke-width:3.5px\">热</text>\n      \n      <text x=\"8\" y=\"44\" font-size=\"10\" fill=\"#9a8f7d\">场景</text>\n    </g><g class=\"node\" data-id=\"chubiao\" transform=\"translate(1000,84)\" opacity=\"1\">\n      <rect width=\"200\" height=\"56\" rx=\"6\" fill=\"#1c1915\" fill-opacity=\"0.8\" stroke=\"#5b8fb8\" stroke-width=\"1.5\"  class=\"node-rect\"/>\n      <text x=\"8\" y=\"18\" font-size=\"14\" fill=\"#5b8fb8\" font-weight=\"700\">□</text>\n      <text x=\"27\" y=\"17\" font-size=\"13.5\" fill=\"#e8d9b0\" style=\"paint-order:stroke;stroke:#0e0c0a;stroke-width:3.5px\">出师表</te =\"17\" cy=\"69\" r=\"3.5\" fill=\"#5b8fb8\" opacity=\"0.95\"/>\n          \n          <text x=\"27\" y=\"71\" font-size=\"12\" font-weight=\"500\" style=\"paint-order:stroke;stroke:#0e0c0a;stroke-width:3.5px\" fill=\"#f5e8c8\">修德——减膳撤乐，以禳天灾。</text><line x1=\"12\" y1=\"90\" x2=\"188\" y2=\"90\" stroke=\"#3a342b\" stroke-width=\"1\"/>\n          <circle cx=\"17\" cy=\"95\" r=\"3.5\" fill=\"#5b8fb8\" opacity=\"0.95\"/>\n          \n          <text x=\"27\" y=\"97\" font-size=\"12\" font-weight=\"500\" style=\"paint-order:stroke;stroke:#0e0c0a;stroke-width:3.5px\" fill=\"#f5e8c8\">斥之——朕命在天，何禳之有。</text>\n      </g><g class=\"node\" data-id=\"ch_xiangping\" transform=\"translate(3160,84)\" opacity=\"1\">\n        <rect width=\"200\" height=\"118\" rx=\"6\" fill=\"#14110e\" fill-opacity=\"0.85\" stroke=\"#5b8fb8\" stroke-width=\"1.5\"  class=\"node-rect\"/>\n        <text x=\"10\" y=\"19\" font-size=\"14\" fill=\"#5b8fb8\" font-weight=\"700\">□</text>\n        <text x=\"30\" y=\"18\" font-size=\"13.5\" fill=\"#e8d9b0\" style=\"paint-order:stroke;stroke:#0e0c0a;stroke-width:3.5px\">襄平</text>\n        \n        <text x=\"10\" y=\"44\" font-size=\"10\" fill=\"#5b8fb8\" font-weight=\"600\">场景 · 抉择</text>\n        <line x1=\"12\" y1=\"64\" x2=\"188\" y2=\"64\" stroke=\"#3a342b\" stroke-width=\"1\"/>\n          <circle cx=\"17\" cy=\"69\" r=\"3.5\" fill=\"#5b8fb8\" opacity=\"0.95\"/>\n          \n          <text x=\"27\" y=\"71\" font-size=\"12\" font-weight=\"500\" style=\"paint-order:stroke;stroke:#0e0c0a;stroke-width:3.5px\" fill=\"#f5e8c8\">遣司马懿——百战老将，兵权给足…</text><line x1=\"12\" y1=\"90\" x2=\"188\" y2=\"90\" stroke=\"#3a342b\" stroke-width=\"1\"/>\n          <circle cx=\"17\" cy=\"95\" r=\"3.5\" fill=\"#5b8fb8\" opacity=\"0.95\"/>\n          \n          <text x=\"27\" y=\"97\" font-size=\"12\" font-weight=\"500\" style=\"paint-order:stroke;stroke:#0e0c0a;stroke-width:3.5px\" fill=\"#f5e8c8\">遣毋丘俭——宗室旧将，稳妥。</text>\n      </g><g class=\"node\" data-id=\"ch_kaixuan\" transform=\"translate(3400,84)\" opacity=\"1\">\n      <rect width=\"200\" height=\"56\" rx=\"6\" fill=\"#1c1915\" fill-opacity=\"0.8\" stroke=\"#5b8fb8\" stroke-width=\"1.5\"  class=\"node-rect\"/>\n      <text x=\"8\" y=\"18\" font-size=\"14\" fill=\"#5b8fb8\" font-weight=\"700\">□</text>\n      <text x=\"27\" y=\"17\" font-size=\"13.5\" fill=\"#e8d9b0\" style=\"paint-order:stroke;stroke:#0e0c0a;stroke-width:3.5px\">凯旋</text>\n      \n      <text x=\"8\" y=\"44\" font-size=\"10\" fill=\"#9a8f7d\">场景</text>\n    </g>","actTicks":"<text x=\"40\" y=\"22\" font-size=\"11\" fill=\"#9a8f7d\" opacity=\"0.85\">第1幕 ▸</text><text x=\"1240\" y=\"22\" font-size=\"11\" fill=\"#9a8f7d\" opacity=\"0.85\">第6幕 ▸</text><text x=\"2440\" y=\"22\" font-size=\"11\" fill=\"#9a8f7d\" opacity=\"0.85\">第11幕 ▸</text><text x=\"3640\" y=\"22\" font-size=\"11\" fill=\"#9a8f7d\" opacity=\"0.85\">第16幕 ▸</text>","edgeSvg":"<path d=\"M240,124 C260,124 260,124.32 280,124.32\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/><path d=\"M720,124 C740,124 740,124.32 760,124.32\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/><path d=\"M1200,124 C1220,124 1220,124.32 1240,124.32\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/><path d=\"M1820,124 C1890,124 1890,206.32 1960,206.32\" fill=\"none\" stroke=\"#5fa877\" stroke-width=\"1.3\" stroke-dasharray=\"\" opacity=\"0.9\"/><path d=\"M1820,124 C1890,124 1890,124.32 1960,124.32\" fill=\"none\" stroke=\"#c05b4d\" stroke-width=\"1.3\" stroke-dasharray=\"\" opacity=\"0.9\"/><path d=\"M2160,206 C2180,206 2180,206.32 2200,206.32\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/><path d=\"M2160,124 C2180,124 2180,124.32 2200,124.32\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/><path d=\"M2400,206 C2420,206 2420,124.32 2440,124.3
