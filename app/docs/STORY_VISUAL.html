" letter-spacing=\"3\" font-weight=\"600\">尾声 · 权谋线（物证锁死，只能篡</text><rect x=\"0\" y=\"70\" width=\"5090\" height=\"330\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"85\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">尾声 · 走正道线但心已不纯（道义</text><rect x=\"0\" y=\"232\" width=\"5090\" height=\"86\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"247\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">尾声 · 道义≥55（真结局入口）</text>","nodes":[{"id":"start","title":"卷宗入库","type":"scene","lines":["弘治十二年，六月。","京畿暑气郁蒸，热风锁闭皇城，连御河里的鲤鱼都翻着白肚。","","卷宗摆在案头。牛皮封面半卷，三角压着半个泥印——是顺天府在急递时没压紧，泥封歪了些。","","我提笔写\"接手\"二字。墨在笔尖凝成一颗珠子，迟迟不肯落。","","灯火跳了一下。我抬头看天色，已是申时末刻。六扇门都闭了，街上的行人也散尽，只剩更夫在远巷里\"笃、笃\"敲着梆子。","","明日卯时，刑部会把这桩案子从顺天府提解至大理寺。今夜我得把卷宗过一遍——不是看，是把每个字的偏旁都过一遍。","","卷宗名为《准驸马谢十集夜杀案》。"],"desc":"","choices":[],"next":"origin","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"origin","title":"卷宗溯源 · 初版备案","type":"scene","lines":["时间回溯至弘治十二年三月初七，入夜。","","如意酒家二楼雅间。准驸马谢十集席间酣饮，侍从退出。","店主李三供称：席间只闻酒杯坠地一声，再入时驸马已倒在椅中。","报案者：驸马近侍王二，时年二十二，于案发后一个时辰击顺天府登闻鼓。","","初版口供三份——","驸马左颈有刃痕，深二寸，皮肉外翻。桌上有半杯残酒，未见打斗迹象。","李三供述，谢公子与驸马是旧识，二人同窗时立过婚约，案发前谢公子曾入二楼\"略坐\"。","王二跪称，驸马当晚饮了三壶花雕，未曾添酒，亦无旁人入。","","我合上卷宗。三个人的口供都对得上。","但三个人的口供都像背诵。"],"desc":"","choices":[],"next":"witness","next2":"","effects":"线索:x4；线索:x7","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"witness","title":"四方口供","type":"scene","lines":["店家小二李三供称：「唯独谢公子端坐席上、衣衫规整，既未沾酒渍，也未受伤。驸马倒时，他只低着头，没敢看。」","","店外卖汤饼的老翁刘七，隔墙听到案发前后约一刻钟，无人进出二楼。","伙计张四补充：案发前一日，谢公子在楼下等了一刻钟；案发当夜，他在后厨洗碗，楼上无人。","驸马近侍王二反复念叨：驸马素来与谢公子亲厚，二人当年同窗时曾以兄妹相称，案发前席间只说\"旧事\"，不曾拌嘴。","","顺天府的卷宗里，还夹着半张被水浸过的草纸——","上头有几个字，墨迹晕开了，但还能辨出：\"入京、寻君、婚约\"。","这纸是案发现场搜出来的，登记为\"杂物\"，未归入物证。","大理寺的规矩：未入物证卷宗之物，不入御审。","","我把这张草纸抽出来，夹在袖中。灯下再看，纸背还有一行更淡的字：\"丙寅秋，闱中见。\"","那是七年前，会试的年份。"],"desc":"","choices":[],"next":"side_hall","next2":"","effects":"chaoting-2","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"side_hall","title":"散衙之后","type":"scene","lines":["散衙时天色已暗。","三日后正式开审，明日一整日是你的——大理寺不催，刑部不问，连顺天府的仵作都已领了月俸回家。","","你点一盏油灯，摊开两样东西。","左首：那张从卷宗里抽出的半幅草纸，墨迹晕开，纸背七年前的会试题\"丙寅秋，闱中见\"。","右首：一只玉珏，半枚。断面平整，像是被谁掰成了两半，另一半不知流落何处。","","灯花爆了一下。你抬头，窗外有人影一闪——是宫中内侍的黄袍。","","门被敲了三下。","\"大人，宫里来人了。\"","","你抬眼去看那盏灯，又去看那枚玉珏。半枚玉珏，断得齐整。剩下半枚，若在驸马手边——那便是七年前会试的题；不在驸马手边，便在七年前那场会试里。","","宫里的内侍还在等。",""],"desc":"","choices":[{"text":"先回府歇息，把口供再读三遍。","hint":"稳妥 · 道义与朝望不动","next":"market_gate","cond":"","effects":"旗标:rested"},{"text":"连夜提审李三——趁他还没被「提醒」过。","hint":"勤勉 · 得诚仆之助，朝望小损","next":"li_night","cond":"","effects":"旗标:pressed_li；chaoting-3"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"li_night","title":"灯下 · 李三","type":"scene","lines":["大牢的灯很暗。","李三抱着膝盖缩在草席上，见我进来，挣扎着要起身。","","我没让他起。我在草席边坐下，把油灯放在地上，火苗把两个人的影子投在墙上。","\"李三，\"我说，\"七年前你不在如意酒家。你在侯府后厨。\"","李三身子一僵。","","我没有追问他。我从袖中取出那张草纸，摊在他面前。","\"入京、寻君、婚约'——这纸是七年前从侯府账册里掉出来的，你收着了。\"","","李三盯着那张纸，喉结滚了一下。","\"大人，\"他终于开口，\"她七年前就死了。死在去京城的路上。驸马知道。\"","\"那夜你为何要在场？\"","\"大人，\"他说，\"驸马让我在场——他需要一个见证。\"","\"见证什么？\"","李三抬头，眼里有泪：\"见证他也想死。\""],"desc":"","choices":[],"next":"market_gate","next2":"","effects":"得卡:r_li_sanj","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"market_gate","title":"金陵市集 · 夜","type":"scene","lines":["三山街的夜市灯火连成一线。","我的便笺上写着两处地方：文萃堂（才子聚的吟诗作对处）与桥头赌坊（江湖人开的推牌九处）。","","街口分岔：","一往北去，文萃堂的灯烛还亮着，里头传出琴声与拍掌声——今夜恰是\"灯下对联\"赛。","一往西去，桥头赌坊檐角挂着半盏羊皮灯笼，里头骰子声与骂声此起彼伏。","中间正街，两边小摊摆开，灯火通明，闲人多了些。","","我抬头看了看天色。戌时二刻，明日开审前最后的闲。","便笺纸背还有一行自己写的字——\"今夜何往，心安处\"。",""],"desc":"","choices":[{"text":"【夜市】买卡、开包、编组，顺便……赌坊也可以坐坐。","hint":"市集","next":"market","cond":"{\"notFlag\":\"done_market\"}","effects":"旗标:done_market"},{"text":"【文萃堂】灯下有位老者摆了盘残局——「应三手，彩头三十两。」","hint":"棋局残局 · 赢得彩头","next":"wenchat","cond":"{\"notFlag\":\"done_wenchat\"}","effects":"旗标:done_wenchat"},{"text":"◆ 回府歇息。明日复勘如意酒家。","hint":"","next":"search_gate" ,"ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"search","title":"现场复勘","type":"scene","lines":["你重新封锁现场，细致复勘。","十二处细碎物证，一一录入卷宗：","","酒罐碎片：桌角半只碎罐，残液已干，罐底有官窑暗记——非市面上买得到的酒。","灼痕：窗边一道由外向内、非贴身火源的灼痕，深约半寸。","空位：窗边一块干净的空地，正午日光垂直而落——有人在这里站过很久。","镜片：西洋凸面镜片，孩童上交，边缘有褐土。","","你蹲下来，指尖拂过那道灼痕。","\"火不是从里面烧的。\"你说，\"是从外面，照着里面烧的。\"","文书愣了一下：\"大人是说——有人拿镜子，把日光聚进来？\"","","你起身，把那枚镜片放进证物袋。","\"把这面镜子，和那道灼痕，单独归档。\""],"desc":"","choices":[],"next":"search_pick","next2":"","effects":"线索:x1；线索:x2；线索:x3；线索:x5；线索:x6；线索:x8","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"search_pick","title":"库房 · 顺手之物","type":"pick","lines":["临出酒家，随行的老文书压低声音：","\"大人，按规矩，现场细软要入官库封存。但有三样东西……您先挑一样带在身上，余下的入册。查案的人，手里总得有东西。\"","","他摊开一方布帕：","一枚温润的玉珏（龙凤纹，御赐之物）","一柄短刃（鞘口磨得发亮，像是常被摩挲）","一串铜钱（绳头系着红布，是押镖人的老习惯）","","夜风从门口灌进来，吹得布帕一角微微掀动。","你伸出手——玉珏在灯下泛着青光，像一只眼睛，看着你。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"i_yu、i_dao、i_zhu","minigame":""},{"id":"secret_letter","title":"剧情拐点 · 一念之差","type":"scene","lines":["次日拂晓，天色微熹。一名宫内内侍秘密到访。","","他进门时，脚步轻得像猫。公文匣里取出一封黄锦封皮的密信，双手奉上，随即躬身退到门外——从头到尾，没说一个字。","","你拆开密信。太皇太后亲笔手书，字迹凌厉：","\"驸马年少轻狂，市井纠纷实属无心之失。此案有损天家颜面，即刻压下风波。\"","","密信摊开之际，一张面值十万两的银票，从信纸间轻飘飘落下来，落在宣纸上。","","银票是内廷的印。票号、汇兑、暗记，一应俱全——它烫手。","","穿堂微风拂动书房匾额。先父手书的「无欲则刚」四字摇曳映目，铮铮刻骨。","你看着银票，又抬头看那四个字。","风停了。银票的一角，还在微微颤。"],"desc":"","choices":[],"next":"secret_choice","next2":"","effects":"得卡:i_xin；得卡:i_yinpiao；得卡:i_shu","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"secret_choice","title":"一念之间","type":"scene","lines":["银票就压在密信上。屋子里静得能听见烛芯的哔剥声。","","你伸手，指尖触到银票的边缘——纸面光滑，带着内廷独有的、沉重的压手感。","又缩回来。灯花\"啪\"地爆了一下。","","你忽然想起昨夜在如意酒家窗台上，那半个还没干透的水渍脚印。","内廷的皂靴，昨夜已经去过了现场。这封密信，是今天早上送来的。","他们的手，已经伸进这桩案子里了。","","烛火把你的影子投在墙上，一分为二。一半映着银票，一半映着匾。","","门外，内侍还在等。他知道你接了信，也知道——信里夹着银票。",""],"desc":"","choices":[{"text":"【密信 · 封存入库】收录为内廷行贿铁证。秉公翻案。","hint":"守心持法 · 正道线（证据将被人暗中抹除，查案更难；密信留作对局底牌）","next":"a_start","cond":"","effects":"旗标:line_A；daoyi+15,chaoting-10；失卡:i_yinpiao"},{"text":"【银票 · 收入袖中】顺水推舟，压下此案。","hint":"受贿妥协 · 权谋线（物证锁死，只能篡改口供圆谎；十万两入袋）","next":"b_start","cond":"","effects":"旗标:line_B；daoyi-20,chaoting+10；失卡:i_xin；失卡:i_shu"},{"text":"【密信上缴 · 银票私留】外示清正，内怀机心。","hint":"首鼠两端 · 走正道线但心已不纯（道义、朝望俱损，银两充裕）","next":"a_start","cond":"","effects":"旗标:line_A；旗标:greedy；daoyi-10,chaoting-5；失卡:i_shu"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"a_start","title":"分支A · 守心持法","type":"scene","lines":["你当即将银票封存入库、登记造册，断然回绝皇室施压。","","内侍接过话时的笑，僵在脸上，随即恢复了那副温驯的皮相：\"大人……三思。\"","\"已思。\"你合上库门，\"送客。\"","","你秉公守正的姿态，彻底触怒了太皇太后。","","当日午后，酒家店主王满财当庭推翻前置口供——他说那夜楼上没听见任何动静。","隔日，送酒商贩周奎畏罪潜逃。官差追到城外十里，只寻回他丢下的半只草鞋。","深夜，大理寺后院黑影一闪。巡夜的老卒喝问一声，黑影翻墙而去——翌日清点，卷宗匣的锁，有被撬过的痕迹。","","四处细微物证被内廷暗中抹除，证据链残缺断裂。剩下的路，只有人证。","","你站在窗前，看了一夜灯笼。灯笼是顺天府挂的，说是驱邪——你看着它，想的是那只还没干透的水渍脚印。","改口的王满财，得趁夜色，去会一会。出门前，你可以整理一下要带的卡组。"],"desc":"","choices":[],"next":"a_prep","next2":"","effects":"旗标:evidence_hidden","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"a_prep","title":"整备 · 出门前","type":"pick","lines":["夜风起了。袖中能带的东西有限——十二张，是你的极限。","","烛台旁摆着三样，是文书替你备下的：","一枚龙凤玉珏（御赐之物，可作话头）","一册手抄的《会试闱墨》（七年前丙寅科的卷子）","一封官银三十两的封函（路上打点用）","","你拾起玉珏，在指间转了一圈。玉是凉的，但贴着皮肉久了，会暖。","你把它放进袖中。",""],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"r_zhou、c_wei_liang、s_yin30","minigame":""},{"id":"a_duel_scene","title":"夜访 · 如意酒家","type":"duel","lines":["后堂的灯还亮着。王满财正盘账，算盘珠子拨得飞快。","","听见脚步声，他头也不抬：\"打烊了，客官明日再来——\"","话音未落，你已在他对面坐下。他手里的算盘\"嗒\"地停住。","","\"哟，大人夜临，小店蓬荜生辉——\"他的笑堆起来，眼睛却在你官袍的补子上打转。补子是洗过很多次的那种旧，边角起了毛。","","你没接话。把玉珏从袖中取出，搁在账本上。玉面朝上，龙凤纹对着烛光。","","王满财的笑，像被风吹灭的灯，一寸一寸地暗了下去。","\"大人……这、这是……\"","\"认得吗？\"你说。","\"不、不认得——\"","","他嘴上说不认得，眼神却已经把它认出来了——那目光落在玉珏上，像落在烫手的炭上。","","你端起茶盏，慢条斯理地吹了吹浮沫。","\"王掌柜。你盘账盘得这么勤，账上，也该有笔旧账才对。\"",""],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_wang","pick":"","minigame":""},{"id":"a_duel_win","title":"夜访得手","type":"scene","lines":["三巡茶尽。王满财的额头终于渗出汗来。","","他长叹一声，瘫坐在条凳上：","\"大人……小民说，小民都说。那夜楼上，小民其实看见赵作揣着东西上了楼……\"","","他颤颤巍巍从柜台夹层里摸出一张油纸包着的残破草纸——那是官差初勘时遗漏、他偷偷扣下的东西。","","\"赵作伏尸的时候，腰间就揣着这半张纸。小民不敢交……上面有驸马爷的名讳啊！\"","","你展开草纸。字迹模糊残缺，唯余四字残痕，如四根钉，钉进这桩\"铁案\"的棺材板——","\"入京。寻君。婚约。\"","","灯花爆了一下。王满财偷眼看你，喉结滚了滚。","","你的指尖在纸背停住——纸背有更淡的字。你把草纸举到灯下，逆着光看：","\"丙寅秋，闱中见。\"七个字，墨迹晕开，却还认得出。","","七年前。会试。你捏着草纸，忽然想起那册《会试闱墨》。",""],"desc":"","choices":[{"text":"【出示龙凤玉珏】追问玉珏来历——「这等御赐之物，怎会在死者身上？」","hint":"需要：龙凤玉珏 · 道义≥55 · 逼出更深的口供","next":"a_yu_probe","cond":"{\"card\":\"i_yu\",\"statAtLeast\":{\"daoyi\":55}}","effects":"旗标:probed_yu；daoyi+3"},{"text":"【收好草纸】不多问，先保住这条命再论其他。","hint":"","next":"evidence_fate","cond":"","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"a_yu_probe","title":"玉珏之问","type":"scene","lines":["你把玉珏搁在账本上。王满财的脸\"唰\"地白了。","","\"大人明鉴！那玉珏……赵作生前逢人便吹，说是'天大的富贵'。小民听他醉后漏过一嘴——\"","他咽了口唾沫：","\"'驸马爷的把柄，值一座金山。'\"","","把柄。你捏着玉珏的手紧了紧。","勒索，不是偷窃。","","\"他拿什么勒索？\"","\"小民不知……只听说，驸马爷在乡野，好像、好像有个过不去的旧人……\"","\"什么旧人？\"","\"小民不敢问！\"他扑通跪下，\"那夜之后，赵作就死了。小民怕啊！\"","","你把玉珏收回袖中。玉是凉的。","\"起来吧。\"你说，\"你说的'旧人'，我去查。\""],"desc":"","choices":[],"next":"evidence_fate","next2":"","effects":"daoyi+2","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"a_duel_lose","title":"夜访碰壁","type":"scene","lines":["话不投机。王满财的笑重新挂回了脸上，一层一层，把自己裹了回去：","\"夜深了，大人请回吧。小民明早，还要开门做生意。\"","","算盘珠子重新拨起来，\"噼啪\"声在夜色里格外清脆。","","你站在如意酒家门口的灯笼下，听着门板在身后合拢。","灯笼是旧的，纸面发黄，里面的火苗晃了晃。","","三日之限，只剩两日。","那半张残破的草纸，终究没能到你手上——但窗台上那半个水渍脚印，你记住了。","","回大理寺的路上，更夫敲了三更。","更声在空巷里荡开，像没有回声。"],"desc":"","choices":[],"next":"evidence_fate","next2":"","effects":"chaoting-5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"evidence_fate","title":"灯下 · 两件东西","type":"scene","lines":["回到大理寺。案上，还摊着白日里收到的那两样东西。","","密信与银票并排躺着。黄锦的封皮，压着内廷的印；银票的票号，是汇通天下的那家。","","烛火跳了一下。你想起了堂上那块匾。","「无欲则刚」四个字，在烛光里明明灭灭。","","你伸手拿起银票。十万两，够你在京城买下半条街，够三百户人家吃十年，够让一个寒门子弟，从此再不为银钱弯腰。","","灯火把银票照得透亮。纸面上，隐约能看到一个\"欲\"字的暗记——是汇通天下防伪的水印。","你盯着那个\"欲\"字，看了很久。","","门外，更鼓又敲了一下。",""],"desc":"","choices":[{"text":"【烧掉银票】当着烛火烧了——「无欲则刚」，先过自己这关。","hint":"需要：十万两银票 · 道义大增","next":"burn_scene","cond":"{\"card\":\"i_yinpiao\"}","effects":"失卡:i_yinpiao；旗标:burned_silver；daoyi+10"},{"text":"【把玩良久，收进暗格】——留着。银子没有罪。","hint":"需要：十万两银票 · 道义小损","next":"verdict_gate","cond":"{\"card\":\"i_yinpiao\"}","effects":"旗标:kept_silver；daoyi-5"},{"text":"【烛下独坐】——两样都不动，天亮面圣。","hint":"","next":"verdict_gate","cond":"","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"burn_scene","title":"烧","type":"scene","lines":["银票在烛焰上卷了边。","","十万两，一炷香不到，只剩一撮灰。","灰烬还带着热度，在案上蜷成一小团，像一只闭上的眼睛。","","你看着它烧完，忽然想起小时候——父亲也是这样，烧掉一份不该收的礼。","那年你家的年货，只有半扇腊肉。父亲烧礼的时候，手是稳的。","你说：\"爹，这么多钱，烧了可惜。\"","父亲说：\"钱是烫的。揣在怀里，手会烂。\"","","灰烬凉了。你把它扫进痰盂，倒进院子里的雨水沟。","\"无欲则刚。\"你轻声念了一遍。这一遍，是替父亲念的。","","雨水沟里，那撮灰被冲散，顺着水流走了。","像从没存在过。"],"desc":"","choices":[],"next":"verdict_gate","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"verdict_gate","title":"三日之限","type":"scene","lines":["限期到了。你收拾卷宗入宫。","","该带的线索，一张都不能错——草纸残字、玉珏之问、王满财的改口，还有那封被你封存入库的密信。","","文书替你理了三遍，仍不放心，又问你一遍：","\"大人，今夜的面圣，带哪几样？\"","","你望着那叠卷宗，没有立刻回答。","窗外，天边刚泛起一线青白。宫门在晨光里次第打开，一声接一声，像沉重的鼓。","","\"该带的，都在这里了。\"你说。","\"余下的——\"你顿了顿，\"余下的，看殿上怎么说。\""],"desc":"","choices":[],"next":"verdict","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"verdict","title":"结案陈词 · 线索复盘","type":"scene","lines":["御书房内，烛火煌煌，文武百官侧立。","","圣上开口，只问了八个字：\"卿断何案，证据几何？\"","","你从卷宗中拣选最要紧的线索，呈上御案——","拣选哪几条，将决定这桩案子，能否经得起满朝文武的诘难。","","殿上很静。能听见御香灰烬落下的声音。","","你展开第一样：草纸残字，\"入京。寻君。婚约。\"四字残痕。","殿上有低低的议论声。","你展开第二样：密信。黄锦封皮上的内廷印，在烛光下一照，议论声忽然停了。","","内侍捧上一只锦匣。掀开——一方金漆描边的玉墀拓片。","圣上不置一词。殿上文武，皆望向你的绯袍。","","你听见自己的心跳。一下，一下。","该呈的，都呈上去了。接下来，交给殿上。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"a_win_gate","title":"御书房外 · 夜","type":"scene","lines":["铁案翻案，朝野震动。你退出御书房时，宫灯已次第亮起，长街幽深。","","案子走到这一步，于律法已无可断。","可那半张草纸上的四个字——\"入京、寻君、婚约\"，仍像四根鱼骨，横在你喉间。","","王满财颤声的话又响在耳边：\"驸马爷的把柄，值一座金山。\"","赵作那夜上楼，当真只是为了偷东西么？","一个偷儿，值当驸马用一座金山去压？","","你停在宫灯下。灯影把你的影子拉得很长。","长街尽头，一个打更的老卒敲着梆子走过，梆声在空旷里荡开。","","你摸了摸袖中的玉珏。玉是凉的。","七年前，丙寅科。会试。乡野。旧人。","这几个词在喉间滚了一遍，没有落下去。",""],"desc":"","choices":[{"text":"【就此结案】呈奏归档——案子已了，余下的，交给风。","hint":"律法之内，已无再断之处","next":"end_a_win","cond":"","effects":""},{"text":"【循残字暗访】换一身布衣，往京郊乡道走一趟。","hint":"需：玉珏之问已问出「把柄」 · 道义≥55（真结局入口）","next":"a_deep","cond":"{\"flag\":\"probed_yu\",\"statAtLeast\":{\"daoyi\":55}}","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"a_deep","title":"京郊 · 麻纸上的名字","type":"scene","lines":["你换了布衣出城。","窗沿那半枚泥印的土色、死者掌心几缕粗麻丝，都指向同一个方向：乡野。","","京郊三十里，你寻到一处门扉紧闭的院落。","篱上晒着半幅粗布裙，补丁叠着补丁，浆洗得干干净净——是有人把它当宝一样护着的。","","村中族老说：村里原有个女子，与谢家书生自幼定亲，寒暑相守数载。书生入京题名之后，音书断绝。今岁三月，女子辞别故土，孤身入京寻他——此后再无音讯。","","你站在那扇门前，没有进去。","门环上系着一截红绳，褪了色，是旧年定亲时挂的。","","当夜你回到大理寺，门缝里不知何时塞进一封无署名的信：","乡野麻纸，笔墨仓促，与你从王满财手上接过的那半张，是同一路的纸。","","\"谢生隐匿糟糠婚约，贪恋天家姻亲。赵作席间偶闻秘事，持短上楼胁迫勒索，遂殒其身。命案之本，非是杀戮，而是人心贪欲。\"","","你把两张草纸并排搁在灯下。","一张写着婚约，一张写着殒命。","原来是同一张。"],"desc":"","choices":[],"next":"end_a_deep","next2":"","effects":"daoyi+5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_a_deep","title":"结局 · 人心沟壑","type":"ending","lines":["案子的真相有两层。","上层是律法断得清的：赵作挟私勒索、贪利殒身，谢十集无杀人之罪，太皇太后徇私干政、禁足慈宁宫。","","下层是律法断不动的：","寒门士子一朝题名，恐旧配拖累仕途，瞒婚断亲；","乡间女子恪守旧约，三千里入京，只寻得门缝里一封无人肯认的信。","","你终究没有把婚约一节写进卷宗——婚约不在律条之内。","但你让文书将那两张草纸另行登册、封匣存库，匣面写了四个字：\"以俟后评\"。","","结案那日，你独自立在堂前，望着「无欲则刚」的匾额看了很久。","先父写这四个字的时候，大约也看见了字背后那道沟壑。","","窗外落了今冬第一场雪。","雪落在匾额上，薄薄一层，盖住了金字，又渐渐化开，顺着檐角滴下来。","","你伸手，接住一滴。","凉的。","","律法可断生死案卷，难勘人心沟壑；","刑狱可判世俗是非，唯独名利贪妄，从来无解。",""],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"人心沟壑（A线 · 深层结局 · 终极真相）","endingDesc":"案子上层律法断得清，下层律法断不动——命案之本，是人心贪欲。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_a_win","title":"结局 · 守得云开","type":"ending","lines":["你逐条复盘：勒痕非刃、密室无斗、玉珏藏襟、草纸残字——环环相扣，铁案翻案。","","谢十集清白脱罪。死因水落石出：","赵作觊觎驸马随身财物，深夜潜入雅间偷窃，被惊醒的谢十集撞破，慌乱中束带勒毙自身；谢十集受惊晕厥，无意识触碰落地短匕，才有了\"持刀杀人\"的假象。","","只是那半张草纸上的\"入京、寻君、婚约\"四字，终究没有再往下查。","有些东西压在卷宗底下，不翻开，就一辈子看不见了。","","\"律法可断生死案卷，难勘人心沟壑。\"","你望着堂前「无欲则刚」的匾额，久久无言。","","太皇太后徇私干政、干预司法，遭圣上禁足慈宁宫。朝野震动，律法昭彰。","","退朝时，同僚拱手道贺。","你回了一礼，袖中的玉珏轻轻碰了一下肋骨——凉的。","","结案文书归档那天，你把那半张草纸，折好，放进卷宗最底层。","然后合上卷宗，盖上火漆。",""],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"守得云开（A线 · 成功）","endingDesc":"秉公守正，真相大白于朝堂。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_a_lose","title":"结局 · 悬案归档","type":"ending","lines":["你呈上的线索零散破碎，口供相悖、证据断裂，多处关键疑点无法自圆其说。","","文武百官当庭诘难。太皇太后借机施压，传内廷口谕，一口咬定谢十集醉酒行凶、证据确凿。","","圣上无完整铁证佐证疑点，只得降罪主事官员：","你被贬官三级，罚俸两年。此案永久沦为悬案归档。","","谢十集醉杀污名钉死，废除驸马婚约，终身不得入朝。","内廷徇私的丑闻彻底掩埋，权贵乱法，无人制衡。","","离京那日下着雨。","你回头望了一眼大理寺的匾额，「明刑弼教」四个金字，在雨里暗得看不清了。","","文书追出二里地，塞给你一把伞。","\"大人，保重。\"","你没接。雨淋着，比伞下清楚。","","走到城门口，你忽然站住。","从怀里摸出那半张草纸——「入京、寻君、婚约」——看了很久。","然后把它收回去，贴身放着。","","有些话，到死也说不出口。","卷宗归档了。它没有。",""],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"悬案归档（A线 · 失败）","endingDesc":"守正而力不足，真相随卷宗一同封存。","shop":"","duel":"","pick":"","minigame":""},{"id":"b_start","title":"分支B · 绝境圆谎","type":"duel","lines":["一念贪私，一念妥协。你抬手将银票收入袖中，决意顺水推舟、压下命案。","","袖中那叠纸，薄，却沉。像揣着一块冰，贴着皮肉，一路凉到心底。","","奈何大理寺新晋主事沈砚，年少刚正，不通权术。","他察觉卷宗异样、查到贿银痕迹，无视官场潜规，连夜上疏御前，直指大理寺徇私压案！","","一石激起千层浪。案件彻底公示朝野，圣上震怒，下旨限期三日彻查。","所有现场物证、尸检底稿尽数录入朝堂存档、固化锁死——不可造假、不可篡改。","","你只剩一条退路：串通人证、篡改口供、捏造说辞。","","而沈砚，已抱着一册物证存档，立在公堂中央，等你开口。","他年纪轻，官袍却穿得笔挺，像一把刚出鞘的刀。","","（袖中十万两银票还在——钱能通神，也能通鬼。）","","公堂的烛火，映着两道人影：一个握着册子，一个揣着银票。","今夜，总有一个要先开口。",""],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_shen","pick":"","minigame":""},{"id":"end_b_win","title":"结局 · 谎言之上的官袍","type":"ending","lines":["你逐条拆解沈砚的质询，句句堵在他话头之前。","物证虽铁，但物证不会自己开口——开口的从来都是人。","","一场对质下来，你竟真的圆住了八成疑点。","沈砚盯着你看了很久，收起存档，一言不发地退出公堂。","","此案以\"市井纠纷、意外殒命\"草草定论。","你保住了官袍，太皇太后保住了颜面。","","只是自那以后，沈砚再没与你说过一句话。","而那十万两银票，你一分不敢动，压在箱底，像一块烧红的烙铁。","","夜半惊醒时，你总会想起那块匾——无欲则刚。","先父写这四个字的时候，大约想不到，它有一天会变成一面照妖的镜子。","","镜子里，官袍是新的，补子是旧的。","镜子外，你坐了很久，没有点灯。",""],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"谎言之上的官袍（B线 · 成功）","endingDesc":"圆谎成功，仕途得保，清名已葬。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_b_lose","title":"结局 · 弃子","type":"ending","lines":["物证铁板钉钉，你的说辞漏洞百出。","新旧交错的灼痕、受力均匀的勒痕——每一处固化物证，都在朝堂上撕扯你捏造的口供。","","未等御前会审，沈砚便连夜二次上疏，逐条拆解你篡改的证词。","铁证如山，徇私枉法、蒙蔽朝堂，尽数曝光。","","太皇太后为撇清干系，当即舍弃你这枚棋子，对外宣称毫不知情。","","你被革职下狱，家产抄没。","谢十集以过失致人死亡流放三千里。你家族世代清名，毁于一旦。","","诏狱的墙很厚，隔壁的嘶吼都传不进来。","你数着墙上凝出的水珠，一滴，一滴——像倒计时，也像那年御书房里的更漏。","","墙角有一缕光，从铁窗缝里漏进来，落在地上，窄窄一条。","你伸手去够，够不着。","","狱卒送饭的时辰到了。脚步声在廊下由远及近，又由近及远。","没有人停在你这一间。",""],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"弃子（B线 · 失败）","endingDesc":"权谋反噬，满盘皆输。","shop":"","duel":"","pick":"","minigame":""}],"viewpoints":[]},{"id":"qiuwei","title":"江南秋闱舞弊案","subtitle":"正德九年 · 大理寺绝密卷宗","mode":"case","startScene":"start","W":4610,"H":846,"nodeSvg":"<g class=\"node\" data-id=\"start\" transform=\"translate(40,84)\" opacity=\"1\">\n      <rect width=\"200\" height=\"56\" rx=\"6\" fill=\"#1c1915\" fill-opacity=\"0.8\" stroke=\"#5b8fb8\" stroke-width=\"2.5\" stroke-dasharray=\"5 3\" class=\"node-rect\"/>\n      <text x=\"8\" y=\"18\" font-size=\"14\" fill=\"#5b8fb8\" font-weight=\"700\">□</text>\n      <text x=\"27\" y=\"17\" font-size=\"13.5\" fill=\"#e8d9b0\" style=\"paint-order:stroke;stroke:#0e0c0a;stroke-width:3.5px\">卷宗入库</text>\n      \n      <text x=\"8\" y=\"44\" font-size=\"10\" fill=\"#9a8f7d\">场景</text>\n    </g><g class=\"node\" data-id=\"origin\" transform=\"translate(280,84)\" opacity=\"1\">\n      <rect width=\"200\" height=\"56\" rx=\"6\" fill=\"#1c1915\" fill-opacity=\"0.8\" stroke=\"#5b8fb8\" st " height=\"86\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"247\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">尾声 · 给寒门一个场，还是给死者</text>","nodes":[{"id":"start","title":"卷宗入库","type":"scene","lines":["正德九年，秋。江南的雨下了月余，京城的案头也潮了。","","一摞卷宗从南京快马递到。牛皮封套渗着水汽，拆开时，霉味混着墨腥扑了满屋。","","放榜之日，金陵满城哗然：享誉多年的寒门士子尽数落第；登榜的多是勋贵子弟与籍贯江西、家世隐晦的布衣。榜单贤愚倒置，刺眼。","","舆情汹汹传到京师。圣上批复内阁，下旨：大理寺三日彻查，速速结案。","","三日。你把这几个字看了两遍，又看了看窗外无休无止的雨。","","随卷宗附来一封刑部旧识的便笺，字迹潦草：「秋闱水很深，金陵的雨，比京城的脏。」","","你合上卷宗。案头那盏灯，忽明忽灭。"],"desc":"","choices":[],"next":"origin","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"origin","title":"卷宗溯源 · 八方口供","type":"scene","lines":["大理寺连夜锁拿涉案人员。","","主考翰林宋文彬被带到时，官袍整整齐齐。他一口官腔：落第皆因江南士子「心性浮躁、文风逾矩」。","","落第士子苏砚秋进门时，袍角还滴着雨。他说话不卑不亢：近三年江西士子登榜人数逐年暴涨，大多学识平庸、籍籍无名，却屡屡及第。","","誊卷书吏许安缩在廊下，衣裳是湿的。他吞吞吐吐，只挤出半句——阅卷那几日，常有口音偏赣的长衫文士，深夜徘徊贡院后门，私递信函财物。","","贡院杂役陈三蹲在台阶上，搓着手：今年阅卷深夜，库房灯火彻夜通明，翰林大人们深夜私会外来文士，「处处透着诡异蹊跷」。","","口供真假交织。你合上卷宗。","","案头一盏灯，映着四张各怀心事的脸。你起身：第一站，贡院誊卷库房。"],"desc":"","choices":[],"next":"market_gate","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"market_gate","title":"金陵 · 查案前夜","type":"scene","lines":["三日期限，自明日拂晓起算。今夜，贡院外的长街还剩几盏灯。","","墙根下，落第士子们摆开了书摊。油布搭的棚子，一灯如豆，灯下是成摞的文集——卖文为生，也卖几句骂。","","桥头的馄饨挑子冒着白气。卖卦的摊前围着人，卦签上写着「文运」，十个人有九个摇头。","","你站在街口，雨已经停了。风把书摊上的纸页吹得哗哗响。","","灯影里，有人远远望了你一眼——看见官袍，又缩了回去。","","今夜的路，在你脚下摊开。贡院的门，明日一早就该去叩。","","只是这趟查案的前夜，金陵还有几处灯，值得你停一停。"],"desc":"","choices":[{"text":"【士子书摊】买几本文集——顺便，听听骂声。","hint":"剧情市集 · 落第者的货摊","next":"shutan","cond":"{\"notFlag\":\"done_shutan\"}","effects":"旗标:done_shutan"},{"text":"【桥头夜市】馄饨、消息、一应用度。","hint":"市集","next":"yeshi","cond":"{\"notFlag\":\"done_yeshi\"}","effects":"旗标:done_yeshi"},{"text":"【贡院墙根】几个落第士子围着盏灯，争一件夜里的事——「谁进过贡院，谁心里有鬼。」","hint":"证词辩真 · 赢了听个真话（败不可再战）","next":"qw_logic","cond":"{\"notFlag\":\"done_logic\"}","effects":"旗标:done_logic"},{"text":"◆ 回驿馆。明日叩贡院的门。","hint":"","next":"d1_intro","cond":"","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"qw_logic","title":"贡院墙根 · 传言辨真","type":"minigame","lines":["贡院墙根，几个落第士子围着一盏灯，争一件夜里的事。","","「昨夜贡院只进了一人——谁进的，谁心里有鬼。」","","七嘴八舌，谁也不让谁。一个老者敲了敲烟杆：","","「争什么。证词里只有一句是真的，你们自己推。」","","灯花爆了一下。夜风把争论声吹散，又聚拢。","","你站在人圈外，听着。推得对，灯下自有人肯多说一句。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":"logic → 胜:qw_lg_win / 败:qw_lg_lose"},{"id":"qw_lg_win","title":"灯下 · 真话","type":"scene","lines":["三桩传言皆明。老者烟杆点了点你：","","「大人有这副脑子，贡院里的事，瞒不住你。」","","一个黑衫汉子凑过来，声音压得极低：","","「放榜前一夜，贡院侧门开过。进去的人，穿的不是举子服。」","","他说完便走，没入灯影。你记下这句话。","","灯还亮着。话，已经到手了。"],"desc":"","choices":[],"next":"market_gate","next2":"","effects":"银+15；线索:q1","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"qw_lg_lose","title":"灯下 · 散了","type":"scene","lines":["传言未明。灯下的人散了大半。","","老者磕了磕烟杆，也走了。烟灰落在湿漉漉的墙根，暗了一下。","","你站了一会儿，也转身离开。","","传言还在灯影里浮着，没人肯收尾。"],"desc":"","choices":[],"next":"market_gate","next2":"","effects":"银+5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"shutan","title":"书摊 · 落第者的货摊","type":"shop","lines":["书摊的主人们看见你的官袍，先是瑟缩，随即又梗起了脖子。","","一个青年士子把一册文集推到你面前：","","「大人，买一册罢。文章不值钱——骂街的话，倒是白送。」","","文集是粗纸印的，纸页泛潮。翻开来，字里行间全是火气。","","「十载寒窗，抵不过权贵一诺。」他说这话时，眼睛亮得吓人。","","「大人——这话我们只敢印在纸上。」","","摊上还摆着些旧物。他本人，也可以「请」——做你的证人。"],"desc":"","choices":[],"next":"","next2":"market_gate","effects":"","ending":"","endingDesc":"","shop":"落第书摊 · 卡包1","duel":"","pick":"","minigame":""},{"id":"yeshi","title":"桥头夜市","type":"shop","lines":["桥头夜市，落第士子扎堆的地方。","","馄饨摊前骂考官，卖卦摊前问前程。灯火连成一线，喧嚷里全是失意。","","馄饨挑子隔壁就是骰摊。骰子声混着骂声，一夜不歇。","","你走过时，摊主们看你一眼，又各自忙各自的——官袍在这里，不稀奇，也不受欢迎。","","查案的夜长，金陵的夜短。该置办的，今夜置办齐了。"],"desc":"落第士子扎堆的地方。馄饨摊前骂考官，卖卦摊前问前程。","choices":[],"next":"","next2":"market_gate","effects":"","ending":"","endingDesc":"","shop":"桥头夜市 · 卡包1","duel":"","pick":"","minigame":""},{"id":"d1_intro","title":"剧情一 · 贡院库房拦查","type":"duel","lines":["你携僚属文书，冒雨奔赴金陵贡院。敕令与官牒藏在袖中，被雨水洇得微潮。","","西侧誊卷库房，封存着本届秋闱全部原始墨卷、批阅底稿与出入勘验记录。","","库房朱漆侧门前，孤身伫立着一名皂衣守卫。面皮白净，眉目温润，唇角常年噙着一缕恰到好处的浅笑——贡院上下无人不识，坊间送他外号：笑面虎。","","你亮出鎏金官牒与御印敕令。话音落地的一瞬，他面上的浅笑分毫未减。","","可那双温和的眼眸里，所有暖意，尽数褪去。","","他缓缓直起身躯，双脚稳稳钉死在门槛正中央，自此闭口缄默。","","宣读圣旨也好，厉声诘问也好。他不争执、不辩驳、不推诿、不让退——像一尊依照规矩塑成的石像，蛮横至极。","","雨下大了。他的皂衣湿透，贴在身上，人却纹丝不动。","","进退皆是困局。你定了定神。","","试试，把话递进去。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_xiaomianhu","pick":"","minigame":""},{"id":"d1_win","title":"拦查 · 软处着手","type":"scene","lines":["你不再提圣旨，只与他论规矩、问家小、看那身湿透的皂衣。","","他钉在门槛上的脚，几不可察地松了半寸。","","「大人……」良久，他终于开口，声音压得极低，「不是小人不放行。是这贡院里上上下下几十张嘴，都拴在一根绳上。小人放了行，全家的命就没了。」","","话虽如此，他终究没让开。","","但你看清了要害：一名无品无级的底层守卫，绝无胆量私自阻拦朝廷命官——这满院上下，早达成了默契，筑起一道以官场潜规为砖石的壁垒。","","雨势稍歇。你遣人快马奔赴京师，辗转打通江南官场顶层关节。","","准入手令到手时，已是半日之后。"],"desc":"","choices":[],"next":"d2","next2":"","effects":"线索:q1；shijian-1；chaoting+5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"d1_lose","title":"拦查 · 无处下口","type":"scene","lines":["话说岔了。他的笑重新挂稳，石头般钉在门槛上。","","任你把圣旨念出花来，纹丝不动。","","僵持到日头偏西。你只能暂且收队，遣人快马奔赴京师联络刑部旧部，层层周旋人情、调和派系。","","准入手令到手时，天色早已沉暗入夜。","","滂沱秋雨疯狂冲刷库房——大量原始卷宗尽数受潮浸泡、墨字晕染湮灭。","","你站在库房门口，看着雨水顺着檐角灌进去，溅在那些化开的字迹上。","","这场人为的拖延，葬送了最佳取证时机。","","雨还在下。像有人掐着时辰，等这一切发生。"],"desc":"","choices":[],"next":"d2","next2":"","effects":"线索:q1；shijian-1；chaoting-5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"d2","title":"剧情二 · 库房初勘","type":"scene","lines":["推门踏入库房。一股霉气混着陈旧墨香扑面而来。","","四面窗棂破败，冷雨灌入。成堆珍贵墨卷随意落地堆砌，尽数被积水浸泡。","","卷上的字，洇成一片片灰影。有些还能辨出笔锋，有些已经化成了水。","","库房书役垂首立于一旁，言辞刻板：金陵秋雨罕见、库房老旧，卷宗损毁全系天时，人力难及。","","你没接话。目光落在墙角——","","官署统一配发的防水油布、挡雨木板、防潮毡毯，整齐堆叠，崭新无尘，从未被动用过半。","","器具齐全、人手充足，官吏却放任卷宗淋雨损毁。","","这不是疏漏，是刻意放纵。","","天灾，是最好的幌子。","","你蹲下来，指尖划过一卷化开的墨卷。水是冷的。","","人心，也是。"],"desc":"","choices":[],"next":"d3","next2":"","effects":"线索:q2","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"d3","title":"剧情三 · 私宅搜证","type":"scene","lines":["库房取证受挫。你兵分两路，亲自带队搜查主考翰林宋文彬的私宅。","","正厅简约素雅，唯有古籍笔墨，全然一副清廉文官模样。","","直至官差撬开西侧厢房一处常年落锁的暗柜——","","北方勋贵府专属的名家书画、和田玉佩、鎏金镇纸，件件带有勋贵钤印，价值不菲。","","随行僚属当即断言：铁证如山的贿赂！","","你按住卷宗。逐一比对礼簿、往来信函——","","所有馈赠时间分散、跨度数年，皆登记在册，是逢年过节的同僚贺礼、官场人情。","","这正是派系最老练的自保手段：以公开合规的人情往来，掩盖不可见人的权力交易。","","这批「铁证」，定不了罪。","","僚属怔住。你已转身走向东厢。","","官差的脚步停在书案前。案角镇纸下，压着一页火印题纸——封条未启，墨迹已干。","","你拾起来，对着光看了看。","","封条上的贡院火印，是真的。"],"desc":"","choices":[],"next":"d4","next2":"","effects":"线索:q3；得卡:q_changshi","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"d4","title":"剧情四 · 市井采风","type":"scene","lines":["午后雨势渐缓。贡院大门外人声鼎沸。","","忽有沙哑叫卖穿透嘈杂：「秋闱密卷！考前原题！有价即得！」","","人群呼啦围过去。你拨开人群时，商贩已经不见了——像一滴水融进了雨里。","","满城搜捕无果，密卷风波不了了之。","","此后，落第士子彻底分裂。平庸者扎堆茶肆，撰文诋毁顶尖才子「恃才傲物、咎由自取」；才子们提笔反击，怒斥庸人「对内内耗、自毁风骨」。","","这场士林内讧，恰好完美贴合布政司的官方定论——士子浮躁、同业相争、无事生非。","","官场派系乐见其成，放任流言发酵。","","你站在茶肆外听了一会儿。","","所有人的视线，都从顶层权力博弈，转移到了底层书生的意气之争上。","","雨又下了起来。议论声被雨声盖住，像什么都没发生过。"],"desc":"","choices":[],"next":"d5","next2":"","effects":"线索:q4","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"d5","title":"剧情五 · 档案核验","type":"scene","lines":["你再度重返库房，闭门封场，独自带着文书深耕官方值守档案。","","案头一盏油灯摇曳明灭。纸页摩擦声，在死寂里格外清晰。","","巡检武官陆昭上交的日夜巡防档册，字迹工整、记录周全，滴水不漏。","","你逐页比对纸张厚度、墨色新旧、装订痕迹。","","本届阅卷最关键的三个深夜时段，记录页面被整齐利落地裁撕。","","撕口笔直平整，无毛边、无受潮、无自然脱落——是锋利薄刃精准裁割、人为销毁。","","油灯的火苗晃了一下。你伸手，指腹拂过那道撕口。","","再联想到杂役陈三的口供：阅卷深夜，库房灯火彻夜通明，口音偏赣的长衫文士频繁出入。","","两条线索，双向印证——文官操控榜单，武官销毁记录，从上到下，联手封口。","","你合上档册。窗外雨声潺潺。","","这满库房的墨香里，藏着一把刀。"],"desc":"","choices":[],"next":"d6","next2":"","effects":"线索:q5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"d6","title":"剧情六 · 墨卷细勘","type":"scene","lines":["夜色深沉。大理寺公堂寂静肃穆。","","你孤身伏案，通宵达旦，逐卷细勘数百份科考墨卷。","","江南寒门士子的考卷章法严谨、论据扎实，尽数被考官黜落，批注强行安上「文风浮躁」的罪名。","","登榜考卷大多文笔粗浅、论据空洞，却被圈点夸赞、高居前列。","","油灯添了三回油。你的眼睛熬得发涩，指尖沾着墨。","","反复交叉比对之下，你捕捉到一个针尖大小的隐秘规律：","","所有勋贵子弟与江西布衣的登榜考卷，纸张右下角，尽数藏有一枚淡若无痕的墨色圆点。","","大小统一、墨质均匀、落点一致。","","这不是偶然墨渍，是阅卷高层私下约定的舞弊密记：有记必录，无记必黜。","","你捏起一卷，对着灯。那枚圆点，在光下几乎看不见——像一枚针尖，扎在国朝的命门上。","","国之重典，沦为权术私器。","","灯油将尽。你把那卷考卷，单独收进袖中。"],"desc":"","choices":[],"next":"d6_pick","next2":"","effects":"线索:q6；得卡:i_moji","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"d6_pick","title":"公堂 · 证物箱底","type":"pick","lines":["天将破晓。文书把彻夜比对的证物归箱，忽然停了手：","","「大人，箱底还有三样，是初勘时杂役顺手收的——不入正册。」","","他摊开一方油布：一枚官银印子，一册泛潮的文集，一张三十两的旧银票。","","「您挑一样，替它们正名。」","","晨光从窗缝漏进来，落在那三样东西上。","","你伸出手。指腹先触到的，是那张银票——纸面潮软，边角卷起，像是被手摩挲过很多遍。","","「就它了。」你说。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"i_siyin、i_wenji、s_yin30d","minigame":""},{"id":"d7","title":"剧情七 · 书吏搜赃","type":"scene","lines":["为溯源贿赂链条，你下令二次彻查誊卷书吏许安的居所。","","官差撬床板、挖墙缝、拆桌柜。他缩在墙角，脸色白得像纸。","","卧房床底的密封暗匣里，搜出一叠油纸层层包裹的银票。","","票面无商户落款、无私人印记，版式小众独特，与京城、江南流通的所有银票全然不同。","","多名资深钱庄掌柜交叉辨认，统一确认：该版式专属江西南昌藩府御用商号，宁王宗族内部流通，极少流出江西地界。","","你拈起一张银票，对着光。","","纸面是新的，墨印是新的。崭新的票子，包在陈旧的油纸里——说明持票人一直等着用，又一直没敢用。","","许安并非单线依附北方勋贵，而是长期双线受贿、两头牟利。","","北方勋贵嘱托打压寒门士子；宁王暗客授意偏袒江西布衣、抹除藩势痕迹。","","正是南北党争互相牵制的空隙，给了宁王绝佳的渗透契机。","","这条银票，击穿了「单纯党争」的表象——科场舞弊的深处，藏着蓄谋叛乱的社稷大祸。","","你把银票放回油纸，原样包好。"],"desc":"","choices":[],"next":"d8","next2":"","effects":"线索:q7","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"d8","title":"剧情八 · 深夜毒膳","type":"scene","lines":["子时已过。金陵万籁俱寂，唯有大理寺公堂孤灯独明。","","你孤身端坐案前，复盘连日查案的线索。僚属尽数退值歇息。","","空旷公堂，杀机暗藏。","","值守衙役轻步呈上后厨统一烹制的官衙夜宵：一笼糯米细点，一碗冰糖银耳甜汤。","","汤还冒着热气。银耳在灯下泛着温润的光。","","你没有端碗。你常年深夜办公，只食干点、绝不饮用汤水——只为护住案上卷宗，不叫一滴水渍损了物证。","","这份无人留意的自律，让你躲过一场无声绝杀。","","无人知晓，那碗寻常甜汤里，暗藏两股截然不同的杀机——北方勋贵授意投入缓性迷药，拖延查案、干扰判断；宁王死子掺入藩府秘制慢性毒剂，意在绝杀灭口。","","两股毒药同时落地、药性对冲，方才败露踪迹。","","你即刻封锁后厨。差役赶到时，灶台擦拭一尘不染。","","后厨横梁之上，白绫垂落——当夜唯一烹制夜宵的厨子，悬梁自尽，气绝多时。","","案头遗书自述私怨投毒、畏罪自戕，一人包揽所有罪责。","","可一个底层厨子，哪来的宫廷秘毒？哪来的胆量谋害奉旨主审？哪来的缜密布置这般干净的自绝现场？","","他是死子。一旦查案触及宁王核心隐秘，即刻启动，杀人灭口、自我湮灭。","","你站在白绫下，看了很久。汤早已凉了。"],"desc":"","choices":[],"next":"verdict","next2":"","effects":"线索:q8","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"verdict","title":"结案陈词 · 线索复盘","type":"scene","lines":["三日时限将尽。","","你面前摊开连日查案搜集的八条线索——有真钥匙，有假锁，有一把能开最后那扇门的。","","案头灯焰跳了跳。你把每一条线索重新过了一遍：","","笑面虎的脚，松过那半寸。油布是崭新的。撕口是直的。墨点是圆的。银票是江西的。甜汤是凉的。白绫是新的。","","圣上要的是「速速结案、平息风波」。","","而你呈上去的每一纸，都将决定这桩案子，是戳破朝堂的惊雷，还是无声消解的闹剧。","","窗外，雨声不知什么时候停了。","","你从中拣选五条，落笔定谳。","","笔尖悬在纸上。一滴墨，迟迟不肯落。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"win_gate","title":"落笔之前","type":"scene","lines":["线索核验无误。五条罪证，层层咬合。","","笔已蘸墨，只欠最后一问——这道爰书，你要它响到什么地步？","","案头，那叠江西银票还包在陈旧的油纸里。白绫的事，卷宗上只记了一行。","","窗外起了风。灯焰伏下去，又立起来。","","你想起苏砚秋进门时滴着雨的袍角，想起书摊青年梗着的脖子，想起那个厨子悬在梁下的脚。","","又想起南昌的方向——雨停之后，那边该起风了。","","笔尖的墨，开始发干。","","你提笔，落纸。这一笔下去，是办这桩案子，还是办案子里的人——","","纸上的字，由你写。纸外的局，也由你收。"],"desc":"","choices":[{"text":"【办多深】惊雷还是埋雷——先定这一笔对朝堂的分量。","hint":"姿态 · 砸向御前，还是埋进土里","next":"q_power_prep","cond":"","effects":""},{"text":"【办什么】恩科还是白绫——先定这一笔对人的分量。","hint":"人心 · 给寒门一个场，还是给死者一句真话","next":"q_human_prep","cond":"","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"q_power_prep","title":"驿馆 · 灯下","type":"scene","lines":["驿馆的烛，换到第三支。","五条罪证誊在纸上，墨已干透。你把它拿起来，对着光看——纸上的字，一笔一笔，都认得。","认得「科场」，认得「勋贵」，认得「藩府」。","最底下一行，你誊的时候，笔顿了顿——「南昌」。","南昌。宁王的庄子，酒是十年陈的，人是新换的。","你想起那日在公堂上，笑面虎的脚，松过半寸。只松了半寸，又踩实了——像踩住一个念头，不让人捡起来。","你想起苏砚秋那句话：「大人，这案子办到底，是要掉脑袋的。」","他说这话时，眼睛很亮，像不知道怕字怎么写。","你怕。你怕得很具体：怕诏狱的墙厚，怕菜市口的雪大，怕老家的母亲，等不到一封平安信。","你把罪证翻过来，扣在案上。窗外，南昌的方向，起风了。"],"desc":"","choices":[],"next":"q_power_gate","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"q_power_gate","title":"惊雷与埋雷之间","type":"scene","lines":["风从窗缝里灌进来，烛焰伏下去，又立起来。","你从怀里掏出那叠银票。油纸是旧的，票面是新的——江西的官银，从不印这种花纹。","惊雷，是把五条链子一起砸在御前——科场、勋贵、藩府，一个不留。雷声大，天也会裂。","埋雷，是烧掉这叠银票——只办科场与勋贵，把南昌让过去。雷埋在地下，响不响，由不得你。","你把它按在案上，指腹贴着票面，能摸到纸的纹理——那上面，压着多少人的十年。","多少人十年寒窗，不如一纸荐书。多少人的命，就系在这一张纸上。","灯焰一晃。银票的边角，卷起一点黑。","你松开手。手背上，青筋一跳，一跳。","天亮之前，总要做个了断。"],"desc":"","choices":[{"text":"【惊雷】五证并呈，科场、勋贵、藩府，一个都不放过。","hint":"完整解密 · 震动朝野之路（需朝望≥55 且有足够时限）","next":"end_win","cond":"{\"statAtLeast\":{\"chaoting\":55,\"shijian\":1}}","effects":""},{"text":"【埋雷】烧掉江西银票：只办科场与勋贵，不碰南昌。","hint":"需：江西来路银票在手 · 摇动社稷之罪，你不想担","next":"end_buried","cond":"{\"card\":\"i_siyin\"}","effects":"旗标:buried_thunder；失卡:i_siyin"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"q_human_prep","title":"驿馆 · 灯下","type":"scene","lines":["夜很深。案上五条罪证，摆得整整齐齐——像五个死者，并排躺着。","你挨个看过去。看到最边上那条时，停了。","卷宗里夹着一页纸，记的是那个厨子：悬在梁下，白绫是新的。甜汤验出来的一行字，你压在底下，没写进正卷。","陈三在班房里。他抖了一夜，问什么都说——唯独问起那碗甜汤，他闭了嘴。","你想起书摊那个青年。他梗着脖子，说「十年寒窗，不如一纸荐书」的时候，喉结在动，像咽下一口没咽完的气。","你想起苏砚秋。他进门时袍角滴着雨，官袍穿得笔挺，像一把刚出鞘的刀。","刀出鞘，是要见血的。他大概还不知道。","你把那页纸抽出来，又放回去；放回去，又抽出来。","纸边被你揉软了。窗外，更夫敲过三更。梆子声，一下，一下，像在给什么数着数。"],"desc":"","choices":[],"next":"q_human_gate","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"q_human_gate","title":"恩科与白绫之间","type":"scene","lines":["灯花爆了一下。你伸手，拨了拨灯芯。","五条罪证之外，卷宗里还压着两件事。","一件是恩科——江南寒门，今科中式者，十有八九是勋贵门生。另附一疏，请重开恩科，是把场还给读书人。","一件是白绫——先不结案，验甜汤，提陈三，给那个厨子讨一句真话。死子也是人，死子的话，也是话。","你提笔，先写了两个字：「恩科。」","笔尖停住。你把那行字划掉，重新蘸墨。","墨研到一半，你忽然听见自己的心跳——很响，像擂鼓。","原来官做久了，心还在跳。","你把这五个字，慢慢地，写进卷宗。"],"desc":"","choices":[{"text":"【补卷】定案之外另附一疏：请重开江南恩科，还寒门一个场。","hint":"需：苏砚秋已入你的班房 · 案子办的是人，也是人心","next":"end_supplement","cond":"{\"card\":\"r_suyan\"}","effects":"旗标:petition_exam"},{"text":"【白绫】先不结案——验甜汤、提陈三，给那个厨子讨一句真话。","hint":"需：杂役陈三已入你的班房 · 死子也是人","next":"end_bailin","cond":"{\"card\":\"r_chensan\"}","effects":"旗标:cook_inquest"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_thunder_fall","title":"结局 · 惊雷未震","type":"ending","lines":["五证并呈，你在御前把科场黑幕铺陈开来——","可殿上议论声起，又渐渐止住。你听见自己声音里的底气，比案卷上的证据，薄了一分。","涉事官吏拿办，勋贵撇清干系，宁王在江南的经营折了一角——却没能烧到南昌城的墙角。","藩府缩回去了。它只是更小心了些。","（惊雷终未震——朝望不足/时限紧迫，未尽全功的近似结局。）"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"惊雷未震（近似结局 · 未尽全功）","endingDesc":"你看见了一切，却没来得及把它全部呈上去。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_win","title":"结局 · 惊雷","type":"ending","lines":["夜宵毒膳、宁王银票、墨点暗记、撕页档册、闭门拦查。","","你在御前，将整张黑幕铺陈开来：科场系统性溃烂、勋贵双向操控、藩王暗中布局叛乱。","","殿上很静。你听见自己的声音，一字一字，落在金砖上。","","朝野震动。涉事官吏锁拿问罪，宁王在江南的经营被连根拔起一截——虽未能就此定其谋逆大罪，但那把火，已经烧到了南昌城的墙角。","","退朝时，同僚的目光躲着你走。","","你立在丹墀下，忽然想起那碗没喝完的甜汤——凉的。","","回衙那夜，你把结案文书复读了一遍，在末尾补了一句：","","「科场之弊不在考场，在朝堂。今日不治，他日江山科场，尽入藩府。」","","史官在卷宗末页记下八个字：查案三日，震动朝野。","","没人知道，这八个字背后，是一碗没喝完的甜汤，和一条白绫。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"惊雷（完整解密结局）","endingDesc":"核心线索在手，藩王暗谋惊现于朝堂。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_buried","title":"结局 · 埋雷","type":"ending","lines":["爰书呈上之前，你先在灯下烧了一样东西：那叠江西银票。","","票面无落款，火一舔，蜷成黑蝶——世上再无人能指认它见过谁的手。","","灰烬落在案上，还是温的。你把它扫进水里，看着它散开。","","定案：主考宋文彬卖榜鬻爵，革职问斩；书吏许安受贿誊卷，杖一百、流三千里；撕页武官陆昭同罪。","","科场之弊，止于科场。","","朝堂很满意：三天限期之内，你给了一个既见血、又不见骨的交代。圣上朱批嘉勉，你迁光禄寺少卿。","","赴任那日，你经过贡院。墙根的书摊还在，油布棚下换了新主人。","","只有你知道自己埋了什么。宁王的暗客退回了江西，那根渗透科场的线完好无损——它只是学会了更小心。","","你在私记里给自己留了一句话：","","「摇动社稷之罪，我担不起。可雷不是灭了——是我亲手按下去的。」","","六年后的那个夏天，南昌兵起的檄文传到京师。","","满朝仓皇里，你站在班列中，异常平静。","","从那天起你数着自己的每一天——那堵墙，是你亲手垒的。","","塌下来，你接着。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"埋雷（妥协结局 · 能臣之择）","endingDesc":"你烧掉了最烫手的那页纸，换来一个朝堂满意的答案。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_supplement","title":"结局 · 补卷","type":"ending","lines":["定案照拟：墨点暗记、撕页档册、双线贿银，铁证如山；宋文彬下狱，许安流徙，控榜之链连根拔起。","","但你另附了一疏，不为定罪，为请命：","","「江南寒窗之士，十二载灯，尽悬于私记一点。今弊既去，乞赐恩科一闱，使落第者复有其场。」","","疏入，留中三日。","","第四日，批红下来：准。","","次年春，江南恩科重开。","","开试那日，苏砚秋来大理寺外长揖辞行。他没说谢——寒窗十二载的人，不轻易说谢。","","他只留下一句：「大人，这场的卷子，我们自己写。」","","后来听说他中了。名次不高，榜上无名显贵。","","放榜那晚金陵落了场小雨。书摊上的文集换了新的一册，头一页印着：","","「十载寒窗，幸遇一卷公心。」","","你把那册文集收进了卷宗箱底，与那枚针尖墨点的考卷并排放着。","","一张是病，一张是药。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"补卷（人心结局 · 恩科重开）","endingDesc":"案子办的是舞弊，你多办了一件事：把场，还给了人。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_bailin","title":"结局 · 白绫","type":"ending","lines":["你押下了结案文书，多要了三天。只为一个悬梁的厨子。","","仵作复验：吊痕上扬过急，梁下无垫脚之物的尘土落痕，指缝无抓握白绫的勒茧——自缢者攀不上那根梁。","","是有人替他上去的。","","陈三后半夜被提上堂。这个夜夜值守库房后门的粗人，抖了半天，终于吐出一句：","","「那夜小人起夜，看见后厨的灯……灯里进过一个穿长衫的人。口音偏赣。」","","长衫。偏赣。又是这五个字。","","你连夜比对伪书笔迹与当值名册：投毒、灭口、伪书，一环不差，是死子的收官手续。","","补充爰书呈上：「厨子非自戕，乃灭口；谋害钦差，罪浮于弊。请敕锦衣卫按南昌藩府客馆。」","","宁王府三名门客锁拿北上。藩王上疏自辩，言辞哀恳——可自辩本身，已是一身冷汗。","","结案那日，你让人把那碗没喝完的甜汤，埋在了后衙的槐树下。","","没立碑。有些人的名字上不得爰书——但你记得。","","入冬后那棵槐树落了叶。你偶尔经过，会停一停。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"白绫（隐藏结局 · 为死者）","endingDesc":"满卷宗都是大人物的名字，只有你为一个厨子多要了三天。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_lose","title":"结局 · 庸判","type":"ending","lines":["你呈上的线索组合零散失据——或是被天灾幌子带偏，或是被勋贵馈礼迷惑，或是让士子内讧转移了视线。","","整桩科场大案，最终以「士子文风浮躁、聚众滋事」的定论草草收场。","","江南士林离心离德，寒门再无出路。","","那碗下了两种毒的甜汤，无人知晓；那条白绫后的死子，无声湮灭。","","宁王的暗线完好无损地缩回了江西的地界，只待来年。","","六年后，宁王起兵。檄文传至金陵那日，你正在整理旧档。","","翻到正德九年的这册卷宗时，你的手停住了。","","墨点、撕页、银票——那些纸，还静静躺在卷宗里。","","你忽然想起，那夜案头，汤是热的，笔是干的，雨是停的。","","——所有答案，当年都曾在你的案头摊开过。","","你把卷宗合上。窗外，又下雨了。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"庸判（缺憾结局）","endingDesc":"真相曾到过你手上，又从指缝漏走了。","shop":"","duel":"","pick":"","minigame":""}],"viewpoints":[]},{"id":"sichou","title":"丝绸通倭案","subtitle":"正德十二年 · 刑部疑案卷宗","mode":"case","startScene":"start","W":2450,"H":1108,"nodeSvg":"<g class=\"node\" data-id=\"start\" transform=\"translate(40,84)\" opacity=\"1\">\n      <rect width=\"200\" height=\"56\" rx=\"6\" fill=\"#1c1915\" fill-opacity=\"0.8\" stroke=\"#5b8fb8\" stroke-width=\"2.5\" stroke-dasharray=\"5 3\" class=\"node-rect\"/>\n      <text x=\"8\" y=\"18\" font-size=\"14\" fill=\"#5b8fb8\" font-weight=\"700\">□</text>\n      <text x=\"27\" y=\"17\" font-size=\"13.5\" fill=\"#e8d9b0\" style=\"paint-order:stroke;stroke:#0e0c0a;stroke-width:3.5px\">卷宗启封 · 王</text>\n      <text x=\"27\" y=\"32\" font-size=\"13\" fill=\"#e8d9 sharray=\"6 4\" opacity=\"0.9\"/><path d=\"M1920,381 C1940,381 1940,370.32 1960,370.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M1200,696 C1220,696 1220,124.32 1240,124.32\" fill=\"none\" stroke=\"#5fa877\" stroke-width=\"1.3\" stroke-dasharray=\"\" opacity=\"0.9\"/><path d=\"M1200,696 C1220,696 1220,760.32 1240,760.32\" fill=\"none\" stroke=\"#c05b4d\" stroke-width=\"1.3\" stroke-dasharray=\"\" opacity=\"0.9\"/>","laneSvg":"<rect x=\"0\" y=\"70\" width=\"2450\" height=\"722\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"85\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">丝绸通倭案</text><rect x=\"0\" y=\"642\" width=\"2450\" height=\"86\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"657\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">尾声 · ◆ 封笔定案（至少勘得五</text><rect x=\"0\" y=\"232\" width=\"2450\" height=\"86\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"247\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">尾声 · 密奏与题本之间</text><rect x=\"0\" y=\"394\" width=\"2450\" height=\"86\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"409\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">尾声 · 断腕与文告之间</text>","nodes":[{"id":"start","title":"卷宗启封 · 王朝底色","type":"scene","lines":["正德十二年五月，江南端午汛期。","","连日霪雨，新安江洪峰骤起。沿江九县万顷良田尽遭浸漫，流民遍野，饿殍枕藉。","","京城的案头，卷宗启封。墨是新的，纸是旧的——蜡封下压着一角，被潮气洇软了。","","彼时国库虚空：豹房靡费，边饷沉重，倭患连年。内阁议定国策——改稻为桑。铲稻种桑，以桑殖银，以绸养兵。","","江南本是天下粮仓。稻可饱腹，桑仅产丝——改桑则绝粮，粮绝则生乱。","","乡民死守耕地，国策阻滞难行。","","然后，汛期水势汹汹，新安江九处堤口，同期崩裂。","","官府即刻定调：衙署主簿周书年贪墨修堤银两，偷工减料致堤坝疏松。文告遍贴州县，定论仓促，未有复盘。","","你合上卷宗。窗外没有雨，京城的六月，干得发裂。","","临行前，刑部旧友塞给你一封信：「苏杭水深。要查账，先备银子——三山街市集、贾三的牙行，都能办货。——故人」"],"desc":"","choices":[],"next":"origin","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"origin","title":"卷宗溯源 · 二十份口供","type":"scene","lines":["你把二十份口供分作六组，钉在案前：内廷宦官、地方文官、海防武将、商贾商行、底层民人、倭寇关联。","","织造局掌印崔福全一口咬定周书年贪银坏堤。他说话时，拇指无意识地摩挲着腰间的印袋。","","采办高禄话里有话——「九处堤口切口平整笔直，绝无自然坍塌痕迹」。他说完这句，便低头看自己的鞋，鞋上沾着灰白的石灰。","","随堂太监刘小三拍案痛骂：崔福全私造御用官印，借水患杀寒门主簿灭口！他骂得最响，人却最不像有靠山的。","","账房吕思远摊开明账暗账：宦二文一武三，商行只剩四成；东家苏怀瑾一年垫付官银六万余两。","","「海上交易的船，挂黑灯笼。」吕思远说，「我从不敢看。」","","每个人都在说，没有人全说。四条线等你去拉：河堤、账册、海上、大牢。","","——但拉线之前，你还有一整天的空。苏杭的市集，白日不打烊。"],"desc":"","choices":[],"next":"market_gate","next2":"","effects":"线索:t4","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"market_gate","title":"苏杭 · 开查前夜","type":"scene","lines":["驿馆的灯下，你摊开故人的信。三山街的市集白日喧闹，贾三的牙行入夜才开。","","袖里四十两官银——查案的用度，案上不报销。","","窗外，苏杭的夜还早。巷口传来货郎的吆喝，一声长，一声短。","","你数了数银子，又想起那句「要查账，先备银子」。","","这桩案子办不办得下去，就看今夜，你舍得把银子花在哪一扇门里。","","市集明码标价，牙行来路不问，后堂还有一桌赌局。","","灯花爆了一下。你起身。"],"desc":"","choices":[{"text":"【三山市集】买卡、开包、编组。","hint":"市集","next":"market","cond":"{\"notFlag\":\"done_market\"}","effects":"旗标:done_market"},{"text":"【贾三牙行】「大人要什么？人，话，还是命？」","hint":"剧情商人 · 独占货栈","next":"jia_san","cond":"{\"notFlag\":\"done_jia\"}","effects":"旗标:done_jia"},{"text":"【牙行后堂】贾三拍了拍你：「后头有桌好局，大人，玩两把？」","hint":"推牌九 · 赌局（败不可再战）","next":"sc_paijiu","cond":"{\"notFlag\":\"done_paijiu\"}","effects":"旗标:done_paijiu"},{"text":"◆ 灯熄，就寝。明日开查。","hint":"","next":"hub","cond":"","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"sc_paijiu","title":"牙行后堂 · 推牌九","type":"minigame","lines":["后堂灯火昏黄。一张案几，两副骨牌。","","贾三亲自坐庄，把牌推到你面前，指腹在牌背上摩挲了一下，像在试探什么。","","「大人，五局定输赢。」他笑，「先看自己的牌，再押注。对子最大，天杠次之——同点，庄赢。」","","骨牌在灯下泛着温润的旧光，被手摸过千遍万遍。","","后堂的门虚掩着。门缝外，有人影一闪，又没了。","","你伸手，摸起第一张牌。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":"paijiu → 胜:sc_pj_win / 败:sc_pj_lose"},{"id":"sc_pj_win","title":"后堂 · 赢家","type":"scene","lines":["你数了数桌上的银子，只多不少。","","贾三的账房把一页册子推过来，上面记着几个名字——都是走暗柜的主顾。","","「大人，这页纸，就当我送您的。」","","他把茶盏往你这边推了推，茶还是热的：「往后这条街上的话，您要听，小人替您听。」","","你没接茶。你把那页纸折好，收进袖中。"],"desc":"","choices":[],"next":"market_gate","next2":"","effects":"银+15；线索:t10","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"sc_pj_lose","title":"后堂 · 输了","type":"scene","lines":["银两输了个干净。贾三把最后几两也收了去，笑得愈发殷勤。","","他亲自送你到门口，脸上的笑敛了半分：","","「大人慢走。后堂这桌，往后只认熟客了。」","","门在你身后合拢。骨牌声又响起来，隔着门板，闷闷的。"],"desc":"","choices":[],"next":"market_gate","next2":"","effects":"银-15","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"market","title":"三山市集","type":"shop","lines":["三山市集白日喧闹，明码标价。绸缎、消息、人手——苏杭百物，皆可买卖。","","摊上的绸缎一匹匹挂开，在日头下晃眼。也有不挂绸的摊子：卖消息的，卖人手的，卖「一句话」的。","","价钱都写在纸签上，童叟无欺——欺也没用，明日这条街还开。","","你走过一排摊子，袖里的银两还沉。该买什么，心里得有数。","","离市之后，还可去牙行，或就寝。苏杭的夜，有自己的去处。"],"desc":"白日喧闹，明码标价。绸缎、消息、人手——苏杭百物，皆可买卖。","choices":[],"next":"","next2":"market_gate","effects":"","ending":"","endingDesc":"","shop":"三山市集 · 卡包2","duel":"","pick":"","minigame":""},{"id":"jia_san","title":"牙行 · 贾三","type":"shop","lines":["牙行的门脸不起眼，半扇门板虚掩着，里头却别有洞天。","","贾三斜倚在柜后，见你进来，笑得像见了亲爹。","","「大人查丝绸的案子？巧了——小人的货栈里，恰好有几样『前主顾』留下的东西。」","","他压低声音：「白来的，便宜卖。您懂的。」","","柜上的货不上明面：强卡、雇人、暗柜，都锁在后头的暗格里。","","「大人。」他忽然正色，「做官和做生意，一个道理——来路不问，去路不留。」","","他把账本往你面前推了推，指尖点了点上面一个空着的名字栏。"],"desc":"货不上明面：强卡、雇人、暗柜。入夜才开，来路不问。","choices":[],"next":"","next2":"market_gate","effects":"","ending":"","endingDesc":"","shop":"贾三货栈 · 卡包1","duel":"","pick":"","minigame":""},{"id":"hub","title":"江南 · 四条线","type":"scene","lines":["翌日开查。案前四份勘验录：河堤、怀瑾坊、海上、大牢。","","人证俱在：官、商、兵、宦、民、寇。有人刻意揽罪，有人含糊遮掩，有人字字属实却句句留白。","","窗外，江南的雨断断续续，下了一夜，还没停。","","你先把四份勘验录各读了一遍——每一条线，都通向一扇不同的门。","","河堤的门，是土做的。账册的门，是墨做的。海上的门，是水做的。大牢的门，是铁做的。","","先推开哪一扇，案子的走向，便从那扇门里长出来。","","雨声里，你伸手。"],"desc":"","choices":[{"text":"【河堤】勘堤问工——堤是怎么样溃的","hint":"","next":"dike","cond":"{\"notFlag\":\"done_dike\"}","effects":"旗标:done_dike"},{"text":"【怀瑾坊】账房对册——钱是怎么样流的","hint":"","next":"zhang","cond":"{\"notFlag\":\"done_zhang\"}","effects":"旗标:done_zhang"},{"text":"【提审山本一郎】海上——货是怎么样出的（对局）","hint":"","next":"yam_intro","cond":"{\"notFlag\":\"done_yam\"}","effects":"旗标:done_yam"},{"text":"【刑部大牢】对坐周书年——罪是怎么样认的（对局）","hint":"","next":"zhou_intro","cond":"{\"notFlag\":\"done_zhou\"}","effects":"旗标:done_zhou"},{"text":"◆ 封笔定案（至少勘得五条线索）","hint":"","next":"verdict","cond":"{\"cluesAtLeast\":5}","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"dike","title":"河堤 · 一明一暗","type":"scene","lines":["你沿着残堤走了十里。","","九处堤口，切口平整笔直，边缘锋利规整——没有一处是雨水冲刷的自然坍塌。","","市井杂役牛二蹲在堤根，抓起一把黑土，在掌心搓了搓：","","「上半截堤身，石料规整、夯土坚硬；下半截贴近水面的堤土，发黑疏松，一捏就碎。」","","「开春修缮，我搬过每一块石头——官府采买的石料，不是这个成色。」","","端午前夜，他亲眼看见一队官差携铁凿铁锤登堤，硬生生凿开上半截坚硬堤身。","","「说白了——这道堤在被凿之前，水下基底早就被动过手脚。一暗一明，一缓一急，两处人为损毁，才有九处同步崩塌。」","","堤下村口，一个瘦小的身影朝你张望。是织女阿桃。","","她攥着衣角站了很久，才敢走过来：「大人……我们踩着堤长大。堤下的黑土，我们认得出。」","","「没人肯听我们说。」"],"desc":"","choices":[],"next":"dike_pick","next2":"","effects":"线索:t1；线索:t2；线索:t3；线索:t9；minxin+5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"dike_pick","title":"堤下 · 阿桃的谢礼","type":"pick","lines":["你把阿桃的话一字一字记进卷宗。","","她忽然从怀里摸出个布包，塞过来就跑，跑出十几步又回头喊：","","「爹娘说，肯听我们讲话的官，该谢！」","","布包是粗布缝的，针脚歪歪扭扭，收口处打了个死结——她怕东西掉出来，系了又系。","","你解开布包。里面是三样东西——她能拿得出手的，全在这了。","","堤下的风灌过来，把布包的一角吹得翻起。你把它重新系好。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"r_atao、i_midce、s_yin10b","minigame":""},{"id":"zhang","title":"怀瑾坊 · 明账与暗账","type":"scene","lines":["总账房吕思远三十年的账，条理清晰得近乎坦白。","","商行每年海上走私盈利十一万两，宦臣抽两成、文官抽一成、武官抽三成，商行仅剩四成。","","「朝廷下发的桑苗补贴，三成经商行中转，尽数被布政司截留私分。灾民未领分毫。」","","他说话时，算盘珠子一直没停，噼里啪啦，像在替那些数目数命。","","账册末尾，一处墨痕涂改的大额银款——数额巨大，不走商行渠道，经由内廷暗渠划拨。","","「我忌惮内廷权势，不敢记录，只能涂改遮掩。」","","再比对田契：受灾农户三千四百余户，灾田尽数流转至商行与官绅名下——田契落款日期，均在溃堤后三日之内。","","东家苏怀瑾临走时，留下一句他憋了一年的话：","","「每年入冬，织造局必下发隐秘织造令——一批特制云锦，不计工本，织成后宦官亲自上锁封存，不录台账、不见去处。」","","账册最后一页的夹层，抽出一架袖珍织机的图样。","","机杼暗纹与堤身砌法，是同一双手量出来的。"],"desc":"","choices":[],"next":"zhang_pick","next2":"","effects":"线索:t5；线索:t6；线索:t7；得卡:s_yingsi","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"zhang_pick","title":"柜上 · 吕思远的私赠","type":"pick","lines":["临出怀瑾坊，吕思远叫住你。","","他从袖中摸出两样东西压在账册下，又飞快地缩回手，仿佛烫着了。","","「拿一样走。就当……老朽三十年，头一回也做了回主。」","","他的手指在账册上微微发抖——那本他记了三十年的账，从没抖过。","","你垂眼看那两样东西。他别过头去，看着窗外。","","雨打在窗纸上，沙沙的。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"r_lvsiyuan、i_yinpiao2、s_yin50","minigame":""},{"id":"yam_intro","title":"提审 · 东海浪人","type":"duel","lines":["山本一郎被押上堂时，坐姿狂放，毫无囚犯惶恐之态，嘴角挂着嘲讽的冷笑。","","铁链在他脚边堆成一圈，他坐着，像坐在自己的船头。","","「我等跨海而来，所求不过丝绸、精铁、硫磺。大明官吏与我交易数年：宦官私盖官印、文官凿堤淹田、武官押运军械、商贾储运绸缎——流程熟稔，配合默契。」","","「你们朝堂之人，比我等浪人更加冷血。」","","他笑吟吟看着你：「审我？大人先想清楚，你敢审到哪一层。」","","堂上很静。他的冷笑在烛火下，像一把没出鞘的刀。","","此人不怕死，只怕无聊。那就给他一个值得开口的对手。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_yamamoto","pick":"","minigame":""},{"id":"yam_win","title":"浪人 · 真话","type":"scene","lines":["你以证对质，一条一条钉：月圆黑船、军械磨号、抽成暗账。","","他的冷笑慢慢变成了注视——像在海上打量一艘值得抢的船。","","「好。大人这样的对手，值几句真话。」","","他身体前倾：「东海之上，真假难辨；寇匪之中，亦有官身。」","","「若无朝堂内部暗线保驾护航，我等浪人永远无法靠近大明海防。近海孤岛停我们这类浪人；可远海迷雾里那座无人岛——船上之人衣着规整、军纪森严，说的不是倭语。」","","「你们大明最凶狠的寇匪，从来不在沧海孤岛——」他最后笑了笑，「而是藏在庙堂之上、隐于官袍之中。」","","李狗剩在旁听得直抖，也竹筒倒豆子：岛上那些中土装束的人，腰间令牌纹路，「和织造局太监随身的，隐隐相似」。","","你连夜核验缴获的倭人密信——七封信无落款、无方位，可其中两封的信纸夹层，是皇家专用的桑皮纸。","","灯下，那两张桑皮纸薄得透光。你捏着它，指尖发凉。"],"desc":"","choices":[],"next":"hub","next2":"","effects":"线索:t8；线索:t10；线索:t11；得卡:i_mixin","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"yam_lose","title":"浪人 · 冷笑","type":"scene","lines":["话被他牵着走了。你拍案，他大笑；你质问，他鼓掌。","","一堂审下来，他把你审了个通透。","","「大人回去想想，」被押下去时他回头，「想明白了，再来。想不明白——就照文告定案罢，反正你们最擅长这个。」","","堂上空了。只剩烛火，和一地铁链拖过的痕迹。","","你坐在堂上，手边只有截获的账册与密信。云锦匹身的倭文暗记还核得出，可岛上的人、船上的货——这条线，断了。","","你合上账册。窗外，江南夜雨又起了。"],"desc":"","choices":[],"next":"hub","next2":"","effects":"线索:t8；线索:t10","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"zhou_intro","title":"大牢 · 主动赴死的人","type":"duel","lines":["周书年衣着素净旧衫，面色惨白，端坐囚椅，无挣扎、无辩解、无惶恐。","","「本官认罪，无可辩驳。」供词背得一字不差，「修堤公款三千七百两，私扣一千二百两……我罪孽深重，甘愿领受死刑。」","","静默良久，他垂眸看向地面，语声干涩：「除此之外，无供可述。旁人所作所为，我不便言、不可言、不敢言。无需再审，判罪即可。」","","可全案的物证都在替他喊冤：吕思远验过石料无劣质掺假；王婆子见过此人粗茶淡饭、不置田宅——清贫简朴，全然不似贪财之人。","","他不惧刑，不喊冤，主动赴死。像一具提前写好了遗言的躯壳。","","牢狱看守还有一件怪事：每至子夜，便有黑衣内侍悄入囚牢，不审不问，只静坐片刻。","","周书年每逢此人到访，脊背僵硬、周身战栗——非是惧刑，乃是敬畏。","","牢里的灯很暗，暗得只能看清他脸上那两条深纹。","","你走进大牢，在他对面坐下。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_zhou","pick":"","minigame":""},{"id":"zhou_win","title":"对坐 · 半张桑皮纸","type":"scene","lines":["你不问案。你把二十份口供、四条线、涂改的账尾、发黑的堤土，一层一层摆给他听——像在锁匠面前，把锁芯拆开。","","他始终垂着眼。直到你说出「黑衣内侍」四个字，他的脊背，几不可察地一颤。","","「大人。」很久之后，他开口了，声音轻得像叹息，「您已经看到门槛了。门槛后面的东西，我拿命换不来，您拿官袍换得来——想清楚，再迈。」","","他抬起眼。眼底那点极淡的冷光，第一次有了温度：","","「查两样东西。牢里，我的被褥。织造局，霜降的那批锦。」","","他顿了顿：「这是我这个死人，能给大人的全部。」","","牢灯晃了一下。你起身，他依旧坐着，像一尊终于开口的石像。"],"desc":"","choices":[],"next":"deep_unlock","next2":"","effects":"线索:t13；得卡:i_sangpizhi","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"zhou_lose","title":"对坐 · 石像","type":"scene","lines":["话没能递进去。你走的时候，他还保持着原来的姿势，像一尊入定的石像。","","「判罪即可。」他最后说了一句，「大人，对彼此都好。」","","牢里的灯很暗。你走出大牢时，听见身后传来一声极轻的叹息——又像是错觉。","","江南夜雨又起了。雨丝斜斜地打在你官袍上。","","那扇铁门在身后合拢，锈声闷响。"],"desc":"","choices":[],"next":"hub","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"deep_unlock","title":"深层 · 拆检暗锦","type":"scene","lines":["「霜降的那批锦。」","","你以钦差官牌，连夜调封织造局库房。特制暗锦，匹匹上锁——你拆检了一匹。","","锦面在灯下流光。指腹摩挲过去，能感到暗纹凸起的纹路——极细的金线，织在锦底。","","非祥瑞花鸟，非官衙图腾。","","是帝王私用暗纹。专供内廷密探、远海暗卫标识所用。","","灯花爆了一下。你捏着那匹锦，指尖发凉。","","所有线索在这一瞬间串成了一条线：账尾不明银款、失踪的修堤石料、被墨遮盖的朱笔暗注、无备案的御用私印——全部流向同一处隐秘节点：帝王私库。","","改稻为桑、凿堤淹田、兼并灾田、海上交易，从来不是江南权贵自发敛财，而是深宫自上而下的排布——所有罪责推给底层官吏与地方权贵。皇家身居幕后，不染半分污浊。","","而周书年，是皇家暗部的人。奉命南下，刻意认罪赴死——帝王定下的弃子。","","你把那匹锦裁下一角，收进袖中。","","从今往后，这方寸之物，就是你见过的深渊。"],"desc":"","choices":[],"next":"deep_pick","next2":"","effects":"线索:t12；得卡:i_anyun；旗标:deep_seen；minxin+10","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"deep_pick","title":"库房 · 顺手之证","type":"pick","lines":["库房的梁上落着灰。你环顾四周——守库的老太监缩在角落，头都不敢抬。","","你走过一排排上了锁的锦柜。手边两样东西，落在灰里，像是被仓促遗落的。","","「大人，」老太监声音发颤，「库房里的东西，动一针一线，都是要掉脑袋的……」","","你把手伸向那两样东西。","","梁上的灰，落下来，细得像雪。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"i_guanyin、r_liuxiaosan、s_yin100","minigame":""},{"id":"verdict","title":"封笔 · 定案陈词","type":"scene","lines":["密旨的限期到了。","","你面前是江南三个月的雨、九县的流民、二十份各怀鬼胎的口供。","","案头那匹裁下的暗锦，静静地压在卷宗下。锦上金线，在灯下若隐若现。","","你提笔，又放下。笔尖的墨，干了两次。","","呈上去的每一纸，都会变成某些人的坟——或者，你自己的。","","窗外，雨声不知什么时候停了。檐角还在滴水，一滴，一滴。","","你拣选五条，附于卷首。","","笔落下去的时候，你的手，没有抖。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"verdict_pass","title":"落笔之前","type":"scene","lines":["线索核验无误。但真正的抉择现在才开始——","","这桩三层套盒的案子，你的爰书写到哪一层？","","案头，暗纹云锦、桑皮纸、账册、黑土，一字排开。每一件，都指向不同的深渊。","","你想起周书年那句话：「门槛后面的东西，您拿官袍换得来——想清楚，再迈。」","","又想起山本一郎的冷笑：「你们大明最凶狠的寇匪，藏在官袍之中。」","","窗外起了风。案头那匹锦的边角，微微卷动。","","笔已经蘸好了墨。这一笔落下去，是往深渊里写，还是往自己身上写——","","纸上的字，由你写。纸外的局，由深渊收。"],"desc":"","choices":[{"text":"【把命押出去】深渊在案下，刑台在案外。这身官袍，今夜先借给死人穿一回。","hint":"碰深渊 · 密奏与题本之间","next":"s_deep_prep","cond":"","effects":""},{"text":"【把官袍穿回来】朝堂要结案，江南要太平。官袍先替自己披好——天冷。","hint":"保仕途 · 断腕与文告之间","next":"s_surface_prep","cond":"","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"s_deep_prep","title":"驿馆 · 灯下","type":"scene","lines":["驿馆的灯，下半夜换了三次油。","官袍的扣子，解了又系上；系上，又解了。","窗外，江南的雨停了又起，起了又停——像心里那根弦，绷着，不敢松。","暗纹云锦摊在案上。你伸手，指腹从金线上抹过。","小时候娘说，锦上的金线是蚕吐的。那时候你信。","现在你看着它——只觉得像一条蛇。","你想起崔福全的脸：笑的时候，眼白比眼仁多。","又想起周书年。他在牢里不哭，不喊冤，安安静静等着，像一截早就知道要烧完的蜡烛。","你把云锦折好，又摊开；摊开，又折好。","灯花爆了。你伸手去剪，剪子悬在半空，没有落下去。"],"desc":"","choices":[],"next":"s_deep_gate","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"s_deep_gate","title":"深渊与刑台之间","type":"scene","lines":["天快亮了。案头的墨，研了第三次。","两份稿子，摊在面前。一份写给御前，一份写给登闻鼓。","写给御前的，是密奏——帝王暗线、远海暗卫、私库通倭，全写进去。呈上去，石沉大海是好的，怕的是有回响。","写给登闻鼓的，是题本——不碰那条最深的线，只把崔福全钉在午门外，把周书年从刑台上抢回来。","你提笔，又放下。","你想起周书年那句话：「大人不必愧疚。这条路，我自己选的。」","那是个怕死的人，做了件不怕死的事。","而你呢？你怕死。你清清楚楚地知道，你怕死。","正因为怕，才要趁着手还稳，把这一笔，写到底。","天光从窗纸缝里漏进来，落在两份稿子上。"],"desc":"","choices":[{"text":"【密奏】帝王暗线、远海暗卫、私库通倭——深渊收不回的字。","hint":"看见深渊的人 · 需暗纹云锦为凭 · 民命≥60（真结局）","next":"end_deep","cond":"{\"card\":\"i_anyun\",\"statAtLeast\":{\"minxin\":60}}","effects":"旗标:accuse_deep"},{"text":"【题本】不密奏、不攀龙——只办崔福全：把弃子从刑台上抢回来。","hint":"救人一线 · 需桑皮纸为凭 · 民命≥65","next":"end_flip","cond":"{\"card\":\"i_sangpizhi\",\"statAtLeast\":{\"minxin\":65}}","effects":"旗标:accuse_flip"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"s_surface_prep","title":"驿馆 · 灯下","type":"scene","lines":["灯焰矮下去，你伸手拢了拢——没拢住，火苗还是晃。","官袍挂在架上。缎面在暗处，泛着水一样的凉光。","你走过去，摸了摸领口。那里有一根线头，起了毛，你一直没舍得剪。","这件官袍，是你考了七年，才穿上的。","从贡院出来那夜，你蹲在墙角，把榜纸上的名字，看了七遍，才敢相信是自己。","娘站在衙门口，远远地看了一眼，没走近——她说，官袍沾了灰，不好。","后来你就懂了：官袍这东西，穿得越久，越怕脏。","你把手从领口收回来。指尖勾着那根线头，捻了捻，没有剪。","窗外，雨又大了些。打在瓦上，密得像织机。"],"desc":"","choices":[],"next":"s_surface_gate","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"s_surface_gate","title":"官袍与良心之间","type":"scene","lines":["案头另两份稿子，各写了一半。","一份奏折：江南官商兵宦，协同贪腐、私通海商——罚没降级，断腕而不掀桌。朝堂会满意，你会上迁，周书年照旧问斩。","一份文告：主簿周书年，贪墨库银，偷工减料——斩立决，秋后行刑。百姓会拍手，桑田会连片，仿佛那九处堤口从未崩裂。","你捏着笔，指节发白。","笔尖悬在「周书年」三个字上。墨滴下来，洇开一小团——像一滴泪，落在雪上。","你想起阿桃在织坊里，四更起的影子。她今年十四岁，手掌上全是茧。","你想起那半张桑皮纸——薄到一折就破，像那些人的命。","窗外，织机的声远远地响着。天快亮了，织坊该开工了。","官袍还在架上。缎面凉，贴不到脖子上。"],"desc":"","choices":[{"text":"【断腕】江南官商兵宦协同贪腐、私通海商，罚没降级。","hint":"能臣之路 · 断腕而不掀桌","next":"end_mid","cond":"","effects":"旗标:accuse_mid"},{"text":"【文告】周书年贪墨库银，判斩立决，秋后行刑。","hint":"官府文告的定论 · 最省事，也最凉","next":"end_surface","cond":"","effects":"旗标:accuse_surface"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_deep","title":"结局 · 锦绣藏骨","type":"ending","lines":["密奏呈上去了。如你所料——石沉大海。","","三日后，圣旨到苏杭：嘉奖你「查案详实」，改稻为桑国策「续行」，周书年「罪证确凿」，斩立决。","","又过七日，一驾无标识的马车停在驿馆外。车中没有人，只有一只锦盒。","","盒中三样东西：一匹暗纹云锦，一张崭新的桑皮纸，一锭五十两的金铤。","","帝王的意思，从来不需要字。","","你把金铤原封退回。锦与纸，收进了行囊最底层。","","当夜收拾行李时，窗外屋檐上落了一只信鸽，腿上空无一物——它只是看了你很久，飞走了。","","行刑那日，你去了法场。周书年跪在刑台上，看见人群中的你，忽然笑了，微微摇了摇头——","","刀落。江南的雨，又下起来了。","","多年后，嘉靖登基，大礼议起，朝局翻覆。有人在清点旧档时，于一册刑部卷宗的夹页里，发现了半张桑皮纸，和一页不属于任何官方记录的墨迹：","","「锦绣藏骨，江水埋忠；庙堂无鬼，帝王为谋。」"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"锦绣藏骨（深层结局 · 深渊回望）","endingDesc":"你看见了深渊，深渊也看见了你——而你选择了让后世看见。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_mid","title":"结局 · 断腕","type":"ending","lines":["爰书上，布政使张惟岳、总兵周承业、掌印太监崔福全，协同贪腐、私通海商：罚没私产、降级留用，不杀不贬，留作朝堂制衡。","","朝堂很满意——断腕而不掀桌，是官场艺术的最高境界。你迁都察院佥都御史，圣眷日隆。","","江南的桑田还在扩。流民入了织坊，四更起，三更歇。阿桃们的故事，没有出现在任何一份公文里。","","周书年仍依律问斩——中层的案子，需要一个表层的凶手。","","临刑前他托狱卒带给你八个字。你捏着那张纸条，在灯下坐了一夜：","","「既见门槛，何不迈耶？」","","你没有迈。你告诉自己：留着这条命，下次再迈。","","纸条在灯焰上卷了边，烧成灰。灰落进砚台里，和墨混在一起。","","只是那个「下次」，一直没有来。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"断腕（中层结局 · 能臣之路）","endingDesc":"你办成了大案，也亲手埋了真相。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_surface","title":"结局 · 秋后","type":"ending","lines":["「主簿周书年，贪墨库银，偷工减料，致使河堤崩坏，祸乱江南，判斩立决，秋后行刑。」","","文告贴出去那天，苏杭百姓争相围观，人人拍手称快——三个月的洪水，总算有个交代了。","","行刑前夜，你去牢里看了他最后一眼。他依旧平静，像赴一场约好的宴。","","你张了张嘴，终究什么也没说。","","「大人不必愧疚。」他先开了口，「这条路，我自己选的。您只是……恰好也在选。」","","秋后，刀落，雨停。","","次年桑田连片，云锦按期供奉内廷，海防军饷「足额拨付」。一切如常，仿佛那九处堤口从未崩裂。","","只有每年霜降，织造局的暗船照旧出海。船上的锦，织着帝王才知道的纹。","","你在官衙里批着无关紧要的文书，偶尔抬头，会看见窗外那片桑田——绿得晃眼。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"秋后（表层结局 · 官府定论）","endingDesc":"天下最省事的答案，由你亲手写进了文告。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_flip","title":"结局 · 翻棋","type":"ending","lines":["你没有写密奏。密奏是递到深渊手里的——你写的是题本，登闻鼓能敲得响的那种。","","题本只办一件事：掌印太监崔福全，私造无备案御用官印、放行走私漕船、勾连倭人密信、凿堤灭口寒门主簿。","","人证刘小三，物证空白官印、桑皮纸残页、霜降暗锦的台账。","","通篇不提帝王，不涉私库，不碰那条最深的线——你把深渊小心翼翼地绕了过去，只把深渊门口看门的那条狗，钉在了午门外。","","朝堂不能不办：官印的来历若深究，烧着的是另一层。于是崔福全成了答案。","","弃卒保帅，从来是宫里最熟的刀法——只是这一次，被丢掉的卒，换成了他们自己人。","","周书年开释，以「失察之罪」除名，发往边远州县，改换名姓，终身不得复入仕途。","","行刑那日的刑台空着，围观的人群散了个干净。","","刘小三替你把登闻鼓的槌递到手上时，笑得很亮：「小人无靠山——所以小人什么都不怕。大人，鼓槌给您，小人去牢里接人。」","","出城那日天晴。周书年只带了一个包袱，包袱里是半张桑皮纸。","","他在官道口朝你长揖到底，没说话。","","你在私记里写：深渊还在，望深渊的人还在。但自今夜起，这盘棋里，少了一颗替死的棋子。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"翻棋（隐藏结局 · 救人一线）","endingDesc":"不掀桌、不密奏，只在悬崖边上，把一个赴死的人拉了回来。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_surface_bad","title":"结局 · 卷宗里的雨","type":"ending","lines":["你呈上的线索杂乱失据——被「阴雨毁堤」的官腔带着走，被刻意揽罪的供词绕了路。","","最终定谳，与官府文告一字不差：小吏贪墨，天灾诱发，斩立决。朝野称快，卷宗归档。","","你离任南返那日，路过新安江。","","残堤重修了，新土夯实。石料——你特意看了一眼采买清单，依旧没有入库签收。","","江水浑浊东去。你忽然想起牛二那把一捏就碎的黑土，想起阿桃说「我们踩着长大的堤，我们认得出」。","","他们也认出了。认出了，又能如何呢。","","你在堤下站了很久。江水拍着新堤，声音闷闷的。","","雨又下起来了。你钻进轿子，放下了帘子。","","帘子放下的那一刻，你忽然想：那匹暗锦，还在卷宗箱底压着。织它的人，也该还在织。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"卷宗里的雨（庸判结局）","endingDesc":"所有人共谋的答案，由你盖了章。","shop":"","duel":"","pick":"","minigame":""}],"viewpoints":[]},{"id":"xie","title":"谢秀才自燃案","subtitle":"永乐十三年 · 大理寺封卷","mode":"case","startScene":"start","W":3410,"H":846,"nodeSvg":"<g class=\"node\" data-id=\"start\" transform=\"translate(40,84)\" opacity=\"1\">\n      <rect width=\"200\" height=\"56\" rx=\"6\" fill=\"#1c1915\" fill-opacity=\"0.8\" stroke=\"#5b8fb8\" stroke-width=\"2.5\" stroke-dasharray=\"5 3\" class=\"node-rect\"/>\n      <text x=\"8\" y=\"18\" font-size=\"14\" fill=\"#5b8fb8\" font-weight=\"700\">□</text>\n      <text x=\"27\" y=\"17\" font-size=\"13.5\" fill=\"#e8d9b0\" style=\"paint-order:stroke;stroke:#0e0c0a;stroke-width:3.5px\">卷宗入库</text>\n      \n      <text x=\"8\" y=\"44\" font-size=\"10\" fill=\"#9a8f7d\">场景</text>\n    </g><g class=\"node\" data-id=\"origin\" transform=\"translate(280,84)\" opacity=\"1\">\n      <rect width=\"200\" height=\"56\" rx=\"6\" fill=\"#1c1915\" fill-opacity=\"0.8\" stroke=\"#5b8fb8\" stroke-width=\"1.5\"  class=\"node-rect\"/ 又猛，来不及施救。他说这话时，手还在抖。","","酒摊老板赵听风胆小避责：只当酒酣昏睡，转眼衣衫自行起火。他说完便低头擦碗，碗沿被他擦得发亮。","","市井闲人李七水油滑喊冤：当日与人赌戏，从未靠近酒摊。西洋客商安德烈性情刚烈：当日驻守河滩修船，未曾入城——且早年谢家兄弟曾救他于官司。","","最刺眼的，是死者兄长谢祯的口供——淡漠寡疏：「生死有命。只求认领尸身，入土为安。其余一概不知。」","","手足之死，淡漠如斯。","","你合上口供。四张嘴，各说各的——只有一个人的手在抖，一个人的碗沿擦得发亮。","","传令：封锁现场，复勘。"],"desc":"","choices":[],"next":"market_gate","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"market_gate","title":"县前街 · 夜","type":"scene","lines":["公堂的烛火烧到二更。复勘明日一早开始——今夜，县前街的夜摊还亮着。","","货郎的担子、书坊的尾灯、酒摊收摊前最后一壶。你摸了摸袖中的驿银。","","街角的灯油铺子还开着门，油缸排成一排。卖灯油的老汉说，最近灯油卖得格外好——天热，夜里点灯的人多了。","","书坊的尾灯下，掌柜还在抄书。抄的是前朝的诗集，笔尖沙沙的。","","巷口有人影一闪，等你再看，只剩一盏晃动的灯。","","你站在街口，夜风里裹着油腥气。","","今夜的路，在你脚下摊开。明日复勘前的最后一夜，县前街还亮着几处灯。"],"desc":"","choices":[{"text":"【夜市】采买一应查案之物。","hint":"市集","next":"market","cond":"{\"notFlag\":\"done_market\"}","effects":"旗标:done_market"},{"text":"【书坊尾灯】掌柜的正在抄书——「大人要什么孤本？」","hint":"剧情商人 · 孤本货栈","next":"bookshop","cond":"{\"notFlag\":\"done_book\"}","effects":"旗标:done_book"},{"text":"【书坊棋枰】尾灯下，有位老者摆了盘残局——「应三手，彩头三十两。」","hint":"棋局残局 · 赢得彩头（败不可再战）","next":"xie_weigi","cond":"{\"notFlag\":\"done_weigi\"}","effects":"旗标:done_weigi"},{"text":"◆ 回驿馆。明日复勘。","hint":"","next":"search_gate","cond":"","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"xie_weigi","title":"书坊 · 残局","type":"minigame","lines":["书坊尾灯下，老者不抬头，只把黑子罐往你面前推了推。","","「三手。应住了，银子拿走；应岔了，茶钱留下。」","","棋盘上一条大龙纠缠未活。黑白绞成一团，断点藏在腹地。","","老者垂着眼，像是在看棋，又像是在看棋枰之外的东西。","","灯花爆了一下。他忽然说：「谢秀才那晚，也是在这灯下坐了一夜——他看的书，可不在这架子上。」","","你落子之前，把这句话记下了。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":"gobang → 胜:xie_wg_win / 败:xie_wg_lose"},{"id":"xie_wg_win","title":"彩头","type":"scene","lines":["三手毕，满盘黑白分明。老者盯着棋枰看了很久，把三十两彩头推了过来：","","「大人这一手『倒扑』——断案，也是这个路数。」","","他把银子推过来，指尖在银子上点了点：「谢秀才那晚，也是在这灯下坐了一夜——他看的书，可不在这架子上。」","","「他说，他那盏灯，点了一夜没熄。」","","你没接银子。你伸手，把棋盘上那枚「倒扑」的黑子，拈起来看了看。"],"desc":"","choices":[],"next":"market_gate","next2":"","effects":"银+30；shengyuan+2","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"xie_wg_lose","title":"茶钱","type":"scene","lines":["他拂乱棋子：「棋差一着。茶钱留下，改日再来。」","","你放下茶钱，起身。","","临出门，老者忽然补了一句：「大人，谢秀才那晚，也是在这灯下坐了一夜。」","","「他看的书，可不在这架子上。」","","门在你身后合拢。书坊的尾灯，还在烧着。"],"desc":"","choices":[],"next":"market_gate","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"market","title":"县前夜市","type":"shop","lines":["县前夜市，县城唯一的夜市。","","卖灯油的多，卖纸扎的也多——最近生意格外好。油缸、纸钱、白烛，摆满半条街。","","摊主们看见你的官袍，有的点头哈腰，有的低头拨算盘。","","消息和胆子，都论斤卖。","","「大人，」一个卖灯的压低声，「那白衣书生烧起来那天，火是从里往外烧的——火苗是蓝的。灯油烧起来，才是蓝的。」","","他说完便走，没等你问第二句。","","灯油。蓝火。你把这个词，记进了心里。"],"desc":"县城唯一的夜市。卖灯油的多，卖纸扎的也多——最近生意格外好。","choices":[],"next":"","next2":"market_gate","effects":"","ending":"","endingDesc":"","shop":"县前夜市 · 卡包1","duel":"","pick":"","minigame":""},{"id":"bookshop","title":"书坊 · 尾灯","type":"shop","lines":["书坊掌柜抄书抄到三更，见你进来，搁笔拱手。","","听闻你在查「自燃」的案子，他从柜底摸出一个小匣：「大人，有三样东西，是小店收旧书时夹带的。您挑得中，随意给价；挑不中，就当小老儿没拿出来过。」","","匣子打开，一股陈年墨香混着纸霉味。","","他低声说：「纸比人活得长。大人——纸上的事，也活得长。」","","他抄书的笔还搁在案上，墨迹未干。那是一首旧诗，字迹工整，像是抄了很多遍。","","「大人，」他忽然说，「谢秀才生前，常来小老儿这里抄书。他抄的，都是解学士的诗。」"],"desc":"","choices":[],"next":"","next2":"market_gate","effects":"","ending":"","endingDesc":"","shop":"书坊孤本柜 · 卡包1","duel":"","pick":"","minigame":""},{"id":"search_gate","title":"封条之下","type":"scene","lines":["翌日清晨，你带着文书来到酒摊旧址。","","县衙的封条撕开时，卷起的灰尘在晨光里飞。灰尘落在你的官袍上，细细一层。","","焦黑的窗框、发黑的血迹、库房里那枚被孩童上缴的镜片——你让文书一样一样呈上来。","","酒摊老板赵听风缩在街角，远远看着，不敢过来。","","阳光正好。你站在酒摊中央，环顾四周。","","窗边的空位，正午的日光垂直而落，在地上投下一道干净的影子。","","「大人，」文书低声问，「从哪儿开始？」","","你蹲下来，指尖拂过那道焦痕：「从火开始。」"],"desc":"","choices":[],"next":"search","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"search","title":"现场复勘 · 十二物证","type":"scene","lines":["大理寺重新封锁现场。本次物证全数公开、毫无隐匿——刑部专员全程旁观存档。这恰恰最不对劲：一场市井命案，何须刑部盯防？","","桌面碎裂的酒罐与干燥结块的残液；由外向内、非贴身火源的灼烧痕迹；窗边平整干净、正午日光垂直而落的空位；孩童上缴的西洋凸面镜片……","","高墙外半枚鞋纹细密的小脚印；死者袖口近似蜡脂的油脂；墙头残留的白衣丝缕、镜片边缘附着的墙面褐土；后堂度数极高的烈酒……","","证物库房的白磷粉末入库后凭空遗失；都头雷如的账目莫名暴富。十二处物证，一一钉上卷宗。","","那枚镜片在你掌心沉甸甸的。正午的太阳穿过它，能在纸上烧出一个焦黑的洞——也能在「天降神火」的谎话上，烧出同样的洞。","","残液沿桌缝走了一线，在一道焦痕前停住。你俯身——火不是从火种醒来的，是从一盏没点完的灯里醒来的。","","你抬头，看那道正午落下的日光。日光穿过窗格，落在地上，像一条笔直的线。","","线的那头，正好是那个「空位」。"],"desc":"","choices":[],"next":"search_pick","next2":"","effects":"线索:v1；线索:v2；线索:v3；线索:v4；线索:v5；线索:v6；线索:v7；线索:v8；线索:v9；线索:v10；线索:v11；得卡:i_jing；得卡:x_dengyou","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"search_pick","title":"案头 · 文书的提点","type":"pick","lines":["复勘收尾，随行文书收拾物证箱，忽然压低声音：","","「大人，有三样东西按律要入官库。但……您先挑一样带在身上。查案的人，手里总得有东西。」","","他摊开一方布帕：一盏旧油灯，一册旧诗稿，一封三十两的驿银。","","「都是顺手之物，不入正册。」他说，「大人带了哪样，哪样就替大人记着这个案子。」","","夜风从门口灌进来，吹得布帕一角微微掀动。","","你伸手。指尖先触到的，是那盏旧油灯——灯身还残留着一点灯油的痕迹。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"i_la、i_shigao、s_yin30b","minigame":""},{"id":"verdict","title":"三日限期 · 结案陈词","type":"scene","lines":["三日时限将尽。刑部专员就坐在偏房，等你的卷宗。","","十二处物证，真伪交织——有能拼出「人为聚光行凶」的铁链，也有引人走向「天灾自殒」的岔路。","","你面前摊开卷宗，笔已蘸墨。","","那枚镜片、那道日光、那缕墙头的白衣丝缕——和那份不该出现在证物库的白磷。","","窗外，锦衣卫的缇骑，在街角站了一整天。","","你拣选五条，落笔定谳。","","这份卷宗，将决定此案是「人为命案」，还是「天道异象」。","","笔尖悬在纸上。一滴墨，迟迟不肯落。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_surface","title":"结局 · 表层铁案","type":"scene","lines":["你以凸面镜片、灼烧痕迹、墙头脚印、贿银账目、粉末失窃五证定谳：人为布局、聚光杀人、官吏受贿毁证。","","刑部专员逐页核查，认可逻辑缜密、证链完整。市井妖言溃散，朝堂流言平息。在人前，这是一场无可挑剔的良吏断案。","","结案当夜，残云吞月。你独自坐在公堂，望着卷宗封印上那方朱红大印，久久没有起身。","","所有巧合规整得近乎刻意，所有破绽隐匿得滴水不漏。白日公堂之上，受制于官身规矩，诸多揣测不可言、不可查。","","唯有入夜褪去官服，方可私下沉访——探寻卷宗封存、权谋掩盖的终极真相。","","你把那盏旧油灯，从袖中取出来，放在案头。","","灯还点得亮。火苗在夜风里晃了晃，没有灭。"],"desc":"","choices":[],"next":"night_intro","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_lose","title":"结局 · 妖言定谳","type":"ending","lines":["你呈上的线索零散失据——或被尸身无痕带入「天罚自殒」的歧途，或被后堂烈酒引向市井仇杀的死胡同。","","整桩诡案，最终以「书生醉酒自焚、天道降罚」的定论草草收场。妖言平息了，却是以确认妖言的方式。","","市井百姓焚香拜火神，锦衣卫缇骑照旧穿行街巷。那枚凸面镜片静静躺在证物库里，落了灰。","","无人再提起那个白衣书生临窗吟的诗。无人敢问，他凭吊的「亡父」，究竟是谁。","","只有卖灯油的老汉，在深夜里把那盏油灯的火苗，拨得亮了一些。","","灯油是蓝的。他看了很久，又把灯吹熄了。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"妖言定谳（庸判结局）","endingDesc":"以妖言止妖言——这正是某些人想要的结果。","shop":"","duel":"","pick":"","minigame":""},{"id":"night_intro","title":"夜访 · 土墙檐下","type":"pick","lines":["你褪去制式官袍，换上素色布衣，孤身潜行于幽暗巷陌。夜色可掩官身，却难掩心底沉甸甸的疑虑。","","酒摊后侧老旧土墙檐下，一盏孤灯悬于木柱，灯油将尽。年迈织妇数十年如一日独坐檐下织布，昼夜不辍——","","她僻处市井边角，无利益纠葛、无朝堂牵绊，静默看遍街巷人事，是整条街巷最沉默通透的旁观者。","","灯油快尽了。织妇没有抬头，梭子在她手里来回，像两条游鱼。","","你站在檐下阴影里，隔着那盏灯看她。","","出门前，你理了理袖中的东西——今夜能带进这条巷子的，只有那几样。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"i_wenjiu、x_wei_yin、s_yin10c","minigame":""},{"id":"night_duel","title":"檐下","type":"duel","lines":["你缓步驻足，轻声问询：「老妇人常年守居此处。上月十二日正午，可曾望见酒摊周遭，有何异样人事？」","","织妇翻飞的指尖骤然凝滞，清脆的梭织声戛然而止。摇曳灯火将她苍老的面容映得半明半暗——她眼底沉淀着说不清的忌惮。","","梭子悬在半空，没有落下。","","灯油在风里晃，把两个人的影子投在土墙上，一长一短。","","你听见自己的心跳。她也听见了。","","「老朽……」她终于开口，声音像砂纸磨过，「老朽眼花，什么都没看见。」","","梭子又动了。比方才快。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_zhifu","pick":"","minigame":""},{"id":"night_win","title":"夜访 · 墙头人影","type":"scene","lines":["你的话绕开了案子，只谈天光、街巷、故人。织妇紧绷的肩，一点一点松了下来。","","临别时，她把手里那枚磨得发亮的木梭塞进你袖中：「大人，替那条街的人，多问一句。」","","「那日日头毒辣，整条街巷空无一人。老朽躲在檐下避热织布——恍惚望见高墙之上，立着一道素衣人影。」","","「那人在墙头伫立良久，俯身朝向酒摊方向，手部反复微动，似在安置何物。待天光炽盛至极，便纵身跃下，步履仓促，隐入巷陌暗影。」","","寥寥数句市井闲谈，无确凿证词、无实物佐证——却如惊雷破夜，击碎了你所有的自我宽慰。","","木梭在你袖中，还带着她掌心的温度。","","你连夜折返大理寺，重启已盖章归档的案卷，交叉比对——终极真相，就此撕开了一角。"],"desc":"","choices":[],"next":"final_truth","next2":"","effects":"线索:v12；得卡:i_suo；minxin+5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"night_lose","title":"夜访 · 沉默的梭子","type":"scene","lines":["话没能递进去。织妇垂眸紧盯往复穿梭的梭子，任你如何试探，只反复念着：「老朽眼花，什么都没看见。」","","灯油燃尽了。她在黑暗里继续织布，梭声不疾不徐，像是要把这条街巷所有的秘密，都织回布纹里去。","","你在原地站了很久。","","月光从檐角漏下来，落在她织了一半的布上。布纹细密，针脚整整齐齐——像一道墙。","","你最终转身离去。终极真相的那道门，在你面前合上了。","","走出巷口时，你回头。那盏灯已经熄了，只有梭声，还在黑暗里响着。"],"desc":"","choices":[],"next":"final_door","next2":"","effects":"minxin-5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"final_truth","title":"终极真相 · 借天杀人","type":"scene","lines":["此案根源，根植于永乐朝堂的一场惊天清算。前朝大儒解缙，曾辅政帝王、主修大典，后因言语忤逆、触怒圣颜，身陷囹圄、家族倾覆。","","解缙幼子为避皇权屠戮，连夜隐去本姓，改「解」为「谢」，随族人辗转归乡，蛰伏吉水市井——正是那个临窗独酌、酒后悼父的白衣书生，谢亮。","","每至酒酣耳热，他便难掩心绪，临街吟诗、凭吊亡父，字句之间暗藏怨怼。锦衣卫缇骑侦缉无孔不入，这些细碎私语，层层传至御前。","","朱棣深知：再度公开清算遗孤，只会落下「苛待文士、屠戮遗臣」的朝野非议。但帝王猜忌入骨，绝不允许罪臣子嗣留存世间。","","遂降密令，交由锦衣卫隐秘处置——不留痕迹。缇骑深谙圣心：摸清谢亮盛夏正午必至酒摊临窗独饮的习性，暗中购入西洋凸面镜片，深夜登墙布设、校准日光落点，辅以宫廷白磷——","","借正午天光，行缇骑杀令。一场缜密的朝堂秘杀，被伪装成无解的民间诡案。","","卷宗就摊在你的案头，墨迹未干。窗外，锦衣卫的暗探还没有走。","","你掌心的那枚镜片，还带着午后的温度。"],"desc":"","choices":[{"text":"【袖藏镜片 · 密奏直呈】以凸面镜片为证，附密奏直递御前——哪怕石沉大海，也要留下一笔。","hint":"需要：凸面镜片 · 民心≥55 · 史笔如铁，圣眷难保","next":"end_historian","cond":"{\"card\":\"i_jing\",\"statAtLeast\":{\"minxin\":55}}","effects":"旗标:truth_written；shengyuan-30,minxin+20"},{"text":"【誊抄藏梁】誊抄一份藏于祖宅房梁，正卷维持表层铁案。","hint":"藏之名山 · 传之后世","next":"end_beam","cond":"","effects":"旗标:truth_hidden；minxin+10"},{"text":"【烧掉夜访记录】有些真相，埋着比挖出来能让更多人活。","hint":"随波逐流 · 或曰顾全大局","next":"end_ash","cond":"","effects":"旗标:truth_burned；shengyuan+15,minxin-10"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"final_door","title":"卷宗之外","type":"scene","lines":["夜访无果，终极真相的门已合上。你只能抱着那册「人为命案」的表层铁案，走出公堂。","","同样是面对未竟的疑点——你还可以做最后一个决定。","","卷宗摊在案上，火漆已经化开，等你落印。","","窗外，缇骑的脚步声，从街角传来，又远去。","","你握着那枚官印，指尖摩挲着印面。","","这方印落下去，是合上一扇门；留一道缝，是给后来的人。","","灯芯烧到底，爆了一下。"],"desc":"","choices":[{"text":"在卷宗末页留下批注：「此案证链有隙，留待后勘。」","hint":"为后人留一道门缝","next":"end_note","cond":"","effects":"旗标:note_left；shengyuan-5,minxin+10"},{"text":"合上卷宗，封印，归档。三日后，你升了半级。","hint":"官场之道","next":"end_sealed","cond":"","effects":"旗标:sealed；shengyuan+10"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_historian","title":"结局 · 史笔","type":"ending","lines":["密奏呈上去了，镜片随卷封存。如你所料，石沉大海——三日后，刑部以「审案详实」四字嘉奖了你，一字未提问那枚镜片。","","又过月余，你被外放为云南边郡小官。临行前夜，你在灯下把谢亮的诗稿从头抄了一遍——那些「追忆京华、凭吊亡父」的句子，如今终于有了名姓。","","很多年后，仁宗即位，为解缙平反昭雪。翻检旧档时，有史官在永乐十三年大理寺卷宗的夹页里，发现了一纸墨迹斑驳的密奏，和一枚磨得发亮的镜片。","","史官沉吟良久，提笔在《明史 · 解缙传》末尾添了一句：「缙子亮，永乐十三年殒于江西，事具密牍。」","","十二个字。你用一身官袍换来的，是这十二个字。","","云南的雨季很长。每年六月，你都会在灯下，把那枚镜片拿出来擦一擦。","","镜片上映着灯。灯是亮的。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"史笔（隐藏结局 · 直笔）","endingDesc":"真相没能翻案，但史册留下了名姓。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_beam","title":"结局 · 房梁","type":"ending","lines":["正卷维持表层铁案：人为聚光、官吏受贿、律法昭彰。刑部嘉奖，圣上朱批「可」。","","誊抄的那份，你用油纸裹了三层，趁夜藏进了祖宅正梁的榫缝里。","","你不知道谁会找到它，也不知道找到时是什么年月。或许是一场翻修，或许是一次抄家，或许是一百年后某个和你一样的深夜查案人。","","你只确定一件事：纸比人活得长。","","吹灯，睡。明日还要早朝。","","入梦前你忽然想：那盏旧油灯，还亮在案头。","","它比你先睡。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"房梁（隐藏结局 · 藏之名山）","endingDesc":"真相没有沉没，只是在等一个时代。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_ash","title":"结局 · 灰烬","type":"ending","lines":["夜访记录在烛火上卷了边，一点一点烧成灰。你看着它，像看很多年前很多来不及烧掉的东西。","","「有些真相，埋着比挖出来能让更多人活。」你对自己说。这句话说第二遍的时候，稍微顺了一些。","","三日后，卷宗归档，刑部嘉奖。你升了半级，圣眷正隆。","","只是每年六月，路过吉水县那条街时，你总会绕开那个酒摊的旧址。那里如今开了一家伞铺，老板娘不知旧事，只觉得这位过路的大人，每逢阴雨天都会在她檐下站一会儿。","","「大人，进来避避雨？」","","「不必了。」你说，「我看看就走。」","","伞铺的屋檐下，挂着一盏旧灯。雨大的时候，灯影晃得厉害。","","你看了很久，终究没有伸手去拨它。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"灰烬（权宜结局）","endingDesc":"你烧掉的不是一页纸，是自己心里的一盏灯。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_note","title":"结局 · 门缝","type":"ending","lines":["「此案证链有隙，留待后勘。」——十个字，写在卷宗末页的空白处，落了你的官印。","","上官核卷时看见了，眉头一皱，终究没说什么。毕竟人是你抓的，案是你破的——你想留一句话，没人拦得住。","","这道门缝，这一朝未必有人来推。但卷宗不烂，字就不灭。","","你收拾官印时想：查案之人能做的，从来不止是把真相挖出来——","","还可以是，别把路堵死。","","多年后，有个年轻的书吏在归档时翻到这册卷宗，读到末页那十个字，愣了许久。","","他把那十个字，抄在了自己的案头。","","后来他破了一桩悬了十年的旧案。有人问起，他说：是从一扇门缝里，看见的光。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"门缝（余韵结局）","endingDesc":"真相未竟，但你为后来者留了一线光。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_sealed","title":"结局 · 封印","type":"ending","lines":["合上卷宗，封印，归档。火漆落下的那一瞬，你听见很轻的一声响——像一扇门，关上了。","","三日后，你升了半级。同僚道贺，你也举杯，也笑。","","只是那年秋闱，你路过贡院，看见一个白衣士子临窗独酌，心里莫名一紧——","","走近了才看清，那人不是他。这世上白衣士子千千万，临窗独酌的、酒后吟诗的、心里揣着不肯说的父名的——","","从来不止一个。","","那天夜里，你翻出那盏旧油灯，想点，又放下。","","灯油还满着。你最终没有点它。","","后来那盏灯，一直摆在案头。再后来，你忘了它是从哪来的。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"封印（顺宦结局）","endingDesc":"官越做越大，能记起的越来越少。","shop":"","duel":"","pick":"","minigame":""}],"viewpoints":[]},{"id":"qinhuai","title":"秦淮河堤秘亡案","subtitle":"弘治十五年 · 大理寺密卷","mode":"case","startScene":"start","W":1730,"H":1166,"nodeSvg":"<g class=\"node\" data-id=\"start\" transform=\"translate(40,84)\" opacity=\"1\">\n      <rect width=\"200\" height=\"56\" rx=\"6\" fill=\"#1c1915\" fill-opacity=\"0.8\" stroke=\"#5b8fb8\" stroke-width=\"2.5\" stroke-dasharray=\"5 3\" class=\"node-rect\"/>\n      <text x=\"8\" y=\"18\" font-size=\"14\" fill=\"#5b8fb8\" font-weight=\"700\">□</text>\n      <text x=\"27\" y=\"17\" font-size=\"13.5\" fill=\"#e8d9b0\" style=\"paint-order:stroke;stroke:#0e0c0a;stroke-width:3.5px\">密卷启封</text>\n      \n      <text x=\"8\" y=\"44\" font-size=\"10\" fill=\"#9a8f7d\">场景</text>\n    </g><g class=\"node\" data-id=\"market_gate\" transform=\"translate(280,84)\" opacity=\"1\">\n        <rect width=\"200\" height=\"144\" rx=\"6\" fill=\"#14110e\" fill-opacity=\"0.85\" stroke=\"#5b8fb8\" stroke-width=\"1.5\"  class=\"node-rect\"/>\n        <text x=\"10\" y=\"19\" font-size=\"14\" fill=\"#5b8fb8\" font-weight=\"700\">□</text>\n        <text x=\"30\" y=\"18\" font-size=\"13.5\" fill=\"#e8d9b0\" style=\"paint-order:stroke;stroke:#0e0c0a;stroke-width:3.5px\">金陵 · 开查前</text>\n        <text x=\"30\" y=\"33\" font-size=\"13\" fill=\"#e8d9b0\" style=\"paint-order:stroke;stroke:#0e0c0a;stroke-width:3.5px\">夜</text>\n        <text x=\"10\" y=\"48\" font-size=\"10\" fill=\"#5b8fb8\" font-weight=\"600\"
