pacity=\"0.9\"/><path d=\"M1200,1110 C860,1110 860,121.24000000000001 520,121.24000000000001\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/><path d=\"M1340,124 C930,124 930,124.32 520,124.32\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/><path d=\"M1200,155 C1220,155 1220,206.32 1240,206.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M1200,155 C1220,155 1220,452.32 1240,452.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M1200,155 C1220,155 1220,288.32 1240,288.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M1200,155 C1220,155 1220,370.32 1240,370.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M960,614 C980,614 980,124.32 1000,124.32\" fill=\"none\" stroke=\"#5fa877\" stroke-width=\"1.3\" stroke-dasharray=\"\" opacity=\"0.9\"/><path d=\"M960,614 C980,614 980,894.32 1000,894.32\" fill=\"none\" stroke=\"#c05b4d\" stroke-width=\"1.3\" stroke-dasharray=\"\" opacity=\"0.9\"/>","laneSvg":"<rect x=\"0\" y=\"70\" width=\"1730\" height=\"856\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"85\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">秦淮河堤秘亡案</text><rect x=\"0\" y=\"560\" width=\"1730\" height=\"86\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"575\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">尾声 · ◆ 回公堂结案（至少勘得</text>","nodes":[{"id":"start","title":"密卷启封","type":"scene","lines":["弘治十五年，海内承平，江南财赋甲天下。秦淮河贯通南北漕运，兼护金陵城防，每岁春汛之前，必动内帑巨银修葺河堤。\r","本年河工将竣，堤身规制粗劣、物料虚耗；河道监察裴清臣坚拒不签。继而深夜多人潜入监察官私宅，巷内互殴，次日十数重伤者弃于城郊荒沟。伤者宗族联名叩阍，直诉官长授意行凶。\r","圣谕遣内廷监察太监谷进忠南下巡访、居中调停。四月十三，谷进忠抵金陵，赴秦淮河画舫夜宴。宴罢独乘小舟返泊——次日清晨，舟夫登船，见其端坐气绝。\r","周身无兵刃创口，无勒扼痕迹，无中毒青斑。地方三司勘验无从定谳。\r","河工弊、巷内殴、民讼、内臣猝亡——四事纠缠连成一案。你奉旨启封密卷：限十日，给朝廷一个交代。\r","卷宗就摊在案上：河堤、裴府巷陌、荒沟、画舫小舟。从哪里查起，由你定。\r","案头还压着那艘小舟的勘验录。封条的火漆印，红得发亮，像一滴没干的血。\r","你伸手按了按卷宗。纸是凉的。外头的秦淮河，今夜没有风。\r","窗外有更声敲过一响。你吹熄了灯，却没有躺下——十日，两百四十个时辰。卷宗里的每一行字，都在黑夜里睁着眼。\r"],"desc":"","choices":[],"next":"market_gate","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"market_gate","title":"金陵 · 开查前夜","type":"scene","lines":["十日之限，从明晨开始算。今夜——金陵的灯火才刚点亮。\r","夫子庙的夜市人声鼎沸；秦淮河上，苏十娘的画舫刚换了新灯。\r","你站在官驿二层的窗前。河风把灯影揉碎在水面上，碎成一把金。\r","卷宗里那艘小舟，此刻就泊在渡口，船身落了封条。\r","小舟的艄公姓刘，渡口军卒叫刘舟——同名同姓，卷宗里列在一起，像是有人特意排的。\r","你下楼时，驿丞追出来，递上一只油纸包：「大人，这是苏姑娘差人送来的——说大人查案辛苦，给大人备的宵夜。」\r","油纸包打开，是一碟桂花糕，底下压着一张字条：「秦淮的灯，今夜为大人亮着。」\r","字条上的字，娟秀得过分。你收起油纸包，望向河上那艘画舫——灯火通明，笙歌正起。\r","今夜不去。灯下的金陵，比白日的金陵话多。\r"],"desc":"","choices":[{"text":"【夫子庙夜市】采买查案一应之物。","hint":"市集","next":"market","cond":"{\"notFlag\":\"done_market\"}","effects":"旗标:done_market"},{"text":"【画舫】「大人问案问到奴家的船上，是奴家的体面。」","hint":"剧情商人 · 苏十娘货栈","next":"boat_shop","cond":"{\"notFlag\":\"done_boat\"}","effects":"旗标:done_boat"},{"text":"◆ 灯熄，就寝。明日开查。","hint":"","next":"hub","cond":"","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"market","title":"夫子庙夜市","type":"shop","lines":["夜市的路，灯一盏接一盏。卖糖人的老汉吆喝着，把糖浇成小舟的形状。\r","书肆的老板认得你腰间的官牌，压低了声：「大人查案？河堤那事，坊间都传是『省料』——两头做得像样，中段……中段没人看。」\r","他不说了，只冲你眨眨眼，像在提醒什么。\r","再往深处走，卖米的、卖布的、卖杂耍的，人挨着人。你听见有人在赌坊门口骂了句什么，骰子声隔着半条街传过来，通宵不歇。\r","你在一家旧货摊前停下。摊主翻出一面镜子，镜背的漆磨得发亮：「大人，夜里照路用的——三十文。」\r","你没买。你忽然想起卷宗里那行字：画舫内舱的灯，是上等琉璃。\r","夜市尽头的桥头，一个说书人正在讲前朝故事，讲的是「河神娶妇」。他说得眉飞色舞，底下听的人笑了又笑。\r","只有你听出他最后那句没讲完的话：河要钱，人要命——修的哪是堤，是人心。\r"],"desc":"","choices":[],"next":"","next2":"market_gate","effects":"","ending":"","endingDesc":"","shop":"夫子庙夜市 · 卡包1","duel":"","pick":"","minigame":""},{"id":"boat_shop","title":"画舫 · 夜话货栈","type":"shop","lines":["苏十娘亲自温酒，屏退左右，从舱底捧出一只描金匣子。\r","「大人莫问来路。画舫上三十年，什么客人落下过什么，奴家都替人收着——今日，挑一两样用得上的罢。」\r","匣子最底层，压着一盏琉璃灯。灯影落在水面上，碎成一片金。\r","「夜里的秦淮，就数它照得远。」\r","她笑着把灯推到你面前。灯芯是新的，捻得细细的——像她说话的样子，永远留着一分。\r","你正要收灯，她忽然又开口：「大人若信奴家一句——谷公公那夜，灯是灭着上的船。」\r","「灭着？」\r","「画舫送客，没有不点灯的道理。可那夜他登舟，船头那盏灯，是黑的。」她垂下眼，「奴家记了一辈子。」\r","水声从舱底传上来，一下，一下，像有人在船底敲。\r"],"desc":"","choices":[],"next":"","next2":"market_gate","effects":"","ending":"","endingDesc":"","shop":"苏十娘货栈 · 卡包1","duel":"","pick":"","minigame":""},{"id":"hub","title":"金陵 · 四处案发地","type":"scene","lines":["四份勘验录并排摊开。城南河堤绵延数里，裴府巷陌血痕已洗，城郊荒沟的伤者还在大牢里养伤，秦淮河上那艘小舟，封存在渡口。\r","人证也齐：巡抚卫承霖、参议楼庸、监察裴清臣俱在金陵听勘；游民周莽伤愈收监；画舫主苏十娘、艄公刘舟，随传随到。\r","先查哪里？\r","案头的灯芯烧了一截。窗外的秦淮，正把又一船灯影送进夜色。\r","你翻到勘验录最末一页——谷进忠的随行小太监供称：公公随身有个密奏小本，寸步不离，临行前夜还添了两页。\r","小太监还供了一句：「公公说，金陵的事，比密奏里写的，要深。」\r","你合上卷宗。四份勘验录并排铺着，像四扇门。门后各有一个金陵。\r","哪一个门里，藏着那个要命的\"密奏\"两个字——得亲自推开才知道。\r"],"desc":"","choices":[{"text":"【河堤】勘验堤身与账册","hint":"河工弊案之根","next":"dike","cond":"{\"notFlag\":\"done_dike\"}","effects":"旗标:done_dike"},{"text":"【裴府巷陌】勘验斗殴现场","hint":"官殴民讼之核","next":"alley","cond":"{\"notFlag\":\"done_alley\"}","effects":"旗标:done_alley"},{"text":"【大牢】提审周莽","hint":"买凶的口子（卡牌对局）","next":"zm_intro","cond":"{\"notFlag\":\"done_zm\"}","effects":"旗标:done_zm"},{"text":"【秦淮夜宴】夜访苏十娘","hint":"内臣之死的钥匙（卡牌对局）","next":"ss_intro","cond":"{\"notFlag\":\"done_ss\"}","effects":"旗标:done_ss"},{"text":"【河畔酒肆】入席行令——酒过三巡，舌头比口供松。","hint":"宴会行令 · 赢得席间传闻（败可再战）","next":"jiuling_scene","cond":"{\"notFlag\":\"done_jiuling\"}","effects":""},{"text":"◆ 回公堂结案（至少勘得五条线索方可定谳）","hint":"","next":"verdict","cond":"{\"cluesAtLeast\":5}","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"dike","title":"河堤 · 两头与中段","type":"scene","lines":["堤身绵延数里。你从南端走上堤顶：石缝密实，夯层规整，工部青石制式分毫不差。\r","走到中段，你蹲下身，指尖一剥——夯土松散簌簌而落；砖石大小参差，多杂旧碎残料。老河匠陈石跟在你身后，压着嗓子：「老夫一生修堤，没见过这样的——两头精工，中段敷衍。账册上写的上等物料，实则全是碎砖浮土顶替。」\r","再查工时名册：多处人名空缺、工时留白，笔墨新旧不一。书吏跪在堤上直哆嗦：「都是上官吩咐誊改的……小吏只能依命行文……」\r","你眺望中段河堤。阴雨赶工，解释不了「刻意两头精工」——那不是偷懒的形状，是算计的形状：验收官若只看两端，便签了字。\r","堤侧荒滩，废弃劣砖上覆着浮土，似事后仓促掩埋。\r","你捡起一块碎砖。砖缝里嵌着一角纸——账页的一角，墨迹浸水化开，只余一个\"银\"字。\r","陈石凑过来看了一眼，忽然伸手把那块砖掂了掂：「这不是工部的砖。是北边窑口的——那种窑，烧的是军用的料。」\r","他不再说。河风从堤下吹上来，吹得人脊背发凉。\r","你顺着堤脚往回走，数了数：这样的\"中段\"，绵延足有三里。三里烂堤，压在账册上，却是一笔一笔的好料。\r","「省下的银子，去了哪里？」你问。\r","陈石望着河面，答非所问：「往年修堤，堤脚总要埋几块镇水石。今年——一块都没埋。」\r"],"desc":"","choices":[],"next":"hub","next2":"","effects":"线索:m1；线索:m2；线索:m9","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"alley","title":"裴府巷陌 · 打斗的形状","type":"scene","lines":["巷口地面有多人夜半踩踏的凌乱痕迹；院墙低处有攀爬磕碰的凹痕数处；院内空场留有棍棒瘀斗印记——分布规整。\r","「大人明鉴。」裴府管事躬身引路，「来人进退颇有章法，不似寻常市井泼赖。」\r","你翻开裴府防卫器械簿，眉头一皱：器械半近官式，远逾寻常私宅规制。管事垂首：「老爷居官清直，因河堤勘验得罪上官，衙内早有流言——府里不得不防。」\r","地面无大片血迹，无器物碎裂。可荒沟里那十几个重伤者，遍体钝器合围瘀伤，筋骨多有折损——现场无匹配凶器。\r","也就是说：打斗有预演，埋伏有准备，伤者是打完之后被拖去荒沟的。而验伤笔录最刺眼的一行是——伤者受困时辰，早于夜半三更。\r","时序错了。巷内「滋事」是三更，荒沟里的伤，三更之前就在挨了。\r","你把这句话在心里念了一遍。念到第二遍时，你听见巷口的风，吹得院墙上的枯叶沙沙响——像有人站在暗处，替你数着时辰。\r","回身时，管事还弓着腰，脸上挂着那副恭谨的笑。你忽然问他：「府上守卫，那夜是谁当值？」\r","「回大人——」他顿了一下，「当值的，第二日便辞工回原籍了。」\r","「回哪里？」\r","「没说。」他答得滴水不漏，「只说家里有事。」\r","你不再问。走出巷口，你回头看了一眼院墙——墙头那排防夜的铁蒺藜，尖都朝着墙里。防的不是贼，是外面来的人。\r"],"desc":"","choices":[],"next":"alley_pick","next2":"","effects":"线索:m3；线索:m11","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"alley_pick","title":"荒沟 · 老卒的托付","type":"pick","lines":["你从荒沟折返大牢复问。一个断了三根肋骨的老卒挣扎着坐起来，从贴身衣物里摸出个布卷——\r","「大人……小的们是被人骗去的。这三样里，大人挑一样使。使完了……记得给小的们留个活口。」\r","布卷摊开，是半旧的三样。老卒的目光在每一样上都停了停，像在替它们挑一个值得托付的人。\r","狱外的雨，又下起来了。\r","雨点打在窗棂上。老卒把布卷往你这边推了推，手背上的青筋，一根一根地鼓着。\r","他压低了声音，最后补了一句：「大人……那夜领头的人，腰上挂着一块牌子。黑的。上面好像有个字——小人不识字。」\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"i_yinzan、r_zhoumang、s_yin10d","minigame":""},{"id":"zm_intro","title":"大牢 · 灯下的人","type":"duel","lines":["周莽蜷在草席上，肋骨还缠着布。见你进来，他把头埋了下去。\r","「当日有人以重金相邀，只令往裴府巷内略作惊扰，并无伤人之意。」他的供词背得很熟，「邀我之人身居高位，不敢直言名姓。」\r","背熟的供词，就是没说完的供词。牢里灯很暗，他的眼睛更暗——他怕的东西，在牢外。\r","你在他对面坐下。今夜，把话递进去。\r","灯芯爆了一下。周莽的肩膀跟着一颤——他连灯花都怕。\r","你看着那盏灯。灯焰颤了颤，又直了。像一个人，把腰杆重新挺起来，又不敢挺得太直。\r","狱卒送饭来，搁下就走了。周莽盯着那碗饭，忽然说了一句不相干的：「这碗饭，比家里熬的稠。」\r","他扒了一口，又补了一句：「家里——不知道还在不在。」\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_zhoumang","pick":"","minigame":""},{"id":"dzm_win","title":"口供 · 那个名字","type":"scene","lines":["「布政司参议……楼大人府上的幕师。」周莽的声音抖得不成样子，「银子是现银，从他宅里账房手上过的。说好只惊不伤——没说院里会有伏兵等着我们！」\r","「打完之后，又有人连夜把我们拖去荒沟，不许声张。没死成的，是命大。」\r","你记下「现银、账房、楼府」六个字。回衙即查楼庸私宅账簿——账房先生一见大理寺官牌，腿就软了：年内几笔大额现银支出，无明细名目，不经商行流转，账页后半被人撕去。\r","雇凶的银子，走的是楼庸的账。\r","账房先生跪在地上，忽然又磕了个头：「大人……小的多一句嘴。那银子，账上是楼大人的名——可经手递出去的，是卫抚台衙门的人。」\r","他不再说了。窗外的雨，正好敲在檐角上，一下，一下。\r","你合上账簿。账页撕掉的后半截，切口齐整——是拿裁纸刀裁的，不是手撕的。裁纸刀，文官案上才见。\r","走出楼府时，雨已经停了。门房追出来，递上一把伞：「大人，我家大人说——雨大了，路上仔细。」\r","伞是新买的，油纸还没干透。楼庸自己，从头到尾没有露过面。\r"],"desc":"","choices":[],"next":"hub","next2":"","effects":"线索:m12；线索:m4；得卡:i_zhang","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"dzm_lose","title":"口供 · 沉默","type":"scene","lines":["话没递进去。周莽把背熟的供词又背了一遍，然后把自己缩回草席上，像一块石头。\r","「大人杀了小民罢。」他最后说，「说出去，全家都活不成。」\r","你走出大牢。夜风很凉。楼府的账，明日另想法子查。\r","牢门在身后合上。门里传来一声极轻的啜泣——不是周莽的。是墙角另一个关着的，不知谁的。\r","你站在雨里，站了很久。雨落进衣领，凉得人清醒。\r","楼府账房的灯还亮着。你远远望着那盏灯，心想：那本账，明日在不在，就看今夜了。\r"],"desc":"","choices":[],"next":"hub","next2":"","effects":"线索:m12","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ss_intro","title":"秦淮 · 重开一席","type":"duel","lines":["苏十娘的画舫重新点了灯。她亲自温酒，笑得滴水不漏：「大人问案，问到奴家的船上，是奴家的体面。」\r","当夜宴中言谈平和，并无争执——她的供词与侍婢一般无二。唯有一处，她始终绕着走：酒至半席，巡抚与谷公公入内舱屏退左右，密语约半个时辰方出。\r","半个时辰。四个字说得那样轻。\r","你端起酒盏。今夜这一席，只为那半个时辰。\r","画舫的灯影在水里晃。你忽然想起船头那盏琉璃灯——它照得远，也照得见水底。\r","酒过三巡，你随口问：「那夜画舫上，都有谁侍酒？」\r","「老规矩，只留一个。」她答得很快，「奴家亲手侍的。」\r","「那谷公公登舟时，船上点的是什么灯？」\r","她斟酒的手，顿了一顿：「……大人记性真好。是琉璃灯。那夜，画舫上最亮的一盏。」\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_shishang","pick":"","minigame":""},{"id":"dss_win","title":"夜话 · 半个时辰","type":"scene","lines":["三盏酒过，你不再问案，只与她数当夜的灯、当夜的酒、当夜每一个人的脸色。她忽然轻轻叹了口气。\r","「大人既然听得出——奴家便说了。内舱密语，奴家只隔着屏风听见了三个词。」她伸出三根手指，「河堤。银子。还有——『密奏里写了什么』。」\r","「谷公公当时的笑声很冷。他说：『咱家南下之前，只知河工；到了金陵才知，河工之下还有河工。』宴罢登舟时，他脚步很稳——可他在船头站了很久，回头望了一眼画舫。」\r","再查小舟勘验录：船底水痕分两层，小舟当夜两次靠岸，与渡口登记不合；泊岸后，河岸暗处有青衣人远远伫立，良久方去——艄公与渡口军卒两处独立目击，互为印证。\r","舱内淡香非兰麝非汤药，舱面有人擦拭清扫——痕迹可以擦掉，香味擦不掉。\r","而谷进忠随身的密奏小本，整册失踪，只余一角无字残纸。\r","苏十娘起身续酒，袖口掠过桌沿：「那香——是宫里的。」\r","她说完这一句，像是卸下了什么，又像是把自己关得更紧。\r","你放下酒盏。窗外秦淮的水，把一船灯影送进夜色里，无声无息。\r"],"desc":"","choices":[],"next":"boat_pick","next2":"","effects":"线索:m5；线索:m6；线索:m7；线索:m8；线索:m10","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"dss_lose","title":"夜话 · 隔舱之灯","type":"scene","lines":["一席终了，她笑吟吟送你下船：「大人慢走。秦淮的酒，解不了官场的愁。」\r","当夜的事，她一个字也没多给。你站在码头上，看着画舫的灯一盏一盏灭掉。\r","明日，只得从渡口军卒与艄公的口供里，再捞那夜的小舟了。\r","最后一盏灯灭时，你看见舱门口有个影子，站了很久，才退回去。\r","码头的石阶很滑。你低头看，阶沿上有一道新刻的记号——像船号，又像谁画的一个圈。\r"],"desc":"","choices":[],"next":"hub","next2":"","effects":"线索:m5；线索:m6；线索:m10","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"jiuling_scene","title":"河畔酒肆 · 行令","type":"minigame","lines":["酒肆临河，桨声灯影。你被人拉进一席——席间令官击箸：「令出如山，岔令者罚！」\r","桌上的酒盏摆成一线。令官的话音刚落，邻座有人小声接了一句：「听说谷公公那夜，也在这条河上，喝过一盏。」\r","没人接他的话。酒肆的灯，晃了晃。\r","令官又击了一下箸，笑道：「满座宾朋，就数这位大人面生——大人，行令规矩：令出，接令，错一错，罚三杯。」\r","他把酒壶搁在桌上，壶嘴朝着你。壶身擦得锃亮，像随时准备给谁斟满。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":"jiuling → 胜:jl_win / 败:jl_lose"},{"id":"jl_win","title":"席间传闻","type":"scene","lines":["三巡令罢，你拔了头彩。令官亲自斟酒，邻座一个红脸船工凑过来套近乎：「大人好才思！说起令签——小人倒见过一回真的『翻牌』。」\r","他压低声音：「谷公公登舟那夜，河岸暗处立着个青衣人，远远盯着小舟，良久才走。小人当时只当是哪个相好的……如今想想，那身形站得笔直，倒像是当兵的。」\r","「当兵的？京师口音？」你追问。\r","他挠头：「口音……听不出。就是站得直，像根桩子。小的在船上二十年，认腿脚——那种站法，是旗手营练出来的。」\r","「旗手营」三个字一出，满席安静了一瞬。令官咳了一声，把酒壶往自己那边收了收：「夜了，夜了。大人，散席罢。」\r","你把那段话，一个字一个字咽进了卷宗。\r","出酒肆时，红脸船工追出来，压低声音补了一句：「还有——那青衣人手里，攥着个香囊。月光底下，金的。」\r"],"desc":"","choices":[],"next":"hub","next2":"","effects":"线索:m5；shenwang+5；旗标:done_jiuling","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"jl_lose","title":"罚酒三杯","type":"scene","lines":["岔了两回令，满堂哄笑里你连干三杯。再想开口套话，令官已经换了题目，席间众人推杯换盏，再没人看你。\r","你按着席边起身。这一桌人的嘴，今夜是撬不开了——改日再来？令官远远望你一眼，把酒壶往自己那边收了收。\r","走出酒肆，河风扑面。你忽然觉得，那令官收酒壶的动作，像是在替什么人，把话头也一并收了。\r","你回头望了一眼。酒肆的灯还亮着，人影绰绰——没有人追出来。\r"],"desc":"","choices":[],"next":"hub","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"boat_pick","title":"画舫 · 船头的赠礼","type":"pick","lines":["三盏酒尽，苏十娘起身送你下船。船头风凉，她忽然把一样东西塞进你袖里。\r","「大人今夜的话，奴家记下了。这个——也请大人记着收。」\r","船离岸时，她站在灯下，没有再说话。那盏琉璃灯还亮着，照得她半边脸，半边影。\r","你上了岸，摸出那东西——是一只旧荷包，料子是宫里才有的贡缎。\r","荷包口松松的，像是被翻过很多遍。里面空了，只余一股极淡的香。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"i_xiang、r_shishang、s_yin30c","minigame":""},{"id":"verdict","title":"十日限期 · 结案陈词","type":"scene","lines":["十日将尽。你把勘得的所有线索在公堂上铺开——有真钥匙，有串供的假锁。\r","圣谕要的不是真相，是交代。而你呈上去的每一纸，都将变成某些人的坟，或另一些人的梯。\r","你拣选五条，附于卷首。\r","笔尖悬在纸上。窗外秦淮的灯，正一盏一盏地熄——金陵的夜，要醒了。\r","你忽然想起老河匠陈石的话：修的哪是堤，是人心。\r","案头的灯芯，已经烧到最后一截。火苗一跳，一跳，像在等谁开口。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"accuse","title":"定谳 · 指控谁","type":"scene","lines":["线索齐了。最后一个问题，也是最重的一个——\r","这桩四事纠缠的案子，爰书上写谁的名字？\r","案上的灯，是你亲手拨亮的。灯下铺着五条线索：河堤碎砖、时序勘验、楼府现银、半时辰密语、双层水痕。\r","每一条都指向一个方向。而爰书只有一张。\r","你提笔，又放下。笔尖的墨，在纸上洇开一个点——像河堤中段那块碎砖，嵌在堤身上，不起眼，却承着整条河的水。\r"],"desc":"","choices":[{"text":"参议楼庸：侵吞河工银、买凶袭监察宅、灭口内臣。","hint":"账证链最全 · 需圣望≥55 · 但他背后的人会袖手么","next":"end_lou","cond":"{\"statAtLeast\":{\"shenwang\":55}}","effects":"旗标:accuse_lou"},{"text":"巡抚卫承霖：总理河工失察，纵属为恶，一并论死。","hint":"位高者顶罪，朝堂最省事 · 半个真相","next":"end_wei","cond":"","effects":"旗标:accuse_wei"},{"text":"皇城方向：密奏失踪、双重水痕、青衣人——灭口谷进忠的，是宫里来的人。","hint":"隐藏指控 · 需谷公公香囊为凭 · 密奏之线索在握","next":"end_qingyi","cond":"{\"clue\":\"m8\",\"card\":\"i_gongxiang\"}","effects":"旗标:accuse_shadow"},{"text":"封卷。四事皆存疑，不敢妄定爰书，存待复审。","hint":"原作之路 · 密卷缄藏","next":"end_seal","cond":"","effects":"旗标:accuse_seal"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_lou","title":"结局 · 爰书上的名字","type":"ending","lines":["楼庸的案子，三堂会审只审了五天。账簿残页、现银流水、周莽翻供、时序勘验——铁链一头拴着河堤中段的碎砖，一头拴着秦淮小舟的淡香。\r","他认罪那日很平静，只说了一句：「大人好眼力。只是这河里的水，比大人想的深。」\r","卫承霖「失察」降三级，改督他处河工。谷进忠之死，终以「暴疾」定谳——密奏小本失踪一案，卷宗里只留了一行小字：待勘。\r","次年春汛，秦淮河堤中段，重修了。\r","又过三年，你在京里遇见当年渡口的军卒。他已经退役，喝多了，忽然凑过来说：「大人……那夜的青衣人，小的后来想起来——身量好像在哪里见过。」\r","他没说在哪里见过。你也没再问。有些名字，写上去一个，就够很多很多人活了。\r","你回府那夜，把当年那只贡缎荷包翻出来。香早散了，缎子还是软的。\r","你在灯下看了很久。然后把它锁进箱底，再没开过。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"爰书上的名字（完整结局）","endingDesc":"你写下的名字是真的，但你也知道了——它不是全部的真。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_wei","title":"结局 · 总要有人顶罪","type":"ending","lines":["巡抚卫承霖论死。抄家那日，金陵万人空巷。\r","朝堂很满意：封疆大吏以身殉法，江南吏治「为之一清」。圣上朱批嘉勉，你迁刑部侍郎。\r","只有你自己知道爰书里少了什么：楼庸的现银账，谷进忠的密奏小本，两次靠岸的水痕——这些纸你压在了卷宗最底层，一页都没呈。\r","卫承霖赴刑前，只托人带给你一句话：「本官认的不是罪，是命。你押的不是律，是势。」\r","三年后，楼庸致仕还乡，船过秦淮，画舫夜宴如旧。\r","你在京里听说了，什么也没说。那年冬天，你的鬓角全白了。\r","入夜，你独坐书斋。案头那盏灯，还是金陵带回来的那盏——琉璃灯。\r","灯还亮着。只是再没有人，在灯下替你留一句「大人慢走」。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"总要有人顶罪（半真相结局）","endingDesc":"案子结了，官升了，有些东西再也没能直起腰。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_seal","title":"结局 · 密卷缄藏","type":"ending","lines":["「人证各执其词，供语互有参差；物证处处存疑，时序多有相悖。眼下未得确证，不敢妄定爰书。」\r","「暂封卷宗，存待后续复审、再行勘验。」\r","你提笔写下卷末结语，火漆封缄。弘治十五年八月，吉日。\r","没有人因这桩案子而死，也没有人因它而白。荒沟的伤者领了汤药钱回乡；周家父子再没上过金陵；苏十娘的画舫换了新船；河堤中段在次年春汛前，由新任巡抚「例行加固」。\r","只有那册密卷沉在大理寺的架子上，落了一年又一年的灰。\r","很多年后，某个同样失眠的深夜，会有另一个左寺正取下这册卷宗，吹去灰，就着灯，一行一行读下去——\r","然后在这段文字的末尾，看见你留下的最后一句批注：\r","「河工之下，还有河工。」\r","灯花落了一声。那左寺正抬起头，望着窗外——秦淮河的灯，还亮着。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"密卷缄藏（悬案结局）","endingDesc":"你没给出答案，你把问题留给了下一个人。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_qingyi","title":"结局 · 青衣人","type":"ending","lines":["你的爰书没有写给三法司——你写的是密奏，只呈御前。\r","「谷进忠南下之前，只知河工；到了金陵才知，河工之下还有河工。他随身的密奏小本整册失踪，内舱密语问的是「密奏里写了什么」。臣勘得：双重水痕、淡香清扫、青衣伫立——杀谷进忠的，不是楼庸，不是卫承霖，是怕那本密奏到京的人。」\r","十日后，宫里来了人。没有仪仗，没有口谕，只有一个青衣内侍，把那枚「不见下落」的香囊轻轻放回你的公案上。\r","「咱家们查过了。」他的声音很平，「谷公公确实是暴疾。——大人您说呢？」\r","你说是。有些爰书，写了就是办到了；不必有人画押，也不必有人偿命。\r","当年底，内帑拨银三万两，秦淮河堤中段重修，工部派员驻场验收；卫承霖、楼庸各降三级，调离江南；荒沟伤者领了双份汤药钱。次年春汛，水涨过旧痕三尺，新堤纹丝不动。\r","只是那册密卷的卷末，多了两行不相干的字：一行是官笔——「谷进忠，暴疾亡，优恤」；另一行是你深夜添的小字，墨色比旁的深：\r","「青衣犹在，河工犹在。堤是人修的，也是人守的。」\r","青衣内侍走时，在门槛外回头，似笑非笑：「大人留步。河工的事，大人守住了；旁的事——大人守得住，就守着。」\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"青衣人（隐藏结局 · 内廷深水）","endingDesc":"你把爰书写给了皇城。没等到画押，却等到了堤。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_seal_bad","title":"结局 · 卷宗游戏","type":"ending","lines":["你呈上的线索东拼西凑——被「阴雨赶工」的托词带着走，被「年老疾发」的口径哄着转。串供的假锁，恰好严丝合缝地扣进了你画押的爰书。\r","周莽等以盗匪论处，流三千里；裴清臣「苛细坏事」，改调闲职；河工银两「查无实据」，依册核销。\r","圣上朱批：「可。」\r","案子结得又快又漂亮。金陵官场弹冠相庆，只有城南的乡民在堤上多添了几炷香——求来年春汛，水别涨过中段。\r","你后来官运不错。只是每逢江南漕运的邸报送到案头，你都会先看一眼——秦淮河的水位。\r","那年春汛，水涨过中段旧痕三尺。新堤裂了一道口子，又堵上了。\r","邸报上说：江南总督亲赴河堤督修，军民同心，堤无恙。\r","你放下邸报，看着窗外。京城的雨，正下着。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"卷宗游戏（庸判结局）","endingDesc":"串供者最想要的结局，是你亲手递给他们的。","shop":"","duel":"","pick":"","minigame":""}],"viewpoints":[]},{"id":"jieyu","title":"劫与烬","subtitle":"己巳之变 · 北京保卫战","mode":"story","startScene":"start","W":3410,"H":1338,"nodeSvg":"<g class=\"node\" data-id=\"yq_night\" transform=\"translate(40,308)\" opacity=\"1\">\n      <rect width=\"200\" height=\"56\" rx=\"6\" fill=\"#1c1915\" fill-opacity=\"0.8\" stroke=\"#5b8fb8\" stroke-width=\"1.5\"  class=\"node-rect\"/>\n      <text x=\"8\" y=\"18\" font-size=\"14\" fill=\"#5b8fb8\" font-weight=\"700\">□</text>\n      <text x=\"27\" y=\"17\" font-size=\"13.5\" fill=\"#e8d9b0\" style=\"paint-order:stroke;stroke:#0e0c0a;stroke-width:3.5px\">土木堡 · 败报</text>\n      \n      <text x=\"8\" y=\"44\" font-size=\"10\" fill=\"#9a8f7d\">场景</text>\n    </g><g class=\"node\" data-id=\"start\" transform=\"translate(40,84)\" opacity=\"1\">\n        <rect width=\"200\" height=\"118\" rx=\"6\" fill=\"#14110e\" fill-opacity=\"0.85\" stroke=\"#5b8fb8\" stroke-width=\"2.5\" stroke-dasharray=\"5 3\" class=\"node-rect\"/>\n        <text x=\"10\" y=\"19\" font-size=\"14\" fill=\"#5b8fb8\" font-weight=\"700\" ath d=\"M1680,155 C1700,155 1700,370.32 1720,370.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M1680,155 C1700,155 1700,124.32 1720,124.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M1920,288 C1700,288 1700,107.89333333333333 1480,107.89333333333333\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/><path d=\"M1920,206 C1700,206 1700,116.10666666666667 1480,116.10666666666667\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/><path d=\"M1920,370 C1700,370 1700,124.32 1480,124.32\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/>","laneSvg":"<rect x=\"0\" y=\"70\" width=\"3410\" height=\"332\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"85\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">劫与烬</text><rect x=\"0\" y=\"294\" width=\"3410\" height=\"86\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"309\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">视角 · 于谦</text><rect x=\"0\" y=\"70\" width=\"3410\" height=\"516\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"85\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">视角 · 传令兵</text><rect x=\"0\" y=\"294\" width=\"3410\" height=\"618\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"309\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">视角 · 景泰帝</text><rect x=\"0\" y=\"988\" width=\"3410\" height=\"86\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"1003\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">尾声 · 断壁上，还有最后一战</text><rect x=\"0\" y=\"456\" width=\"3410\" height=\"576\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"471\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">尾声 · 需人心≥55</text><rect x=\"0\" y=\"70\" width=\"3410\" height=\"656\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"85\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">尾声 · 决定能否赶上约期</text><rect x=\"0\" y=\"232\" width=\"3410\" height=\"656\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"247\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">尾声 · 赶不上约期</text><rect x=\"0\" y=\"70\" width=\"3410\" height=\"392\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"85\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">尾声 · 信在人在</text>","nodes":[{"id":"yq_night","title":"土木堡 · 败报","type":"scene","lines":["正统十四年八月十七，败报入京。","二十万精锐，土木堡，全军覆没。御驾亲征的陛下，被瓦剌掳了去。","朝堂乱成一锅粥。有人说南迁，有人收拾细软，有人抱着皇陵的方向哭。","我站在丹墀下，看着满地乱象，忽然想起一句话：京师在，天下在。","当夜我调九门兵力，连夜封城。城门落锁的声音，一声接一声，像在为土木堡送葬。","城头的火把亮起来的时候，我对自己说：于谦，你守的不是朱家的江山——是城墙后面的人。","风从城头灌下来。我数着九门的火把，一盏，一盏，像数一注还没断的香。","败报上那行字，我看了三遍——二十万。京师的兵，不满十万。","够不够？不知道。但城门的锁，今夜起，不会再开了。"],"desc":"","choices":[],"next":"start","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"start","title":"第一视角 · 兵部尚书","type":"scene","lines":["辰时，紫禁城。天刚蒙蒙亮，我就已经站在了这城头。","九门巍峨，本是京师繁华的冠冕。可如今每一座城门都成了一道生死防线，像九座沉甸甸的山，砸在我的心头。","城墙上，士兵们佝偻着脊背搬运滚石，有人手臂缠着渗血的布条，仍咬牙托举着比自身还重的擂木。新熔铸的火炮带着铜屑的腥气，炮口直指城外。","心里那本账，我昨夜算到三更：河南备操军、山东备倭军，最快七日抵达。七日，够不够？我一遍遍问自己，一遍遍得到同一个答案——不够。可城墙就在脚下，城墙后面是几十万百姓。够不够，都得够。","而我最忌惮的，是土木堡失守时被掳走的那些火器——神机营的佛郎机、宣德式火铳。那是大明最锋利的爪牙。如今，爪牙换了主人。","「大人，瓦剌军动了！」参将的嘶吼刺破晨雾，「黑纛在前，数万骑——大人，倾巢而出了！」","我抬眼望去，也先的黑纛在风中狂舞，马蹄声震得城墙微微颤动，弯刀的寒光在沙尘里明灭。掌心的汗瞬间浸透剑柄。","倾巢而出。我在心里默念这四个字。土木堡一场大败，把大明二十年的家底赔了个干净，也先自然觉得京师唾手可得。他不知道的是——我站在这城头，等的就是他倾巢而出。","「神机营就位！」我厉声下令，「三段射击，不得有误！告诉弟兄们：打光最后一发火铳之前，不许让一架云梯搭上这面墙！」","民房后埋伏的神机营早已蓄势，士兵们分三排列队。第一排火铳喷吐烈焰，第二排紧接着补射，第三排飞速装弹——枪声连绵，无半分停歇。","我死死盯着城下，心提到了嗓子眼。这是大明最后的依仗。","城头的人潮里，我认出一个背影——陈四，当年太原城防营的兵，如今也来守城了。他扛着擂木从我面前跑过去，没看见我。","我没喊他。守城的人，认得越少越好。","晨雾里，我听见有人唱了一句家乡的调子，被炮声吞了。城头的人，谁也没有回头。"],"desc":"","choices":[{"text":"「火炮对准瓦剌炮队！」——先敲掉那批改了主人的旧炮。","hint":"针锋相对 · 弹药消耗极大","next":"p1_intro","cond":"","effects":"旗标:duel_pao"},{"text":"「火炮对准骑兵集群！」——骑兵才是破城的刀。","hint":"稳守 · 但城墙要挨炮","next":"p1_intro","cond":"","effects":"旗标:duel_qi"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p1_intro","title":"九门血线","type":"duel","lines":["炮声撕裂了晨雾——不是我们的。最坏的猜想成了现实：瓦剌竟真的会用缴获的佛郎机了。土木堡丢的那批火器，如今调转了炮口，对着旧主。","数枚炮弹砸向德胜门城墙，砖石飞溅，搬运擂木的士兵瞬间被埋在废墟下——尘土里伸出一只手，扒开碎石，又爬了起来。","「大人！城墙裂了！」有人在喊。","「裂了就裂了！」我盯着城下，「人还在，墙就还在！堵上！」","士兵们应声扑上去，用身体、用滚石、用一切能堵的东西去填那道裂缝。骑兵分路冲击安定门、西直门，寻找破绽。","每一发炮弹都需用在刀刃上。弹药耗一分，胜算就减一分。我攥着令旗，指节发白——土木堡的教训，我们赔不起第二回。","我挥令旗的手微微发颤——不是害怕，是焦急。","炮声里，我看见陈四在德胜门垛口，正往火器里装药。他抬头抹了一把脸上的灰，冲我这边咧嘴笑了笑。","那一瞬间，我忽然认出他腰上那截红绳——八年前太原城楼，他递给我那半壶酒的时候，腰上也系着这么一截。","我别开眼，把令旗压下去。现在是打仗的时候，不是叙旧的时候。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_defense","pick":"","minigame":""},{"id":"p1_win","title":"守住了一日","type":"scene","lines":["当夕阳的最后一丝余晖被城头吞没时，九门胶着的战事终究如潮水般褪去。德胜门的火炮热得烫手，神机营弹药所剩无几，士兵们靠着城垛喘息，嘴角挂着血迹。","我靠着城垛缓缓坐下，望着天边残阳如血，心中一遍遍默念：撑住，再撑住。只要熬过这七日，大明就有救。","城楼下，一个十二岁的孩童抱着弹弓跑过——他用弹弓打伤了一个摸上来的瓦剌兵，此刻怯生生又骄傲地望着我。","「红衣官袍皆是百姓血染，我穿蓝图个干净。」我想起自己说过的这句话，朝他点了点头。","我点头的工夫，余光扫见陈四靠坐在墙根下，手里攥着半个干饼，人已经睡着了。","但真正的硬仗还在后面。当夜，一封急奏送入行辕：勤王军的调令，必须即刻送出——走官道，过敌占区，五日内抵达河北总兵府。","「大人，派谁去？」幕僚低声问。","我看了看帐外那二十名亲兵。送信的人，要快，要稳，还要——活着。","我把密信交给了一个最沉得住气的人。他接信的时候，我忽然问了一句：「家里还有人吗？」","他愣了愣：「有。保定，一个老娘。」","「打完这仗，回去看看她。」我说。","他点了点头，没说话，转身走进了夜色里。他身后站着二十名精锐亲兵。","夜风吹动蜡封的密信。我目送那队人马消失在官道尽头——二十个背影，二十盏将熄未熄的火。"],"desc":"","choices":[],"next":"yq_bridge","next2":"","effects":"junwei+10,renwen+5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p1_lose","title":"血染的城墙","type":"scene","lines":["西南城破了又夺，夺了又破。一日血战，九门三易其手。将士的尸体在瓮城里堆了一层，又一层。","我站在德胜门城头，甲胄上全是别人的血。斥候来报：也先在整顿后军——明日，会是更猛的一轮。","「大人……还守得住么？」年轻的参将声音在抖。","我望着城内。百姓们自发地往城墙下运砖石木料，工匠连夜赶制火器，火星溅在他们疲惫的脸上。","砖石的队伍里，陈四背着两筐土，从我身边挤过去。他背上全是血道子，没停。","「守不住，也得守。」我说，「告诉弟兄们：身后就是他们的家。他们的老娘、婆娘、孩子，都在城墙那边。」","「大人，」年轻的参将忽然又问，「若是援军……来不了呢？」","我没有答他。城墙上的火把明灭，照见每一张疲惫的脸。援军来得了来不了——城，都得守。","当夜，一封急奏送入行辕：勤王军的调令，必须即刻送出——走官道，过敌占区，五日内抵达河北总兵府。","我把密信交给了一个最沉得住气的人。他接信时，我多看了一眼他的背——血道子还没干。","是他。","我张了张嘴，终究什么也没说。","城头的火把，烧完一截，又接上一截。我忽然想，这一夜，不知道有多少人家的灯，还亮着。"],"desc":"","choices":[{"text":"密信不能断——让传令兵即刻出发，京师还在等。","hint":"守城未成，信不能再误","next":"yq_seven","cond":"","effects":""},{"text":"留下。与城同死——京师在，于谦在。","hint":"赴死 · 断壁上，还有最后一战","next":"p1_last","cond":"","effects":""}],"next":"","next2":"","effects":"junwei-10,renwen+10","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_withcity","title":"结局 · 与城同烬","type":"ending","lines":["德胜门的断壁最后一次被冲开时，我没有退。也先的骑兵从缺口涌进来，像洪水漫过堤。","我退回内城，一路收拢残兵。路过城东书坊时，门板大敞，书散了一地——店主一家已不知去向，只有那套《左传》，孤零零躺在门槛上。","我捡起来，拍了拍灰，夹在腋下。","午时，我立于正阳门城楼。身后是百姓，身前是刀兵。我拔剑横在颈间，对亲兵说：「告诉陛下，于谦守住了该守的——只是没守住这一天。」","《明史 · 于谦传》只有一行：己巳之变，谦死之。","可京师的老人说，那一天雪落得极大。城楼下那个用弹弓打过瓦剌兵的孩童，跪在雪里，朝城楼磕了三个头。","有些清白，要用人血来证明。有些清白，用命也证不完。","那套《左传》夹在腋下，硌着肋骨。至死，我也没有把它放下。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"与城同烬（败线结局 · 以身守城）","endingDesc":"第一日便城破。你把自己留在了城里，把清白留在了雪里。","shop":"","duel":"","pick":"","minigame":""},{"id":"p1_last","title":"死战之前","type":"duel","lines":["当夜，我把九门守将都叫到德胜门。没有议事，只有一道军令：明日城破，不退内城——在断壁上打。","参将问：大人，剩下的弹药呢？我说：打光。一粒也不留给瓦剌。","散了之后，我独自回帐，把那件青袍展平，灯花上烧掉了一封写了一半的信——没有要寄的人了。","天没亮，那个打弹弓的孩子又爬上了断壁，往兜里装石子。没有人赶他。守城的人，多一个是一个。","我提剑上墙的时候，东方刚有一线灰白。我对身边人说：记住，今日过后——城在，人在；城破，人破。","断壁上的风很硬。我摸了摸那件青袍——它在灯下烧掉了一角，剩下的一角，还披在我肩上。","青的。干净的。"],"desc":"","choices":[],"next":"","next2":"","effects":"junwei+5","ending":"","endingDesc":"","shop":"","duel":"d_laststand","pick":"","minigame":""},{"id":"end_bancheng","title":"结局 · 半壁","type":"ending","lines":["第六波攻势退下去的时候，断壁上的活人，比死人少——但活人都还站着。","也先的大纛缓缓退过箭程，城上没有人欢呼。有人一屁股坐下去，才发觉自己身上的伤。","第三日，瓦剌烧营北遁。他们占了外城，没占到内城；赢了一场仗，没赢下这条人墙。","我的左臂被飞石打断过筋，此后提不动笔。公文都是书吏代写，只有落款那四个字，我自己写。","后来的史书，写这一战只用了七个字：瓦剌攻京师，不克。没有写墙是怎么守的。","那个打弹弓的孩子活下来了。多年后他来看我，腰间还揣着那只弹弓兜——石子早就打完了，兜还在。","我留他吃了顿饭。他走的时候，在门口站了很久，忽然说：「先生，那面墙，我后来去看过。」","「墙在。」","「人也在。」他说。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"半壁（隐藏结局 · 死战惨胜）","endingDesc":"外城破了，人墙没破。这座京城守住了一半——史书只写了一半。","shop":"","duel":"","pick":"","minigame":""},{"id":"yq_bridge","title":"七日 · 等东风","type":"scene","lines":["密信送出去之后，我能做的只剩一件事——守。","第二日，第三日，第四日。城墙被轰塌了修，修了再轰塌；人倒下去，再换人补上来。我不再数日子，只数今夜城上还剩下几段完好的垛口。","第五日，河北方向没有消息。第六日，还是没有。幕僚不敢问我，我不敢往「万一」那头想。","第七日拂晓，地平线上起了烟尘——不是瓦剌大营的方向。勤王军，到了。","也先烧营北遁。城上的人喊哑了嗓子，我靠着城垛缓缓坐下，才发觉剑柄已被掌心磨得发亮。","那封信，第五日到的河北总兵府。后来我查名册，查到了送信人的名字：陈四，保定人，当兵九年。","战场收殓，是我亲自主持的。尸堆里，一名断了腿的瓦剌兵还有一口气。亲兵把刀递到我手上。","不远处，一名被俘的瓦剌将领看着这一幕，眼睛红了，没有说话。","箭书上绑着瓦剌的话：退兵不难，岁币十万两，送到营前。","幕僚低声劝：「大人，银子买平安——朝廷出得起。」","我没看他。接过那箭书，一寸一寸，从中间撕开。","「十万两，够边军发三年饷。」我撕到一半，抬头，「拿兵士的饷银喂狼，喂饱了，它还来。」","「可城下这几万人……」","「城下这几万人，是来守城的，不是来讨债的。」我把碎纸扬进风里，「要银子，让他们拿命来换。」","那夜碎片进了炮膛。一炮出去，城下骂声四起——可再没有第二封信射进来。","城头的火把明灭。我握着那柄剑，剑柄上，还留着陈四的体温——他接过密信的时候，手心的汗，焐在那里。"],"desc":"","choices":[{"text":"抽刀——又收了回去。「都是爹娘生养。收容，治伤。」","hint":"刀下留人 · 城头一念之仁","next":"yq_calm","cond":"","effects":"旗标:mercy_shown；renwen+15"},{"text":"一刀落下。战场之上，仁慈是奢侈品。","hint":"斩草除根 · 军法不容情","next":"yq_calm","cond":"","effects":"旗标:mercy_slain；junwei+5,renwen-10"}],"next":"","next2":"","effects":"junwei+10,renwen+10","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"yq_seven","title":"第七日 · 东风不来","type":"scene","lines":["密信送出去，第七天了。","第五日，河北方向没有消息。第六日，还是没有。到第七日，城头的人已经不再往地平线那头看了。","朝里的消息比战报更坏：粮秣只够十日；瓦剌开始焚烧城外仓厂；朝会上，徐珵公然言「南迁」，附议者，有了。","折子递到我手上时，我正在城头督修垛口。我看完，把折子叠起来，压在垛口的半块砖底下。","幕僚低声问：大人，朝议那边……怎么办？","我望着城外连绵的营火。墙还能撑，人心不能散——人心一散，墙就只是土。","垛口那半块砖底下，压着折子，也压着我的一句话。","夜风把城外烧仓的烟送过来，呛得人咳嗽。我咳了两声，把折子往砖底又压了压。"],"desc":"","choices":[{"text":"「言南迁者，可斩也！」——我亲自入朝，压下这场议论。城，守到底。","hint":"镇压朝议 · 民心可用 · 需人心≥55","next":"yq_dawn","cond":"{\"statAtLeast\":{\"renwen\":55}}","effects":"junwei+10"},{"text":"南迁的懿旨，已经发了。宫门口，正在装箱。","hint":"天命已去 · 你还有一处要去","next":"end_wumen","cond":"","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"yq_dawn","title":"第八日 · 拂晓","type":"scene","lines":["那日朝堂上，我站在丹墀下，把该说的话都说了。最后太后拍了板：不迁。再有言南迁者——斩。","我回到城头。那一夜，全城没有人睡。","第八日拂晓，地平线上起了烟尘——不是瓦剌大营的方向。勤王军到了。比约的迟了三天，但它来了。","也先烧营北遁。城上的人喊哑了嗓子，我靠着城垛缓缓坐下，才发觉剑柄已被掌心磨得发亮。","后来我查名册，查到了送信人的名字：陈四，保定人，当兵九年。迟了三天——我不问缘由。用命送来的东西，到了，就够了。","战场收殓，是我亲自主持的。尸堆里，一名断了腿的瓦剌兵还有一口气。亲兵把刀递到我手上。","不远处，一名被俘的瓦剌将领看着这一幕，眼睛红了，没有说话。","城头的旗，在风里舒展开来。我看着它，忽然想：这面旗，是那二十个送信的人，用命换回来的。"],"desc":"","choices":[{"text":"抽刀——又收了回去。「都是爹娘生养。收容，治伤。」","hint":"刀下留人 · 城头一念之仁","next":"yq_calm","cond":"","effects":"旗标:mercy_shown；renwen+15"},{"text":"一刀落下。战场之上，仁慈是奢侈品。","hint":"斩草除根 · 军法不容情","next":"yq_calm","cond":"","effects":"旗标:mercy_slain；junwei+5,renwen-10"}],"next":"","next2":"","effects":"junwei+10,renwen+10","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_wumen","title":"结局 · 午门","type":"ending","lines":["南迁的懿旨发下来的那天，百官收拾行装。我逆着人流，去了午门。","我站在门前，只说了一句话：「言南迁者，可斩也。」","人群涌动，推搡之间，我听见有人喊「国贼」，有人喊「忠臣」——然后，一道寒光，从人缝里出来。","刀捅在我腰上的时候，我甚至看清了那只手缩回人群的样子。没有人抓住他。","我靠着门柱坐下去。血在青砖上洇开。有人踩着我的袍角过去，有人绕过我——没有人低头看我一眼。","第二天，城破了。","勤王军开到的时候，接到的是一座已经易帜的京城。那封蜡封密信，后来有人在城外雪地里捡到——墨晕成一团，只依稀辨出四个字：京师，七日。","这四个字，是一道死线。我守在死线这头，守到了第七日——后来史书给我的，只有一行：谦死之。","只有午门的青砖记得，那天早上，有个人逆着人流来过。","血还在洇。青砖缝里，洇进一个字——\"谦\"。一笔一划，都往砖缝里沉。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"午门（败线结局 · 被刺）","endingDesc":"言南迁者，可斩也——说完这句，你倒在了午门前。第二天，城破了。","shop":"","duel":"","pick":"","minigame":""},{"id":"yq_calm","title":"太平年","type":"scene","lines":["仗，打完了。城墙还在——我守的从来不是朱家的江山，是城墙后面活着的人。","此后数年，修城垣、练兵马、安百姓。账册上的欠债都还得上，唯独那些没能回来的名字，还不上。","每年清明，我在城头站一会儿。不看列队，看那些爬上城墙玩的孩子——他们之中，有个还揣着弹弓兜。","景泰八年。年味儿还没散，南宫那把锈蚀的锁底下，已经有人按捺不住了。","我摸了摸腰间。那里空了——那半壶酒，早在太原的城楼上，就喝完了。"],"desc":"","choices":[],"next":"p4_intro","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p2_intro","title":"第二视角 · 传令兵","type":"scene","lines":["接过那封蜡封密信时，京师的炮火声还在天际回荡，沉闷得像打雷。","我叫陈四，保定府人，当兵九年。城头上那个穿绯色官袍、站在最高处的人，是于大人——太原的老巡抚。我们这儿的老兵都记得他，记得那年冬天太原城楼上的半壶酒。","那年冬夜巡城，我把怀里焐着的酒递给他。他说：哪来的？我说：偷的。他喝了一口，笑了笑：那我也偷了。","就为这一口酒，我记了他八年。他教过我的两个字，我也一直没忘：陈四，保定。如今这两个字，一个写在名册上，一个写在梦里。","我当兵九年，从没见过这样的京师——城门紧闭，街巷空了一半，粮铺门口排着长队。一个月前，陛下御驾亲征，带着二十万精锐出了居庸关。回来的只有败报：土木堡，全军覆没，陛下被掳。","瓦剌的骑兵如今就在城下，打着皇旗，让守城的开门。城门开一次，就再也关不上了。","于大人把我叫到跟前，只说了两句话：「京师能打的兵，不满十万。河南的备操军、山东的备倭军，五天能到——这封信，五天内必须送到河北总兵府。」","他挑了我。他说：小四，你跑得快，也沉得住气。打完这仗，回保定，把地赎回来。","这句话，他说得和八年前城楼上的那半壶酒一样轻。","我把密信塞进贴身甲胄，反手抽出佩刀，对身后二十名精锐亲兵沉声道：「事态紧急，星夜驰援河北。遇敌只突围，不恋战！」","身后是摇摇欲坠的都城，怀中是大明的生机。每一秒耽搁，都可能城破人亡。","沿途荒无人烟，村落十室九空，田地里的庄稼被马蹄踏平，偶见散落的盔甲碎片与干涸的血迹——都是土木堡败兵留下来的。","腹中空空，只靠腰间干硬的饼子充饥。冷水下肚，刺骨，却能提神。","出京师三十里，第一道隘口夹在两山之间。身后二十骑，蹄声如鼓。","我把手按在胸口，密信硌着心口，一下，一下，像在替谁敲鼓。"],"desc":"","choices":[],"next":"p2_leg1","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p2_leg1","title":"隘口 · 第一程","type":"scene","lines":["马队刚进谷口，两侧林梢动了——没有喊声，先到的是箭。","「中伏！突围！」我勒转马头，余光里看见有人栽下马背，滚进草丛，再没有起来。","第一轮箭雨落下来，二十骑的本能是一致的：勒马，低头，夹紧马腹。","谷口的风，把箭鸣声送得很远。我听见身后有人闷哼一声，接着是重物坠地的闷响。","一程还没走完，命已经折了一半的念头，我不敢想。想了，腿就软了。"],"desc":"","choices":[{"text":"强行冲关——一鼓作气撞出去。","hint":"快 · 血换时间","next":"p2_r1a","cond":"","effects":""},{"text":"勒马退进山涧，绕行。","hint":"慢 · 少折人命","next":"p2_r1b","cond":"","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p2_r1a","title":"隘口 · 冲出来了","type":"scene","lines":["马队硬撞出去。箭从耳边嗖嗖过，打在甲上叮当作响。","出了谷口，有人伏在马背上，有人已经不在马背上了。没人喊停——官道不能停。","我偏头数了数：二十骑，出来了十四。六个，留在谷口那一段箭雨里。","没时间回头。前面的路，还长。"],"desc":"","choices":[],"next":"p2_leg2","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p2_r1b","title":"隘口 · 山涧绕行","type":"scene","lines":["退进山涧。涧水没过马膝，箭从头上嗖嗖过，打在石壁上。","折了两条人命，换了两日。值不值——要到了总兵府才知道。","涧水是凉的。马过涧的时候打了个趔趄，我抓住鬃毛，才没被甩下去。","怀里的密信，隔着甲胄，还是温的。"],"desc":"","choices":[],"next":"p2_leg2","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p2_leg2","title":"渡口 · 第二程","type":"scene","lines":["第二日，官道断在一条河前。渡口只有一条船，船夫早跑没了。","河对岸，瓦剌的散骑正在饮水。身后，追兵的烟尘已经接上了地平线。","船是条破船，船底漏着水，缆绳断了一股。可河对岸的散骑，正在往这边张望。","前有河，后有兵。我攥着缰绳，指节发白——这一程，两头都是刀。"],"desc":"","choices":[{"text":"抢船强渡——把追兵隔在河对岸。","hint":"快 · 血换时间","next":"p2_r2a","cond":"","effects":""},{"text":"沿河寻上游浅滩，涉水过河。","hint":"慢 · 少折人命","next":"p2_r2b","cond":"","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p2_r2a","title":"渡口 · 强渡","type":"scene","lines":["船到河心，对岸的火铳响了。水面上炸开一片红——有人拽着船帮喊我的名字，声音被水声吞了。","我把密信往怀里又塞了塞。水是凉的，信是热的。","船底的水越漏越快。有人用身子堵着漏洞，血从指缝里渗出来，混进船舱的水里。","到岸的时候，船上的人，又少了一双。"],"desc":"","choices":[],"next":"p2_leg3","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p2_r2b","title":"渡口 · 浅滩","type":"scene","lines":["浅滩的水没到马腹。一匹失蹄，连人带马冲出去老远，再没浮起来。","河是过了，追兵也踩着浅滩跟了过来——烟尘，更近了。","我回头看了一眼那匹没浮起来的马。马的鞍上，还捆着半袋干粮——省下来给弟兄们的那半袋。","不回头了。回头，路就走不动了。"],"desc":"","choices":[],"next":"p2_leg3","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p2_leg3","title":"山道 · 第三程","type":"scene","lines":["第三日，官道拐进山道。两侧石壁如削，林深得发黑。","老兵说过：这种地方，站满了人。","话音没落，伏兵从山石后头立起来。那个十七岁的弓手把我推下马——自己没躲开。他死的时候，还攥着半块没吃的饼。","他推我的那一把，用了全身的力气。我摔在路沟里，抬头，看见他倒下去的背影，像一截被风折断的旗杆。","山道两边的石壁，把喊杀声关在里头，闷得像闷雷。"],"desc":"","choices":[{"text":"硬闯伏击——杀出去，最快。","hint":"快 · 决定能否赶上约期","next":"p2_r3a","cond":"","effects":"旗标:p2_fast"},{"text":"弃马入林——保命，但密信会淋雨。","hint":"慢 · 赶不上约期","next":"p2_r3b","cond":"","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p2_r3a","title":"山道 · 杀出来了","type":"scene","lines":["刀光里杀出一条血路。出了山道，回头数——能站起来的，没几个了。","我把那块饼从他手里抽出来，揣进怀里。快，快过总兵府要的期限，就行。","那块饼还是硬的。硌着心口，和密信挨在一起。","我摸了摸它们。一块饼，一封信——一个是他留给我的，一个是于大人交给我的。都沉。"],"desc":"","choices":[],"next":"p2_leg4_fast","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p2_r3b","title":"山道 · 弃马入林","type":"scene","lines":["弃马入林。林子里走了两日，出来时马一匹不剩，密信被雨浸了边角——字还在，只是潮得发软。","我把信贴在胸口，用体温烘了一夜。天亮时，信纸干了，边角卷起来，像一片被火燎过的叶子。","字还在。只要字还在，信就还是那封信。"],"desc":"","choices":[],"next":"p2_leg4_slow","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p2_leg4_fast","title":"旷野 · 就我一个人了","type":"scene","lines":["第四日，旷野。追兵的号角咬住了尾巴。","从日出跑到日落，我回头数——官道上，只有我一个人了。","出发时是二十骑。二十，到一——中间隔着的，是隘口的箭、渡口的水、山道的刀。一程一程，数不清了。","就我一个人了。","可总兵府，就在前面三十里。快——快，还来得及。","我伏在马背上，听见自己的心跳，比马蹄声还响。怀里的信，贴着心口，烫得像一块烙铁。"],"desc":"","choices":[],"next":"p2_duel_fast","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p2_leg4_slow","title":"旷野 · 就我一个人了","type":"scene","lines":["第四日，旷野。追兵的号角咬住了尾巴。","从日出跑到日落，我回头数——官道上，只有我一个人了。","出发时是二十骑。二十，到一——中间隔着的，是隘口的箭、渡口的水、山道的刀。一程一程，数不清了。","就我一个人了。","总兵府还有三十里。怀里的密信边角潮了——字还在，只是软了。","我把信贴在心口，让体温把它焐干。风从旷野上刮过来，像要把人从马背上掀下去。","我伏低了身子。信，比我这条命重。"],"desc":"","choices":[],"next":"p2_duel_slow","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p2_duel_fast","title":"官道 · 单骑突围","type":"duel","lines":["前方烟尘起处，是总兵府的旗。可身后的马蹄声，已经贴上了后脑勺。","三十里。我攥紧缰绳，把马头一压——这三十里，是用牙咬着跑的。","风灌进喉咙，腥甜。怀里的信，随着马背的起伏，一下一下，拍着心口。","总兵府的旗，在风里张着。它看见我了。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_deliver_fast","pick":"","minigame":""},{"id":"p2_duel_slow","title":"官道 · 五日驰援","type":"duel","lines":["前方三十里，是总兵府——可追兵，已经围上来了。","马的鼻孔喷着白沫，腿在打颤。它和我一样，跑不动了，可还站着。","我抽出刀。刀锋卷了，刀柄上缠的布条，被汗浸得发黑。","能挡几刀，就挡几刀。信在，人在。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_deliver","pick":"","minigame":""},{"id":"p2_win_hero","title":"结局 · 信在人在","type":"ending","lines":["第七日，总兵府的旗，终于立在了眼前。","我翻身下马——腿一软，先跪在了地上。怀里的密信还是热的，我把它举过头顶，递出去的时候，手抖得厉害。","总兵拆开信，看了很久，抬头看我：「就你一个人？」","我说：信到了，就行了。","第九日，勤王军开拔。铁蹄踏碎官道上的霜——比约期，早了三天。","那一仗，京师守住了。德胜门上的旗没有换，城头的炮响到第三天，瓦剌退了。","于大人站在城头，远远看见军旗上的字，没有说话。","后来他写信给总兵，只问了一句：送信的人，叫什么？","总兵回信：他说，他叫陈四，保定人。","于大人批了个字：赏。","那年冬天，我把地赎回来了。娘在地头骂我瘦了，骂完又给我下了碗面，卧了两个鸡蛋。","我端着碗，看着灶膛里的火，忽然想起官道上的霜——那二十骑的名字，我没问过。可我记得他们的脸。","那碗面，我吃得很慢。娘问：咋了？我说：没事。就是想起几个弟兄，他们没吃上。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"信在人在（传令兵结局 · 突围）","endingDesc":"二十骑只剩一人，密信比约期早到三天。京师守住了——送信的人，叫陈四。","shop":"","duel":"","pick":"","minigame":""},{"id":"p2_win","title":"五日 · 密信到","type":"scene","lines":["第五日黄昏，河北总兵府的轮廓出现在视野里。","两匹战马体力不支倒毙在路上，几名士兵带箭，我肩头也被流矢擦伤，火辣辣地疼——可怀中的密信，完好无损。","我踉跄着翻身下马，双腿软得几乎站不住，却一把推开搀扶的亲兵，用尽最后一丝力气，将那封被汗水与血渍浸皱的密信，重重拍在案几上。","当指尖触到冰冷的案几的瞬间，所有的憋屈、怒火与疲惫，都化作一股滚烫的暖流，从心底蔓延开来。","我靠在门框上喘了很久。怀里的饼还没动——老娘说的，出门在外，饭要省着吃。","案几上那封信，蜡封还完整。我盯着它，忽然想：它比我值钱——它到了，二十骑的命，才算没白搭。"],"desc":"","choices":[{"text":"（主线）回营复命——京师还在等。","hint":"继续 · 战场收殓","next":"p2_mercy","cond":"","effects":""},{"text":"（结局）总兵问：你叫什么名字？","hint":"无名 · 送到了，就够了","next":"end_unknown","cond":"","effects":""}],"next":"","next2":"","effects":"junwei+10","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_unknown","title":"结局 · 无名","type":"ending","lines":["第五日黄昏，我把密信拍在总兵府的案几上。案几很凉，我的手在抖——不是怕，是二十骑只剩七人，那股气一直吊到现在。","总兵看完了信，抬头问我：你叫什么名字？","我张了张嘴，没说出来。出发时于大人只说了两个字：送到。没有人告诉过我，送到了之后，我叫什么。","后来京师守住了。捷报传遍天下，史书写了于谦，写了景泰皇帝，写了瓦剌败走——没有写送信的人。","我也没再回京师。那年秋天，我跟着总兵的队伍进了北边的军镇，领了一份军饷，在名册上，填了个姓。","很多年后，新一批军饷运到边镇，随行的还有一封没有署名的信。","我拆开，里面只有一句话：「京师，守住了。谢谢。」","我认不出笔迹。可我知道这封信是给谁的——它和当年那封密信一样，没有落款，不问名字。","我把两封信收在一起，压在箱底。","那年冬天，北边下了场雪。雪很大，像京师保卫战那一年。","我把两封信又翻出来，看了半夜。一封蜡封的，一封没有落款的——它们都到过该到的地方。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"无名（传令兵结局 · 送到了）","endingDesc":"信送到了，史书没有记下送信人的名字——像没有记下那二十匹马。","shop":"","duel":"","pick":"","minigame":""},{"id":"p2_lose","title":"第七日 · 惨至","type":"scene","lines":["密信还在怀里，人已经站不住了。二十骑，活着跟上来的，只剩七人——离总兵府，还有二十里。","我肩上的箭伤化了脓，高热三日不退。迷迷糊糊里，我总听见官道上的马蹄声，一队一队，像是要把这条路踏碎。","军令上写：迟误军机者，斩。可这七天，我们真的已经用命在赶了。","前方山影的后面，就是总兵府。","我摸了摸怀里的信。蜡封还在——它比我先到，就好了。","伏在草丛里躲追兵，马队折回来，领头的用生硬的汉话喊：「降了，保你一条命！你们那个皇帝都在我们手里，替谁卖命？」","我贴着土坡，一动不动。怀里那封密信被汗浸得发软，硌着胸口。","他喊到第三遍，我听清了马蹄声——远了。","后半夜爬起来接着赶路，箭伤疼得人发昏。我边走边想：他说的那些大道理，我不懂。","我只记得城头那个绯袍老头说过——咱大明，站着死的人多，跪着生的人少。","我陈四，站着走。走不动了，爬。","风从坡上灌下来。我攥着那封信，一步一步，往总兵府的方向挪。"],"desc":"","choices":[{"text":"把信送到——爬，也要爬到总兵府。","hint":"信在人在","next":"p2_mercy","cond":"","effects":""},{"text":"「信，到不了了。」你把蜡封的信，按回胸口。","hint":"迟到 · 一场更久的送达","next":"end_letter","cond":"","effects":""},{"text":"把蜡封信塞进道旁石缝，反身往北——引开追兵。","hint":"牺牲 · 差二十里","next":"end_twenty","cond":"","effects":""}],"next":"","next2":"","effects":"junwei-5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_letter","title":"结局 · 没有送达的信","type":"ending","lines":["离总兵府还有二十里。马倒了两匹，第三匹也跪了。我扶着鞍，一步步走——然后，膝下一软。","密信还焐在胸口，被汗浸得发软。我趴在路上，把信从怀里掏出来，想交给谁——四周只有风，和越来越近的马蹄声。","是瓦剌的游骑。他们搜走干粮，搜走佩刀，唯独没有搜走那封蜡封信——他们不识字，也不知道它有多重。","后来有人在那条官道上捡到它，送进了总兵府。总兵拆开，纸上的墨已经晕成了团，只依稀辨出四个字：京师，七日。","信到的日子，京师已经守了十一日。第七日夜里，城破过一回。","朝堂比城墙先撑不住——南迁之议起来了。百官跪在午门外，请圣驾南迁。","于谦挡在午门前：「言南迁者，可斩也！」","话音未落，人群涌动。推搡之间，不知谁的手里亮了一下——","那一刀，捅在他腰上。人群四下散开，没有一个人去扶他。","他靠着门柱坐下去，血在青砖上洇开。有人踩着他的袍角过去，有人绕过他，没有人低头看他一眼。","第二天，城破了。","勤王军开到的时候，京师已经不在了。德胜门上的旗换了，城门口排着逃难的长队。","总兵骑在马上，望着城头的烟火，把怀里的信捏了又捏——那封信，终究没有送到该到的人手里。","后来有人在城外的雪地里捡到它。蜡封还在，纸上的墨晕成一团，只依稀辨出四个字：京师，七日。","这四个字，是一道死线。于谦守在死线那头，守到第七日，倒在了午门前——人群从他身上跨过去，没有一个人低头。","那封信如果再早到三天……总兵后来总这样说。可他只说半句，后半句，一辈子没有说完。","雪地里的那封信，后来不知被谁收走了。大约是被哪个逃难的人，当火引子用了。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"没有送达的信（败线结局 · 迟到）","endingDesc":"信没送到。于谦倒在了午门前，人群从他身上跨过去——第二天，城破了。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_twenty","title":"结局 · 差二十里","type":"ending","lines":["第七日正午，马跪了，我也跪了。离总兵府还有二十里——这二十里，是拿命也填不满的二十里。","我把蜡封信从怀里掏出来，托在掌心，想等一个过路的人。官道空空，只有风。","瓦剌游骑的马蹄声是从北边来的。我把信塞进道旁的石缝里，往反方向走了十步——把他们引开。","他们搜走了我的干粮和佩刀，把我按在道边。为首的人问：信呢？我说：没有信。","刀落下来的时候，我望着南边。京师的方向，有一缕黑烟，很细，很长。","那封蜡封信在石缝里躺了三天。第四天，被一个收尸的民夫捡走，辗转送进了总兵府。","信到的那天，京师已经守了十一日。总兵看完，只说了半句话：「迟了——」后半句，他一辈子没说完。","后来名册上补了一行小字：陈四，保定人，差二十里。","石缝里的信，被雨水泡过，又被太阳晒干。它比我命长。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"差二十里（败线结局 · 驰援）","endingDesc":"信在石缝里等了三天，等来了总兵府——你没等来。","shop":"","duel":"","pick":"","minigame":""},{"id":"p2_mercy","title":"战场收殓","type":"scene","lines":["「都看仔细些！」我哑着嗓子喊，「有口气的都抬上车，没气儿的弟兄，给个全尸！」","翻到一具年轻的尸体时，我停了一下。他怀里揣着半块没吃完的饼，和一张揉皱的纸——纸上歪歪扭扭写着一个字，像个「保」字，又像没写完的「家」。","我把纸从他怀里抽出来，揣进自己胸口。回保定那天，我把它埋在了地头。","收殓到一半，我蹲在地上，忽然想：要是哪天躺在这里的是我，怀里那张纸，会不会也有人替我收着？","我摸了摸怀里的密信。它还在。它比纸沉，也比纸有用。","忽然，一道目光锁住了我。不远处，一名瓦剌将领正指挥手下收拾尸体，浑身是血，铠甲破碎，眼中满是仇恨与不甘。","连日奔逃的憋屈、弟兄伤亡的愤怒涌上心头——此刻他毫无防备，一刀就能结果了他，一雪前耻。","我缓缓抽出佩刀，指尖因用力而泛白。","可就在这时，一声微弱的呻吟从身旁传来——是一名幸存的瓦剌士兵，腿骨断裂，蜷缩在地，痛苦喘息。","对面那名将领的眼中，闪过一丝担忧。","那一眼担忧，让我握着刀的手，顿住了。","收拾完最后一批弟兄，大军拔营北去。我背着半袋干粮，落在队尾——怀里那封信交了差，剩下的路，该往保定走了。","老娘还在等我。这一回，是真的能回去了。"],"desc":"","choices":[{"text":"收刀。「继续收拾。」——都是爹娘生养，何必赶尽杀绝。","hint":"刀下留人 · 需军威≥55 · 你不知道这一念会落在哪","next":"p2_home","cond":"{\"statAtLeast\":{\"junwei\":55}}","effects":"旗标:mercy_shown；renwen+15"},{"text":"一刀斩之。战场之上，仁慈是奢侈品。","hint":"斩草除根 · 军中没人会说什么","next":"p2_home","cond":"","effects":"旗标:mercy_slain；junwei+5,renwen-10"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p2_home","title":"归途","type":"scene","lines":["回保定的路，往南。行囊里是半袋干粮，和那张写了半个「保」字的纸。","路过换马的那个驿站，驿卒老汉认出了我：「你不是那回拼了命往河北跑的后生吗？」我笑了笑，把干粮分了他一半。他没再问。那年头，活下来的人，都不问别人是怎么活下来的。","老娘在地头看见我，没哭。她把我从头到脚看了一遍，只说了一句：「瘦了。」","我把那张纸埋在了地头，朝着北。那个不知名的弟兄——我家的地赎回来了，你的字，就埋在我家的地里，往后逢年过节，多双筷子。","于大人说过：打完这仗，回保定，把地赎回来。地赎回来了。说这话的人，还在京师。","后来，景泰八年，我在京里的旧相识捎来一句话：于少保，死在菜市口，雪很大。","那夜我睡不着，摸出干粮袋里剩的最后一口饼。饼硬得硌牙——像那年官道上的风。我朝着京师的方向，把它吃了。"],"desc":"","choices":[],"next":"end_unknown","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"j_child","title":"偏院 · 童年","type":"scene","lines":["偏殿的井水永远是涩的。母亲说，是井底的砖老了。后来习惯了，涩味就成了偏院的味道：泡茶涩，熬药涩，连夏天湃在井里的西瓜，切开也是寡淡的。","母亲说话总压着声——偏院的日子，教她学会了把话放轻。","宫墙那边有仪仗经过，吹吹打打。我趴在墙头看，母亲把我拽下来，捂住我的嘴：「别出声。那不是咱们看的。」","母亲教我写字，只教两个字：平安。写错一回，她就替我抹掉，重来。","「字可以丑，」她说，「人不能出头。」","她说这话的时候，天边正烧着晚霞。我那时还不知道，多年以后，会有满殿的人跪在我面前，求我出头。","晚霞落尽，偏院暗下来。母亲在灯下做针线，一针，一针，把灯芯挑亮。","那盏灯，照亮偏院的一角。我趴在桌边看她的影子，看墙上那道影子，比什么都大。"],"desc":"","choices":[],"next":"p3_intro","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p3_intro","title":"第三视角 · 偏院的孩子","type":"duel","lines":["他们常说，我是多余的那个。多余出生，多余活着，多余……","皇兄是天子，我是郕王——宣宗皇帝的次子。他住东宫的时候，我住在偏院。偏院的廊下总积着薄尘，连阳光都懒怠照进来。我习惯了在这片阴凉里低头、沉默，把怯懦藏进宽大的衣袍。","偏院里我只有三样东西：一方旧砚，一盆旱死的兰草，和一只来路不明的荷包。砚是母亲留下的，她走时我十一岁，只说了一句：别争，争不过的。荷包是那年在檐下捡的，里面什么也没有，我一直揣着，像揣着一件没人认领的念想。","院角那棵老槐上，住过一只麻雀。那年它从窝里掉下来，摔断了翅膀，我养了它一秋。它会飞那天，在院子上空转了三圈，头也不回地走了。我在檐下站了很久——原来飞走，是不用道别的。","八月里，消息一个接一个地传进偏院：陛下御驾亲征了；陛下在土木堡大败了；陛下……被瓦剌掳走了。","朝堂乱了。太后命我监国——监国是什么，我不懂。我只知道，从前没人正眼看我，如今满朝的人都在看我。","孙太后的懿旨再传进来时，我手里的荷包差点脱手。","「国不可一日无君，你登基吧。」大殿上，太后的话轻飘飘的，却让我如遭雷击。","于谦站出来，说了很多话。他说：瓦剌挟着太上皇在城下叫门，若国无君，那扇门就守不住了。他说得很大声，满殿的人都低了头。","他们一拥而上，将沉重的龙袍披在我肩上。金线硌着脖颈，像偏院冬日里冻硬的旧棉袍——沉、冷、挣不脱。","那一夜，我睁着眼到天明。他们是真的要我登基，还是只缺一个挡在瓦剌刀前的傀儡？","数日后，瓦剌挟着皇兄兵临城下，朝堂之上，南迁之议甚嚣尘上。所有的人都在吵，没有一个人敢拍板。","我坐在龙椅上，指尖攥得发白。那些争执声里，没有一个人愿意扛起这千斤重担——就像从前，所有人都把轻视和敷衍推给我一样。","偏院的寒凉、龙袍的沉重、城外的炮声，忽然都成了一股劲，推着我，逼着我。","我攥着扶手，第一次，想自己说一句话。","那只荷包，在我怀里，攥出了汗。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_court","pick":"","minigame":""},{"id":"p3_win","title":"朕意已决","type":"scene","lines":["「朕意已决，不必再议！」","话音落下，我自己都愣住了。大殿上的争执声瞬间停歇，所有目光齐刷刷落在我身上——有惊愕，有难以置信，还有几分不易察觉的敬畏。","南迁之议，就此作罢。当夜，兵部尚书于谦整军出城，列阵九门之外，背城死战。","回居所的路上，我路过那座曾让我避之不及的偏殿。殿内摆设如旧，落着薄尘，和我记忆里蜷缩度日的模样分毫不差。","唯独那熟悉的墙角，不知何时，开出了一朵陌生的小花。","我蹲下去看了很久。偏院里，我养死的兰草、放飞的麻雀、捡来的荷包——原来有些东西，不用争，也会自己长出来。","后来史官记：京师保卫战，凡五日，瓦剌败走。也先携皇兄北遁，再不敢南顾。","那朵花，我后来给它浇过水。再后来，它旁边，又开了一朵。"],"desc":"","choices":[],"next":"j_wait","next2":"","effects":"junwei+10,renwen+10","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"j_wait","title":"等捷报","type":"scene","lines":["五日血战，我一日也没敢合眼。宫墙里的日子，是听着过的——炮声远了，我心口松一寸；炮声近了，我扶着柱子，把指甲掐进木头里。","小太监跑来问我：陛下，打赢了是什么样子的？我想了想，发现自己竟答不上来——从土木堡的消息传进偏院那天起，我就没听过「赢」这个字。","「等捷报进来，」我说，「朕念给你听。」","第五日，捷报真的进了奉天殿。我一个字一个字念完，满殿山呼。散朝后，我绕了远路，回偏院去看那面墙。","墙角那朵不知名的小花，被人流踩折了一茎——剩下的一茎，还立着。","我蹲下去看了很久。明年，它还会开的。","瓦剌的使者来了不止一趟。头一趟说要送还上皇，顺嘴提了句「两家结亲，永息干戈」；第二趟，连聘礼的礼单都递了上来。","我想了想，说：接。","满殿死寂。于谦的声音先炸开：「陛下！」接着是满地的「不可、不可」——大臣跪了一地，孙太后的懿旨下午就到了，四个字：和亲不许。","那晚我在殿里站了很久。灯花爆了一下，又爆一下。","「朕本来就不想当这个皇帝。」我跟满殿的空椅子说，「是你们把朕从偏院拽出来，按在这把椅子上的。如今连一句话，也不许朕说。」","没有人应我。偏院的廊下积着薄尘——那方旧砚上刻着别人的名字，我擦了很多年，擦不掉。"],"desc":"","choices":[],"next":"j_yichu","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"j_yichu","title":"景泰三年 · 易储","type":"scene","lines":["景泰三年春，我想让见济做太子。","太子是太后立的——朱见深，皇兄的儿子。满朝都看着，我这个皇帝，不过是个「代管」的。","我先试探太监金英：「七月初二，是东宫太子的生日吧。」","金英垂着眼：「回陛下，东宫生日，是十一月初二。」","他答得滴水不漏，连眼神都没抬。","我把诏书压了半年，又压了半年。汪皇后跪在我面前：「废长立幼，动摇国本——陛下三思。」","我看着她，忽然笑了：「你也觉得，朕坐不稳这把椅子？」","景泰三年五月，废朱见深为沂王，立见济为皇太子。汪皇后被废，打入冷宫。","那晚我站在见济的床边，看他睡得安稳。我摸着龙椅的扶手——坐了三年了，它头一回像是我的。","灯下，见济翻了个身，含糊地喊了声「父皇」。我伸手，替他掖了掖被角。","手在半空停了一下。我忽然想起偏院的母亲——她走的时候，也是这样，替我掖了掖被角。"],"desc":"","choices":[],"next":"j_jianji","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"j_jianji","title":"景泰四年 · 夭折","type":"scene","lines":["景泰四年十一月，见济病了。太医说是风寒，喝了药，不退。","第十日，他拉着我的袖子说：父皇，我冷。","我把他抱到炭盆边，抱着他坐到天亮。天亮时，他不动了。十岁。","我抱着他坐了三天。谁也不敢来收。","钟同跪在午门外上疏：「太子薨逝，足知天命有在——请复立沂王。」他当庭被杖，死在丹墀下。","从此再没有人敢提立储。","可我知道他们在等——等我死，等那把椅子空出来。","我夜夜梦见偏院的井。井水是涩的——可那时候，起码有人告诉我，水为什么涩。","那三天，我抱着他，没有哭。宫人说，陛下眼里没有泪。他们不知道，泪是有的——只是都淌进了心里，和偏院的井水，一样涩。"],"desc":"","choices":[],"next":"j_eight","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"j_eight","title":"八年之间","type":"scene","lines":["五日血战与夺门之夜之间，隔着八年。","第二年，上皇从漠北回来了。我派人去迎——兄弟在南宫门前对拜的那一刻，我们有很多话想说，最后只说了礼数。那以后，南宫的门锁换了一道又一道。偏院的寒凉，我曾一个人受；如今换一个人受了，我竟不知道自己是松了一口气，还是揪了心。","朝会上，我能远远看见那身绯袍。于少保奏军务、奏边事，字字句句，满殿寂然。有时候我想：那把椅子上，其实有两个人在坐——他坐着我坐不稳的那一半。","还有一件事，邸报上没有写。听人说，京师保卫战那年，有个传令兵五天送出蜡封密信，二十骑出去，回来七个。兵部议叙功，名册上只留了四个字：陈四，保定。","我看着那份名册的抄件，看了很久。原来这天下，多的是连四个字都留不下的人——而我这个皇帝，是被他们一个一个，托在掌心里举起来的。","景泰五年，我废了太子。反对的折子在案上堆了半尺高，我一封一封，全都批了。深夜独处时才忽然发现——我变成了当年在偏院里，自己最怕的那种人。"],"desc":"","choices":[{"text":"年节之前，往南宫送两箱冬衣——国事再紧，兄弟的情分不能紧。","hint":"亲亲之谊 · 门里的人，也是人","next":"end_kaihua","cond":"","effects":"renwen+10"},{"text":"南宫的守卫，再加一班，锁换新的——这把椅子，赌不起。","hint":"防微杜渐 · 帝王没有兄弟","next":"end_kaihua","cond":"","effects":"junwei+10,renwen-5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_kaihua","title":"结局 · 开花了","type":"ending","lines":["后来的事，史书是这样记的：景泰八年，夺门之变。太上皇复辟，帝迁西内。","史书没有记的是：那一年，我坐在偏院的台阶上，看着墙角那朵花，又开了一回。","八年了。它从一棵杂草，开成了一株不知名的花。就像我，从偏院多余的孩子，开成了大明的皇帝——哪怕只有八年。","夺门那夜，皇兄的人闯进寝殿时，我很平静。我最后看了一眼那把椅子，忽然想起登基那日，龙袍硌着脖颈，像偏院冬日里冻硬的旧棉袍。","「陛下，请。」他们说。","我没有挣扎。我站起来，整了整衣冠，跟着他们走了。路过偏院时，我停下来，把墙角那朵花，轻轻摘了下来，别在衣襟上。","西内的日子很安静。有人送饭，有人送药，没有人问过我，那朵花是什么花。","后来，西内的墙角也长出了草。我没有再种花。","有些东西，开过一次，就够了。","《明史 · 景帝纪》只有一行：景泰八年，帝暴卒，葬西山。","没有人写过，那朵花。","衣襟上那朵花，最后落在哪里，没有人知道。大约和西内的尘一样，落进土里，又长成了来年的草。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"开花了（景泰帝结局 · 八年天子）","endingDesc":"他从偏院多余的孩子，开成了八年的天子——最后把那朵花，别在了衣襟上。","shop":"","duel":"","pick":"","minigame":""},{"id":"p3_lose","title":"垂帘之后","type":"scene","lines":["话没能说出口。争执声越来越大，我坐在那把椅子上，胸口发闷，一个字也插不进去。","最终是太后拍了板：暂不南迁，命于谦总督各营——由太后懿旨，不由皇帝圣断。","京师保住了。五日血战，瓦剌败走。万民欢呼的声音传进宫墙时，赞的是于少保，念的是孙太后。","没有人提起龙椅上那个一言未发的年轻皇帝。","回居所的路上，我在偏殿前站了很久。墙角的杂草枯了又生。","这一次，没有开花。","我摸了摸怀里的荷包。它还是空的。母亲说得对——别争，争不过的。可我还是在墙角，替那朵没开的花，浇了水。"],"desc":"","choices":[{"text":"你把自己嵌进龙椅里，一言不发——像从前在偏院一样。","hint":"沉默 · 多余的那个","next":"end_duoyu","cond":"","effects":""},{"text":"你张了张嘴，想说什么——满殿的声浪涌过来，话到唇边，终究落回肚里。","hint":"失语 · 偏院的尘","next":"end_pian","cond":"","effects":""}],"next":"","next2":"","effects":"junwei+5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_duoyu","title":"结局 · 多余的那个","type":"ending","lines":["南迁之议那日，我没有说出「朕意已决」。那句话在我喉咙里转了一夜，终究没有出口。","太后拍了板：不迁。命于谦总督各营。京师守住了，万民欢呼，赞的是于少保，念的是孙太后。","没有人提起龙椅上那个一言未发的年轻皇帝。","我回到偏院，在墙角站了很久。去年的杂草枯了，没有开花。","后来很多年，我都是一个听话的皇帝。太后说什么，我做什么；百官说什么，我准什么。只有一次，礼部拟的年号里带了个「泰」字，我提笔，改成了「景」。","没有人知道为什么。景者，光也——我想让偏院那个孩子，也沾一点光。","景泰八年，夺门之变。我被迁往西内，一个月后，暴卒。","史官写：郕王薨。","只有偏院的老人记得，那一年墙角开过一朵花——只是开得太早，谁也没看见。","年号那一个字，改完我搁了笔，在灯下看了很久。","「景」。光也。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"多余的那个（景泰帝结局 · 垂帘之后）","endingDesc":"他到底还是多余的那个——只是这一次，他替自己，开过一朵花。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_pian","title":"结局 · 偏院的尘","type":"ending","lines":["南迁之议，终究不是由朕拍板。太后的懿旨压下来，于谦的兵权抬上去——满殿都有事做，只有龙椅上的人，被轻轻搁在了一边。","散朝那日，我走过偏院的游廊。廊下的薄尘还在，阳光还是懒怠照进来——原来天塌下来，偏院是不管的。","后来的年月，我学着做一个安静的皇帝：不拍板，不争先，把话咽回去，把「朕」字说得越来越轻。","景泰八年，夺门之变。被迁往西内之前，我回偏院看了一眼——拿起笤帚，把那层积了十几年的尘，扫了扫。","扫到墙角，我停了一下。那里曾经开过一朵花，我没来得及看。","《明史》没有记那间偏院。只有尘知道，有人在那里住过一辈子。","那朵没来得及看的花，大约和尘一样，扫一扫，就散了。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"偏院的尘（败线结局 · 失语）","endingDesc":"满殿都有事做——只有龙椅上的人，被轻轻搁在了一边。","shop":"","duel":"","pick":"","minigame":""},{"id":"p4_intro","title":"终章 · 夺门","type":"scene","lines":["景泰八年正月十七，夜漏三响。","南宫的门锁早已锈蚀。我披甲立在门后——不，立在门后的那个人，是皇兄。八年前被也先掳走、又被迎回、又被安置在南宫「静养」的太上皇。","石亨的低吼隔着门板传来：「陛下，时辰到了！」","这一夜的事，后世的史书只用了三个字：夺门之变。","那个曾经跪着领懿旨的偏院孩子、那个说过「朕意已决」的年轻皇帝——此刻正被这件黄袍的旧主人，一步一步逼下龙椅。","而我，兵部尚书于谦，在黎明前被捕了。","铁链上肩的时候，天还没亮。我回头看了一眼奉天殿的方向——灯还亮着。那盏灯，是景泰帝的。"],"desc":"","choices":[],"next":"p5_prison","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p5_prison","title":"诏狱","type":"scene","lines":["锦衣卫狱阴暗潮湿，深陷地下。墙壁上凝结的水珠滴滴答答，如倒计时的钟摆。","他们要给我议罪。审讯之日，主审官捧着伪造的供词，字字皆是罗织：「谋立外藩」「擅权乱政」「通敌瓦剌」——条条件件，皆是夺门复辟的清算，无关功罪，只为政治立威。","我沉默着听着那些荒诞的指控，忽然想起多年前，有人赠过我八个字：","「独善谋国，不善谋身。」","当时不以为意。现在的我，才算真正懂了。","严刑拷打接踵而至。可醒来后，眼前竟闪过无数碎片，像走马灯——","墙上的水珠，一滴，一滴。像那年城头的炮声，一声，一声。"],"desc":"","choices":[{"text":"（若你曾在战场收殓时刀下留人）对面瓦剌将领眼中，那一闪而过的担忧。","hint":"","next":"p5_light_mercy","cond":"{\"flag\":\"mercy_shown\"}","effects":"renwen+5"},{"text":"（无论如何）德胜门城楼上，那个用弹弓打伤瓦剌兵的孩童，怯生生又骄傲的目光。","hint":"","next":"p5_light_child","cond":"","effects":""},{"text":"（无论如何）那句意气风发的——「红衣官袍皆是百姓血染，我穿蓝图个干净」。","hint":"","next":"p5_light_robe","cond":"","effects":""},{"text":"（把走马灯收进心底）行刑那日，雪下得更大了。","hint":"","next":"p5_final","cond":"","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p5_light_mercy","title":"走马灯 · 刀下","type":"scene","lines":["那个断了腿的瓦剌士兵蜷缩在血地里。我的刀抽出来，又收回去。","都是爹娘生养，都是为了各自的家国。审讯官问我「通敌瓦剌」时，我几乎要笑出来——","通敌？我在他们的尸体堆里留过活口。这世上再没有比这更荒诞的指控，也没有比这更干净的清白。","那一眼担忧，我记到今天。"],"desc":"","choices":[],"next":"p5_prison","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p5_light_child","title":"走马灯 · 弹弓","type":"scene","lines":["十二岁，弹弓，打伤了一个摸上德胜门的瓦剌兵。他望着我的时候，眼里有光。","那光比任何官袍都亮。我守的从来不是朱家的江山——","是那个孩子能继续爬上城墙撒野的、普普通通的一天。","那只弹弓兜，我后来在城楼上见过。石子早就打完了，兜还在。"],"desc":"","choices":[],"next":"p5_prison","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p5_light_robe","title":"走马灯 · 红衣","type":"scene","lines":["「红衣官袍皆是百姓血染，我穿蓝图个干净。」","说这话的时候，我还年轻，官袍确实是干净的。如今它旧了、皱了，上过血、沾过泥——","但直到最后一刻，它没有沾过百姓的一滴血。够了。","那件青袍，在死战前的夜里，烧掉了一角。剩下的一角，一直披到我入狱。"],"desc":"","choices":[],"next":"p5_prison","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"p5_final","title":"刑场 · 雪","type":"ending","lines":["主审官见我始终不认罪，最后放缓语气，问我可有未了心愿。","我愣了愣，忽然想起数月前，在城东书坊赊的那套《左传》。店主说此书刻印精良，要三吊钱。我当时公务繁忙，只匆匆记下，未曾付钱。","「我赊了人家的书。」我轻声说，「欠了城东头书坊三吊钱。」","「记得帮我还。」","主审官默然垂首，良久轻叹一声，转身离去，再无逼供的厉色。","行刑那日，雪下得更大了。沿途百姓纷纷落泪，有人悄悄扔来衣物，有人跪地叩首，狱卒押解时，也刻意放轻了手脚。","我望着远处依旧飘扬的大明旗帜。红色的旗帜在白雪的映衬下，格外醒目。","「粉身碎骨浑不怕，要留清白在人间。」","雪落在我肩头，一片，一片。像那年德胜门城楼上，弹弓打碎的石子。","清白两个字，我写了一辈子。临了，用这一场雪，写完了。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"要留清白在人间（终章）","endingDesc":"己巳之变八年后的那场雪。你为这座城做过的一切，都映在刑场的泪眼中。","shop":"","duel":"","pick":"","minigame":""}],"viewpoints":[{"id":"vp_yuqian","name":"于谦","desc":"兵部尚书。九门是一张网，他是持网的人。","start":"yq_night"},{"id":"vp_chuanling","name":"传令兵","desc":"保定府人陈四。一封蜡封密信，二十骑，五日。","start":"p2_intro"},{"id":"vp_jingtai","name":"景泰帝","desc":"偏院的孩子。龙袍很沉，像冻硬的旧棉袍。","start":"j_child"}]},{"id":"shumian","title":"十
