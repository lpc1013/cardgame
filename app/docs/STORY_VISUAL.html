a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M2880,155 C2900,155 2900,124.32 2920,124.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M3360,155 C3380,155 3380,124.32 3400,124.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M3600,124 C3620,124 3620,124.32 3640,124.32\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/>","laneSvg":"<rect x=\"0\" y=\"70\" width=\"4610\" height=\"414\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"85\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">人生长恨水长东</text>","nodes":[{"id":"start","title":"咳","type":"scene","lines":["「咳咳咳……」一阵沉闷的咳嗽声在寂静的宫殿内荡开。我刻意压低声音，却还是惊醒了枕边人。\r","\r","「来人啊，快来人！」\r","\r","「让你受累了。」我握住夫人的手放在胸口，示意无大碍，又挥手让手忙脚乱的奴婢们散去。\r","\r","「陛下……」\r","\r","我没等她把话说完：「太医说，我命不久矣，大限就在眼前了。」\r","\r","她先是一愣，随即又哭啼起来，像极了小时候的模样。\r","\r","「别说出去，好吗？」\r","\r","看到她点头之后，我悬着的心，终于可以和羸弱的身子一起躺下了。\r","\r","我，还能活多久呢？\r","\r","「若吾病终，请执吾之尸首面朝北尔。」写下这句话时，我想起了父亲临终前的叮嘱。\r","\r","不知父亲现在，在那边过得怎么样了。\r","\r","窗外，天将亮未亮。殿外的树影，还压着一层薄霜。\r"],"desc":"","choices":[],"next":"ch_chaohui","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"fever","title":"热","type":"scene","lines":["热。好热。大概是谁把炉子烧得太旺了。\r","\r","总觉得有人把什么东西按在我的手腕上——太医又来诊脉了吗？不行，我得起来，免得失了帝王礼仪。\r","\r","眼皮很重，怎么也抬不起来。我想叫下人，喉咙却干渴得要冒火。\r","\r","我隐约听见一些声音，他们在不停地念叨着什么。我竭力想听清——但一动脑子，便跌进了黑暗的深渊。\r","\r","许久之后，我从深渊里浮上来，只剩下一个念头：\r","\r","「我要喝水。」\r","\r","有人把水递到我唇边。我喝下去，又跌回那片黑暗里。\r","\r","黑暗的尽头，好像有一棵很大的树，树影里站着一个人，背着身，看不清脸。\r"],"desc":"","choices":[],"next":"ch_beifa","next2":"","effects":"shouming-10","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"chubiao","title":"出师表","type":"scene","lines":["自上次病倒之后，病愈发沉重。短短几日，消瘦数斤。我望着衣带渐宽，悔恨不知不觉涌上心头。\r","\r","我命人寻出那篇曾被我不屑一顾的《出师表》，在漫长的文字里，找到了那句让我感同身受的话：\r","\r","「夙夜忧叹，恐托付不效，以伤先帝之明。」\r","\r","我想起父亲临终的嘱咐，想起母亲泪流满面的模样。\r","\r","如今，我也要到这一步了吗？\r","\r","司马懿不停上表要回家养老。我知道必须防着他——可是没有他，统一天下要等到何时呢？\r","\r","我，还能看见那一天吗？\r","\r","烛火跳了一下。我把那页《出师表》，压在了案头最常看见的地方。\r"],"desc":"","choices":[],"next":"ch_jieting","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"duel_intro","title":"棋局","type":"duel","lines":["「啪！」棋盘上的白色大龙被拦腰截断。对面的老者面无表情，看到棋势被打断，便直接认了负。\r","\r","「爱卿又让了我一局了。」我开始试探这只老狐狸。\r","\r","「老朽年迈，算有遗策，是陛下年少有为啊。」他的身子俯了下去，我几乎看不见他的脸了。\r","\r","我笑了笑，不置可否。任谁也想不到，就在几天前，我还是一个连床都下不来的病人。\r","\r","老狐狸棋差一招——嫡子违法的把柄，被我抓住了。他又跪在地上请辞。无聊的套路。\r","\r","我要用他。但在此之前，我要先敲打他。恩威并施，乃驭人之道。\r","\r","但这一局棋，怎么下？\r","\r","他俯着身，等我的下一手。我盯着棋盘上那条断开的龙，忽然觉得，它像我。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_sima","pick":"","minigame":""},{"id":"sima_win","title":"棋局 · 收放","type":"scene","lines":["一子一子，我把「用你」和「防你」都摆在明面上。他俯得更低了，低到几乎贴着棋枰——\r","\r","「老臣，万死不敢。」\r","\r","「起来罢。」我摆摆手，「先帝把太子托给了你，也托给了朕。这盘棋，你我还得下很多年。」\r","\r","他退出大殿时，殿内重归寂静。我只觉一阵虚脱，方才强撑的精神顷刻消散——要是没有内侍搀扶，我大概又要结结实实摔上一跤。\r","\r","但棋局至此，已无退路。\r","\r","我把那枚截断白龙的棋子，收回棋盒。棋盒的木纹，被摩挲得发亮。\r"],"desc":"","choices":[],"next":"yaoyu","next2":"","effects":"旗标:held_upper_hand；junchen+15","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"sima_lose","title":"棋局 · 雾","type":"scene","lines":["话被他轻轻巧巧地绕了回去。棋盘上我的大龙被截断，棋盘外——我竟也看不清他俯下去的那张脸了。\r","\r","「老朽年迈，恳请归乡养老。」他第三次请辞。\r","\r","我盯着那张深不见底的脸，忽然一阵眩晕。敲打不动的人，是喂不熟的，也是杀不掉的。\r","\r","「就先这样，退下吧。」\r","\r","他退出大殿。据说回去时，吓得连轿子都乘错了——别人提醒他，他愣是找不到轿子在哪，后来干脆走回去了。\r","\r","宫人们在屏风外笑。我按住了要起身呵斥的总管。\r","\r","嘘。让他们笑罢。\r","\r","真好啊，这样的日子。\r","\r","可我知道，这盘棋，朕输了第一手。往后每一手，都要加倍地补。\r"],"desc":"","choices":[],"next":"end_wu","next2":"","effects":"旗标:lost_upper_hand；junchen-10","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_wu","title":"结局 · 没看清","type":"ending","lines":["那夜我独自在养心殿，把那局残棋摆了出来。大龙断在中间——我看了很久，没找到下一手。\r","\r","总管进来剪灯，小心翼翼地说：「陛下，太傅的车驾，出城了。」\r","\r","「朕知道。」我往枰上落了一子。落在哪儿，我不知道。\r","\r","几日后，诏书下来了：司马懿归乡养老。朝中来劝谏的人，我数了数——不到三个。他们不是替我惋惜，是替他惋惜。\r","\r","摁不住，就先放。这个道理，是祖父教我的。他没教我后半句：放走的人，总有一天会回来。\r","\r","父亲临终说，面朝北。我在病榻上常常想：这大魏的棋，到底是谁在下，又是谁在看。\r","\r","殿外那棵枇杷树长得很快。它不等任何人。\r","\r","后来，听说司马懿在乡间又摆了盘棋。对面没人。他一个人，下了整夜。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"没看清（败线结局 · 棋雾）","endingDesc":"这一局你没看清那张脸——往后的每一天，都补不上那一手。","shop":"","duel":"","pick":"","minigame":""},{"id":"yaoyu","title":"药罐与枇杷树","type":"scene","lines":["养心殿。药香与墨香混杂，沉得压人。下人们在屏风外搬药罐——「今天把药罐全部搬出去，可得好好去去晦气！」\r","\r","「你听说了吗？陛下天命至现，拖了几年的病竟然全好了，气色比你我都要好。」\r","\r","他们都以为我的病好了。只有我知道，这是回光返照。\r","\r","我出神地看着殿门外那棵大树。不对——在我印象里，它原本应该是一支树苗。\r","\r","「庭有枇杷树，吾母死之年所手植也，今已亭亭如盖矣。」\r","\r","此刻我终于明白，为什么当年父亲要那么着急伐蜀了。\r","\r","但愿，蜀汉比我先撑不住。\r","\r","药罐搬空了。廊下风来，枇杷树的叶子，哗哗地响了一整夜。\r"],"desc":"","choices":[],"next":"ch_gongshi","next2":"","effects":"shouming-10","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"wuzhang","title":"五丈原","type":"scene","lines":["「诸葛亮死了？」我望着来报的密探，难以置信地又问了一遍。\r","\r","「回禀陛下，蜀军尽披缟素，昨夜已连夜撤回祁山。诸葛亮确实死了。」\r","\r","我摁住内心的狂喜：「好。那司马懿呢？」\r","\r","「司马懿被诸葛亮雕像所吓跑，未能及时追击蜀军，此刻正在五丈原。」\r","\r","「急宣司马懿回京，要快！」\r","\r","命令下达后，我忽然又想起什么，急忙把密探喊回，从盒子里取出金牌令箭：\r","\r","「我许你特权。如果他不听号令——你可便宜行事。」\r","\r","我望着密探渐行渐远的背影，第一次觉得，有些事情真正掌握在了自己的手中。\r","\r","可回到榻上，那种熟悉的虚脱又袭来了。赢了诸葛亮，我的天年，也快到头了。\r","\r","密探的背影消失在宫门外。金牌令箭的冰凉，还留在掌心里。\r"],"desc":"","choices":[{"text":"趁司马懿回京述职，削其兵权，改以宗室掌军。","hint":"需君臣之分≥60 · 防患未然，但北伐大业谁继？","next":"ch_xiangping","cond":"{\"statAtLeast\":{\"junchen\":60}}","effects":"旗标:cut_sima；junchen-20,shouming+5"},{"text":"以先帝托孤之义相托，曹爽与司马懿共辅太子。","hint":"史实之路 · 九泉之下可安？","next":"ch_xiangping","cond":"","effects":"旗标:trust_sima；junchen+10"},{"text":"召太子至榻前，令二大臣当面盟誓：共辅幼主，负盟者天祖共殛。","hint":"需君臣之分≥40 · 盟约之路","next":"ch_xiangping","cond":"{\"statAtLeast\":{\"junchen\":40}}","effects":"旗标:oath_sima；junchen+5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"final","title":"面朝北","type":"scene","lines":["我终究还是没能熬过蜀汉——我甚至连司马懿也熬不过了。\r","\r","不过，失去诸葛亮的蜀汉，又能坚持多久呢？\r","\r","人之将死，其言也善。我第一次觉得司马懿没有那么可恶，没有那么富于心计。\r","\r","榻外的哭声渐起。我想起当年父亲去世时的场景——只不过，那时我在地上，此时，我在床上。\r","\r","「曹爽、司马懿，你们要尽心辅佐太子。」\r","\r","「如此之为，九泉之下，我亦可安。」\r","\r","我最后望了一眼殿外。那棵亭亭如盖的树，在风里轻轻摇着。\r","\r","「若吾病终，」我用尽力气，说完了最后一句话——「请执吾之尸首，面朝北尔。」\r","\r","北方，有父亲没打完的仗。\r","\r","殿外，枇杷树的叶子，落了一地。\r"],"desc":"","choices":[],"next":"epilogue","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"epilogue","title":"尾声","type":"scene","lines":["史书记：帝崩，太子年幼，托孤于宗室与权臣。\r","\r","没人记下那一夜的枇杷树，落了满地的叶子。\r","\r","也没人记下，高陵的方向，正对着北方。\r"],"desc":"","choices":[{"text":"（若你削了司马懿的兵权）—— 十年后，庙堂之上再无姓司马的权臣。","hint":"","next":"end_cut","cond":"{\"flag\":\"cut_sima\",\"flag2\":\"held_upper_hand\"}","effects":""},{"text":"（若你削了司马懿的兵权）—— 可庙堂之外，处处皆是他的门生故吏。","hint":"","next":"end_cut_fail","cond":"{\"flag\":\"cut_sima\",\"flag2\":\"lost_upper_hand\"}","effects":""},{"text":"（若你们在榻前立过盟）—— 十年后，高平陵起了烽烟——但他先去了趟高陵。","hint":"","next":"end_oath","cond":"{\"flag\":\"oath_sima\",\"flag2\":\"held_upper_hand\"}","effects":""},{"text":"（若你们在榻前立过盟）—— 可金匮里的那卷誓书，不知何时丢了。","hint":"","next":"end_oath_broken","cond":"{\"flag\":\"oath_sima\",\"flag2\":\"lost_upper_hand\"}","effects":""},{"text":"（若你以托孤之义相托）—— 十年后，高平陵的烽烟起了。","hint":"","next":"end_trust","cond":"{\"flag\":\"trust_sima\"}","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_cut","title":"结局 · 北望","type":"ending","lines":["新帝登基，宗室掌军。司马懿以太子太傅荣养，三年后病逝于洛阳，谥曰「贞」。\r","\r","史官论曰：明帝知懿之雄，防微杜渐，魏祚得延。\r","\r","只是北伐的大业，从此又慢了二十年。临终前，新帝也学着父亲的样子，写下了一句遗言——「面朝北。」\r","\r","北边的事，一代人做不完，就交给下一代。就像父亲交给儿子，儿子交给孙子——像水一样，长东去，不尽，不回。\r","\r","我躺在那里，听完新帝的遗言，忽然觉得很安心。\r","\r","那棵枇杷树还在。它替我看了很多年，看过辽东的雪，看过西线的月，看过洛阳城楼下一队一队的兵马，终于看见了一个不需要再面朝北的朝代。\r","\r","虽然那个朝代，我终究没能亲眼看见。\r","\r","面朝北。就够了。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"北望（改命结局）","endingDesc":"你熬死了诸葛亮，也锁死了司马懿。代价是，天下又乱了二十年。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_cut_fail","title":"结局 · 将死的军","type":"ending","lines":["新帝即位，宗室掌军。可边警每一次传到京师，满朝的目光都往那座太傅府上瞟——司马懿称病不朝，门生故吏却布满朝野。\r","\r","你削去了他的兵权，却没有留下一个接得住他的人。三年后陇右告急，廷议上有人带头出列：「非司马公不能镇西。」\r","\r","复起的诏书送到府上时，病榻上的人已经病了很久。他接诏、跪拜、面向西方——那一年魏军大胜。捷报里写的还是「魏」，可那支军队，早已姓了司马。\r","\r","你在弥留之际听到捷报，咳出了一口血。将死之人终于看清了一件事：\r","\r","你可以夺一个人的兵权，夺不了一个时代的走向。你防住的那条大龙，原来早就在棋盘外面布好了势。\r","\r","临终前，你让人把那张御赐棋枰收起来。棋枰上，还有半局没下完的棋。\r","\r","「别收了。」你说，「留着——让后人看看，这盘棋，朕输在哪一手。」\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"将死的军（遗恨结局 · 左右皆不成）","endingDesc":"你削了他的兵权，却没有练出一个能代替他的人。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_oath","title":"结局 · 病榻之盟","type":"ending","lines":["榻前盟誓那夜，曹爽与司马懿跪在龙床前，指天为誓：共辅幼主，负盟者天祖共殛。\r","\r","誓书写了两份，一份封进金匮，一份压在朕枕下。\r","\r","朕听完他们的誓言，闭上眼，觉得可以安心走了。\r","\r","十年后，高平陵起了烽烟——但司马懿先去了趟高陵。\r","\r","他在朕的陵前站了很久。史官没记他站了多久，只记他离去时，眼眶是红的。\r","\r","金匮里的誓书还在。负盟的人，最后自己把盟约，补上了。\r","\r","那棵枇杷树，看着这一切，没有说一句话。\r","\r","它比金匮记得久。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"病榻之盟（盟约结局 · 一言所护）","endingDesc":"誓言没能保住江山，但保住了一个孩子的一生。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_oath_broken","title":"结局 · 被风吹散的誓","type":"ending","lines":["金匮里的那卷誓书，不知何时丢了。\r","\r","看守金匮的老太监，跪在殿外一夜，第二天自尽了。他的供词只有一句：「奴婢该死。」\r","\r","新帝登基第七年，高平陵起了烽烟。这一次，没有人先去高陵。\r","\r","那卷誓书去了哪里，成了朝堂上一个没人敢问的谜。\r","\r","只有守陵的匠人说，某年夜里，见过一驾无标识的车停在帝陵外。车上下来一个人，在陵前烧了一卷纸。\r","\r","火光里，那人站了很久。纸灰飞起来，像一群黑色的蝶。\r","\r","那卷誓书，大约是还给了应该看的人。\r","\r","只是誓言这种东西，烧了，就真的不在了。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"被风吹散的誓（破盟结局 · 人死言轻）","endingDesc":"你把誓言托付给了金匮，金匮托付给了看住它的人。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_trust","title":"结局 · 长东","type":"ending","lines":["你以先帝托孤之义，把太子托给了曹爽与司马懿。\r","\r","「先帝把你们托给了朕，朕把天下托给你们。」你说完这句话，就闭上了眼。\r","\r","史书说：明帝托孤，社稷得安。\r","\r","十年后，高平陵的烽烟还是起了。曹爽伏诛，司马氏掌权——可史官在那一页的末尾，加了一句小注：\r","\r","「司马懿临终，曰：吾受明帝托孤之重，终身未负。」\r","\r","没有人知道他这句话有几分真。但他确实到死，都留着明帝赐的那副棋枰。\r","\r","棋枰上的棋，走到一半，没有下完。\r","\r","那一半，是明帝没来得及下完的天下。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"长东（史实结局）","endingDesc":"人生长恨水长东。你熬赢了所有对手，独独输给了身后事。","shop":"","duel":"","pick":"","minigame":""},{"id":"ch_chaohui","title":"朝会","type":"scene","lines":["病着的消息，压了三日。三日里，我撑着上朝，把咳嗽咽回肚子里，袍袖掩着唇，只当是风。\r","\r","可总有压不住的时候。那日议完军务，我扶着案沿缓了半晌，抬头时，满殿的目光都落在我的手上——那只手，在抖。\r","\r","「陛下龙体……」有臣子小心翼翼开口。\r","\r","我打断他：「无碍。继续。」\r","\r","退朝后，内侍低声劝：陛下，称病歇两日罢，龙体要紧。\r","\r","殿外的枇杷树，叶子又落了一层。\r","\r","这道称不称病的口谕，天下人会看三年。\r"],"desc":"","choices":[{"text":"瞒——强撑上朝，病势咽回腹中。","hint":"威仪 · 折天年","next":"fever","cond":"","effects":"junchen+5,shouming-5"},{"text":"示——坦然称病，朝务暂付三公。","hint":"露怯 · 省着活","next":"fever","cond":"","effects":"shouming+3,junchen-3"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch_beifa","title":"北伐","type":"scene","lines":["诸葛亮死了。消息传来那日，朝堂上没人敢笑——大家都在等我的态度。\r","\r","北伐的大旗，是先帝立的。这面旗，是继续扛，还是缓一缓？\r","\r","将军们跪了一地：陛下，趁蜀国新丧，天赐良机！\r","\r","太傅们却摇头：陛下龙体欠安，军国大事，宜从长计议。\r","\r","我看着案头那页《出师表》。先帝写它的时候，大约也像我现在这样，灯下独坐，进退两难。\r","\r","这道诏书发出去，不是一道军令——是拿朕剩下多少日子，去换那面旗能扛多远。\r"],"desc":"","choices":[{"text":"急催——趁蜀国新丧，天赐良机。","hint":"抢时机 · 耗灯油","next":"chubiao","cond":"","effects":"junchen+5,shouming-5"},{"text":"缓图——以守养命，待时而动。","hint":"把日子往后拖","next":"chubiao","cond":"","effects":"shouming+4"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch_jieting","title":"街亭","type":"scene","lines":["陇右的战报，比秋雨来得早。\r","\r","街亭。张郃破之。蜀将马谡，败走。\r","\r","朝堂上，有人请功，有人请罪，还有人小心翼翼地看我——诸葛亮第一次出祁山，就这么退了。\r","\r","张郃的捷报写得克尽本分：斩获无算，蜀军宵遁。\r","\r","我批复的时候，笔尖在\"张郃\"二字上多停了一瞬。\r","\r","这一仗赢在张郃，也赢在马谡——若对面是个稳将，胜负还两说。\r","\r","我提笔，给西线写了一道诏书：严备，勿追。蜀地多山，深不可测。\r"],"desc":"","choices":[{"text":"重赏张郃——军功可期，士气可振。","hint":"赏功 · 立军威","next":"ch_chencang","cond":"","effects":"junchen+5,shouming-3"},{"text":"追查败因——深究己方用人。","hint":"自省 · 防微杜渐","next":"ch_chencang","cond":"","effects":"shouming+3,junchen-3"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch_chencang","title":"陈仓","type":"scene","lines":["诸葛亮又来了。这一次，他围的是陈仓。\r","\r","陈仓守将郝昭，手里只有一千余人。诸葛亮数万大军，围了二十余日。\r","\r","战报一封接一封：蜀军云梯、冲车、填壕——郝昭一应俱全地挡了回去。\r","\r","将军们请战：陛下，发兵救陈仓！\r","\r","我看了半晌舆图。陈仓距洛阳，隔着整个关中。\r","\r","救，要发大军，要耗粮草，要拿朕本就不多的日子去填这条官道。\r","\r","不救，郝昭那一千多人，就是在替朕守这道门。\r","\r","我提笔，写了一道与发兵无关的诏书——「郝昭守孤城，朕信卿能守。卿守到几时，朕便信到几时。」\r"],"desc":"","choices":[{"text":"发援兵——不惜代价救陈仓。","hint":"救急 · 耗粮耗日","next":"duel_intro","cond":"","effects":"junchen+5,shouming-5"},{"text":"传诏嘉勉——卿守孤城，朕信卿。","hint":"信人 · 郝昭果守下","next":"duel_intro","cond":"","effects":"shouming+4,junchen-3"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch_gongshi","title":"宫室","type":"scene","lines":["太极殿要修了。图纸摊在御案上，金瓦玉阶，巍峨得很。\r","\r","工部的人说：先帝留下的殿宇，配不上大魏的国运。洛阳的宫室，该有天子的气象。\r","\r","征发的役夫，已经过了万人。洛阳城外，新坟比新房多。\r","\r","杨阜伏阙直谏——这个老臣，跪在殿外，声音穿透了整个宫城：「陛下，民力为国之本！修宫室，伤民力，陛下三思！」\r","\r","他说完，伏地不起。天开始下雨。\r","\r","我看着那份图纸。修，还是不修——满朝的眼睛，都在这道诏书上。\r","\r","修了它，宫室成，万民苦。不修它，朕这病体，还能让天下记住几年？\r","\r","雨点砸在宫墙上，像有人在外面，替那些役夫敲门。\r"],"desc":"","choices":[{"text":"罢役——民力为国之本。","hint":"恤民 · 臣下失望于志","next":"ch_xingbian","cond":"","effects":"shouming+5,junchen-3"},{"text":"续修——帝王自有体统。","hint":"威仪 · 大工役耗天年","next":"ch_xingbian","cond":"","effects":"junchen+3,shouming-5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch_xingbian","title":"星变","type":"scene","lines":["太史令的奏章，是半夜递进来的。荧惑守心——火星，进了心宿。\r","\r","按星占，这是帝王之灾。\r","\r","朝堂上没人敢明说。只有高堂隆，伏阙直陈：请陛下修德以禳——减膳撤乐，省徭役，恤刑狱。\r","\r","他说话时，殿外的天光很暗。群臣屏息，等我的字。\r","\r","修德？朕这一生，从登基起就在跟天争命。减膳撤乐，能换回几天？\r","\r","可高堂隆的胡子都在抖——他是真的怕。怕朕，怕这天下，怕那粒荧惑落下来。\r","\r","我抬头看天。白天看不见星。但我能感觉到，它在那里。\r","\r","这道诏书，写的是禳灾，还是不服——天下人都会知道。\r"],"desc":"","choices":[{"text":"修德——减膳撤乐，以禳天灾。","hint":"信天命 · 示弱","next":"wuzhang","cond":"","effects":"shouming+6,junchen-4"},{"text":"斥之——朕命在天，何禳之有。","hint":"强硬 · 天年真的折","next":"wuzhang","cond":"","effects":"junchen+5,shouming-5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch_xiangping","title":"襄平","type":"scene","lines":["辽东的公孙渊，自立燕王了。\r","\r","檄文传到洛阳那日，朝堂像开了锅。有人主战，有人主抚——最后所有的目光，都落在一个名字上：司马懿。\r","\r","他已经老了。但辽东那地方，也只有他能平。\r","\r","将军们进言：陛下，不可再授兵权于司马氏！\r","\r","我望着舆图上辽东那片地。公孙渊不除，北疆永不安宁。可司马懿再胜一仗，这满朝，还有谁能压得住他？\r","\r","这趟辽东，去的是司马懿，回来的，未必还是那个臣子。\r","\r","金牌令箭还躺在盒子里。我用指腹，摩挲着盒盖上的龙纹。\r","\r","用，还是不用——这道诏书，是朕替这大魏下的最后一盘大棋。\r"],"desc":"","choices":[{"text":"遣司马懿——百战老将，兵权给足。","hint":"能胜 · 懿声望日隆","next":"ch_kaixuan","cond":"","effects":"junchen+6,shouming-4"},{"text":"遣毋丘俭——宗室旧将，稳妥。","hint":"防懿 · 或久攻不克","next":"ch_kaixuan","cond":"","effects":"junchen-4,shouming+4"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch_kaixuan","title":"凯旋","type":"scene","lines":["司马懿回来了。\r","\r","辽东平了。公孙渊的头颅，装在一只木匣里，先行送到了洛阳。我没有打开看。\r","\r","凯旋那日，洛阳城外，百官跪迎。我看见那支军队——旌旗蔽日，甲胄森然，行进之间，纹丝不乱。\r","\r","那是大魏的军队。可领军的人，姓司马。\r","\r","我站在城楼上，看着那支队伍由远而近。风很大，吹得我的袍角猎猎作响。\r","\r","司马懿在城楼下马，跪拜，山呼万岁。他的头，俯得很低。\r","\r","我看着他的背。当年棋局上，他也是这样俯着身——我始终没看清过他的脸。\r","\r","那支军队在他身后，整整齐齐，一动不动。\r","\r","城楼下，万岁声一浪高过一浪。我扶着垛口，站了很久。\r"],"desc":"","choices":[],"next":"final","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""}],"viewpoints":[]},{"id":"jianfeng","title":"剑锋之上","subtitle":"孤家寡人 · 其三 · 王冠与水","mode":"story","startScene":"start","W":5090,"H":514,"nodeSvg":"<g class=\"node\" data-id=\"start\" transform=\"translate(40,84)\" opacity=\"1\">\n        <rect width=\"200\" height=\"118\" rx=\"6\" fill=\"#14110e\" fill-opacity=\"0.85\" stroke=\"#5b8fb8\" stroke-width=\"2.5\" stroke-dasharray=\"5 3\" class=\"node-rect\"/>\n        <text x=\"10\" y=\"19\" font-size=\"14\" fill=\"#5b8fb8\" font-weight=\"700\">□</text>\n        <text y=\"0.9\"/><path d=\"M2160,124 C2180,124 2180,124.32 2200,124.32\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/><path d=\"M2400,155 C2420,155 2420,124.32 2440,124.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M3120,155 C3140,155 3140,124.32 3160,124.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M4080,155 C4100,155 4100,124.32 4120,124.32\" fill=\"none\" stroke=\"#d99a4e\" stroke-width=\"1.3\" stroke-dasharray=\"6 4\" opacity=\"0.9\"/><path d=\"M4320,124 C4340,124 4340,124.32 4360,124.32\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/>","laneSvg":"<rect x=\"0\" y=\"70\" width=\"5090\" height=\"332\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"85\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">剑锋之上</text><rect x=\"0\" y=\"70\" width=\"5090\" height=\"330\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"85\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">尾声 · 慢，但城终究会开</text><rect x=\"0\" y=\"232\" width=\"5090\" height=\"86\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"247\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">尾声 · 放弃水攻，这一战的名声与</text>","nodes":[{"id":"start","title":"加冠","type":"scene","lines":["正午，烈阳高照。副都宫殿外挤满了人，面向北方，长跪在地。\r","\r","今天是加冠大典。那顶冰冷而沉重的王冠触及我的发梢、稳稳箍住额头时，一股战栗般的狂喜自脊椎窜起——那不是激动，是权力灌顶时的灼痛与晕眩。\r","\r","「陛下，要示剑。」太后又开了口。\r","\r","我皱了皱眉，没有说话，自顾自登向城楼。城楼尽头，一位头发花白的老者伫立——「陛下，这是我宗宗主，按祖制，示剑应由宗主……」\r","\r","我没等他说完，推开了那扇半掩的红色漆门。\r","\r","城墙上视野开阔，城楼下跪拜的百官一览无余。\r","\r","我丢掉腰间宝剑，推开鼓手，亲自擂响了宣鼓。三声齐贺，加冕礼成。\r","\r","从今天起——规则，由我来制定。\r","\r","只是转身时，我看见城楼下那片乌压压的宗族行列里，有一双眼睛，正冷冷地望着我。\r","\r","那是成蟜的方向。我的弟弟。\r"],"desc":"","choices":[{"text":"回头扶起那位宗主，以晚辈之礼致歉——宗族还需他坐镇。","hint":"给旧规矩留一条活路","next":"c_tunliu","cond":"","effects":"旗标:honor_zong；weiwang-5,liangxin+10"},{"text":"从宗主身边径直走过，看也不看——新规则不需要旧人的祝福。","hint":"王冠之下，无旧无新","next":"c_tunliu","cond":"","effects":"旗标:spurn_zong；weiwang+10,liangxin-5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"dian","title":"狼烟","type":"scene","lines":["晌午，副都大殿。诡异——坐满人的大殿，鸦雀无声。殿门口的鸟雀落在案牍上啄食餐肉，也无人驱赶。\r","\r","「狼烟起了吗？」我率先开口。\r","\r","「还没。」不知是谁回了话。随即，又是一阵久长的沉默。\r","\r","我们都在等。等一个人叛乱，等叛乱后升起的狼烟，等一个名正言顺剿灭他的理由。\r","\r","夏日的暖风裹着檀香和百官压抑的呼吸。时间被拉得像丝一样细长。我数着自己的心跳，一下，两下——控制它，不能太快。\r","\r","终于，狼烟燃起来了。黑色的狼烟笔直刺入云霄，百里之外清晰可见。\r","\r","我知道，是时候了。\r"],"desc":"","choices":[],"next":"punish","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"punish","title":"殿上的狗","type":"scene","lines":["那个人被压到大殿上时，昂着头，骂骂咧咧，一脸不屑。\r","\r","他骂太后，骂先王，骂这满朝——骂得最响的一句是：「你连你母亲的位子都保不住！」\r","\r","我抬头看了看，略微一笑，把侍卫遣退，转头继续讨论沙盘上的布阵：「将军此去，不必在乎一城一池的得失。攻城为下，攻心为上。」\r","\r","偏殿的屏风挡住了他的视线，让他的叫骂显得那么无力。半晌后，叫骂减弱；一晌后，他开始沉默；一刻后，大殿里仿佛不存在任何人了。\r","\r","我们的讨论愈发轰轰烈烈——从治兵四方聊到横渠四句，从上兵伐谋聊到交兵攻城。\r","\r","一个时辰后，我送别将军们。他们抱拳告退，仿佛在夸我胆大心细——竟敢将谋逆的罪人不戴刑具置于身旁。\r","\r","大殿上，那个人还趴在地上大口喘气，形同一条癞皮狗。有人经过时还顺势踩了他一脚。\r","\r","但他们不知道的是——他的四肢，已经被我打断了。打断许久了。\r","\r","他是太后的假父。从今天起，他只是一个死人。\r"],"desc":"","choices":[],"next":"d_chelie","next2":"","effects":"weiwang+10,liangxin-5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"city_intro","title":"一座城的名字","type":"scene","lines":["第一次听到这座城池的名字时，它只是许多未攻克城池中的一环。「慢慢打，补给线拉得太长了也不好。」我轻轻带过。\r","\r","第二次，它的名字躺在奏折上，成了为数不多的孤城。总有几个慷慨悲歌之士嘛，并不奇怪。\r","\r","第三次，它的名字在将军们之间传唱，几个老将跃跃欲试。我笑了笑：去吧，姜还是老的辣。\r","\r","第四次，它被刻在沙盘上、画在作战图上、写在数封鸡毛信上。我不得不重新重视起来。\r","\r","十倍围之，围三阙一——怎么会拿不下一座小小的城池？\r","\r","直到现在，我亲自站在它的面前，我才真正感到了震撼。\r","\r","城头那面帅旗，在风里猎猎地响，像在应战。\r"],"desc":"","choices":[],"next":"city_seen","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"city_seen","title":"用战术掀翻战略的大手笔","type":"scene","lines":["这是一份用战术掀翻了战略的大手笔。\r","\r","城中两千余户，七千余人——青年壮丁，皆为士卒；老人妇孺，皆被食之。\r","\r","守城将士两千五百人，未有一人投降，更未有一人存活。\r","\r","一块惨白的趾骨在浑浊的水面微微打了个旋，沉了下去。我的胃部一阵抽搐——某个瞬间，一个近乎软弱的念头浮起：\r","\r","也许……我们该做点什么？\r","\r","那天夕阳低垂。饶是见惯了死人的随行将士们也一言不发，沉寂地走过一条条街道，搜寻着最后的活物。\r","\r","士兵们空手而归，沉默地摇着头。\r","\r","一切，都结束了。\r","\r","我站在城门口，闻着风里的味道。这个味道，我记了一辈子。\r"],"desc":"","choices":[],"next":"ts_suojian","next2":"","effects":"liangxin-10","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"flood_intro","title":"水","type":"scene","lines":["水。漫天的大水——不，还没有。但端午汛潮已至，接连五天的大雨，让上游的堤坝接连告急。\r","\r","沙袋刚下水即被冲走。我不得不让士兵们手拉着手下水，组成人墙，为抢修河堤争出时间。\r","\r","同时，我接连派出人马劝降，一遍又一遍地让使者告诉他们：降者，定不屠城。这已经是第五波了。\r","\r","眼下这座城地处下游，城深池固：护城河平均十余丈宽，最宽处三十丈；绊马坑、刺桩、火炬；城墙上的火箭、滚油、落石，数不胜数。\r","\r","我骑着马伫立在山头，在心里默默计算着降雨量和时间。\r","\r","哼。我可不是什么善男信女。惹恼了我，我也会屠城。\r","\r","随着最后一批劝降的士兵尸体被抬到我面前，我终于下定了决心。\r","\r","开闸，还是收闸——这个决定，今夜就要落。\r"],"desc":"","choices":[{"text":"「开闸！」——毁堤开闸，以水为兵。","hint":"水攻 · 王威最大，良知的账以后再算","next":"duel_city","cond":"","effects":"旗标:use_flood"},{"text":"再围一个月——断粮断水，耗到最后一人。","hint":"围困 · 慢，但城终究会开","next":"duel_city","cond":"","effects":"旗标:use_siege"},{"text":"「收闸，回军护堤。」——城可以明年打，堤若崩，下游万户先完。","hint":"护堤 · 放弃水攻，这一战的名声与胜期都押后了","next":"hold_dike_scene","cond":"","effects":"旗标:hold_dike；weiwang-10,liangxin+20"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hold_dike_scene","title":"堤上 · 人墙","type":"scene","lines":["「陛下！水攻之机，千载难逢——」将军们跪了一堤。我没有回头，只说了一句：「下游还有万户。朕的天下，不拿朕的民垫城。」\r","\r","全军回师护堤。那一夜，士兵们手拉着手泡在齐胸的洪水里，我在堤上站到下半夜——王冠没有戴，蓑衣是跟一个火头兵借的。\r","\r","黎明时分，水退了半尺。堤，保住了。城头的守军远远望着我们，没有放箭——后来我才知道，那一夜城里也在发水，他们忙着堵自己的城墙。\r","\r","次年开春，大军复至。围城两月，城中粮尽。第三个月，城门开了——不是降书，是战书：两千五百人尽数出城列阵，求战而死。\r","\r","那一仗从辰时杀到酉时。没有洪水，没有溃堤，只有一支守到最后一人的军队，和一个把水闸关上过的帝王。\r","\r","我在阵前站了很久。身后，那条渠的图纸，已经开始在工部传看了。\r"],"desc":"","choices":[],"next":"end_nowater","next2":"","effects":"weiwang+5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"duel_city","title":"孤城之战","type":"duel","lines":["五波劝降的尸体排成一列。城头那面猎猎作响、顽抗了数月的帅旗，还在。\r","\r","我勒马山头，做了帝王隐忍整整五天的决定。这一战，攻下它——用什么攻，天知道，城知道，我知道。\r","\r","风从河谷灌上来，带着潮气。我的指尖，搭上了腰间的剑柄。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_gucheng","pick":"","minigame":""},{"id":"g_win","title":"洪水","type":"scene","lines":["「开闸！」\r","\r","半晌后，铺天盖地的洪水咆哮着，夹杂着泥土、树木和无数我看不清的东西，浩浩荡荡向下游袭去。\r","\r","那条让我们颇为头疼的护城河，此时成了洪水的帮凶，引领着浩荡洪水一路涌进这座城市。\r","\r","顷刻间，那面帅旗像被一只巨手捏碎般，瞬间吞噬于浑浊的怒涛之中。\r","\r","与之同时消失的，还有声音。那原本应该出现的惨叫声、呼唤声、求救声，都在洪水的高压下一一覆灭。\r","\r","小子——这是帝王隐忍了整整五天的愤怒。\r","\r","洪水退去后的城，安静得像一座坟。我站在城头，脚下的淤泥还在冒着泡。\r"],"desc":"","choices":[],"next":"a_hanjian","next2":"","effects":"weiwang+15,liangxin-15","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"g_lose","title":"拉锯","type":"ending","lines":["这一仗打得极苦。城墙反复易手，尸体积在护城河里，把河都填窄了。\r","\r","洪水终究还是来了——不是开闸放的水，是连日暴雨冲垮了上游残堤。天替你做了决定，只是晚了十天，多拿了一万条人命垫底。\r","\r","城破那日，帅旗折在泥里。最后一个守卒抱着旗杆，站在水中央，没有跪。\r","\r","我看着他，他也看着我。水漫到他的胸口，他始终没有松手。\r","\r","后来军报上写：城破，敌帅殁。没有人写他站了多久，也没有人写那根旗杆最后是谁收的。\r","\r","我在中军帐里坐了一夜。案上那卷修渠的图纸，被烛泪滴穿了两个洞。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"weiwang+5,liangxin-10","ending":"拉锯（败线结局 · 天替你来）","endingDesc":"洪水还是来了，只是晚了十天——多拿了一万条人命垫底。","shop":"","duel":"","pick":"","minigame":""},{"id":"aftermath","title":"新死的城","type":"scene","lines":["秋风无意马蹄迟，一日看尽此城花。\r","\r","我策马，在这座新死的城池街道中缓辔而行。战马蹄下是深可没蹄的淤臭泥泞，废墟遍布，唯剩几堵残壁倔强地立着，布满泪痕般的水渍与裂痕。\r","\r","空气里弥漫着潮湿霉味，还有一种甜腻到令人作呕的死亡气息，压得人喘不过气。\r","\r","士兵们忙碌地东奔西走，周围却始终静悄悄的——只有偶尔的水流声和战马的嘶吼，提醒着我眼前的寂寥与悲凉。\r","\r","我深深地吸了一口气，试图平复内心的波澜。\r","\r","终于，许久后，我平复了心情，也说服了自己。\r","\r","城门口，一块空地。有人搬来了石料。\r"],"desc":"","choices":[{"text":"「慈不掌兵。这是战争。」——合上眼，翻身上马，不再看。","hint":"帝王之术 · 把那点软弱埋进泥里","next":"end_iron","cond":"","effects":"旗标:heart_iron；weiwang+5,liangxin-5"},{"text":"为两千五百守将立碑——不写国号，只刻八个字：皆为士卒，无一人降。","hint":"帝王也是人 · 需良知≥55 · 一块碑压不住什么，但立了","next":"end_stone","cond":"{\"statAtLeast\":{\"liangxin\":55}}","effects":"旗标:heart_stone；liangxin+15"},{"text":"「传史官。」——水攻一事，直笔入史，一字不许讳。","hint":"直笔 · 需良知≥70 · 千古骂名，自己背","next":"end_brush","cond":"{\"statAtLeast\":{\"liangxin\":70}}","effects":"旗标:heart_brush；liangxin+10"},{"text":"「再搜一遍。」——传军医入城，活要见人。","hint":"再搜 · 也许什么都搜不到，也许","next":"end_search","cond":"","effects":"旗标:heart_search；liangxin+10"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_iron","title":"结局 · 剑锋之上","type":"ending","lines":["后来的史书说：帝雄猜果决，加冠三月而诛强藩，一年而清宇内，水破孤城，天下震栗。\r","\r","再后来，说书人们讲到这里，总要压低声音加一句——「可你们知道吗，那天之后，陛下再也没有骑过马。」\r","\r","没人知道为什么。史书不记，陛下不说。\r","\r","只有那匹战马知道：那座新死的城里，有一种甜腻的味道，从那天起，就再也没从主人的梦里散去过。\r","\r","剑锋之上，是王冠。王冠之上——什么都没有。\r","\r","多年后有人进谥。史官说，陛下提笔，写了一个字，又涂掉了。\r","\r","涂掉的那个字是什么，没有人看清。只是有宫人赌咒说，像是「仁」。\r","\r","又有人说，像是「守」。\r","\r","到底写了什么，只有陛下自己知道——而那匹战马，已经在宫苑里老得走不动路了。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"剑锋之上（铁血结局）","endingDesc":"你赢得了整个天下，和一场一辈子醒不来的梦。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_stone","title":"结局 · 无字之碑","type":"ending","lines":["碑立在城门口，没有国号，没有帝号，只刻了八个字：「皆为士卒，无一人降。」\r","\r","将军们不解：陛下为何给叛军立碑？\r","\r","我说：不是给叛军——是给两千五百个没投降的人。\r","\r","没人再问。碑立在洪水退去的淤泥里，一年一年，苔痕爬满了字缝。\r","\r","很多年后，我统一了天下。史官请谥，我提笔想了很久，最终圈了一个字：「武。」\r","\r","然后又在旁边，极小极小地，添了一个字。\r","\r","史官没看清那个字。他也不敢问。\r","\r","那个字是——「仁」。\r","\r","郑国渠的渠水还在流。灌溉的田，一季一季地绿。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"无字之碑（隐藏结局）","endingDesc":"慈不掌兵——但掌了兵的那颗心，还留着一块柔软的地方。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_nowater","title":"结局 · 水未用","type":"ending","lines":["后来的史书这样记：某年端午，汛潮危堤，帝罢水攻之谋，回军护堤，堤得全，下游万户无恙。\r","\r","再后一页：次年春，帝复围孤城，城破，守军两千五百人尽殁，无一人降。\r","\r","两页之间，隔着整整一个冬天。将军们私下说，那个冬天陛下瘦了很多——围城的粮道是他亲手画的线，每一笔都稳，只是画得慢。\r","\r","只有我知道那个冬天我在等什么：我在等自己确认，那座城，不是我用水杀的。\r","\r","水没有错。错的是开水的人——这一次，那个人没有开。\r","\r","多年后一统天下，有人进谥，拟了「武」与「烈」。我都没要，自己提笔写了一个——「守。」\r","\r","守堤的守。守心的守。\r","\r","工部呈上来年开渠的预算，我在朱批上只写了两个字：准凿。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"水未用（仁兵结局 · 闸在你手里）","endingDesc":"城还是破了，可史书上永远写不出「水攻」两个字。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_brush","title":"结局 · 直笔","type":"ending","lines":["史官跪在泥里，笔悬在半空，不敢落。\r","\r","「写。」我说，「某年某月，帝以水灌城，城溃，军民尽殁。帝曰：此事，朕一人所为。」\r","\r","「陛下，这……这是要挨千古骂的。」他的声音在抖。\r","\r","「朕知道。」我翻身下马，站在那片新死的淤泥里，「骂名也是名。总要有人把这笔账记下来，记清楚了——才有人记得还。」\r","\r","他落了笔。那一行字后来被刻进了正史，也刻进了野史，刻进了说书人的醒木底下。\r","\r","很多年后，有个孩子在学堂里读到这一行，问先生：这个皇帝是好人还是坏人？\r","\r","先生想了很久，说：都不是。他是一个做了那件事、又没肯假装没做的人。\r","\r","孩子似懂非懂。但那一行字，他背下来了。\r","\r","多年后，郑国渠的灌区里，那个孩子当了主簿。他治水的第一件事，是把渠首的碑文拓了一份，寄回了咸阳。\r","\r","碑文上没有字。只有八个点——像一个人，终于把心里的什么东西，放下了。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"直笔（直笔结局 · 自领骂名）","endingDesc":"你没有把洪水写进别人的账里——这一笔，是你自己签的名。","shop":"","duel":"","pick":"","minigame":""},{"id":"end_search","title":"结局 · 那一次搜寻","type":"ending","lines":["军医与士卒重新入城。淤泥没过小腿，每个人手里都举着灯。\r","\r","搜了三天。第一天什么都没有；第二天，什么都没有；第三天将尽时，城南一口倒扣的铜钟底下，传出一声极轻的咳嗽。\r","\r","是个孩子，八九岁，抱着半坛雨水，在钟底下撑了不知多少天。见到灯火，他没有哭，只是哑着嗓子问了一句：「仗，打完了吗？」\r","\r","「打完了。」我听见自己说。\r","\r","我没有把他带回营中，也没有写入捷报。我把他托付给山下一户没有被征过粮的人家，改了他的姓，给了他一个和这座城无关的名字。\r","\r","将军们问：陛下，那孩子算什么？战果？俘虏？\r","\r","我说：都不是。他算这场仗里，我们唯一留下来的一点东西。\r","\r","很多年后我死了。听说有个乡间的教书先生，每年端午都要朝着这座废城的方向，摆一盏灯。\r","\r","没人知道为什么。灯一直摆着。\r","\r","又过了些年，关中修渠的工地上，来了一个年轻的监工。他说他姓韩，是个孤儿。\r","\r","他画的渠线，笔笔都像那张被烛泪滴穿过的图。\r"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"那一次搜寻（余温结局 · 留下一条命）","endingDesc":"洪水吞掉了一座城，你从铜钟底下，捞回了一粒火种。","shop":"","duel":"","pick":"","minigame":""},{"id":"c_tunliu","title":"屯留","type":"scene","lines":["加冠第七日，边报入京：长安君成蟜将兵击赵，行至屯留，举兵反。\r","\r","使者跪在殿下，双手捧着那卷帛书，抖得像风里的纸。帛书上是成蟜的檄文——「王以母迁雍，囚太后，乱人伦，天下其谓秦何」。\r","\r","我看完，把它叠好，放在案角。\r","\r","宗室连夜入宫，跪了一地：请王发兵，正国法，安人心。\r","\r","「他是我弟弟。」我说。\r","\r","没人敢接话。殿外，狼烟未起——但我知道，它已经在路上了。\r"],"desc":"","choices":[{"text":"发兵讨——王命讨逆，叛者族诛。","hint":"雷霆 · 宗室胆寒","next":"c_changanjun","cond":"","effects":"weiwang+8,liangxin-8"},{"text":"遣使招抚——成蟜若归，既往不咎。","hint":"怀柔 · 宗室可安","next":"c_changanjun","cond":"","effects":"liangxin+8,weiwang-5"},{"text":"按兵不动——看他自溃。","hint":"拖延 · 不费一兵","next":"c_changanjun","cond":"","effects":"weiwang-3,liangxin+3"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"c_changanjun","title":"长安君","type":"scene","lines":["屯留的降表与战报先后到了。成蟜败了——不是败给秦军，是败给他自己的军心。兵士哗变，绑了他献出城门。\r","\r","囚车入京那日，我站在城楼上看着他。他抬头，隔着老远，与我四目相对——然后别过头去，像小时候赌气那样。\r","\r","处置的条陈，就摊在案上。\r","\r","他是王弟。是宗室的脸面。也是第一个敢举兵的反贼。\r","\r","这道命令落下去，宗室会记住一辈子：王，对血脉也下得去手。\r"],"desc":"","choices":[{"text":"尽诛其党——血脉也当正法。","hint":"斩尽 · 宗室再不敢望","next":"dian","cond":"","effects":"weiwang+6,liangxin-6"},{"text":"罪止成蟜——余者不问。","hint":"宽宥 · 收宗室之心","next":"dian","cond":"","effects":"liangxin+6,weiwang-4"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"d_chelie","title":"车裂","type":"scene","lines":["嫪毐的车裂令，是他自己讨来的。\r","\r","可太后怎么办？朝堂上，臣下们的眼睛都望着我——他们在等一个态度：是国法，还是母子之情。\r","\r","太后宫里传出话来，说她病了，不见任何人。\r","\r","我站在殿前，看着那道通往太后寝宫的长廊。长廊尽头，帘子低垂。\r","\r","有人递上条陈：迁太后于雍，以正视听。\r","\r","也有人低声劝：母子连心，天下人看着呢。\r","\r","这道旨意下去，天下的孝，和天下的法，总有一个要先低头。\r"],"desc":"","choices":[{"text":"迁太后于雍——以正国法。","hint":"国法 · 天下见王不徇私","next":"d_maojiao","cond":"","effects":"weiwang+8,liangxin-6"},{"text":"嫪毐罪止其身——全太后颜面。","hint":"母子 · 宫闱秽闻按下","next":"d_maojiao","cond":"","effects":"liangxin+6,weiwang-4"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"d_maojiao","title":"茅焦","type":"scene","lines":["迁雍的诏书下了。太后的车驾出宫那日，我站在宫门上，没有下去送。\r","\r","七日后，齐人茅焦伏阙。他抬着一口棺材来的。\r","\r","「陛下有狂悖之行——车裂假父，迁母于雍，恐天下闻之，皆欲背秦而去。」他说这话时，声音很平，像在念一页早就写好的讣告。\r","\r","侍卫的刀已出鞘。朝臣屏息，等着我说那个字。\r","\r","我看着那口棺材。棺材是新的，木纹还没被雨淋过。\r","\r","茅焦跪在棺材旁，白发在风里飘。他连死的地方都替自己选好了。\r"],"desc":"","choices":[{"text":"从茅焦谏——迎太后归。","hint":"纳谏 · 天下称孝","next":"b_zhuke","cond":"","effects":"liangxin+10,weiwang-5"},{"text":"王命已下——岂可反覆。","hint":"固执 · 茅焦伏诛","next":"b_zhuke","cond":"","effects":"weiwang+6,liangxin-6"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"b_zhuke","title":"逐客议","type":"scene","lines":["嫪毐案毕，吕不韦免相。朝堂忽然安静下来——安静得能听见廊下滴水。\r","\r","宗室大臣联名上书：诸侯人来事秦者，大抵皆为其主游间于秦耳，请一切逐客。\r","\r","名单递上来，密密麻麻一页。我数了数，里面有几个名字，是这些年替秦修过城、练过兵、写过法令的。\r","\r","朝臣们说：王，秦之社稷，当以秦人守之。\r","\r","殿外，各国来客的车马，已经开始有人收拾行装了。\r"],"desc":"","choices":[{"text":"一切逐客——秦之社稷，秦人守之。","hint":"快意 · 人才散","next":"b_kesheng","cond":"","effects":"weiwang+8,liangxin-8"},{"text":"召李斯庭对——听他怎么说。","hint":"纳谏 · 客卿可留","next":"b_kesheng","cond":"","effects":"liangxin+10,weiwang-5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"b_kesheng","title":"客卿","type":"scene","lines":["逐客令拟好，只差用印。\r","\r","掌印官抱着印匣站在殿角。我提笔，又放下。\r","\r","「把那个楚人叫来。」我说。\r","\r","李斯上殿时，衣裳已经换成了布衣——逐客名单上，他的名字排在很前面。他没有跪，也没有求，只说了三句话：\r","\r","「太山不让土壤，故能成其大；河海不择细流，故能就其深。」\r","\r","「王欲成帝业，而弃客以资敌国——此所谓借寇兵而赍盗粮者也。」\r","\r","他说完，退后一步，站在殿中央，等我的字。\r","\r","殿外，各国客卿的车马已经停在了城门口。掌印官抱着印匣，等我。\r"],"desc":"","choices":[],"next":"bf_panchen","next2":"","effects":"旗标:li_keshi","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"bf_panchen","title":"叛臣","type":"scene","lines":["断了四肢的叛臣还押在偏殿，等人发落。\r","\r","将军们来请示：枭首示众，以儆效尤？还是……留他一口气，还有用？\r","\r","我搁下朱笔，看着窗外。\r","\r","这道命令，将决定此后三年，军中提起\"叛逆\"二字时的脸色。\r"],"desc":"","choices":[{"text":"枭首示众——叛者皆鉴。","hint":"威慑 · 军中肃然","next":"city_intro","cond":"","effects":"weiwang+8,liangxin-5"},{"text":"留他一口气——戴罪立功。","hint":"物尽其用 · 示天下宽","next":"city_intro","cond":"","effects":"liangxin+8,weiwang-3"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ts_suojian","title":"屠城所见","type":"scene","lines":["夜里，将军们等在中军帐外——等一个命令：这是座死城，烧了干净，还是留着？\r","\r","我坐在灯下，面前摊着那张标满记号的地图。\r","\r","城可以不烧。人可以不杀。但这条军令传下去，是宽是严，三年内军中自有回响。\r"],"desc":"","choices":[{"text":"严令止杀——此后攻城不得滥杀。","hint":"立线 · 军中或有怨","next":"flood_intro","cond":"","effects":"liangxin+10,weiwang-5"},{"text":"兵不厌诈——继续推进。","hint":"铁腕 · 把那点软弱埋进泥里","next":"flood_intro","cond":"","effects":"weiwang+8,liangxin-8"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"a_hanjian","title":"韩间","type":"scene","lines":["城战方歇，朝堂上又起了一桩风波。\r","\r","韩国使臣郑国被押上殿——他献的那卷修渠图，原是疲秦之计：凿泾水，修长渠，耗秦之力，使秦无力东伐。\r","\r","图纸摊在御案上，线条精细，从泾水蜿蜒到洛水，三百余里。画这张图的人，花了十年。\r","\r","宗室老臣齐声请诛：「韩人无信，其图当毁，其人当烹！」\r","\r","郑国跪在殿上，没有辩解。他只是抬头，看了那张图一眼——像看一个养了十年的孩子。\r","\r","「大王。」他终于开口，「始臣为间，然渠成，亦秦之利也。」\r","\r","殿上静了一瞬。我低头，又看了一遍那张图。\r"],"desc":"","choices":[{"text":"烹——韩人无信，其图当毁。","hint":"泄愤 · 渠废","next":"a_qucheng","cond":"","effects":"weiwang+8,liangxin-5"},{"text":"留——渠成亦秦之利。","hint":"远见 · 朝堂哗然","next":"a_qucheng","cond":"","effects":"liangxin+10,weiwang-5；旗标:zheng_kept"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"a_qucheng","title":"渠成","type":"scene","lines":["「渠成亦秦之利」——这话，宗室不信，将军不信，连郑国自己，大约也只信了五分。\r","\r","可我看的是那张图：三百里长渠，灌田四万余顷，关中从此为沃野。\r","\r","朝臣们等着我说那个字。是烹，还是留。\r","\r","我站起来，把图纸卷好，递给工官：「凿。」\r","\r","满殿哗然。宗室老臣的胡子都在抖。\r","\r","「王——此韩人之计也！」\r","\r","「计是韩人的，渠是秦的。」我说，「他画了十年的图，我修十年的渠。十年之后，谁还记得疲秦不疲秦——只记得关中多了一季又一季的收成。」\r","\r","郑国被押下去时，回头看了我一眼。他没有说话，只是把腰挺直了些。\r","\r","这条渠，后来叫郑国渠。\r"],"desc":"","choices":[],"next":"aftermath","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""}],"viewpoints":[]},{"id":"xingxing","title":"星星之火，可以燎原","subtitle":"祠堂 · 隔板 · 识字班","mode":"story","startScene":"start","W":4850,"H":532,"nodeSvg":"<g class=\"node\" data-id=\"start\" transform=\"translate(40,84)\" opacity=\"1\">\n      <rect width=\"200\" height=\"56\" rx=\"6\" fill=\"#1c1915\" fill-opacity=\"0.8\" stroke=\"#5b8fb8\" stroke-width=\"2.5\" stroke-dasharray=\"5 3\" class=\"node-rect\"/>\n      <text x=\"8\" y=\"18\" font-size=\"14\" fill=\"#5b8fb8\" font-weight=\"700\">□</text>\n      <text x=\"27\" y=\"17\" font-size=\"13.5\" fill=\"#e8d9b0\" s 走得快</text><rect x=\"0\" y=\"70\" width=\"4850\" height=\"86\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"85\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">尾声 · 黑边领章</text><rect x=\"0\" y=\"232\" width=\"4850\" height=\"86\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"247\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">尾声 · 守灯人</text>","nodes":[{"id":"start","title":"祠堂","type":"scene","lines":["祠堂的年头比村里最老的老人还长。梁上的灰，积了厚厚一层。","杨先生站在门槛上，用手掌抹了抹门板，那上面刻着两个旧字——是村里人自己刻的，认不全，只知道是好话。","「这屋子好。」他说，「比我们的干部学校，亮堂。」","我们把长凳从车上搬下来，一条一条，摆进祠堂。凳子腿长短不齐，垫了石片，才勉强站稳。","夜里，煤油灯点起来。灯芯是新捻的，火苗一跳，一跳，把祠堂的影子拉得老长。","他坐在灯下写东西。笔是秃的，蘸一次墨，写不了几个字——他就蘸，写，蘸，写，腰板始终挺得笔直。","我站在门口看了一会儿。他头也不抬，只说了一句：「进来坐。夜里凉。」","祠堂外，风从山坳里灌过来。远处有人唱歌——调子不齐，断断续续，像在学一句新词。","他停下笔，听了一会儿：「这是谁教他们的？」","「识字班的孩子。」我说，「今天学的第一课。」","他点了点头，没再问。笔尖落回纸上，继续写。"],"desc":"","choices":[],"next":"zhengzhi","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"zhengzhi","title":"军阀！旧军阀！","type":"scene","lines":["第二天一早，我们在祠堂前的空地上开班。板凳不够，孩子们就站着，踮着脚，往前挤。","「同志们，今天我们讲讲——什么叫军阀。」他站在门板前，声音不大，却清清楚楚，「军阀，就是手里有枪，不讲道理的人。」","「我们这里，有过几个军阀？」","孩子们七嘴八舌：「上一个！上一个是收捐的！」「还有，还有那个抓壮丁的——我爹就是被他抓走的！」","他等他们嚷完，才慢慢说：「旧军阀走了，新军阀又来。换汤不换药——你们说，这叫什么？」","「叫……叫换人收钱！」一个孩子抢答。","「对了一半。」他笑了，「还叫——没有人替你们说话。」","空地上安静了一瞬。有大人低声问：「先生，那谁来替我们说话？」","他指了指孩子们：「等他们认了字，自己说话。」"],"desc":"","choices":[],"next":"geban_intro","next2":"","effects":"junxin-5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"geban_intro","title":"深夜 · 煤油灯","type":"duel","lines":["我想起了白天发生的事情，于是拉开隔板，试探性地喊道：「该睡觉咯。」","他扭头看了看我，又转过头去，没有任何回应。","「你不睡，朱军长也不睡，他年纪可比你大。」","「我不跟没有立场的人讲话。」他快步走了过来，一把关掉了隔板。","我连忙推动隔板，但另一端被他摁住了，怎么也推不动。","「好嘛，不想讲就不要讲咯。反正我是跟着你们两个出来的，你们两个就是我的立场。」","隔板的另一边，沉默了。","煤油灯的影子在隔板上晃。今夜这一道薄薄的木板两侧，得有人先把话递过去。","灯芯爆了一声。隔板那头，传来他翻动纸张的声音——沙沙，沙沙，像山里的夜虫。","我躺着，没有睡。忽然想起白天他站在祠堂门口说的话：「这屋子好，比我们的干部学校亮堂。」","他的干部学校，大概也和他的人一样——门关得紧，灯亮得久。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_geban","pick":"","minigame":""},{"id":"gb_win","title":"隔板 · 拉开了","type":"scene","lines":["话接住了。先是伤员，再是乡音，再是干部学校——隔板那头的力气，一点一点松了。","「还是让朱军长先去整顿吧，免得战士们对你们两个产生误会。」我说。","「那好。」隔板忽然被猛地拉开，「你把这个拿给朱军长，按照上面的要求整顿。他军训起得早，你早点拿给他。」","他把桌案上厚厚一沓文件递给我，又顿了顿：","「还有，明天会上可能有人提出，要带一支部队去打广州打潮州。你的态度一定要鲜明——这支队伍，不能散。」","我接过那沓文件。许多文件上面的墨水，甚至还没有干。","「好嘛，我睡了。反正明天我还要去办我的干部学校。」","「多少个了？」他停住手中的笔，抬起了头。","「马上开讲的有六个，还有十几个正在跑。开讲的第一课，都由你来讲。」","「我最喜欢听的，就是人家叫我先生。」他又埋下了头。深邃的眼睛里，仿佛在回想着什么。","「好——先生～睡觉咯。」我学着他的湖南方言，笑着拉下了隔板。","这回，轮到我拉隔板了。","隔板合上，屋里暗下来。我听见他在那头，轻轻笑了一声——很短，像灯花爆了一下。"],"desc":"","choices":[],"next":"kaike","next2":"","effects":"旗标:geban_heart；xinhuo+10","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"gb_lose","title":"隔板 · 一夜","type":"scene","lines":["话没递进去。隔板那头的煤油灯，亮到了后半夜。","天亮时文件还是交到了我手上——只是他什么也没多说，只交代了一句：「按文件办。会上，态度要鲜明。」","我没能听他说一句「先生」。也没能听他说一句多余的话。","大概在他那里，任务从来不需要寒暄。可我总觉得，隔板那晚少了一点什么。","我把文件收好。出门时，看见他桌上那盏灯，油已经尽了——灯芯烧得焦黑，翘着，像一句没说完的话。"],"desc":"","choices":[],"next":"kaike","next2":"","effects":"xinhuo-5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"kaike","title":"识字班 · 「人」","type":"scene","lines":["「杨先生，开课咯～」当地妇女干部一声呼喊，孩子们的注意力都被吸引了过去。","城角的小屋内挤满了大大小小的孩子，拉着彼此缝满补丁的衣服，紧紧挨在一起，勉强坐上那几条缺了角的长凳。","水滴从腐蚀已久的屋檐掉落。他在竖起的残破桌板上，淡淡描下了一撇一捺。","「同学们，这个字念『人』。哪个同学能告诉我，这个『人』，是什么意思啊？」","他轻轻敲了一下门板，微笑着望向下面昂着头的孩子们，眼神里满是期待。","忽然，一个稚嫩的声音吸引了大家的注意：","「人是地主。地主说我们是牛马。奶奶说，我们不如牛马。」","小屋内顿时鸦雀无声。所有人都看着他，看他会如何回复。","屋檐的水滴，落在门槛上，一声，一声。孩子们的眼睛，亮晶晶的，齐刷刷望着他。"],"desc":"","choices":[{"text":"沉默地等他。这是他的课，也是他的难题。","hint":"旁观 · 你会看到他怎么接","next":"kaike_ren","cond":"","effects":"旗标:watch_class"},{"text":"蹲到孩子中间，替他圆一句：「奶奶是说反话——我们不是牛马。」","hint":"搭一把手 · 课是你的，也是所有人的","next":"kaike_ren","cond":"","effects":"旗标:help_class；xinhuo+5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"kaike_ren","title":"「人」与「手」","type":"scene","lines":["他愣住了。仿佛有点不敢相信——相信那似乎早已深入骨髓的熟练说辞；又仿佛想争辩些什么。可注视着孩子们天真的眸子，终又放弃。","他嘴角的弧度不自觉地消失，眼眸也逐渐低垂。他沉重地背过身去，在门板上颤抖着写下了另一个字。","「这个字念『手』。我们人人都有一双手。地主剥削阶级的手，是拿着剔骨刀，欺压我们穷人。」","「我们穷人的双手，是要做什么呢？」","疟疾的疼痛让他的手不由自主地发颤，他甚至伸不开手指，只能半握拳式地悬在半空。","孩子们也学着他的模样，歪歪扭扭地伸出了黑漆漆的手掌。","「抢过剔骨刀，打倒他们——不做牛马，要做人！」角落里，一个骨瘦如柴的孩子第一个站了起来。","那天的课散了很久，我耳边一直响着那个孩子的声音。要做人。","孩子们散去了，他还站在门板前，盯着那两个歪歪扭扭的字。左手按着腰，像在忍一阵疼。","他没有回头，只说了一句：「这两课，是我教过最好的课。」"],"desc":"","choices":[],"next":"ranfang","next2":"","effects":"xinhuo+5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ranfang","title":"染坊 · 宣纸","type":"scene","lines":["染坊内，染纸的梭线被人卖力地拉动着。老板刚铺好一块染好的纸板，又搬到另一侧——虽是忙碌奔走，眼睛却一直盯着先生所在的位置。","「那天，我看你好像得了摆子病。」老板停下手中的活，擦了擦手，递过去一支烟卷。","「时好时不好，没问题。」先生接过烟卷放进口袋，又接着奋力搅动池子里的水，不在意地答道。","「一张纸，能卖几文钱啊？」","「我们这里啊，是红白两区。赶上白区，挣不了多少钱，都是抢。这两年好了些，成红区了，码头也变好了，学生们也敢回来了。」","先生抬头看了看周围的工人：「白区的时候，这些工人怎么办呢？」","「怎么办，有我吃的他们饿不到哪儿去。少干活，少吃饭。」","「对不起老哥哥，那天我态度不好，我向你道歉。」","「不用道歉，快拿着纸走吧，今天的工钱够了，回去写字吧——等会山匪冲下来，看到生人，就麻烦了。」老板指着那几沓染好的宣纸，释放出了属于他的善意。","先生点了点头，把宣纸夹在身侧，不舍地离开了这座染坊。","走出两步，他停下来，回头看了你一眼。","那一眼里没有话。可他站在原地，等了两步——像是等你，也像是等这池子边的人，自己先开口。"],"desc":"","choices":[{"text":"跟上先生。孩子们还等着那张纸。","hint":"主线 · 纸比人走得快","next":"xx_zhengdun","cond":"","effects":""},{"text":"你留了下来。先生可以走——这池子边的人，总得有人教。","hint":"需心气≥55 · 亦师","next":"end_xiansheng","cond":"{\"statAtLeast\":{\"xinhuo\":55}}","effects":"旗标:stay_worker；xinhuo+10"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_xiansheng","title":"结局 · 先生","type":"ending","lines":["后来我果然做了先生。","不是杨先生那样的先生——我教的是染坊的工人。白天他们浸纸、晾纸，夜里收了工，就着染池边那盏灯，学写字。","头一课教写名字。王二的「王」，他练了半宿，满纸都是。他举着那张纸看了很久，说：这字是我的。这辈子上头的人念我名字的时候，总算有个样子给他看了。","再后来教他们看布告。白区的布告贴一墙，从前只听人念，念什么信什么。现在自己看——看一句，骂一句。有人把布告揭下来，折好，揣进怀里：留着，等翻过身来，当状纸。","山匪下来那回，他们抄着晾纸的竹竿上了街。没打赢，也没全输——他们到底是学会了一样东西：这年头，会认字的人，命是自己的。","队伍再回来的时候，染坊的墙上多了一行字，是工人们自己写的。字歪歪扭扭，比先生差远了——","可每一个字，他们都认得。","那行字是：此地有我们。","灯就点在我教他们写字的池边。那盏灯，是染坊老板留下的——他说，白区的时候，他也是这样，点着一盏灯，等天亮。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"先生（结局 · 亦师）","endingDesc":"你没能成为杨先生，你成了他的回声。那行字，是他们自己写下的。","shop":"","duel":"","pick":"","minigame":""},{"id":"xx_zhengdun","title":"整顿 · 能打仗","type":"scene","lines":["队伍驻扎下来，麻烦也跟着来了。","有人在镇上赌钱，欠了账；有人拿了老乡的鸡，说是「征用」；夜里点名，总有睡过头的。","军法官把名单拍在桌上：三个，够杀一儆百。","朱军长听完，把烟袋往桌上一磕：「杀？杀了，谁来打仗？这些人，是我一手带出来的兵，能打仗！」","杨先生没说话。他等朱军长说完，才开口：「兵要练，仗要打——可兵为什么打仗，得先讲清楚。」","两句话，一个主张杀，一个主张练。满屋子人看着我——我这个随队写字的，被夹在中间。","灯芯爆了一声。军法官、朱军长、杨先生，三双眼睛，都落在我身上。"],"desc":"","choices":[{"text":"支持军法官——纪律不立，队伍就散了。","hint":"立威 · 心气蚀","next":"xx_zhengxun","cond":"","effects":"junxin+8,xinhuo-5"},{"text":"随朱军长——能打仗，就是好兵。","hint":"务实 · 心气微蚀","next":"xx_zhengxun","cond":"","effects":"junxin+5,xinhuo-3"},{"text":"随杨先生——先讲清楚「为什么打仗」，再谈怎么打。","hint":"教育 · 军心蚀","next":"xx_zhengxun","cond":"","effects":"xinhuo+8,junxin-5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"xx_zhengxun","title":"整训 · 一支连队","type":"scene","lines":["整顿不是杀头，是上课。","杨先生把「人」字，搬到了连队里。第一课，还是那两个字：人、手。","不一样的是，这次讲的是兵——「当兵的也是人。打仗，是为了让天下人都能像人一样活着。」","他把连队分成班，每个班选一个班长——选的不是官最大的，是肯教人识字的。","伙食同灶。军官和士兵，一个锅里舀饭。有人不习惯，杨先生说：同灶吃饭，同心打仗。","我教他们写自己的名字。有一个老兵，练了半宿，把「人」字写了满纸，举起来说：报告，我会写「人」了。","那晚的灯，又亮到很晚。杨先生路过我桌边，看了一眼我写的字：字是好字。就是太规矩——让它们，活一点。"],"desc":"","choices":[],"next":"xx_lide","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"xx_lide","title":"争论 · 李德","type":"scene","lines":["整训还没完，来了个苏联顾问——李德。","他带来了地图、沙盘，和一整套正规战的法子：阵地对阵地，堡垒对堡垒，集中兵力，攻打大城市。","「你们的队伍，太散，太游。」他指着沙盘上那座城，「打下它，敌人就输了。」","杨先生蹲在沙盘边看了很久，问：那座城，有多少兵？李德说：一个师。杨先生问：我们有多少？李德说：三个团。","「三个团打一个师。」杨先生说，「打不下来。」","李德脸色变了：「这是国际经验。」","屋里安静下来。朱军长抽着烟袋，看看他，又看看李德——满屋子人，等着我这个随队写字的开口。"],"desc":"","choices":[{"text":"支持李德——国际经验，总不会错。","hint":"服从 · 心气蚀","next":"xx_city_intro","cond":"","effects":"junxin+5,xinhuo-5"},{"text":"支持杨先生——敌强我弱，打大城市是送死。","hint":"实事求是 · 军心蚀","next":"xx_city_intro","cond":"","effects":"junxin-5,xinhuo+8"},{"text":"两边都听——先小规模试一次，用伤亡说话。","hint":"折中 · 代价自会开口","next":"xx_city_intro","cond":"","effects":"junxin+3,xinhuo+3"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"xx_city_intro","title":"强攻 · 赣州城下","type":"duel","lines":["李德的命令还是下来了：三天后，攻打赣州。","军法官把命令念完，营房里安静得能听见针落。有人低声问：三个团打一个师……怎么打？","杨先生没有拦。他只在出发前，蹲在连队里，给每个班长讲了一夜的「怎么在败仗里活下来」。","出发那夜，队伍列在路口。朱军长走到队首，把烟袋别回腰上：打完这仗，都给老子活着回来。","我跟着队伍，看见那个练了半宿「人」字的老兵，在人群里，把枪攥得发白。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_city","pick":"","minigame":""},{"id":"xx_city_lose","title":"强攻 · 败","type":"scene","lines":["赣州没能打下来。","三个团，上去三千多人，下来的不到两千。城头的枪声停的时候，天已经黑透了。","老兵们说，那一夜城下的山坡上，火把亮了一整夜——不是进攻，是在收尸。","杨先生没有骂谁。他蹲在伤员堆里，一个一个看过去，最后说了一句：是我没拦住。","李德站在沙盘边，没有再说话。那盘沙盘上的城，被谁推平了。","后来增援的战事又起，队伍被拉去救急——又折了三百。","一千一百多。这个数字，后来刻进了每一个活着的人的心里。"],"desc":"","choices":[],"next":"huiyi","next2":"","effects":"junxin-10,xinhuo-5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"huiyi","title":"训话 · 二十六天","type":"scene","lines":["那天的会，他批评得很用力，也很不留情面——桌子被拍得吱吱作响，疟疾又发作了，他的手止不住地颤动。","「我讲过多少次了，队伍没有整顿好，不能带出去。写保证书又怎么样呢？我们的战士，哪个是靠写保证书英勇献身的？」","那天他们聊得很晚。最后，只有朱军长他们回去了——他，仍然还在这里。","我们回去的路上，有一条蜿蜒的泥巴路。那一天有雾，我们走得慢了些——直到我们遇见了担架和伤员。","一开始只是几十副。后来，抬着担架的队伍越来越长，蜿蜒的队伍仿佛看不到尽头。","他把长凳放下，着急地在人群中跑了起来。","后来，我们遇见了朱军长。他低头看着担架上的伤员们，失了神。几步跑到朱军长面前，四目相对。短暂的沉默后，是一句让人痛心疾首的数字——","「迟了二十六天。」朱军长的声音像被砂纸磨过，「伤亡一千一百多人。」","他捏着烟叶的手指停在半空，许久，才缓缓垂下。他没有看朱军长，只是望向担架蜿蜒而去的方向，目光仿佛穿透了山峦，空无一物。","他自顾自地找了一个地方坐下，一个人默默抽烟。","忽然，有个人向他慢慢走去——是三纵的司令员。侧脸上全是血渍，脖子和耳朵全是碎掉的沙块和泥巴，帽子破了一个大洞。","那个人走到他面前，看了看他，随即坐在他身旁，望着和他一样的方向。","许久，那个人终于开了口：","「红旗还能扛多久？」","雾很重。担架队的脚步，从近处响到远处，又从远处响到更远处。","烟卷在他指间，烧出一段白灰，没有掉。"],"desc":"","choices":[{"text":"屏住呼吸。等他回答。","hint":"所有人都想知道答案","next":"answer","cond":"","effects":"旗标:heard_answer"},{"text":"走过去，坐在他们身旁——和他望着同一个方向。","hint":"并肩 · 需心气≥55 · 答案不是说给一个人的","next":"answer","cond":"{\"statAtLeast\":{\"xinhuo\":55}}","effects":"旗标:sat_beside；xinhuo+5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"answer","title":"星星之火","type":"scene","lines":["他深吸了一口烟，把最后的烟叶掐灭，一字一顿地说道：","「星星之火，可以燎原。」","雾还没有散。担架队蜿蜒着，从山这头，望不到山那头。可是那一刻，我看见坐在他身旁的人，把破了洞的帽子，重新戴正了。","他站起来，把那支烟头踩灭，又回头看了一眼担架队的方向。","「走。」他说，「天亮了，还有课。」"],"desc":"","choices":[],"next":"gaobie","next2":"","effects":"junxin+10,xinhuo+10","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"gaobie","title":"清晨 · 告别","type":"scene","lines":["第二天清晨，我们走在鹅卵石铺成的长巷上，给这座小城作最后的告别。","「杨先生！杨先生！」妇女干部追上来，气喘吁吁，却仍不忘收好手里的包裹：「我也要跟你们走，我也要参加你们的队伍。」","先生抬着一条长凳，腰间夹着刚染好的宣纸，看着她，笑了笑：「你是留在这里的战士，还是这里的教书先生。教穷苦人读书识字，也是最了不起的革命家。」","「我最喜欢听的，就是人家叫我先生。」","她低下头，把包裹抱紧了些：「那你们还回来吗？」","「要回来的。」先生点了点头。","他放下长凳，朝她深深鞠了一躬：「这个学校，就拜托张先生了。」","我们拐出这条巷子时，她还站在台阶上，目送着——直到我们走进了烟雨里。","巷子尽头，他停了一下，从怀里摸出那支染坊老板给的烟卷，夹在耳朵上，没有抽。","「烟卷是个好东西。」他说，「搁着，比抽了提神。」"],"desc":"","choices":[{"text":"你回头看了一眼，跟上先生。","hint":"主线 · 黑边领章","next":"xx_child_after","cond":"","effects":""},{"text":"「要回来的。」——你在心里，替先生又应了一遍。然后你留了下来。","hint":"需心气≥60 · 守灯人","next":"xx_teacher_after","cond":"{\"statAtLeast\":{\"xinhuo\":60}}","effects":"旗标:stay_school；xinhuo+10"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"xx_teacher_after","title":"张先生 · 乡村","type":"scene","lines":["队伍走后，张先生把祠堂收拾了出来。","她先教认字，再教念布告。白区的布告贴一墙，她带着孩子们一个字一个字地读——读完了，把布告揭下来，折好，收进一个旧木匣里。","有人问她收这些做什么。她说：等翻过身，当状纸。","队伍打了败仗的消息传来，村里人心惶惶。她把孩子们聚到祠堂，又点了一回灯——她说：灯不灭，人就在。","那晚她送走最后一个孩子，一个人坐在门槛上。月光底下，祠堂门板上那两个字——「平安」——还模模糊糊地亮着。","她伸手，摸了摸那两个字。那是母亲教她的第一课。"],"desc":"","choices":[],"next":"xx_teacher_white","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"xx_teacher_white","title":"白区的布告","type":"scene","lines":["队伍走后的第一个秋天，保安团回来了。","祠堂门口的识字班，换成了「保甲讲习所」。布告贴了一层又一层——认得字的，只有我和孩子们。","有人告发我教「共」字。保安团来查，翻遍了祠堂，只翻出一叠旧布告——就是我和孩子们从墙上揭下来，收在木匣里的那些。","领头的人问：收这些做什么？","我说：糊墙。","他盯着我看了很久，到底没有搜那个旧木匣——匣底压着一本《千字文》，书皮上，是杨先生临走时写的两个字。","「平安。」","那一夜，我把煤油灯挪到窗后。灯还亮着——只是换了个不让人看见的地方。"],"desc":"","choices":[],"next":"xx_teacher_years","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"xx_teacher_years","title":"灯芯","type":"scene","lines":["日子像纺线，一拉，就是几年。","队伍走了又来，来了又走。孩子们换了一茬又一茬——认字的孩子长大了，把课本传给了更小的孩子。","有一回，我数了数木匣里的布告，已经厚厚一沓。每一张，都记着这一年谁被抓了，谁家的地又没了。","孩子们问：先生，这匣子什么时候能空？","我说：等天下太平了，就空了。","「那天下什么时候太平？」","我望着窗外。远处，山那头的天，烧着一点红——像有人在那边，点了一盏灯。","「快了。」我说。"],"desc":"","choices":[],"next":"end_yaohuilai","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_yaohuilai","title":"结局 · 要回来的","type":"ending","lines":["「要回来的。」","这句话是杨先生说的。我留了下来——替妇女干部，也替我自己。","学校办起来了。用祠堂，用染坊的纸，用那支秃笔。第一课，我教孩子们写自己的名字。","孩子们问我：先生，杨先生什么时候回来？","我说：要回来的。","后来，红区白区反复拉锯，队伍走了又来，来了又走。有一年春天，我收到一封没有署名的信，信里只有一句话：","「星星之火，可以燎原。」","我把信压在教案底下，没有给任何人看。第二天，我在门板上，又写了一个字：","「火。」","那盏煤油灯，我一直留着。灯芯换过十七回——每一回，都是孩子们看着换的。","他们问：先生，灯怎么不灭？","我说：灯不怕灭。怕的是，没人记得怎么点。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"要回来的（结局 · 守灯人）","endingDesc":"你替杨先生守住了那座祠堂。他说会回来——你替他，先把灯点上了。","shop":"","duel":"","pick":"","minigame":""},{"id":"xx_child_after","title":"孩童 · 队伍","type":"scene","lines":["队伍往北走。我跟在队尾——那个跟着杨先生的半大孩子，第一次觉得，队伍变了很多。","李德来了又走了。强攻赣州那一仗，我见过最硬的老兵，在收尸的时候哭得像个孩子。","可队伍没有散。整训的课还在上，识字班的灯还亮着——行军歇脚，班长们就着篝火，教大家写自己的名字。","我趴在火边写「人」字。写着写着，忽然想：这一笔一捺，杨先生教过我，老兵教过我，现在——我也能教新来的了。","夜里的风很凉。队伍的黑影，在星光下，像一条没有尽头的河。"],"desc":"","choices":[],"next":"xx_child_march","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"xx_child_march","title":"夜行军","type":"scene","lines":["夜行军，脚底板磨出水泡，又磨成茧。","班长教我唱军歌——调子是从湖南带来的，词是新的。我学得慢，他就一个字一个字地教：革命，二字，是蘸着血写出来的。","翻过第三座山的时候，我背上的伤员醒了。他问我：小鬼，几岁了？我说：不知道，队伍里的都叫我小鬼。","他笑了一下，又睡过去。后来我再没见他——过河的时候，他留在对岸了。","我哭了一路。班长说：别哭，记住他的名字。","我记住了。我把他教我的那个字，刻在了河边的大石头上。"],"desc":"","choices":[],"next":"xx_child_base","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"xx_child_base","title":"新地盘","type":"scene","lines":["队伍在赣南扎下了根。","我忽然发现，队伍变了——不再是急急忙忙赶路的样子。田埂上有人帮老乡插秧，祠堂里有人教娃认字，连我这个半大孩子，都被编进了「宣传队」。","村里人起初怕兵。后来，有老人把家里的鸡蛋塞进我手里，说：给同志们补补。","我攥着那枚鸡蛋，忽然想起杨先生说过的话：队伍不是过路的兵——是自家的田，自家的灯。","晚上，宣传队围在火边。我拿出杨先生教的那句话，一笔一笔，写在纸上：星星之火，可以燎原。","写完了，我盯着那八个字，看了很久。"],"desc":"","choices":[],"next":"junzhuang","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"junzhuang","title":"黑边领章","type":"ending","lines":["三天后，我们的新军装下来了，大家都很高兴。","新军装的领章镶了黑边，比初时的设计更宽了些。他说，这不仅是纪念列宁，更是要纪念那些早已牺牲的同志们。","穿着新军装的战士们又开始了一天的操练。透过晨雾，吼声在山谷间回荡，一浪高过一浪。","我站在山坡上，目光掠过那片奔腾的灰色浪潮，最终定格在那一道道镶于领口的沉郁黑色边线上。","我忽然明白，这沉默的黑色，是祭奠，更是无声的火药。","它们沉甸甸地压在每个生者的肩头——不是为了让我们为死者哀悼，而是为了助燃那本就澎湃于胸中的星火。","于是烧得愈来愈旺，直至星火燎原，不可阻挡。","先生说得对。纪念逝者最好的方式，就是让新声来得更响亮些。这响透天际的呐喊，终将盖过所有的悲怆与迷茫——","告慰逝者，召唤新生。","晨雾散尽的时候，山谷里的吼声还在回响。我摸了摸自己的领章——那一道黑边，是温的。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"可以燎原（终章）","endingDesc":"黑色是祭奠，也是火药。而你亲眼看见了那句回答，如何点亮一整片晨雾。","shop":"","duel":"","pick":"","minigame":""}],"viewpoints":[]},{"id":"touming","title":"投名状","subtitle":"第一章 · 雨夜请缨","mode":"story","startScene":"start","W":4610,"H":848,"nodeSvg":"<g class=\"node\" data-id=\"start\" transform=\"translate(40,84)\" opacity=\"1\">\n        <rect width=\"200\" height=\"144\" rx=\"6\" fill=\"#14110e\" fill-opacity=\"0.85\" stroke=\"#5b8fb8\" stroke-width=\"2.5\" stroke-dasharray=\"5 3\" class=\"node-rect\"/>\n        <text x=\"10\" y=\"19\" font-size=\"14\" fill=\"#5b8fb8\" font-weight=\"700\">□</text>\n        <text x=\"30\" y=\"18\" font-size=\"13.5\" fill=\"#e8d9b0\" style=\"paint-order:stroke;stroke:#0e0c0a;stroke-width:3.5px\">雨夜 · 官署</text>\n        \n        <text x=\"10\" y=\"44\" font-size=\"10\" fill=\"#5b8fb8\" font-weight=\"600\">场景 · 抉择</text>\n        <line x1=\"12\" y1=\"64\" x2=\"188\" y2=\"64\" stroke=\"#3a342b\" stroke-width=\"1\"/>\n          <circle cx=\"17\" cy=\"69\" r=\"3.5\" fill=\"#5b8fb8\" opacity=\"0.95\"/>\n          \n          <text x=\"27\" y=\"71\" font-size=\"12 pacity=\"0.9\"/><path d=\"M4320,452 C4100,452 4100,116.10666666666667 3880,116.10666666666667\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/><path d=\"M4320,124 C4100,124 4100,120.21333333333334 3880,120.21333333333334\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/><path d=\"M4320,288 C4100,288 4100,124.32 3880,124.32\" fill=\"none\" stroke=\"#8a7f6e\" stroke-width=\"1.3\" stroke-dasharray=\"2 3\" opacity=\"0.9\"/>","laneSvg":"<rect x=\"0\" y=\"70\" width=\"4610\" height=\"578\" fill=\"#d2a44f\" fill-opacity=\"0.045\"/><text x=\"14\" y=\"85\" font-size=\"11.5\" fill=\"#d2a44f\" letter-spacing=\"3\" font-weight=\"600\">投名状</text>","nodes":[{"id":"start","title":"雨夜 · 官署","type":"scene","lines":["雨下得很大。官署的屋檐，把雨声灌得满屋子都是。","三位大人坐在上头，笑意挂在脸上，眼睛却像三把没出鞘的刀。他们看了看我身后那八百人，又看了看我。","「柴大人，就这点人马，想干什么？」最左边那位大人先开了口，声音不高，却把满屋子的人都压住了。","我低着头，看着自己靴尖上的泥。那泥，是来时的路上，从苏州方向带回来的。","「苏州。」我说。","满屋子安静了一瞬。随即，笑声像烧开的水，从三个方向一起冒了出来。","「苏州？」最右边那位大人笑得直摇头，「苏州是江南最富庶的城，城墙三丈，护城河一丈五，守军两万——柴大人，你是拿这八百人，去给苏州城填壕沟么？」","我抬起头，第一次迎上他们的目光。","「再给我八百。」我说。"],"desc":"","choices":[{"text":"「再给我八百，两年之内，我攻下苏州。」","hint":"留有余地，缓图进取","next":"hall_laugh","cond":"","effects":"旗标:promise_2y；xinyong+5"},{"text":"「再给我八百，一年之内，我攻下苏州！」","hint":"惊世骇俗，一步登天——或一步深渊","next":"hall_laugh","cond":"","effects":"旗标:promise_1y；junxin+10,xinyong-5"},{"text":"低头不语，把机会让给身后的兄弟。","hint":"藏锋于鞘","next":"hall_silent","cond":"","effects":"旗标:silent；junxin-5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hall_laugh","title":"军中无戏言","type":"scene","lines":["「再给我八百，两年之内，我攻下苏州。」——这句话落下去，笑声停了。","笑容在他们脸上戛然而止，我的两位兄弟也侧头望来，满脸不可思议。","随即便是沉默，一阵短暂的沉默。他们在打量我，我的两个兄弟同样也是。","终于，一阵似乎怒非怒的声音响彻了整个屋子：「军中无戏言！」","雨还在下。檐下的雨珠，一颗一颗，砸在石阶上，像有人在那儿数着拍子。","我站在原地，没有动。那句话既然说出了口，就没有退回去的道理。","「大人说得对。」我说，「军中无戏言。」"],"desc":"","choices":[{"text":"咬死不改口，再压一码：「一年半。一年半之内，攻下苏州。」","hint":"","next":"deal","cond":"","effects":"旗标:deal_struck；junxin+10"},{"text":"退半步：「两年。两年之内，若不下苏州，提头来见。」","hint":"","next":"deal","cond":"","effects":"旗标:deal_struck；xinyong+10"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"hall_silent","title":"藏锋","type":"scene","lines":["我垂着头，雨声灌满了整间官署。二弟在我的沉默里等了很久，终于重重磕了一个头，替我们把话说完了。","三位大人对视一眼，笑意里多了几分玩味：「连你自家大哥都不敢接的话，你替他接了？」","「我们兄弟三人，一个人的话，就是三个人的话。」","军令状终究是立下了——只是落笔的名字，不是我的。","雨把官署的门槛打湿了一半。我抬眼，看见二弟跪在地上的背影，肩头的衣服洇着一片深色。","那一片深色，后来跟了我很多年。"],"desc":"","choices":[],"next":"deal","next2":"","effects":"旗标:brother_deal；xinyong+10,junxin-5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"deal","title":"成契","type":"scene","lines":["「好！」最右边那位大人终于开口了，「我再给你三千人，但没有粮草武器，后勤你得自己去凑。」","「谢大人。」我仍旧低着头，摆了摆手，俯身作了揖，转身走进了大雨之中。","雨幕如注。身后官署的灯火被雨打得一片模糊，像一团烧不旺的火。","三千八百人，没有粮，没有械——只有一个承诺，和一场没下完的雨。","我在雨里走了很久。身后的火，始终没有烧旺起来。"],"desc":"","choices":[],"next":"camp","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"camp","title":"雨夜 · 军营","type":"scene","lines":["三弟焦急地拉住我，刚要说话，便被我制止：「我知道，但我们没有选择。不谋一时者不能谋万世，不谋万世者同样不能谋一时。」","三弟一愣，随即转向二弟：「二哥，你快劝劝大哥。」","二弟不说话，只是缓缓拿出了一张被揉得皱皱巴巴的地图，用笔在一处做了标记。","我定眼望去，只见在标记处赫然写着五个大字——","「擒贼先擒王。」","帐外的雨小了些。油灯的光，把地图上那五个字照得发亮。","三弟凑过来看了一眼，又退回去：「苏州守将的帅府？那是城心——进了城，就是进了虎口。」","二弟不说话，只看着我。"],"desc":"","choices":[{"text":"采纳二弟之策：奇兵直捣苏州守将帅府。","hint":"险中求胜，兄弟同心","next":"act1_end","cond":"","effects":"旗标:plan_decisive；junxin+10"},{"text":"摇头：兵凶战危，先练三个月兵，稳扎稳打。","hint":"缓进，但粮草不等人","next":"act1_end","cond":"","effects":"旗标:plan_steady；xinyong+5,junxin-5"},{"text":"深夜独自再去看一遍地图——你想自己找到第三条路。","hint":"独行者的直觉","next":"act1_end","cond":"","effects":"旗标:plan_loner；junxin+5,xinyong-5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"act1_end","title":"第一章 · 完","type":"scene","lines":["雨到后半夜才停。营中的火把一支支熄了，只剩辕门两盏气死风灯，在湿冷的夜风里明明灭灭。","八百人——如今是三千八百人了。没有粮，没有械，只有一句军令状，和一张皱巴巴的地图。","苏州城头的守军大约不会想到，这座江南最富庶的城，即将迎来它此生最长的一个围城。","我把地图折好，贴身收着。风灯的火，在夜里跳了跳。"],"desc":"","choices":[],"next":"ch2_start","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch2_start","title":"第二章 · 围城","type":"scene","lines":["苏州城外，第十九个月。","比军令状上的期限，已经多出了五个月。没人再提这件事——因为提这件事的人，都已经埋在了城下的壕沟里。","我的队伍包围了苏州城一年多，缺衣少食，早已没了斗志。城头的旗子换了三次，城下的营盘挪了七处，只有围城的姿势，始终没变。","比起军令上的期限，眼前更让我担心的是士兵的粮食。军中的米缸，已经见底三日了。我心急如焚。","但城里的情况似乎更糟。逃出来的流民说，许多百姓已经开始易子而食了。","就在昨日，敌方城头射出了一封信。","信是绑在一支箭上射下来的。箭杆上还缠着一截布条，布条被城头的风，吹得猎猎作响。"],"desc":"","choices":[],"next":"ch2_letter","next2":"","effects":"junxin-10","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch2_letter","title":"城头之信","type":"scene","lines":["信是叛军首领亲笔，字迹工整，不像武人手书：","「围城十九月，外无援军，内无存粮。城中军民相食，白骨露于野。某愿以项上头颅，换苏州百姓一条活路。惟望将军受降之日，勿伤城中一人。」","我把信读了三遍，递给二弟。二弟读完，递给三弟。三弟把信拍在案上：「大哥，这是诈降！当年他屠我们三营的时候，可曾想过百姓？」","二弟不说话，只是看着城头的方向。良久，他说了一句：「城里在吃人。」","帐中烛火摇曳。十八个月的期限早过了，可这封信，比军令状重得多。","我把信在灯上烤了烤，想看清纸背有没有字。纸是干透的，没有夹层。","「他不是诈降。」我说，「一个要死的人，不会在信上撒谎。」"],"desc":"","choices":[{"text":"受降。保全城百姓，以礼葬其首领。","hint":"信义为重 · 需信用≥55 · 军中或有不忿","next":"ch2_surrender","cond":"{\"statAtLeast\":{\"xinyong\":55}}","effects":"旗标:surrender_honor；xinyong+20,junxin-10"},{"text":"受降——而后毁诺。兵不厌诈，这是战争。","hint":"原著之路 · 温水里的血","next":"ch2_betray","cond":"","effects":"旗标:surrender_betray；junxin+10,xinyong-20"},{"text":"拒降。再围一月，城自破。","hint":"冷硬如铁 · 城中将继续易子而食","next":"ch2_refuse","cond":"","effects":"旗标:surrender_refuse；junxin+5,xinyong-5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch2_surrender","title":"受降 · 守约","type":"scene","lines":["受降那日没有下雨。城门开时，叛军首领白衣素服，自缚出城，身后是黑压压跪了一地的降卒，和更多扶老携幼、眼窝深陷的百姓。","我依约未伤一人。首领的头颅，我令人以棺椁盛殓，葬在了城外的梅树下。","三弟气得三天没跟我说话。他在校场上练刀，一刀一刀，劈得木桩乱颤：「大哥！那些降卒里，有多少人手上沾着我们弟兄的血！」","我站在城头，看百姓排队领粥。一个瞎眼的老妪被孙儿牵着，从我脚下经过，朝城头的方向磕了一个头。","「兵不厌诈，是战争。」我对着城外的风说，「可要是连降书都成了诈，这仗就永远打不完了。」","捷报八百里加急，送往京城。京城的赏赐还没到，另一份东西先到了——一纸调令，召我即刻回京述职。","梅树底下，新坟的土还湿着。三弟后来去看了那棵树，回来没再骂我。","他只是在喝酒的时候，忽然说了一句：「那老妪……她朝你磕头的时候，我看见了。」"],"desc":"","choices":[],"next":"ch2_court","next2":"","effects":"旗标:hero_of_suzhou","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch2_betray","title":"受降 · 毁诺","type":"scene","lines":["我答应了。受降那日，我站在城头，看着城池瓮城中的俘兵——两万余人，缴械列队，绵延数里。","然后，我反悔了。","号令旗落，伏兵四起。瓮城之中，喊杀声只持续了一炷香。之后的很多年里，我总在雨夜听见那一炷香的声音。","兵不厌诈，这是战争。","苏州平定，捷报送抵京城，朝野震动。我成了朝廷口中的「中兴名将」，苏州百姓口中的「活阎王」。","三弟那晚喝得大醉，抱着酒坛问我：「大哥……城中那些百姓，明明可以不杀俘的……」我说：杀降为绝后患。他哭了。二弟站在营帐的阴影里，从头到尾，一言不发。","那炷香烧完的时候，瓮城的血，顺着城砖的缝，流到了我的靴边。","我没有躲。那天晚上，我换了三双靴子。"],"desc":"","choices":[],"next":"ch2_court","next2":"","effects":"旗标:butcher_of_suzhou","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch2_refuse","title":"拒降","type":"scene","lines":["「回信给他：开城，可活。降书，不受。」","信使出营时，二弟拦了我一次，只说了四个字：「城里在吃人。」我绕过他，走进了内帐。","第二十六日，城破了。不是攻破的——是守军自己打开的。他们绑了首领，献城请降。","入城那日，我踏过堆积在街巷两侧的尸骸。空气中是一种说不出的味道，甜腥，腐熟，粘在军袍上，一个月都散不去。","军中没有伤亡，军令状超额完成。捷报传回京城，满朝称贺。","只有我知道，这座城里多出来的几万具尸骨，有一半，是我「再围一月」四个字的代价。","入城那夜，我在城头站到天亮。城里的烟囱，一整天没有冒烟。"],"desc":"","choices":[],"next":"ch2_court","next2":"","effects":"旗标:cold_general","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch2_court","title":"紫禁城 · 茶局","type":"duel","lines":["我端详着紫禁城的屋檐装饰，竟不知不觉又出了神。忽然，我的余光看见了那个熟悉的人影，还有那熟悉的茶壶。","「柴大人久等了吧？」老者还没走近便开始寒暄。我连忙向前跃了几步，抬起手里的茶杯，恭恭敬敬地悬在那支茶壶下。","「大人太客气了，晚辈受宠若惊。」","「欸～柴大人年青有为，以后朝廷仰仗的都是你们这些人，老夫也是为国举士。」","茶水在空中抛出一道完美的曲线，稳稳落在我的杯中。我接过这杯满茶，一饮而尽。","烫！好烫！这茶怎么回事？！","我猛地抬头，正撞上他那狡黠的目光。他捋了捋胡须，露出那捉摸不透的笑容：「柴大人功勋卓著，只是苏州重镇，兵多了，便有拥兵自立之嫌。若是柴大人愿意卸点负担，便可安心做你的总督之事了。」","「这也是宫里的意思。」他又补了一句。","我悬着的心，终究是死了。这一杯茶，喝的从来不是茶。","茶盏搁在案上。我盯着盏沿那道浅浅的水渍，忽然想起苏州城外那杯粥——和这杯茶，用的是同一种烫。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_chai_tea","pick":"","minigame":""},{"id":"ch2_tea_win","title":"茶局 · 周旋","type":"scene","lines":["我顺着他的话头，一句接一句，把这杯滚烫的茶，生生喝成了温的。","裁军裁到了「无关痛痒」的数目，粮饷多争取了三个月——老者最终收起茶壶，意味深长地看了我一眼：「柴大人，会说话。」","「大人抬举。」我躬身退出府邸。背后的声音又传来：「粮草也只能留一半！」","我的脚步僵了僵，旋即又重重落了下去。「好！」","出府时，天正阴。我把那半杯没喝完的茶，留在案上——茶汤浑浊，盏沿留着一点涩味。","那一夜，我睡得格外浅。梦里全是茶壶倾斜的角度。"],"desc":"","choices":[],"next":"ch2_end","next2":"","effects":"junxin+5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch2_tea_lose","title":"茶局 · 溃败","type":"scene","lines":["话说岔了一句，老者的笑意便淡了下去。之后的每一句话，都像是在对着一堵墙讲。","「柴字营带头裁军，交回一半军械人马。」他不再用商量的语气，「年轻人，话要少，事要多。」","「粮草也只能留一半！」背后的声音夹杂着愤怒再次传来。","我的脚步僵了僵，旋即又重重落了下去。「好！」","出府时，雨点子开始落。我站在檐下，看着雨水把府门前的石阶浇成一片亮汪汪的黑。","那盏茶，我一口都没喝上第二回。"],"desc":"","choices":[],"next":"end_chaju","next2":"","effects":"junxin-5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_chaju","title":"结局 · 茶凉了","type":"ending","lines":["裁军的文书三日后送到。同一天送到的，还有进兵金陵的帅令。","二弟把那张皱巴巴的地图又铺开，看了很久，这次没有落笔。","「大哥，」三弟蹲在火边，声音压得很低，「就剩下这点人马，够干什么？」","我没有答。我在想那杯茶。烫——从那一烫里，我早该尝出来的：倒茶的人，不是要你知道茶味，是要你记住烫。","那一夜，营里的火熄得很早。","后来史书写：柴字营裁半，进兵金陵，未至，溃。十一个字，比半盏凉透的茶还轻。","那盏茶，我一直留着。茶早凉了，盏沿的涩味还在——像一句话，堵在喉咙里，吐不出，咽不下。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"茶凉了（败线结局 · 茶局）","endingDesc":"倒茶的人不是要你知道茶味——是要你记住烫。","shop":"","duel":"","pick":"","minigame":""},{"id":"ch2_end","title":"第二章 · 完","type":"scene","lines":["深夜，军营。裁军的指令与攻打金陵的帅令几乎是同时送到——其心可诛。","我们沉默地围在火边，微弱的火光映出我们三人各自藏着心事的脸庞。","「这回好了，人马军械没了，粮草也丢了，还要我们打下金陵，这跟送死有什么区别？」三弟率先开口。","「我听说，上面打了招呼，现在没人愿意借我们粮。」一向沉默的二弟忽然插了句嘴。","「大哥！实在不行就反了他娘的！」","我笑了笑，没说话，往火堆里又添了两根柴。","要是有这么简单，我当初又何必搏命苏州呢？","火堆炸了一下，火星子窜起来，又落回灰里。二弟伸手，把那颗火星按灭了。"],"desc":"","choices":[],"next":"ch3_start","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch3_start","title":"第三章 · 江上","type":"scene","lines":["五月，端阳，大雨。","「大哥！那帮孙子说端午涨潮，粮食运不上来，咱们的存粮只剩三天的了。」三弟戴着斗笠，半蒙着脸，几乎是在对我呐喊。大雨浇透了他身上的衣服，他干脆连伞也丢在地上。","「娘的！这帮狗日的，根本就没想让我们活着离开金陵！要是逼急了我们，大不了一命换一命……」","我低下身子，把那把油纸伞收了起来。","粮，是要不来的。要，就得亲自去。","雨点砸在伞面上，噼啪作响。三弟还在骂，二弟站在雨里，看着江的方向。","「端阳涨潮，运不上粮。」二弟慢慢说，「这个说法，巧得像一句台词。」"],"desc":"","choices":[{"text":"「我亲自去催。来人，备马！」","hint":"原著之路 · 主帅亲赴，凶险自担","next":"ch3_depart","cond":"","effects":"旗标:go_self"},{"text":"遣三弟带亲兵去催粮。","hint":"避己之险 · 但李大人未必买三弟的账","next":"ch3_depart","cond":"","effects":"旗标:go_sandi；junxin-5"},{"text":"先修书一封，走官驿催粮；同时派人查粮道虚实。","hint":"慎之又慎 · 也许能嗅出陷阱的味道","next":"ch3_depart","cond":"","effects":"旗标:go_letter；junxin-5,xinyong+5"}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch3_depart","title":"逆江","type":"duel","lines":["无论谁去，最后拍板的还是那一夜的马蹄。","我翻身上马，点起一队亲兵，越过烽火台，逆江奔袭。月光下我与黑夜几乎融为一体。","江上映着我的影子。后来我常常想起那个画面——","那是我离月亮最近的时刻。","深夜，帅帐灯火通明。帐外两员裨将还在推诿「端午涨潮、粮食运不上来」，帐中老者终于放下了手中的书卷，捋了捋胡须，缓缓开口——","「要是柴大人能协助我们镇压叛乱，送粮食自然也能按时抵达了。」","「叛军现所在何处？」我低声问道。","「城东三十里外，梁家铺子。」","不知为何，脑袋总有些昏昏沉沉的。是昨晚没睡好，还是得了风寒？我轻轻摇了摇头，又掐了掐大腿，让自己更清醒一点。","帐中的茶，还冒着热气。","茶汤的颜色，和紫禁城那杯，一模一样。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_li_yuan","pick":"","minigame":""},{"id":"ch3_li_win","title":"帅帐 · 满载而归","type":"scene","lines":["我一句一句，把他书卷后面的笑，拆了个干净。粮草谈下了三分之一，「协剿叛乱」的军令也拖成了「再议」。","临出帐时，我回头看了那盏茶一眼——茶汤浑浊，盏沿留着一点不该有的涩味。我终究没有喝第二口。","回程的马上，我越想越不对：我几乎杀光了苏州城所有的兵——哪来的叛军？","梁家铺子。城东三十里。这道军令递到我手上的那一刻，形状就像一张网。","「传令，回营走官道，绕开梁家铺子。」","可命运这张网，从来不止一个网眼。","回程的江风，吹得人清醒了几分。我摸了摸怀里的地图，指尖停在\"梁家铺子\"四个字上。","那个地名，是陌生的。可它出现在这份地图上的方式，太熟了。"],"desc":"","choices":[],"next":"ch3_ambush_intro","next2":"","effects":"旗标:alert；junxin+5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch3_li_lose","title":"帅帐 · 空手而归","type":"scene","lines":["话说岔了。老者的书卷重新举了起来，遮住了半张脸：「柴大人远来辛苦，粮草的事，容后再议吧。」","「协剿梁家铺子叛乱」的军令，却连夜递到了我的行辕。军令如山。","脑袋越发昏沉。回程的马上，江风一吹，我竟在马背上晃了两晃——那盏茶。我喝了几口来着？","城东三十里，梁家铺子。我猛然想起被我坑杀的几万降卒，不由得背后一冷。","我几乎杀光了苏州城所有的兵——哪来的叛军？","一股寒意从内心深处袭来，我努力抑制住抖动的身子，又紧了紧马缰。","江风灌进衣领。那盏茶的涩味，从喉咙深处，一路泛上来。"],"desc":"","choices":[],"next":"end_kongshou","next2":"","effects":"旗标:drugged；junxin-5","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"end_kongshou","title":"结局 · 空手而归","type":"ending","lines":["军令是连夜递到的。我把它搁在案上，没有拆——先让人去数了营中的米缸：三日。","三弟从市上回来，骂了一路：连粮商都不肯卖给我们了。「上面打了招呼。」二弟轻声说。","那一夜，我们三人围着火，谁都没有说话。火光映着那张皱巴巴的地图——上面写着：擒贼先擒王。","「王在朝里。」二弟补了四个字。我盯着火，想了很久，最后摇了摇头。","「粮只有三日。弟兄们吃不饱，擒什么王都是虚的。」","第四日，军令再至。我把帅印收进匣子，交给亲兵：送还帅帐。就说——柴字营病了，打不动了。","后来史书没有给柴字营立传。只在食货志里留了一行：端阳年，江上军乏粮三日，散。","火灭了。我把那张地图折好，放进帅印空出来的匣子里。","那五个字，从此再没有人问起。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"空手而归（败线结局 · 借粮）","endingDesc":"粮只有三日。你没有去擒王——你去送弟兄们回家了。","shop":"","duel":"","pick":"","minigame":""},{"id":"ch3_ambush_intro","title":"梁家铺子","type":"duel","lines":["官道在梁家铺子外拐了一个弯。弯道两侧的坡地上，庄稼长得太好——好得不像荒年。","「快走！」","我的近卫在被十几支长枪贯穿身子之前，用尽全身力气喊出了这两个字。","忽然，我的视线急剧跌落，失重感紧随而来——","「是绊马索！」","我重重摔下马来，眼前一黑，耳边只剩下了嗡嗡的吵闹声。等我稍稍恢复一些，踉跄着重新站起来的时候——","模糊的视野里，只剩下火把、弓箭和士兵。","那一晚，我耳边响起的呼啸风声，是羽箭最后的轻语。","坡地上的庄稼，在火把的光里晃了晃。我忽然想——好得不像荒年的庄稼，是有人特意种的。种它的人，等的就是我。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"d_ambush","pick":"","minigame":""},{"id":"ch3_breakout","title":"结局 · 血路","type":"ending","lines":["二十骑结阵，凿穿了弓手最薄的一段黑。断后的弟兄一个一个坠下去，没有人回头。","天亮时，我趴在一匹只剩三口气的老马上，渡过了江。回头看，梁家铺子的火光已经缩成了地平线上的一粒豆。","军中的粮，撑不到我回营了。但帐里那盏茶、那道「叛乱」的军令、那张网——我都带出来了。","回到金陵的路，走了三天。马死了两匹，最后一匹驮着我，也驮着半条命。","柴字营的辕门外，三弟第一个冲出来，抱着我，又哭又骂：「大哥！你他娘的怎么弄成了这样！」营中弟兄围上来，火光里一张张脸，先是喜，喜完了又往下沉——他们看见了马鞍上卷着的刀，和刀上干透的血。","我把那盏茶、那道「叛乱」的军令，一样一样摆在案上，一句话也没说。","二弟看了很久。然后他缓缓铺开那张皱巴巴的地图，笔尖落在京城的方向。","「擒贼先擒王。」他说，「这次，王在朝里。」","营帐里静了很久。有人问，那我们还打苏州吗？","没有人回答。二弟抬头看着我，像八年前那个雨夜一样，等我的一个字。","「粽子，」我说，「今年先在营里过。」","窗外又下雨了。雨落在摊开的地图上，京城的方向晕开一点墨，像那杯茶里，没喝完的倒影。","后来的事，传得很乱。有人说柴字营被朝廷围了三个月，血战到最后一刻；有人说军旗拔了，弟兄们散进了山里，各奔前程。","只有一件事，江南的盐商和漕帮都信誓旦旦：那之后很多年，长江水道上，总有一支没有番号的船队，专劫官粮，从不伤人。","他们不知道船队从哪来。就像不知道那年端午，有个将军答应了弟兄们，三天之内一定回来——一起吃粽子。","他食言了。","可他答应过的事，柴字营替他，做了很多年。"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"血路（隐藏结局 · 生还）","endingDesc":"你从死局里凿出了一条血路。那一年的粽子，柴字营替你还了很多年。","shop":"","duel":"","pick":"","minigame":""},{"id":"ch3_canon","title":"结局 · 羽箭最后的轻语","type":"scene","lines":["箭是从三个方向来的。亲兵们一个接一个地落马，把最后的位置让给了我的马头。","我靠着一块青石，握着卷了刃的刀。血从肩头的箭伤里涌出来，热的，很快就凉了。","恍惚间，好多画面涌了上来——","雨夜的官署，三位大人的笑；苏州城下的梅树；紫禁城那杯烫手的茶；江上那一轮离我最近的月亮。","还有那张皱巴巴的地图。上面的字，一行一行，都亮了起来。"],"desc":"","choices":[],"next":"ch3_canon_variants","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch3_canon_variants","title":"走马灯","type":"scene","lines":["「军中无戏言！」那夜的雷声还很近。","雨声、笑声、马蹄声，从很远的地方，一层一层漫过来。","我闭上眼。走马灯，一盏一盏，亮起来。"],"desc":"","choices":[{"text":"（守约者的走马灯）苏州城下，瞎眼的老妪朝城头磕了一个头。","hint":"","next":"ch3_canon_honor","cond":"{\"flag\":\"surrender_honor\"}","effects":"xinyong+10"},{"text":"（毁诺者的走马灯）瓮城之中，喊杀声只持续了一炷香。","hint":"","next":"ch3_canon_betray","cond":"{\"flag\":\"surrender_betray\"}","effects":"junxin+10"},{"text":"（拒降者的走马灯）第二十六日，城门从里面打开了。","hint":"","next":"ch3_canon_cold","cond":"{\"flag\":\"surrender_refuse\"}","effects":""},{"text":"（两年之约者的走马灯）雨夜官署，那句话掷地有声。","hint":"","next":"ch3_canon_twoyear","cond":"{\"flag\":\"promise_2y\"}","effects":""},{"text":"（一年之约者的走马灯）声音比谁都大，底气比谁都虚。","hint":"","next":"ch3_canon_oneyear","cond":"{\"flag\":\"promise_1y\"}","effects":""},{"text":"（代笔者的走马灯）军令状上，落的是二弟的名字。","hint":"","next":"ch3_canon_brother","cond":"{\"flag\":\"silent\"}","effects":""},{"text":"（所有走马灯的尽头）雨夜官署，三位大人的哄笑，和一个说「再给我八百」的人。","hint":"","next":"ch3_canon_final","cond":"","effects":""}],"next":"","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch3_canon_twoyear","title":"走马灯 · 两年之约","type":"scene","lines":["「再给我八百，两年之内，我攻下苏州！」","雨声里的那句话，年轻，狂，掷地有声。三位大人的笑凝固了，二弟三弟侧头望来。","原来那一年，我是这样开始的。","那句话说完的时候，我二十一岁，以为自己什么都来得及。"],"desc":"","choices":[],"next":"ch3_canon_variants","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch3_canon_oneyear","title":"走马灯 · 一年之约","type":"scene","lines":["「一年半！一年半之内，攻下苏州！」","声音比谁都大，底气比谁都虚。二弟在桌子底下，轻轻拉了一下我的衣角。","我甩开了。那一年，我二十一岁，以为自己什么都来得及。","如今箭还挂在肩上，才知道有些话，说出口就收不回来了——可当年，我偏要说。"],"desc":"","choices":[],"next":"ch3_canon_variants","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch3_canon_brother","title":"走马灯 · 代笔者","type":"scene","lines":["军令状上，落的是二弟的名字。","「我们兄弟三人，一个人的话，就是三个人的话。」——那夜雨很大，二弟替我把头磕在地上。","原来从第一天起，替我扛着的，从来不是我。","二弟，那三个字，大哥这辈子，还欠你一声谢。"],"desc":"","choices":[],"next":"ch3_canon_variants","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch3_canon_honor","title":"走马灯 · 守约者","type":"scene","lines":["苏州城下，瞎眼的老妪被孙儿牵着，朝城头的方向磕了一个头。","那天我说：要是连降书都成了诈，这仗就永远打不完了。","如今箭如雨下，倒像是替这句话收账来了。也好。这一诺，我守到了最后一刻。","三弟，别哭。大哥这一生，话是算数的。"],"desc":"","choices":[],"next":"ch3_canon_variants","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch3_canon_betray","title":"走马灯 · 毁诺者","type":"scene","lines":["瓮城之中，两万降卒，喊杀声只持续了一炷香。","兵不厌诈，这是战争——我那时是这样说的。三弟醉倒在我脚边，哭得像个孩子。","原来报应不在天道里，在箭羽里。苏州的每一支箭，今晚都找到了我。","二哥，替我告诉三弟：那炷香，我后悔了。"],"desc":"","choices":[],"next":"ch3_canon_variants","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch3_canon_cold","title":"走马灯 · 拒降者","type":"scene","lines":["第二十六日，城门从里面打开了。城中多出来的几万具尸骨，有一半，是「再围一月」四个字的代价。","我一生冷硬，自以为算无遗策。直到今夜才算明白——","绊马索不长眼睛，箭也不长。它们和我一样，只认命，不认悔。","罢了。冷了一辈子，最后这一箭，倒是烫的。"],"desc":"","choices":[],"next":"ch3_canon_variants","next2":"","effects":"","ending":"","endingDesc":"","shop":"","duel":"","pick":"","minigame":""},{"id":"ch3_canon_final","title":"羽箭最后的轻语","type":"ending","lines":["所有走马灯的尽头，是那个雨夜的官署。三位大人的哄笑还在耳边：「就这点人，你们想干什么？」","「再给我八百。」","那个声音很年轻，很狂，也很远。","我笑了。雨水混着血从嘴角淌下来，滴在梁家铺子的泥地里。","远处，天快亮了。军营的方向升起了炊烟——存粮还剩三天的弟兄们，还在等他们的粽子。","那一晚，我耳边响起的呼啸风声，是羽箭最后的轻语。","《旧唐书 · 柴国公传》：「柴善谋子，不善谋势。军功之盛，一朝之谗，遂陨于道。惜夫。」"],"desc":"","choices":[],"next":"","next2":"","effects":"","ending":"羽箭最后的轻语（正史结局）","endingDesc":"功高震主者，死于归途。你的每一次选择，都写进了这篇列传。","shop":"","duel":"","pick":"","minigame":""}],"viewpoints":[]}];
const TYPE_NAME = {"scene":"场景","ending":"结局","shop":"商店","duel":"对局","pick":"翻牌","minigame":"小游戏"};
const TYPE_ICON = {"scene":"□","ending":"★","shop":"市","duel":"战","pick":"翻","minigame":"戏"};
const TYPE_COLOR = {"scene":"#5b8fb8","ending":"#d2a44f","shop":"#5fa877","duel":"#c05b4d","pick":"#d99a4e","minigame":"#8b7ab8"};
let cur = 0;
const svg = document.getElementById('svg');
const wrap = document.getElementById('wrap');
const tabsEl = document.getElementById('tabs');
const detailEl = document.getElementById('detail');
const detailBody = document.getElementById('detailBody');
const endsEl = document.getElementById('ends');

function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// tabs
DATA.forEach((d, i) => {
  const b = document.createElement('button');
  b.className = 'tab' + (i === 0 ? ' on' : '');
  b.innerHTML = esc(d.title) + ' <small>' + d.nodes.length + '场景</small>';
  b.onclick = () => { cur = i; render(); };
  tabsEl.appendChild(b);
});

function render(){
  const d = DATA[cur];
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('on', i === cur));
  svg.innerHTML = '<g id="lanes">' + (d.laneSvg || "") + '</g><g id="ticks">' + d.actTicks + '</g><g id="edges">' + d.edgeSvg + '</g><g id="nodes">' + d.nodeSvg + '</g>';
  svg.setAttribute('viewBox', '0 0 ' + d.W + ' ' + d.H);
  // svg 实际尺寸 = viewBox 全尺寸（让 wrap 横向滚动查看完整长图，不再用 transform 强行缩放）
  svg.style.width = d.W + 'px';
  svg.style.height = d.H + 'px';
  wrap.style.maxHeight = '78vh';
  svg.setAttribute('width', d.W); svg.setAttribute('height', d.H);
  // 滚到左上
  wrap.scrollTo({ left: 0, top: 0 });
  // 结局栏
  const ends = d.nodes.filter(n => n.type === 'ending');
  endsEl.innerHTML = '<span>结局 ' + ends.length + ' 个</span>' + ends.map(n => '<span><b>★</b>' + esc(n.ending) + '</span>').join('');
  // 节点点击
  svg.querySelectorAll('.node').forEach(g => {
    g.addEventListener('click', () => openDetail(d, g.dataset.id));
  });
  // 连线端点高亮
  svg.querySelectorAll('.node').forEach(g => {
    g.addEventListener('mouseenter', () => { g.classList.add('hot'); });
    g.addEventListener('mouseleave', () => { g.classList.remove('hot'); });
  });
}

// 缩放（改 svg 实际尺寸触发 wrap 滚动条）+ 平移（用 wrap.scrollTo 替代 transform）
function getScale(){
  const d = DATA[cur];
  return svg.getAttribute('width') ? parseFloat(svg.getAttribute('width')) / d.W : 1;
}
function setScale(k){
  const d = DATA[cur];
  const w = Math.max(200, d.W * k);
  const h = d.H * (w / d.W);
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  svg.style.width = w + 'px';
  svg.style.height = h + 'px';
}
function fit(){
  // 适配 wrap 宽：缩到能完整显示宽（不缩小于 0.3，避免看不清字）
  const d = DATA[cur];
  const rw = wrap.clientWidth - 8;
  const k = Math.max(0.25, Math.min(1, rw / d.W));
  setScale(k);
  wrap.scrollTo({ left: 0, top: 0 });
}
function reset(){
  const d = DATA[cur];
  setScale(1);
  wrap.scrollTo({ left: 0, top: 0 });
}
document.getElementById('fitBtn').onclick = fit;
document.getElementById('resetBtn').onclick = reset;
wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const curK = getScale();
  const nk = Math.max(0.2, Math.min(4, curK * (e.deltaY < 0 ? 1.12 : 0.9)));
  setScale(nk);
}, { passive: false });
// 拖动用 wrap 自身滚动（更原生，支持触控板）
let drag = null;
wrap.addEventListener('mousedown', (e) => {
  if (e.target.closest('.node')) return;
  drag = { x: e.clientX, y: e.clientY, sl: wrap.scrollLeft, st: wrap.scrollTop };
  svg.classList.add('dragging');
});
wrap.addEventListener('mousemove', (e) => {
  if (!drag) return;
  wrap.scrollLeft = drag.sl - (e.clientX - drag.x);
  wrap.scrollTop = drag.st - (e.clientY - drag.y);
});
window.addEventListener('mouseup', () => { drag = null; svg.classList.remove('dragging'); });

function openDetail(d, id){
  const n = d.nodes.find(x => x.id === id);
  if (!n) return;
  const c = TYPE_COLOR[n.type] || '#5b8fb8';
  let html = '<h2>' + esc(n.title) + '</h2><div class="meta">' + TYPE_NAME[n.type] + ' · ' + esc(n.id) + (n.ending ? ' · ' + esc(n.ending) : '') + '</div>';
  if (n.desc) html += '<div class="sec"><div class="sec-t">简介</div><p>' + esc(n.desc) + '</p></div>';
  if (n.lines && n.lines.length) html += '<div class="sec"><div class="sec-t">文本</div>' + n.lines.map(l => '<p class="line">' + esc(l) + '</p>').join('') + '</div>';
  if (n.effects) html += '<div class="sec"><div class="sec-t">效果</div><p>' + esc(n.effects) + '</p></div>';
  if (n.choices && n.choices.length) html += '<div class="sec"><div class="sec-t">分支选项</div>' + n.choices.map(cx => '<div class="choice"><b>' + esc(cx.text) + '</b>' + (cx.hint ? '<div class="hint">—— ' + esc(cx.hint) + '</div>' : '') + '<div class="hint">→ ' + esc(cx.next) + (cx.cond ? ' · 需: ' + esc(cx.cond) : '') + (cx.effects ? ' · ' + esc(cx.effects) : '') + '</div></div>').join('') + '</div>';
  if (n.next) html += '<div class="sec"><div class="sec-t">推进 → ' + esc(n.next) + '</div></div>';
  if (n.shop) html += '<div class="sec"><div class="sec-t">商店</div><p>' + esc(n.shop) + '</p></div>';
  if (n.duel) html += '<div class="sec"><div class="sec-t">对局</div><p>' + esc(n.duel) + '</p></div>';
  if (n.pick) html += '<div class="sec"><div class="sec-t">三选一翻牌</div><p>' + esc(n.pick) + '</p></div>';
  if (n.minigame) html += '<div class="sec"><div class="sec-t">小游戏</div><p>' + esc(n.minigame) + '</p></div>';
  if (n.endingDesc) html += '<div class="sec"><div class="sec-t">结局</div><p>' + esc(n.endingDesc) + '</p></div>';
  detailBody.innerHTML = html;
  detailEl.classList.add('open');
}
document.getElementById('closeBtn').onclick = () => detailEl.classList.remove('open');
render();
</script>
</body>
